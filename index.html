  m.appendChild(box);
  box.querySelector('#cp-x').addEventListener('click', close);
  box.querySelector('#cp-later').addEventListener('click', close);
  box.querySelector('#cp-detail').addEventListener('click', () => { close(); openDetail(cp.id, 'market'); });
}

// 買付の結果発表: 交渉中の溜め（ドラムロール＋鼓動）→ ドラマチックな成立/残念の発表 → done()。
// v3.2: 買付の結果発表をリッチに。暗転＋金色の鼓動リング→成立は放射バースト＋判子風「成立」スタンプ、
// 見送りは画面シェイク＋「見送り」スタンプ。コスト・確率などのロジックは一切変更しない。
function playOfferSuspense(accepted, cut, done) {
  const overlay = el(`<div class="fixed inset-0 z-[70] overflow-hidden flex items-center justify-center p-4" style="background:radial-gradient(ellipse at center, rgba(15,23,42,0.88) 0%, rgba(2,6,23,0.97) 100%);">
    <style>
      @keyframes ofs-ring { 0% { transform: scale(0.55); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes ofs-stamp { 0% { transform: scale(3.2) rotate(14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 75% { transform: scale(1.07) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
      @keyframes ofs-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-14px); } 40% { transform: translateX(11px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }
      @keyframes ofs-burst { 0% { transform: scale(0.2) rotate(0deg); opacity: 1; } 100% { transform: scale(1.8) rotate(22deg); opacity: 0; } }
      @keyframes ofs-float { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-110px) scale(1.4); opacity: 0; } }
    </style>
    <div id="ofs-rings" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>
    <div id="ofs-burst-layer" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>
    <div id="ofs-box" class="relative text-center text-white space-y-4">
      <div id="ofs-emoji" class="text-7xl" style="filter: drop-shadow(0 0 25px rgba(251,191,36,0.4));">🤝</div>
      <div id="ofs-title" class="text-2xl font-bold tracking-[0.3em]">交 渉 中<span id="ofs-dots" class="tracking-normal"></span></div>
      <div id="ofs-sub" class="text-sm opacity-80">${cut > 0 ? `指値 -${Math.round(cut * 100)}% で相手の返事を待っています…` : '満額で申し込み中…'}</div>
    </div></div>`);
  document.body.appendChild(overlay);
  const dotsEl = overlay.querySelector('#ofs-dots');
  const emojiEl = overlay.querySelector('#ofs-emoji');
  const titleEl = overlay.querySelector('#ofs-title');
  const subEl = overlay.querySelector('#ofs-sub');
  const ringsEl = overlay.querySelector('#ofs-rings');
  const boxEl = overlay.querySelector('#ofs-box');
  // 溜め: ドット点滅＋鼓動＋外へ広がる金色リング＋ドラムロール音
  let dots = 0;
  const dotTimer = setInterval(() => { dots = (dots + 1) % 4; dotsEl.textContent = '.'.repeat(dots); }, 300);
  emojiEl.style.transition = 'transform 0.35s ease-in-out';
  const beatTimer = setInterval(() => {
    emojiEl.style.transform = emojiEl.style.transform === 'scale(1.15)' ? 'scale(1)' : 'scale(1.15)';
  }, 350);
  const ringTimer = setInterval(() => {
    const ring = el(`<div class="absolute rounded-full" style="width:190px;height:190px;border:2px solid rgba(251,191,36,0.55);animation: ofs-ring 1.1s ease-out forwards;"></div>`);
    ringsEl.appendChild(ring);
    setTimeout(() => ring.remove(), 1150);
  }, 420);
  sfxDrumroll();
  const suspenseMs = cut > 0 ? 2000 : 1100;   // 満額は必ず通るので溜めは短め
  setTimeout(() => {
    clearInterval(dotTimer); clearInterval(beatTimer); clearInterval(ringTimer);
    ringsEl.innerHTML = '';
    if (accepted) {
      // 金色の放射バースト＋判子風「成立」スタンプ＋キラキラ
      overlay.querySelector('#ofs-burst-layer').appendChild(el(
        `<div style="width:460px;height:460px;border-radius:50%;background:repeating-conic-gradient(rgba(251,191,36,0.45) 0 10deg, transparent 10deg 30deg);animation: ofs-burst 0.9s ease-out forwards;"></div>`));
      emojiEl.remove();
      boxEl.insertBefore(el(
        `<div class="mx-auto w-44 h-44 rounded-full bg-white/95 shadow-2xl flex items-center justify-center" style="border:9px solid #dc2626;animation: ofs-stamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
          <span class="text-5xl font-black" style="color:#dc2626;">成立</span></div>`), titleEl);
      ['✨', '💴', '✨', '🎉', '💴', '✨'].forEach((c, i) => {
        const sp = el(`<div class="absolute text-3xl pointer-events-none" style="left:${18 + i * 13}%;top:58%;animation: ofs-float 1.2s ease-out ${i * 0.09}s forwards;opacity:0;">${c}</div>`);
        overlay.appendChild(sp);
      });
      titleEl.textContent = '買付 成立！';
      titleEl.className = 'text-3xl font-black tracking-widest';
      titleEl.style.background = 'linear-gradient(180deg,#fde68a,#f59e0b)';
      titleEl.style.webkitBackgroundClip = 'text';
      titleEl.style.backgroundClip = 'text';
      titleEl.style.color = 'transparent';
      subEl.textContent = '契約に進みましょう';
      sfxFanfare();
    } else {
      boxEl.style.animation = 'ofs-shake 0.5s';
      emojiEl.remove();
      boxEl.insertBefore(el(
        `<div class="mx-auto w-44 h-44 rounded-full flex items-center justify-center" style="border:9px solid #94a3b8;background:rgba(255,255,255,0.06);animation: ofs-stamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
          <span class="text-5xl font-black" style="color:#cbd5e1;">見送り</span></div>`), titleEl);
      titleEl.textContent = '残念…見送りに';
      titleEl.className = 'text-3xl font-bold text-red-400 tracking-widest';
      subEl.textContent = '値下げか売れ残りのタイミングで再指値できます';
      sfxFail();
    }
    setTimeout(() => { overlay.remove(); done(); }, accepted ? 1400 : 1600);
  }, suspenseMs);
}

function showPayment(propId, price, close) {
  const p = state.market.find(x => x.id === propId);
  const m = document.getElementById('purchase-modal');
  const cashNeed = price + Math.round(price * L.CONFIG.closingCostRate);
  let downRatio = 0.2;
  let buyOwner = 'personal';   // v3.5: 法人設立済みなら購入名義を選べる
  const draw = () => {
    m.innerHTML = '';
    // v3.6: 頭金は0%〜「手持ち現金で払える上限」まで1%刻みで自由に設定できる（3割上限を撤廃）
    const closing = Math.round(price * L.CONFIG.closingCostRate);
    const maxDownPct = Math.max(0, Math.min(100, Math.floor((state.cash - closing) / price * 100)));
    if (downRatio > maxDownPct / 100) downRatio = maxDownPct / 100;
    const rs = L.reviewAllBanks(p, price, downRatio, state);
    const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start gap-2"><h2 class="font-bold">支払い方法（成約価格 ${L.yen(price)}）</h2><button id="pay-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
      ${state.isIncorporated ? `<div class="flex gap-2 text-sm items-center"><span class="font-bold shrink-0">名義:</span>
        <label class="flex-1 border rounded p-1.5 text-center cursor-pointer ${buyOwner === 'personal' ? 'bg-slate-100 font-bold border-navy' : ''}"><input type="radio" name="buy-owner" value="personal" ${buyOwner === 'personal' ? 'checked' : ''} class="mr-1">👤 個人</label>
        <label class="flex-1 border rounded p-1.5 text-center cursor-pointer ${buyOwner === 'corp' ? 'bg-slate-100 font-bold border-navy' : ''}"><input type="radio" name="buy-owner" value="corp" ${buyOwner === 'corp' ? 'checked' : ''} class="mr-1">🏢 法人</label></div>` : ''}
      <button id="pay-cash" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded py-2 text-sm font-bold ${state.cash < cashNeed ? 'opacity-40' : ''}" ${state.cash < cashNeed ? 'disabled' : ''}>現金一括（必要 ${L.yen(cashNeed)}）</button>
      <div class="text-sm font-bold pt-2 border-t">融資（4行同時審査）</div>
      <div class="text-sm">${term('own_cash', '頭金')} <b id="pay-down-pct">${Math.round(downRatio * 100)}%</b>＝<span id="pay-down-amt" class="font-bold">${L.yen(Math.round(price * downRatio))}</span>
        <span class="text-[11px] text-slate-500">（${term('closing_cost', '諸費用')}込み必要現金 <span id="pay-down-need">${L.yen(Math.round(price * downRatio) + Math.round(price * L.CONFIG.closingCostRate))}</span>）</span></div>
      <input id="pay-down-range" type="range" min="0" max="${maxDownPct}" step="1" value="${Math.round(downRatio * 100)}" class="w-full">
      <div class="text-[11px] text-slate-500">スライドで自由に設定できます（手持ち現金で払える上限 ${maxDownPct}%）。離すと審査結果が更新されます。</div>
      <div id="pay-banks"></div>
      <button id="pay-cancel" class="w-full text-slate-500 text-sm">買付を取り下げる（ペナルティなし）</button></div>`);
    m.appendChild(box);
    const banksDiv = box.querySelector('#pay-banks');
    // v8: 承認された銀行はカード全体を紺で塗って文字を白に反転する。否決は淡いグレーのまま沈める。
    // 「紺＝借りられる／灰＝借りられない」の明暗差だけで、読まずに判別できる状態を狙っている。
    banksDiv.innerHTML = rs.map(r => r.approved
      ? `<div class="border rounded p-2 mb-1 bg-navy text-white"><div class="flex justify-between items-center gap-2">
          <b class="flex items-center gap-1.5"><span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-white text-navy text-[10px] font-black shrink-0">◯</span>${r.label}</b>
          <button class="pay-bank bg-white text-navy rounded px-2 py-1 text-sm font-bold shrink-0" data-k="${r.bankKey}">借りる</button></div>
          <div class="text-xs text-white/80">金利${(r.terms.rate * 100).toFixed(2)}%・${r.terms.years}年・月返済${L.yen(r.terms.monthlyPay)}・要${term('own_cash', '自己資金')}${L.yen(r.terms.requiredCash)}</div></div>`
      : `<div class="border rounded p-2 mb-1 bg-slate-50"><b>✕ ${r.label}</b>
          <div class="text-xs text-red-600">${linkTerms(r.reasons.map(x => x.msg).join('／'))}</div></div>`).join('');
    const range = box.querySelector('#pay-down-range');
    range.addEventListener('input', () => {
      const pct = Number(range.value);
      box.querySelector('#pay-down-pct').textContent = `${pct}%`;
      box.querySelector('#pay-down-amt').textContent = L.yen(Math.round(price * pct / 100));
      box.querySelector('#pay-down-need').textContent = L.yen(Math.round(price * pct / 100) + closing);
    });
    range.addEventListener('change', () => { downRatio = Number(range.value) / 100; draw(); });
    box.querySelectorAll('input[name="buy-owner"]').forEach(rb => rb.addEventListener('change', e => { buyOwner = e.target.value; draw(); }));
    const ownerLabel = () => buyOwner === 'corp' ? '🏢法人名義' : '👤個人名義';
    box.querySelector('#pay-cash').addEventListener('click', () => {
      const r = L.buyPropertyV2(state, propId, { method: 'cash', price, owner: buyOwner });
      state = r.state; r.logs.forEach(pushLog); save(); render(); close(); checkEnd();
      playPurchaseCelebration(p.name || p.label, `${L.yen(price)}（現金一括・${ownerLabel()}）`);
      tutMaybeAdvance('payment');
    });
    box.querySelectorAll('.pay-bank').forEach(b => b.addEventListener('click', () => {
      const r = L.buyPropertyV2(state, propId, { method: b.dataset.k, downRatio, price, owner: buyOwner });
      state = r.state; r.logs.forEach(pushLog); save(); render(); close(); checkEnd();
      playPurchaseCelebration(p.name || p.label, `${L.yen(price)}（融資利用・${ownerLabel()}）`);
      tutMaybeAdvance('payment');
    }));
    box.querySelector('#pay-cancel').addEventListener('click', () => { pushLog('買付を取り下げた'); close(); });
    box.querySelector('#pay-x').addEventListener('click', () => { pushLog('買付を取り下げた'); close(); });
  };
  draw();
}

// v3.5: 個人所有物件を法人へ売却（移転）する確認画面。時価取引・譲渡税・取得コスト・償却再スタートを明示。
function openCorpTransfer(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  // v8.1: 税率と課税対象益は売却フローと同じ saleBreakdown から取る（数字がズレないように）
  const price = p.timeValue;
  const bd = L.saleBreakdown(state, p, price);
  const heldYears = L.heldMonthsOf(state, p) / 12;
  const capTax = bd.tax;
  const acqCost = Math.round(price * L.CONFIG.corpTransferCostRate);
  const total = capTax + acqCost;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <div class="flex justify-between items-start gap-2"><h2 class="font-bold">🏢 ${p.name || p.label} を法人へ売却（移転）</h2><button id="tc-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <table class="w-full text-sm">
      <tr><td>移転価格（現在の時価）</td><td class="text-right font-bold">${L.yen(price)}</td></tr>
      <tr class="border-t"><td>${term('capital_gains_tax', '譲渡税')}（個人側・${heldYears <= 5 ? '短期39%' : '長期20%'}）</td><td class="text-right text-red-600">-${L.yen(capTax)}</td></tr>
      <tr><td>取得コスト（法人側・5%）</td><td class="text-right text-red-600">-${L.yen(acqCost)}</td></tr>
      <tr class="border-t font-bold"><td>支払い合計</td><td class="text-right text-red-600">${L.yen(total)}</td></tr>
    </table>
    <div class="text-xs text-slate-600 bg-slate-50 rounded p-2 space-y-1">
      <div>✅ 以後の課税は法人税率30%（${term('dead_cross', 'デッドクロス')}後も40%にならない）</div>
      <div>✅ <b>${term('depreciation', '減価償却')}が再スタート</b>（中古簡便法・取得価額=現在の時価）</div>
      <div>✅ 売却時の${term('capital_gains_tax', '譲渡税')}が保有期間に関係なく30%に</div>
    </div>
    <button id="tc-run" class="w-full bg-navy text-white rounded py-2 text-sm font-bold ${state.cash < total ? 'opacity-40' : ''}" ${state.cash < total ? 'disabled' : ''}>法人へ移転する（${L.yen(total)} 支払い）</button>
    <button id="tc-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelector('#tc-x').addEventListener('click', close);
  box.querySelector('#tc-cancel').addEventListener('click', close);
  box.querySelector('#tc-run').addEventListener('click', () => {
    const r = L.transferToCorp(state, propId);
    if (!r.done) { alert(r.reason === 'cash' ? '現金が足りません' : '移転できませんでした'); return; }
    state = r.state;
    pushLog(`${p.name || p.label} を法人へ移転（譲渡税${L.yen(r.capTax)}・取得コスト${L.yen(r.acqCost)}・償却再スタート）`);
    save(); render(); close();
    // v3.6: 移転も決定的イベントとして判子スタンプ演出に統一
    playStampFx({ stamp: '移転完了', title: '法人名義へ！', sub: `${p.name || p.label}（課税30%・償却再スタート）`, emojis: ['🏢', '📋', '✨', '💴', '✨'] });
  });
}

function openSell(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const listing = (state.listings || []).find(l => l.propertyId === propId);
  if (listing) { drawListingManage(m, p, listing, close); return; }
  // v8.2: 買付を承諾すると掲載は消えるが物件は決済月まで残る。ここで案内しないと
  // 「まだ売れていない」と誤解して二重に売り出そうとしてしまう。
  const pending = (state.pendingSales || []).find(x => x.propertyId === propId);
  if (pending) {
    const box2 = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
      <div class="flex justify-between items-start gap-2"><h2 class="font-bold">${p.name || p.label} は売却手続き中</h2><button id="sl-x0" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
      <div class="rounded-lg bg-emerald-50 p-3 text-sm space-y-1">
        <div>✅ 買付を承諾済みです。<b>${L.yen(pending.price)}</b> で成約しました。</div>
        <div>📅 <b>翌月に決済</b>され、手取りが入金されます。</div>
      </div>
      ${netProceedsBox(p, pending.price, true)}
      <div class="text-xs text-slate-500">決済までは売出価格の変更も再掲載もできません。</div>
      <button id="sl-ok" class="w-full bg-navy text-white rounded py-2 text-sm font-bold">閉じる</button></div>`);
    m.appendChild(box2);
    box2.querySelector('#sl-ok').addEventListener('click', close);
    box2.querySelector('#sl-x0').addEventListener('click', close);
    return;
  }
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-start gap-2"><h2 class="font-bold">${p.name || p.label} の売却</h2><button id="sl-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">まず不動産屋に査定を依頼しよう（行動力-5）</div>
    <button id="sl-appraise" class="w-full bg-navy text-white rounded py-2">査定を依頼する</button>
    <button id="sl-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelector('#sl-cancel').addEventListener('click', close);
  box.querySelector('#sl-x').addEventListener('click', close);
  box.querySelector('#sl-appraise').addEventListener('click', () => {
    if (state.actionPower < 5) { alert('行動力が足りません'); return; }
    const r = L.requestAppraisal(state, propId, Math.random);
    state = r.state; save();
    drawPricing(m, p, r.appraisal, close);
  });
}

// v8.1: 「この価格で売ったら手元にいくら残るか」。価格決定と買付承諾の両方で同じ内訳を見せる。
// 売却価格そのものより、税と残債を引いた手取りの方が判断材料として重要。
// hideWait: すでに成約済み（決済待ち）の画面では「待てば増える」を出さない。もう待てないので。
function netProceedsBox(p, price, hideWait = false) {
  const bd = L.saleBreakdown(state, p, price);
  // 益が出ていなければ税額も0で、待っても手取りは変わらない。カウントダウンはノイズになるので出さない。
  const waitGain = Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong));
  const toLong = (waitGain > 0 && !hideWait) ? L.monthsToLongTerm(state, p) : 0;
  const rateLabel = p.owner === 'corp' ? '🏢法人 一律30%'
    : `👤個人 ${bd.longTerm ? '長期' : '短期'}${Math.round(bd.rate * 100)}%`;
  return `<div class="rounded-lg bg-slate-50 p-2 text-xs space-y-0.5">
    <table class="w-full">
      <tr><td class="text-slate-600">売却価格</td><td class="text-right font-bold">${L.yen(bd.price)}</td></tr>
      <tr><td class="text-slate-600">${term('capital_gains_tax', '譲渡税')}（${rateLabel}）</td><td class="text-right text-red-600">-${L.yen(bd.tax)}</td></tr>
      <tr><td class="text-slate-600">${term('chukai_tesuryo', '仲介手数料')}（3%＋6万＋税）</td><td class="text-right text-red-600">-${L.yen(bd.costs.broker)}</td></tr>
      <tr><td class="text-slate-600">${term('inshizei', '印紙税')}</td><td class="text-right text-red-600">-${L.yen(bd.costs.stamp)}</td></tr>
      ${bd.costs.release ? `<tr><td class="text-slate-600">${term('teitoken_masshou', '抵当権抹消')}</td><td class="text-right text-red-600">-${L.yen(bd.costs.release)}</td></tr>` : ''}
      <tr><td class="text-slate-600">残債の精算</td><td class="text-right text-red-600">${bd.payoff ? `-${L.yen(bd.payoff)}` : '—'}</td></tr>
      <tr class="border-t font-bold"><td>手取り</td><td class="text-right ${bd.net >= 0 ? 'text-emerald-700' : 'text-red-600'}">${L.yen(bd.net)}</td></tr>
    </table>
    ${toLong > 0 ? `<div class="text-amber-800 font-bold">⏳ あと${toLong}ヶ月待つと長期20%。いまの価格なら手取りが ${L.yen(waitGain)} 増える計算</div>` : ''}
    <div class="text-[10px] text-slate-500">課税対象益 ${L.yen(bd.gain)}（売却価格 − ${term('book_value', '簿価')} ${L.yen(bd.book)}）</div>
  </div>`;
}

// v3.5: 売出価格は自由入力。査定はあくまで参考値として表示し、利回りをリアルタイムに見ながら自分で決める。
// v3.6: backを渡すと「← 戻る」を表示し、売り出し後・戻る押下でひとつ前の画面（売却センター等）へ戻る。
function drawPricing(m, p, appraisal, close, back) {
  m.innerHTML = '';
  let price = appraisal;
  const gpi = L.gpiAnnual(p);
  const yieldOf = (v) => (v > 0 ? (gpi / v * 100).toFixed(1) : '-');
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-center gap-2">${back ? '<button id="sl-back" class="text-xs text-navy shrink-0">← 戻る</button>' : ''}<h2 class="font-bold flex-1">売出価格を決める</h2><button id="sl-x2" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">不動産会社の査定額（参考）: <b>${L.yen(appraisal)}</b>（利回り${yieldOf(appraisal)}%）</div>
    <div class="text-center text-2xl font-black text-navy"><span id="sl-price-v">${L.yen(appraisal)}</span></div>
    <input id="sl-price-range" type="range" min="${Math.max(10000, Math.round(appraisal * 0.5))}" max="${Math.round(appraisal * 2)}" step="10000" value="${appraisal}" class="w-full">
    <div class="flex gap-1 text-xs">
      ${[0.9, 1.0, 1.1, 1.2].map(f => `<button class="sl-preset flex-1 border rounded py-1" data-f="${f}">査定×${Math.round(f * 100)}%</button>`).join('')}
    </div>
    <div class="text-center text-sm text-slate-600">この価格の${term('yield_gross', '表面利回り')} <span id="sl-yield" class="font-bold text-lg text-emerald-700">${yieldOf(appraisal)}</span>%
      <div class="text-[11px] text-slate-500">（満室想定・年間家賃収入 ${L.yen(gpi)} 基準）</div></div>
    <div id="sl-net">${netProceedsBox(p, appraisal)}</div>
    <div class="text-xs text-slate-500">安くすれば早く売れ、高いほど時間がかかる。訳あり物件を高利回りで仕入れ、通常の利回り水準の価格で売り抜く戦略も。</div>
    <button id="sl-list" class="w-full bg-emerald text-white rounded py-2">この価格で売りに出す</button>
    <button id="sl-cancel2" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  const range = box.querySelector('#sl-price-range');
  const updatePrice = () => {
    price = Math.max(10000, Number(range.value));
    box.querySelector('#sl-price-v').textContent = L.yen(price);
    box.querySelector('#sl-yield').textContent = yieldOf(price);
    box.querySelector('#sl-net').innerHTML = netProceedsBox(p, price);   // v8.1: 手取りも追従させる
  };
  range.addEventListener('input', updatePrice);
  box.querySelectorAll('.sl-preset').forEach(b => b.addEventListener('click', () => {
    range.value = Math.round(appraisal * Number(b.dataset.f) / 10000) * 10000;
    updatePrice();
  }));
  box.querySelector('#sl-list').addEventListener('click', () => {
    updatePrice();
    const r = L.listForSale(state, p.id, price, appraisal);
    // v8.2: 決済待ち・掲載中・未所有は logic 側で弾かれる。理由を出して黙って落とさない。
    if (!r.listed) {
      alert({ pendingSale: 'この物件は買付を承諾済みです。翌月の決済を待ってください。',
        alreadyListed: 'この物件はすでに売り出し中です。',
        notOwned: 'この物件はもう所有していません。' }[r.reason] || '売りに出せませんでした');
      close(); return;
    }
    state = r.state;
    pushLog(`${p.label} を ${L.yen(price)} で売りに出した（表面${yieldOf(price)}%）`);
    save(); render(); close();
    back?.();   // v3.6: 売りに出したらひとつ前の画面（売却センター等）へ戻る
  });
  box.querySelector('#sl-back')?.addEventListener('click', () => { close(); back(); });
  box.querySelector('#sl-cancel2').addEventListener('click', close);
  box.querySelector('#sl-x2').addEventListener('click', close);
}

function drawListingManage(m, p, listing, close) {
  m.innerHTML = '';
  const downTo = Math.round(listing.askingPrice * 0.95 / 10000) * 10000;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-start gap-2"><h2 class="font-bold">${p.name || p.label}（売出中 ${listing.listedMonths}ヶ月目）</h2><button id="sl-x3" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">売出価格: <b>${L.yen(listing.askingPrice)}</b></div>
    <button id="sl-down" class="w-full border rounded py-2 text-sm">5%値下げする → ${L.yen(downTo)}</button>
    <button id="sl-delist" class="w-full border rounded py-2 text-sm">掲載を取り下げる</button>
    <button id="sl-close" class="w-full text-slate-500 text-sm">閉じる</button></div>`);
  m.appendChild(box);
  box.querySelector('#sl-down').addEventListener('click', () => {
    state = L.updateListing(state, p.id, downTo).state;
    pushLog(`${p.label} を ${L.yen(downTo)} に値下げした`); save(); render(); close();
  });
  box.querySelector('#sl-delist').addEventListener('click', () => {
    state = L.delist(state, p.id).state;
    pushLog(`${p.label} の掲載を取り下げた`); save(); render(); close();
  });
  box.querySelector('#sl-close').addEventListener('click', close);
  box.querySelector('#sl-x3').addEventListener('click', close);
}

function showOfferModal(listing) {
  const p = state.properties.find(x => x.id === listing.propertyId);
  if (!p || !listing.offer) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const o = listing.offer;
  const lv = L.skillLevel(state.skills.negotiation.exp);
  const counterPrice = Math.round((o.price + listing.askingPrice) / 2 / 10000) * 10000;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <h2 class="font-bold">💌 ${p.name || p.label} に買付が入った！</h2>
    <div class="text-sm">売出 ${L.yen(listing.askingPrice)} に対し <b>${o.type === 'full' ? '満額' : '指値'} ${L.yen(o.price)}</b></div>
    ${netProceedsBox(p, o.price)}
    <button class="of-act w-full bg-emerald text-white rounded py-2 text-sm" data-a="accept">承諾する（翌月決済）</button>
    ${o.type === 'sashine' ? `<button class="of-act w-full border rounded py-2 text-sm" data-a="counter">カウンター ${L.yen(counterPrice)}（成立確率${Math.round((0.5 + (lv - 1) * 0.05) * 100)}%・不成立なら買付消滅）</button>` : ''}
    <button class="of-act w-full border rounded py-2 text-sm" data-a="reject">断る（掲載継続）</button></div>`);
  m.appendChild(box);
  box.querySelectorAll('.of-act').forEach(b => b.addEventListener('click', () => {
    const r = L.respondToOffer(state, listing.propertyId, b.dataset.a, lv, Math.random);
    state = r.state;
    pushLog({ accepted: '買付を承諾した。翌月に決済・入金', rejected: '買付を断った',
      counter_ok: `カウンター成立！${L.yen(r.settlePrice)} で売却へ`, counter_ng: 'カウンターは断られ、買付は流れた…' }[r.result]);
    save(); render(); close();
  }));
}

// ジャンル別の手描き風シルエット。汚れ/ひび/雑草/傾きは svgBuildingParts() の判定を反映する。
const BUILDING_SHAPES = {

    <rect x="44" y="55" width="13" height="20" fill="#78350f"/>
    <rect x="27" y="49" width="11" height="11" fill="${win}"/>

  apart: (wall, roof, win) => `
    <rect x="14" y="20" width="66" height="55" fill="${wall}"/>
    <rect x="14" y="20" width="66" height="6" fill="${roof}"/>
    ${[0, 1, 2, 3].map(i => `<rect x="${20 + i * 14}" y="30" width="9" height="9" fill="${win}"/>`).join('')}

    ${[0, 1, 2].flatMap(row => [0, 1, 2, 3].map(col =>
      `<rect x="${20 + col * 15}" y="${18 + row * 18}" width="9" height="9" fill="${win}"/>`)).join('')}`,

      `<rect x="${28 + col * 17}" y="${15 + row * 15}" width="10" height="9" fill="${row === 1 && col === 1 ? '#fbbf24' : win}" ${row === 1 && col === 1 ? 'stroke="#fff" stroke-width="1"' : ''}/>`)).join('')}`,
  rc: (wall, roof, win) => `
    <rect x="25" y="2" width="50" height="73" fill="${wall}"/>

function renderBuildingSVG(p, sizeClass = 'w-16 h-16') {
  const parts = L.svgBuildingParts(p);
  const wall = parts.wake ? '#d8cba8' : '#f1e4c9';
  const roof = { kodate: '#b3542e', apart: '#5b7fa6', tekkotsu: '#5b7fa6', kubun: '#94a3b8', rc: '#64748b' }[parts.shape];
  const win = parts.dirtLevel > 0.6 ? '#475569' : '#7dd3fc';
  const body = BUILDING_SHAPES[parts.shape](wall, roof, win);
  const dirt = parts.dirtLevel > 0.05 ? `<rect x="10" y="10" width="80" height="65" fill="#4b3621" opacity="${(parts.dirtLevel * 0.35).toFixed(2)}"/>` : '';
  const cracks = parts.hasCracks ? `<path d="M40,45 L44,55 L40,65 M60,40 L64,50 L58,58" stroke="#1e293b" stroke-width="1" fill="none" opacity="0.5"/>` : '';
  const weeds = parts.hasWeeds ? `<path d="M18,75 q2,-8 4,0 M22,75 q2,-10 4,0 M74,75 q2,-8 4,0" stroke="#16a34a" stroke-width="2" fill="none"/>` : '';
  return `<svg viewBox="0 0 100 80" class="${sizeClass} shrink-0">
    <g transform="${parts.tilt ? 'rotate(-6 50 70)' : ''}">${body}${dirt}${cracks}${weeds}</g>
  </svg>`;
}

// v3.2: 概要の「地図で場所を見る」。詳細を閉じて地図の該当地点へ飛び、
// 「タップすると詳細に戻れる」ことを吹き出しで数秒示す（市場物件はピンも立つ）。
function jumpToMapWithBubble(p, from) {
  if (from === 'owned') focusOnOwned(p.id); else focusOnMarket(p.id);
  const canvas = document.getElementById('city-canvas');
  const r = canvas ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  const bubble = el(`<div class="fixed z-[55] pointer-events-none" style="left:${Math.round(r.left + r.width / 2)}px; top:${Math.round(r.top + r.height * 0.30)}px; transform:translate(-50%,-100%); transition: opacity 0.5s;">
    <div class="bg-white rounded-xl shadow-xl px-4 py-2 text-sm font-bold text-navy">📍 ここ！ ${from === 'market' ? 'ピンや建物' : 'この建物'}をタップ（クリック）すると詳細に戻れます</div>
    <div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #fff;margin:0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.15));"></div>
  </div>`);
  document.body.appendChild(bubble);
  setTimeout(() => { bubble.style.opacity = '0'; }, 3800);
  setTimeout(() => bubble.remove(), 4400);

// === v4: 工事は「大分類（修繕/価値UP）→ 工事内容 → 実施方法（DIY/業者→借入）」の3階層 ===

// 物件の現況から選べる工事内容を組み立てる。cost はいずれも業者見積（DIYはこの30%が材料費）。
function workOptions(p, category) {
  if (category === 'valueup') {
    return Object.entries(L.VALUE_UP_PLANS).map(([key, pl]) => ({
      type: 'valueup', planKey: key, label: pl.label,
      detail: `業者なら工期${pl.months}ヶ月`,
      effect: `家賃 +${Math.round((pl.rentMult - 1) * 100)}%・資産価値UP`,
      cost: L.valueUpCost(p, key), diyable: pl.diyable, diyAp: pl.diyAp, blockedReason: pl.blockedReason,
    }));
  }
  const out = [];
  // 現状回復は退去した部屋ごと。回復するまでその部屋は募集できない。
  p.units.forEach((u, i) => {
    if (!u.needsRestore) return;
    out.push({
      type: 'restore', unitIndex: i, label: `現状回復（${i + 1}号室 ${u.layout || ''}）`,
      detail: u.restoreJob ? `業者が施工中（残り${u.restoreJob.monthsLeft}ヶ月）` : '退去後の原状回復。業者なら工期1ヶ月',
      effect: 'この部屋の募集を再開できる',
      cost: L.restoreCost(p, u), diyable: !p.autoManage, diyAp: L.RESTORE_DIY_AP,
      blockedReason: p.autoManage ? 'おまかせ契約中は原状回復も業者へ自動手配されます' : undefined,
      disabled: !!u.restoreJob, disabledReason: '施工中です',
      progress: u.restoreProgress || 0,
    });
  });
  // v6: 日常メンテは 🧹手入れ、大規模修繕は 🏚躯体 と、それぞれ別のゲージを直す。
  const lg = L.REPAIR_KINDS.large;
  const care = Math.round(p.careState ?? p.repairState ?? 100);
  const struct = Math.round(p.repairState ?? 100);
  // v8: 手入れが0（管理崩壊）まで落ちた物件では、日常メンテの代わりに特別清掃だけが出る。
  // 「0まで放置してから一度で直す」が最安にならないよう、日常メンテは選択肢から消す。
  const careKind = L.repairKindAvailable(p, 'maint') ? 'maint' : 'deepclean';
  const ck = L.REPAIR_KINDS[careKind];
  out.push({
    type: careKind, label: ck.label, detail: L.repairDetail(p, careKind),
    effect: `🧹 手入れ ${care}% → 100%`,
    cost: L.repairCost(p, careKind), diyable: ck.diyable && !p.autoManage, diyAp: ck.diyAp,
    blockedReason: !ck.diyable ? ck.blockedReason
      : p.autoManage ? 'おまかせ契約中は工事がすべて業者任せになります' : undefined,
    disabled: care >= 100,
    disabledReason: '手入れは既に100%です',
    progress: (p.diyProgress && p.diyProgress.kind === careKind) ? p.diyProgress.done : 0,
  });
  out.push({
    type: 'large', label: lg.label, detail: L.repairDetail(p, 'large'),
    effect: L.isCondemned(p)
      ? `🏚 躯体 ${struct}% → 100%・資産価値+8%・使用不能を解除`
      : `🏚 躯体 ${struct}% → 100%・資産価値+8%`,
    cost: L.repairCost(p, 'large'), diyable: false, blockedReason: lg.blockedReason,
    disabled: struct >= 100, disabledReason: '躯体は既に100%です',
  });
  return out;
}

// v8: qualityMult はDIYミニゲームの出来ばえ（業者発注では常に1で無関係）。
function runWork(propId, sel, diy, financed, qualityMult = 1) {
  const opts = { diy, financed, qualityMult };
  if (sel.type === 'restore') return L.startRestore(state, propId, sel.unitIndex, opts);
  if (sel.type === 'valueup') return L.startValueUp(state, propId, sel.planKey, opts);
  return L.startRepair(state, propId, sel.type, opts);
}

function openWorkMenu(propId, category, back) {
  const m = document.getElementById('repair-modal');
  m.classList.remove('hidden'); m.classList.add('flex');
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const title = category === 'repair' ? '🔨 修繕' : '✨ 価値UP';
  const lead = category === 'repair'
    ? '傷んだところを元に戻す工事です。'
    : '設備更新やリノベで家賃そのものを上げる投資です。';
  let step = 1, sel = null;

  const draw = () => {
    const p = state.properties.find(x => x.id === propId);
    if (!p) { close(); return; }
    m.innerHTML = '';
    const head = (backFn) => `<div class="flex justify-between items-center gap-2">
      ${backFn ? '<button id="wk-back" class="text-xs text-navy font-bold">← 戻る</button>' : '<span></span>'}
      <button id="wk-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>`;

    let body;
    if (step === 1) {
      const opts = workOptions(p, category);
      const rows = opts.map((o, i) => {
        const off = o.disabled;
        return `<button class="wk-opt w-full border rounded-lg p-2.5 text-left ${off ? 'opacity-40' : 'hover:bg-slate-50'}" data-i="${i}" ${off ? 'disabled' : ''}>
          <div class="font-bold text-sm">${o.label}</div>
          <div class="text-xs text-slate-600">${o.detail}</div>
          <div class="text-xs text-slate-700 mt-0.5">${o.effect}</div>
          <div class="text-xs mt-0.5">業者見積 <b>${L.yen(o.cost)}</b>${o.diyable ? ` ／ DIY材料費 <b>${L.yen(Math.round(o.cost * L.DIY_MATERIAL_RATE))}</b>` : ' <span class="text-slate-500">（業者のみ）</span>'}</div>
          ${o.progress > 0 ? `<div class="text-xs text-emerald-700 font-bold mt-0.5">DIY作業中 ${Math.min(100, Math.round(o.progress))}%</div>` : ''}
          ${off ? `<div class="text-xs text-red-600 mt-0.5">${o.disabledReason}</div>` : ''}</button>`;
      }).join('');
      body = `${head(back)}<h2 class="font-bold">${title}｜${p.name || p.label}</h2>
        <div class="text-xs text-slate-500">${lead}どの工事をするか選んでください。</div>
        <div class="space-y-1.5">${rows || '<div class="text-sm text-slate-500 py-4 text-center">いま必要な工事はありません。</div>'}</div>`;
    } else if (step === 2) {
      const material = Math.round(sel.cost * L.DIY_MATERIAL_RATE);
      const months = sel.type === 'restore' ? 1
        : sel.type === 'valueup' ? L.VALUE_UP_PLANS[sel.planKey].months
        : L.repairJobMonths(p, sel.type);
      body = `${head(true)}<h2 class="font-bold">${sel.label}</h2>
        <div class="text-xs text-slate-500">${sel.effect}</div>
        <button id="wk-diy" class="w-full border-2 rounded-lg p-3 text-left ${sel.diyable ? 'hover:bg-slate-50 border-emerald-500' : 'opacity-50'}" ${sel.diyable ? '' : 'disabled'}>
          <div class="font-bold text-sm">🔨 自分でやる（DIY）${sel.diyable ? '' : '<span class="text-xs font-normal">｜この工事では選べません</span>'}</div>
          ${sel.diyable ? `<div class="text-xs text-slate-600">材料費 <b>${L.yen(material)}</b>のみ・行動力${sel.diyAp}を何回か使って自分で仕上げる</div>
          <div class="text-xs text-emerald-700">安く済むが、その月の行動力を使う</div>`
            : `<div class="text-xs text-red-600">${sel.blockedReason || ''}</div>`}</button>
        <button id="wk-pro" class="w-full border-2 border-navy rounded-lg p-3 text-left hover:bg-slate-50">
          <div class="font-bold text-sm">🏢 業者に頼む</div>
          <div class="text-xs text-slate-600">費用 <b>${L.yen(sel.cost)}</b>・行動力5だけ・工期${months}ヶ月</div>
          <div class="text-xs text-navy">高いが手が空く。リフォームローンも使える</div></button>`;
    } else {
      const loanAmount = L.reformLoanAmount(sel.cost, state.creditScore);
      const down = sel.cost - loanAmount;
      const openLoans = (p.reformLoans || []).length;
      body = `${head(true)}<h2 class="font-bold">${sel.label}｜支払い方法</h2>
        <div class="text-sm">費用 <b>${L.yen(sel.cost)}</b>（現金 ${L.yen(state.cash)}）</div>
        <button id="wk-cash" class="w-full border rounded-lg py-2.5 text-sm font-bold ${state.cash < sel.cost ? 'opacity-40' : 'hover:bg-slate-50'}" ${state.cash < sel.cost ? 'disabled' : ''}>現金で支払う（${L.yen(sel.cost)}）</button>
        <button id="wk-loan" class="w-full bg-navy text-white rounded-lg py-2.5 text-sm font-bold ${state.cash < down ? 'opacity-40' : ''}" ${state.cash < down ? 'disabled' : ''}>
          リフォームローンを使う（頭金${L.yen(down)}＋借入${L.yen(loanAmount)}）</button>
        <div class="text-xs text-slate-500">金利${(L.CONFIG.reformLoanRate * 100).toFixed(1)}%・${L.CONFIG.reformLoanYears}年。借入可能額は信用度で変わります。
          ${openLoans ? `この物件には返済中のローンが${openLoans}本ありますが、重ねて借りられます。` : ''}</div>`;
    }

    const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-md space-y-2 max-h-[85vh] overflow-y-auto">${body}</div>`);
    m.appendChild(box);
    box.querySelector('#wk-x').addEventListener('click', close);
    box.querySelector('#wk-back')?.addEventListener('click', () => {
      if (step === 1) { close(); back && back(); } else { step -= 1; draw(); }
    });
    box.querySelectorAll('.wk-opt').forEach(b => b.addEventListener('click', () => {
      sel = workOptions(p, category)[Number(b.dataset.i)];
      step = 2; draw();
    }));
    box.querySelector('#wk-diy')?.addEventListener('click', () => {
      if (state.actionPower < (sel.diyAp || 0)) { alert('行動力が足りません。翌月へ進むと回復します。'); return; }
      const material = Math.round(sel.cost * L.DIY_MATERIAL_RATE);
      if ((sel.progress || 0) <= 0 && state.cash < material) { alert(`材料費 ${L.yen(material)} が足りません。`); return; }
      close();
      openDiySession(propId, sel, category, back);
    });
    box.querySelector('#wk-pro')?.addEventListener('click', () => { step = 3; draw(); });
    box.querySelector('#wk-cash')?.addEventListener('click', () => order(false));
    box.querySelector('#wk-loan')?.addEventListener('click', () => order(true));
  };

  const order = (financed) => {
    if (state.actionPower < 5) { alert('行動力が足りません'); return; }
    const r = runWork(propId, sel, false, financed);
    if (!r.started) { alert(r.reason === 'cash' ? '現金が足りません' : '発注できませんでした'); return; }
    state = r.state;
    const p = state.properties.find(x => x.id === propId);
    pushLog(`${p.name || p.label} の${sel.label}を業者へ発注（${r.financed ? `リフォームローン${L.yen(r.loanAmount)}` : `現金${L.yen(r.cost)}`}）`);
    save(); render(); close();
    showRepairEffect(propId, `🔨 ${sel.label} を発注（工期${r.monthsTotal || r.months || 1}ヶ月）`);
  };

  draw();
}

    <rect width="220" height="176" fill="url(#dsky)"/><rect y="132" width="220" height="44" fill="#8fbf6a"/>
    <rect x="64" y="60" width="92" height="76" fill="#e7d9b6"/><rect x="60" y="58" width="100" height="8" fill="#c9b787"/>

// 工事内容 → 背景・対象アイテム・配置。DIY可能な4種のみ（大規模修繕は業者専用で出ない）。
// v8.1: 道具は「モノ」ではなく「動作」で持つ。
// v8では スポンジ／ドライバー／レンチ のようなモノを1:1で当てさせていたが、
// スポンジはキッチンにも風呂にも使えるし、ドライバーとレンチの区別も現場を知らないと付かない。
// 当て物になってしまい「軽い負荷」ではなく理不尽だったので、動作に置き換えたうえで
// **必要な動作と回数を箇所に表示する**（当てるゲームをやめ、段取りと手数の遊びにする）。
const DIY_ACTIONS = {
  sweep:   ['🧹', '掃く'],
  wash:    ['💧', '洗う'],
  paint:   ['🎨', '塗る'],
  tighten: ['🔧', '締める'],
  mow:     ['✂️', '刈る'],
  swap:    ['🔌', '交換'],
};

// v8: 各キットに「正しい施工順」と「動作の対応」を持たせた。
// order はミニゲームの正解であると同時に、実際の現場の段取りでもある（遊びながら覚えられる）。
const DIY_KITS = {
  maint: {
    bg: 'exterior', items: ['web', 'weed', 'grime', 'leaf'],
    order: ['web', 'grime', 'weed', 'leaf'],
    orderHint: '清掃は上から下へ。高いところの汚れを先に落とす',
    acts: { web: 'sweep', grime: 'wash', weed: 'mow', leaf: 'sweep' },
  },
  restore: {
    bg: 'room', items: ['wallstain', 'floor', 'pinhole', 'ceiling'],
    order: ['ceiling', 'pinhole', 'wallstain', 'floor'],
    orderHint: '内装は天井→壁→床の順。床を先に仕上げると汚れて二度手間になる',
    acts: { ceiling: 'paint', pinhole: 'paint', wallstain: 'wash', floor: 'wash' },
  },
  equip: {
    bg: 'room', items: ['ac', 'light', 'door', 'outlet'],
    order: ['outlet', 'light', 'ac', 'door'],
    orderHint: '電気は配線から仕上げへ。建具（扉）は最後に調整する',
    acts: { outlet: 'swap', light: 'swap', ac: 'swap', door: 'tighten' },
  },
  water: {
    bg: 'water', items: ['kitchen', 'toilet', 'bath', 'faucet'],
    order: ['faucet', 'kitchen', 'bath', 'toilet'],
    orderHint: '水まわりは止水栓から。上流（給水）を止めてから下流へ進む',
    acts: { faucet: 'tighten', kitchen: 'wash', bath: 'wash', toilet: 'tighten' },
  },
};

// v8: DIYの遊び方は毎回ランダム。押す順・タイミング・道具選びの3種で単調さを解消する。
// どれも「失敗しても詰まない／上手いほど早く終わる」で揃えてある。
const DIY_MODES = ['order', 'timing', 'tool'];
const DIY_MODE_LEAD = {
  order: '正しい順番でタップして直そう！順番を間違えると手戻りになる。',
  timing: 'タップしてゲージを緑で止めよう！きれいに仕上げるほど早く終わる。',
  tool:   '道具を持ち替えて、表示された回数だけタップ！何をどれだけやるかは箇所に書いてある。',
};
// 各箇所に必要なタップ数。合計8回になるよう固定し、配置だけ毎回変える（session時間を読みやすくする）。
const DIY_HITS = [1, 2, 2, 3];
const DIY_POS = [{ l: 27, t: 34 }, { l: 71, t: 30 }, { l: 30, t: 74 }, { l: 73, t: 72 }];
function diyKitFor(sel) {
  if (sel.type === 'restore') return 'restore';
  if (sel.type === 'valueup') return sel.planKey === 'standard' ? 'water' : 'equip';
  return 'maint';
}

function openDiySession(propId, sel, category, back) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('diy-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const kit = DIY_KITS[diyKitFor(sel)];
  const items = kit.items;
  const n = items.length;
  const before = Math.min(100, Math.round(sel.progress || 0));
  const mode = DIY_MODES[Math.floor(Math.random() * DIY_MODES.length)];
  const easy = state.difficulty === 'beginner';
  let fixed = 0, misses = 0, apPenalty = 0;
  let pickedTool = null;      // tool モードで持っている動作（DIY_ACTIONS のキー）
  let freeToolMiss = true;    // 持ち替え忘れの1回目はミスにせず、必要な動作を教えるだけにする

  // order モード: 初心者は番号を出しっぱなし。中上級は開始2秒だけ見せて消す。
  const showNums = mode === 'order';
  const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-2">
    <div class="flex justify-between items-center"><h2 class="font-bold truncate">🔨 ${sel.label}</h2><button id="diy-close" class="text-slate-400 text-xl shrink-0">✕</button></div>
    <div class="text-xs text-slate-500">材料費 ${L.yen(Math.round(sel.cost * L.DIY_MATERIAL_RATE))}${before > 0 ? '（支払い済み）' : ''}・行動力-${sel.diyAp}。${DIY_MODE_LEAD[mode]}</div>
    ${mode === 'order' ? `<div class="text-[11px] bg-sky-50 text-sky-800 rounded px-2 py-1">📐 ${kit.orderHint}</div>` : ''}
    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden"><div class="bg-emerald-500 h-2 transition-all" style="width:${before}%"></div></div>
    <div class="text-xs text-slate-600 text-center">全体の進捗 ${before}%</div>
    ${mode === 'tool' ? `<div id="diy-tools" class="flex gap-1 justify-center"></div>` : ''}
    <div id="diy-stage" class="relative mx-auto rounded-lg overflow-hidden" style="width:220px;height:176px;">
      <div class="absolute inset-0">${diyBackdrop(kit.bg)}</div>
    </div>
    <div id="diy-timing" class="hidden"></div>
    <div class="text-center text-sm font-bold" id="diy-progress">0 / ${n} 直した</div>
    <div class="text-center text-[11px] h-4" id="diy-note"></div>
    <button id="diy-cancel" class="w-full text-slate-500 text-sm">やめる（この回の作業は行われません）</button></div>`);
  m.appendChild(box);
  const stage = box.querySelector('#diy-stage');
  const noteEl = box.querySelector('#diy-note');
  const note = (text, ok) => {
    noteEl.textContent = text;
    noteEl.className = `text-center text-[11px] h-4 font-bold ${ok ? 'text-emerald-600' : 'text-red-600'}`;
  };
  const shake = (elm) => elm.animate(
    [{ transform: 'translate(-50%,-50%) rotate(0deg)' }, { transform: 'translate(-52%,-50%) rotate(-6deg)' },
     { transform: 'translate(-48%,-50%) rotate(6deg)' }, { transform: 'translate(-50%,-50%) rotate(0deg)' }],
    { duration: 260 });

  // 1箇所の修理を確定させる。3モード共通の後始末（絵の差し替え・進捗・完了判定）。
  const finishSpot = (spot, key) => {
    spot.dataset.done = '1';
    spot.querySelector('svg').innerHTML = DIY_ART[key]('a');
    spot.animate([{ transform: 'translate(-50%,-50%) scale(0.7)' }, { transform: 'translate(-50%,-50%) scale(1.15)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 400, easing: 'ease-out' });
    const num = spot.querySelector('.diy-num'); if (num) num.remove();
    sfxKnock();
    fixed++;
    box.querySelector('#diy-progress').textContent = `${fixed} / ${n} 直した`;
    if (fixed >= n) {
      const q = L.diyQualityOf(misses);
      const rank = misses === 0 ? '✨ 完璧な仕上がり！' : misses <= 1 ? '🔨 まずまずの出来' : '😓 手戻りが多かった…';
      note(rank, misses <= 1);
      setTimeout(() => { close(); applyDiy(propId, sel, category, back, q, apPenalty); }, 700);
    }
  };

  // --- tool モード: 動作パレット（タップで持ち替え → 箇所をタップ。ドラッグはスマホで誤爆しやすいので使わない）---
  // 必要な動作は箇所のバッジに書いてあるので「当てる」要素はない。持ち替えと手数の管理だけを遊ばせる。
  if (mode === 'tool') {
    const palette = box.querySelector('#diy-tools');
    // このキットで実際に使う動作だけを、毎回シャッフルして並べる
    const acts = [...new Set(items.map(k => kit.acts[k]))].sort(() => Math.random() - 0.5);
    acts.forEach(act => {
      const [icon, label] = DIY_ACTIONS[act];
      const b = el(`<button class="diy-tool border-2 rounded-lg px-2 py-1 text-center leading-tight" data-a="${act}">
        <div class="text-lg">${icon}</div><div class="text-[9px] text-slate-600">${label}</div></button>`);
      b.addEventListener('click', () => {
        pickedTool = act;
        palette.querySelectorAll('.diy-tool').forEach(x => {
          x.classList.toggle('border-navy', x.dataset.a === act);
          x.classList.toggle('bg-slate-100', x.dataset.a === act);
        });
        note(`${icon} ${label}`, true);
      });
      palette.appendChild(b);
    });
  }

  // --- timing モード: 往復するマーカーを緑ゾーンで止める ---
  const runTiming = (onResult) => {
    const bar = box.querySelector('#diy-timing');
    const zoneW = easy ? 34 : 20;                       // 緑ゾーンの幅（%）
    const zoneL = 8 + Math.random() * (84 - zoneW);     // 端に寄りすぎないよう内側に置く
    bar.className = 'relative w-full h-7 bg-slate-200 rounded-lg overflow-hidden cursor-pointer select-none';
    bar.innerHTML = `<div class="absolute inset-y-0 bg-emerald-400/70" style="left:${zoneL}%;width:${zoneW}%"></div>
      <div id="diy-marker" class="absolute inset-y-0 w-1 bg-navy" style="left:0%"></div>
      <div class="absolute inset-0 flex items-center justify-center text-[11px] font-bold text-navy pointer-events-none">タップで止める</div>`;
    const marker = bar.querySelector('#diy-marker');
    const period = easy ? 1500 : 1050;                  // 往復1周にかかる時間（短いほど難しい）
    const t0 = performance.now();
    let stopped = false;
    // 判定位置は「タップした瞬間の実時刻」から計算する。requestAnimationFrame は
    // タブが非アクティブだと止まるので、描画に判定を依存させると全部ミスになってしまう。
    const posAt = (t) => {
      const phase = ((t - t0) % period) / period;       // 0→1
      return phase < 0.5 ? phase * 2 * 100 : (1 - phase) * 2 * 100;
    };
    const tick = () => {
      if (stopped) return;
      marker.style.left = `${posAt(performance.now())}%`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    const stop = () => {
      if (stopped) return;
      stopped = true;
      const pos = posAt(performance.now());
      bar.classList.add('hidden');
      bar.replaceWith(bar.cloneNode(true));             // リスナーごと差し替えて多重発火を防ぐ
      const center = zoneL + zoneW / 2;
      const inZone = pos >= zoneL && pos <= zoneL + zoneW;
      const perfect = inZone && Math.abs(pos - center) <= zoneW * 0.2;
      onResult(perfect ? 'perfect' : inZone ? 'good' : 'miss');
    };
    bar.addEventListener('click', stop);
  };

  // tool モードだけ、箇所ごとに必要タップ数を割り振る（配置は毎回シャッフル）
  const hits = mode === 'tool' ? [...DIY_HITS].sort(() => Math.random() - 0.5) : null;
  items.forEach((key, i) => {
    const pos = DIY_POS[i % DIY_POS.length];
    const orderNo = kit.order.indexOf(key) + 1;
    const act = kit.acts[key];
    const [actIcon, actLabel] = DIY_ACTIONS[act];
    const spot = el(`<button class="diy-spot absolute" data-k="${key}" data-a="${act}" style="left:${pos.l}%;top:${pos.t}%;transform:translate(-50%,-50%);width:60px;height:60px;padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));">
      <svg viewBox="0 0 64 64" width="60" height="60" style="border-radius:8px;">${DIY_ART[key]('b')}</svg>
      ${showNums ? `<span class="diy-num absolute -top-1 -left-1 bg-navy text-white text-[10px] font-black rounded-full w-4 h-4 flex items-center justify-center">${orderNo}</span>` : ''}
      ${hits ? `<span class="diy-hit absolute -top-2 -right-2 bg-white border-2 border-navy text-navy text-[10px] font-black rounded-full px-1 py-0.5 leading-none whitespace-nowrap">${actIcon}×<span class="diy-hit-n">${hits[i]}</span></span>` : ''}</button>`);
    if (hits) spot.dataset.left = String(hits[i]);
    stage.appendChild(spot);
    spot.addEventListener('click', () => {
      if (spot.dataset.done || spot.dataset.busy) return;

      if (mode === 'order') {
        if (kit.order[fixed] !== key) {
          misses++; shake(spot);
          note(`まだ早い！ ${kit.orderHint}`, false);
          return;
        }
        note('段取りどおり！', true);
        finishSpot(spot, key);

      } else if (mode === 'tool') {
        if (!pickedTool) { note(`先に ${actIcon} ${actLabel} を持とう`, false); shake(spot); return; }
        if (pickedTool !== act) {
          // 必要な動作は箇所に書いてあるので、これは持ち替え忘れ。1回目は無料で気づかせる。
          shake(spot);
          if (freeToolMiss) {
            freeToolMiss = false;
            note(`ここは ${actIcon} ${actLabel}（上から持ち替えよう）`, false);
          } else {
            misses++; apPenalty += 2;
            note(`ここは ${actIcon} ${actLabel}（行動力-2 累計-${apPenalty}）`, false);
          }
          return;
        }
        const left = Number(spot.dataset.left) - 1;
        spot.dataset.left = String(left);
        sfxKnock();
        spot.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(0.88)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 180 });
        if (left > 0) {
          spot.querySelector('.diy-hit-n').textContent = String(left);
          note(`${actLabel}（あと${left}回）`, true);
          return;
        }
        spot.querySelector('.diy-hit')?.remove();
        note(`${actLabel} 完了！`, true);
        finishSpot(spot, key);

      } else {
        spot.dataset.busy = '1';
        runTiming(result => {
          spot.dataset.busy = '';
          if (result === 'miss') {
            misses++; shake(spot);
            note('手元が狂った…もう一度', false);
            return;
          }
          note(result === 'perfect' ? '✨ Perfect！' : '👍 Good', true);
          finishSpot(spot, key);
        });
      }
    });
  });

  // 中上級では順番のヒントを2秒で消す（覚えゲーにせず、毎回の判断にする）
  if (showNums && !easy) {
    setTimeout(() => box.querySelectorAll('.diy-num').forEach(x => x.remove()), 2000);
  }
  box.querySelector('#diy-close').addEventListener('click', close);
  box.querySelector('#diy-cancel').addEventListener('click', close);
}

function applyDiy(propId, sel, category, back, qualityMult = 1, apPenalty = 0) {
  const r = runWork(propId, sel, true, false, qualityMult);
  if (!r.started) { alert('作業できませんでした'); return; }
  state = r.state;
  // v8: 道具を間違えたぶんの手間。ミニゲームの結果をここで一括して state に反映する。
  if (apPenalty) state.actionPower -= apPenalty;
  const p = state.properties.find(x => x.id === propId);
  if (r.done) {
    pushLog(`${p.name || p.label} の${sel.label}をDIYで完了した`);
    save(); render();
    showRepairEffect(propId, `🔨 ${sel.label} 完了！`);
  } else {
    const now = sel.type === 'restore'
      ? (p.units[sel.unitIndex].restoreProgress || 0)
      : (p.diyProgress ? p.diyProgress.done : 0);
    pushLog(`${p.name || p.label} の${sel.label}をDIY中（進捗${Math.min(100, Math.round(now))}%・行動力-${sel.diyAp}）`);
    save(); render();
    showRepairEffect(propId, `🔨 進捗 ${Math.min(100, Math.round(now))}%`);
    openWorkMenu(propId, category, back);   // 続けて作業できるよう工事メニューへ戻る
  }
}

// EXPフロート表示・実績バッジトースト。render()の後で毎回呼び、直前状態との差分から自動検知する。
let lastSkillExp = null;
function showExpFloats() {
  if (!state?.skills) return;
  if (lastSkillExp) {
    for (const key of Object.keys(state.skills)) {
      const before = lastSkillExp[key] ?? state.skills[key].exp;
      const gained = state.skills[key].exp - before;
      if (gained !== 0) {
        const row = document.querySelector(`[data-skill="${key}"]`);
        if (row) {
          // v3.8: 評判ダウン（EXP減少）は赤色で見せる
          const f = el(`<span class="absolute right-0 -top-3 text-xs font-bold ${gained > 0 ? 'text-emerald' : 'text-red-600'} exp-float">${gained > 0 ? '+' : ''}${gained} EXP</span>`);
          row.appendChild(f);
          setTimeout(() => f.remove(), 1200);
        }
      }
    }
  }
  lastSkillExp = Object.fromEntries(Object.keys(state.skills).map(k => [k, state.skills[k].exp]));
}

function wireWorkButton(btn) {
  let timer = null, sessionEarned = 0, sessionCount = 0;
  const workOnce = () => {
    const r = L.doWork(state, Math.random);
    if (!r.earned) { stopWork(); return; }
    state = r.state; sessionEarned += r.earned; sessionCount += 1;
    updateHudLive();
    sfxCoin();
    floatEarn(btn, r.earned);
    tutMaybeAdvance('work');
  };
  const startWork = (e) => {
    e.preventDefault();
    if (timer) return;
    if (state.actionPower < 1) { alert('行動力が足りません。翌月へ進むと回復します。'); return; }
    workOnce();
    timer = setInterval(workOnce, 120);
  };
  const stopWork = () => {
    if (timer) { clearInterval(timer); timer = null; }
    if (sessionCount) {
      pushLog(`働いて ${L.yen(sessionEarned)} 稼いだ（行動力-${sessionCount}）`);
      sessionEarned = 0; sessionCount = 0;
      save(); render();
    }
  };
  btn.addEventListener('pointerdown', startWork);
  btn.addEventListener('pointerup', stopWork);
  btn.addEventListener('pointerleave', stopWork);
  btn.addEventListener('pointercancel', stopWork);
}

function openPropertyFromNotif(n) {
  const propertyId = typeof n === 'object' ? n?.propertyId : n;
  const snapshot = typeof n === 'object' ? n?.snapshot : null;
  if (propertyId == null) return;
  if (state.properties.some(p => p.id === propertyId)) { openDetail(propertyId, 'owned'); return; }
  if (state.market.some(p => p.id === propertyId)) { openDetail(propertyId, 'market'); return; }
  if (snapshot) { openSoldSnapshot(snapshot); return; }
  alert('その物件は既に取引済みのため詳細を表示できません');
}

// 値下げ・他決などの通知トースト。✕は表示を消すだけ（未読は残る）、✓は既読化＋物件詳細へ飛ぶ。
const _toasts = [];
function restackToasts() {
  let top = 16;
  _toasts.forEach(t => { t.style.top = top + 'px'; top += (t.offsetHeight || 44) + 8; });
}
function dismissToast(t) {
  const i = _toasts.indexOf(t); if (i < 0) return;
  _toasts.splice(i, 1);
  t.style.transition = 'opacity 0.3s'; t.style.opacity = '0';
  setTimeout(() => t.remove(), 300);
  restackToasts();
}
function showNotifToast(n) {
  const t = el(`<div class="fixed left-1/2 -translate-x-1/2 bg-amber-500 text-white rounded-lg shadow-lg px-3 py-2 z-[60] text-sm font-bold flex items-center gap-2">
    <span class="flex-1">🔔 ${n.message}</span>
    <button class="toast-check bg-white/25 rounded px-2 py-1 text-xs shrink-0" title="物件詳細へ">✓</button>
    <button class="toast-close bg-white/25 rounded px-2 py-1 text-xs shrink-0" title="閉じる">✕</button>
  </div>`);
  document.body.appendChild(t);
  _toasts.push(t);
  restackToasts();
  t.querySelector('.toast-close').addEventListener('click', (e) => { e.stopPropagation(); dismissToast(t); });
  t.querySelector('.toast-check').addEventListener('click', (e) => {
    e.stopPropagation();
    if (n.id != null) state = L.markNotificationRead(state, n.id).state;
    save(); renderPanelRight();
    dismissToast(t);
    openPropertyFromNotif(n);
  });
}
// Enterキーで一番上（最初に出た）トーストから順に閉じる。
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && _toasts.length) { e.preventDefault(); dismissToast(_toasts[0]); }
});

// v7: チュートリアル専用。乱数の出物待ちにせず、1回の押下で必ずサンプル物件を1件 state.market に追加する。
// 終了時に state はスナップショットへ復元されるため、本編の資産や市場には影響しない。
function tutForceFind(box, closeModal) {
  const rng = () => 0.4;
  const p = L.generateProperty('kodate', 'local', rng, null, {});
  state.nextPropertyId = state.nextPropertyId || 1;
  p.id = 'p' + state.nextPropertyId++;
  p.name = L.propertyName(p.genreKey, p.builtAge, p.id);
  state.market.unshift(p);
  // 体験用に、購入と融資審査が必ず通るぶんだけ所持金を底上げする（不足分のみ）
  state.cash = Math.max(state.cash, Math.round(p.price * 1.5) + 100000);
  setCityState(state);
  save();
  const feed = box.querySelector('#sr-feed');
  feed.querySelector('.sr-empty')?.remove();
  const line = el(`<div class="sr-found font-bold text-emerald-700 underline cursor-pointer">🖥️ ポータルサイトを巡回した…おっ！ ${p.name || p.label} の情報を掴んだ（タップで詳細）</div>`);
  line.addEventListener('click', () => { closeModal(); openDetail(p.id, 'market', openSearchModal); });
  feed.insertBefore(line, feed.firstChild);
  sfxKnock();
  pushLog(`${p.name || p.label}（${p.label}）を発見（表面${(p.grossYield * 100).toFixed(1)}%・${L.yen(p.price)}）`);
  box.querySelector('#sr-progress').textContent = '発見！ 続けて探すこともできます';
  renderPanelRight();
  tutMaybeAdvance('search');
}

// v3.11: 平凡（低利回り）物件の淡々とした紹介フレーバー（良い情報ではなく日常の一コマ）
const MUNDANE_LINES = [
  '🖥️ ポータルサイトに普通に載っていた物件を眺めた',
  '📋 長く売りに出ている物件を紹介された',
  '🏢 不動産屋に「一応こんなのも」と勧められた',
  '📰 折込チラシに載っていた売れ残りをチェックした',
  '🤝 業者から「利回りは高くないですが」と案内された',
];

function onSearchPress(box, closeModal) {
  const sel = readSearchSelection();
  if (!sel.genres.length || !sel.areas.length || !sel.ages.length) { alert('ジャンル・エリア・築年帯を1つ以上選んでください'); return { pressed: false }; }
  if (state.actionPower < 1) { alert('行動力が足りません。翌月へ進むと回復します。'); return { pressed: false }; }
  searchSelection = sel;
  const genres = sel.wakeari ? sel.genres.flatMap(k => [k, WAKEARI_MAP[k]]) : sel.genres;
  const r = L.doSalesPress(state, { genres, areas: sel.areas, ages: sel.ages }, Math.random);
  if (!r.pressed) { alert('行動力が足りません。翌月へ進むと回復します。'); return { pressed: false }; }
  state = r.state; save();
  setCityState(state);   // v3.8fix: 新着物件を地図側の状態にも反映（これがないと「地図を見る」が効かない）
  const feed = box.querySelector('#sr-feed');
  feed.querySelector('.sr-empty')?.remove();
  const act = SEARCH_ACTIONS[Math.floor(Math.random() * SEARCH_ACTIONS.length)];
  updateHudLive();
  // v3.11: 平凡（低利回り）物件は淡々と一覧に流す（利回り数字で自分で判断する目利きの場）。長押しは止めない。
  if (r.mundane && r.mundane.length) {
    for (const mp of r.mundane) {
      const ml = MUNDANE_LINES[Math.floor(Math.random() * MUNDANE_LINES.length)];
      const line = el(`<div class="sr-mundane text-slate-500 underline cursor-pointer">${ml}：${mp.name || mp.label}（表面${(mp.grossYield * 100).toFixed(1)}%）</div>`);
      line.addEventListener('click', () => { closeModal(); openDetail(mp.id, 'market', openSearchModal); });
      feed.insertBefore(line, feed.firstChild);
    }
    sfxMundane();
    pushLog(`平凡な出物を${r.mundane.length}件見た（低利回り・売れ残り）`);
    renderPanelRight();
  }
  if (r.found) {
    // v3.5: 自動で一覧へ飛ばず、発見ログをタップで詳細へ（ログは消えず残る）
    const line = el(`<div class="sr-found font-bold text-emerald-700 underline cursor-pointer">${act}…おっ！ ${r.found.name || r.found.label} の情報を掴んだ（タップで詳細）</div>`);
    line.addEventListener('click', () => { closeModal(); openDetail(r.found.id, 'market', openSearchModal); });
    feed.insertBefore(line, feed.firstChild);
    sfxKnock();
    pushLog(r.log);
    box.querySelector('#sr-progress').textContent = '発見！ 続けて探すこともできます';
    renderPanelRight();
    return { pressed: true, found: true };
  }
  sfxStep();   // v6: 「働く」と同じく、1押しごとに手応えの音を返す
  const miss = SEARCH_MISS[Math.floor(Math.random() * SEARCH_MISS.length)];
  feed.insertBefore(el(`<div>${act}${miss}</div>`), feed.firstChild);
  box.querySelector('#sr-progress').textContent = `調査継続中（累計 行動力${state.salesSearch.spent}消費）`;
  renderPanelRight();
  return { pressed: true, found: false };
}

// 翌月へ進む瞬間、シティビューの各建物から現金表示へ💰（ドル袋）が飛ぶ「回収」の動き。
// v5: 🪙のCSS直線移動をやめ、requestAnimationFrame で弧を描かせながら回転させる（ピンハネ帝国の集金の質感）。
// 着弾すると現金表示がポップする。所有件数が多いと待ち時間が長くなるため最大12個までに丸める。
const COIN_MAX = 12, COIN_FLY_MS = 780;
function playCoinCollectAnimation() {
  const cashTile = document.getElementById('hud-cash') || document.querySelector('#mobile-status .ms-kpi[data-kpi="cash"]');
  const all = cityBuildingScreenPositions();
  if (!cashTile || !all.length) return;
  const step = Math.max(1, Math.ceil(all.length / COIN_MAX));
  const spots = all.filter((_, i) => i % step === 0).slice(0, COIN_MAX);
  const dest = cashTile.getBoundingClientRect();
  const destX = dest.left + dest.width / 2, destY = dest.top + dest.height / 2;
  const delay = spots.length > 6 ? 60 : 90;

  spots.forEach((pos, i) => setTimeout(() => {
    const bag = el(`<div class="fixed z-50 pointer-events-none" style="left:0;top:0;font-size:22px;will-change:transform;">💰</div>`);
    document.body.appendChild(bag);
    sfxCoin();
    const sx = pos.x, sy = pos.y - 26;
    // 出発点と着弾点の中間を上に持ち上げた制御点で二次ベジェを描く＝放物線状の弧になる
    const ctrlX = (sx + destX) / 2 + (sx < destX ? 30 : -30);
    const ctrlY = Math.min(sy, destY) - 90;
    const spin = (i % 2 ? 1 : -1) * 320;
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / COIN_FLY_MS);
      const u = 1 - t;
      const x = u * u * sx + 2 * u * t * ctrlX + t * t * destX;
      const y = u * u * sy + 2 * u * t * ctrlY + t * t * destY;
      bag.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%) rotate(${spin * t}deg) scale(${1 - t * 0.45})`;
      bag.style.opacity = String(t > 0.85 ? (1 - t) / 0.15 : 1);
      if (t < 1) requestAnimationFrame(tick);
      else { bag.remove(); popCashTile(cashTile); }
    };
    requestAnimationFrame(tick);
  }, i * delay + 20));
}

// 着弾のたびに現金表示を弾ませる（ピンハネ帝国の cashPop 相当）
function popCashTile(tile) {
  tile.style.transition = 'transform 0.14s ease-out';
  tile.style.transform = 'scale(1.12)';
  setTimeout(() => { tile.style.transform = 'scale(1)'; }, 140);
}

// v5: 翌月ボタンで地球儀が初期位置へ戻るのにかかる時間。集金演出はこれを待ってから始める。
// 先に飛ばすと、プレイヤーが地球儀の裏側を向けたまま翌月を押したときに建物が画面外にあり、
// 演出が丸ごと空振りしてしまう（実機検証で発見）。
const VIEW_RESET_MS = 1400;

// === v8: 巻き戻し（初心者モードのお守り）===
// 月送りの直前の state を1世代だけメモリに持ち、「先月へ戻る」で復元する。
// 保存しないのは意図的。セーブを膨らませたくないのと、リロードしてまで使い回す機能ではないため。
let rewindSnapshot = null;

function maybeOfferRewind() {
  const box = document.getElementById('rewind-bar');
  if (!box) return;
  const can = rewindSnapshot && state.rewindLeft > 0;
  box.classList.toggle('hidden', !can);
  if (!can) return;
  box.innerHTML = '';
  const btn = el(`<button class="bg-white text-navy border-2 border-navy rounded-full px-4 py-2 text-xs font-bold shadow-lg pointer-events-auto">
    🕰️ 先月に戻る（残り${state.rewindLeft}回）</button>`);
  btn.addEventListener('click', () => {
    if (!rewindSnapshot) return;
    if (!confirm('先月のはじめに戻りますか？\n\nこの1ヶ月の収支・イベント・工事の進行はすべて無かったことになります。\n巻き戻しはこのゲームで1回だけです。')) return;
    state = L.deserialize(rewindSnapshot);
    state.rewindLeft = Math.max(0, (state.rewindLeft ?? 0) - 1);
    rewindSnapshot = null;
    pushLog('🕰️ 先月へ巻き戻した');
    save(); render();
    box.classList.add('hidden');
  });
  box.appendChild(btn);
}

function onNextMonth() {
  // v7.4: チュートリアルの「翌月へ進む」では本物の月送り（イベント・空室判定・収支）は走らせない。
  // どのみち捨てる状態なので、伝えたいこと＝「月が変わると行動力が全回復する」だけを見せる。
  // v7.5: 回復の告知はしない。次の段で実際の行動力の欄を指して見せる。
  if (tutIdx >= 0 && TUTORIAL_STEPS[tutIdx].key === 'next') {
    state.actionPower = state.baseActionPower;
    state.month += 1;                       // 左上の経過年数も動かして、次の説明につなげる
    save(); render();
    tutMaybeAdvance('next');
    return;
  }
  animateResetView(VIEW_RESET_MS);   // v5: 翌月のときだけ、地球儀がゆっくり回って初期位置へ戻る
  if (state.properties.length) setTimeout(playCoinCollectAnimation, VIEW_RESET_MS);
  const nextMonth = state.month + 1;
  // v8.1: 決済演出で「短期で売ったのか、長期まで待てたのか」を見せるため、
  // 物件がまだ残っているこの時点で内訳を控えておく（advanceMonth 後には物件が消えている）。
  const settling = (state.pendingSales || []).filter(x => x.settleMonth <= nextMonth)
    .map(x => {
      const pp = state.properties.find(p => p.id === x.propertyId);
      return { sale: x, label: pp ? (pp.name || pp.label) : '物件',
        bd: pp ? L.saleBreakdown(state, pp, x.price) : null,
        corp: pp ? pp.owner === 'corp' : false };
    });
  const priorNotifIds = new Set((state.notifications || []).map(n => n.id));
  // v8: 巻き戻し用のスナップショットは月送りの直前に1世代だけ取る。localStorage には保存しない
  // （セーブが倍に膨らむのを避ける）。リロードで消えるが、お守りとしてはセッション内で足りる。
  rewindSnapshot = (state.rewindLeft > 0) ? L.serialize(state) : null;
  // v8.2: ここが例外で止まると state が更新されず、月も進まず行動力も戻らないまま
  // 「翌月を押しても何も起きない」詰み状態になる（2026-07-26 の不具合がこれ）。
  // 個別の原因は塞いだが、月送りは1点でも壊れると全体が止まる場所なので、
  // 二度と黙って詰まないよう保険をかける。原因はコンソールに残す。
  let r;
  try {
    r = L.advanceMonth(state, Math.random);
  } catch (err) {
    console.error('advanceMonth に失敗しました', err);
    // 掲載や決済待ちの不整合が原因なら、掃除して1回だけやり直す
    try {
      const repaired = L.migrateSave(state);
      r = L.advanceMonth(repaired, Math.random);
      pushLog('⚠️ データの不整合を自動修復して翌月へ進みました');
    } catch (err2) {
      console.error('自動修復にも失敗しました', err2);
      // それでもダメなら、せめて行動力だけは戻して操作不能を避ける
      state.actionPower = state.baseActionPower;
      save(); render();
      alert('翌月の処理でエラーが発生しました。\n行動力は回復させたので操作は続けられます。\n'
        + '繰り返す場合はお手数ですが状況をお知らせください。');
      return;
    }
  }
  state = r.state;
  (r.logs || []).forEach(pushLog);
  save(); render();
  maybeOfferRewind();
  const freshNotifs = (state.notifications || []).filter(n => !priorNotifIds.has(n.id));
  freshNotifs.forEach((n, i) => setTimeout(() => showNotifToast(n), 500 + i * 900));
  // v3.6: 売却成立も買付・購入と同じ判子スタンプ演出に統一
  // v8.1: どの税率で売ったかを必ず添える。ここで印象づけないと、5年ルールは最後まで学習されない。
  settling.forEach((s, i) => setTimeout(() => {
    const bd = s.bd;
    const stamp = !bd ? '売却成立' : s.corp ? '法人30%' : bd.longTerm ? '長期20%' : '短期39%';
    const title = !bd ? '売り抜けた！' : s.corp ? '法人名義で売却！' : bd.longTerm ? '長期まで待った！' : '短期での売却…';
    const sub = bd
      ? `${s.label} ／ ${L.yen(bd.price)}　譲渡税 -${L.yen(bd.tax)}${bd.payoff ? ` ／ 残債 -${L.yen(bd.payoff)}` : ''}<br>手取り <b>${L.yen(bd.net)}</b>`
        + (!s.corp && !bd.longTerm && bd.tax > 0
          ? `<br><span style="color:#fca5a5">長期まで待てば ${L.yen(Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong)))} 手取りが増えていた</span>`
          : '')
      : `${s.label} ／ ${L.yen(s.sale.price)}`;
    playStampFx({ stamp, title, sub, emojis: ['💰', '📈', '✨', '💴', '🎉', '✨'] });
  }, i * 2700));
  if (r.pendingEvent) { showEvent(r.pendingEvent); return; }
  const withOffer = (state.listings || []).find(l => l.offer);
  if (withOffer) { showOfferModal(withOffer); return; }
  checkEnd();
}

function showEvent(pending) {
  const ev = L.EVENTS.find(e => e.id === pending.id);
  if (!ev) { checkEnd(); return; }
  const m = document.getElementById('event-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  // v6: イベントは物件ごとの条件（築年数・構造・戸数・手入れ）で出るようになったので、
  // どの建物で起きているのかを必ず示す。物件を持たない経営イベントのときは出さない。
  const tp = pending.targetId != null ? state.properties.find(x => x.id === pending.targetId) : null;
  // v6.4: 部屋ごとの設備（給湯器・エアコン・火災警報器）は何号室で起きたのかまで示す。
  const ui = pending.unitIndex;
  const unit = (tp && ui != null) ? tp.units[ui] : null;
  const room = unit
    ? `<div class="mt-1 font-bold text-navy">🚪 ${ui + 1}号室（${unit.layout || ''}${unit.occupied ? '・入居中' : '・空室'}）</div>`
    : '';
  const where = tp
    ? `<div class="text-xs text-slate-600 bg-slate-50 rounded-lg p-2">🏠 <b>${tp.name || tp.label}</b>（${structureLabel(tp)}・築${tp.builtAge}年・${tp.units.length}戸）${room}</div>`
    : '';
  // 見出しは発生時に確定済み（セミナーのお題など）。古いセーブには無いので関数側で解決する。
  const title = pending.title || L.eventTitle(ev);
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3"><h2 class="font-bold">${title}</h2>${where}</div>`);
  // v8: 初心者モードでは「クイズを避けて経験値だけもらう」逃げ道（beginnerHidden）を出さない。
  // 学習のための仕掛けなので、選べてしまうと結局使われないため。
  const beginner = state.difficulty === 'beginner';
  ev.choices.filter(ch => !(beginner && ch.beginnerHidden)).forEach(ch => {
    const b = el(`<button class="w-full border rounded py-2 text-sm ${ch.quiz ? 'border-navy bg-slate-50 font-bold' : ''}">${ch.label}</button>`);
    b.addEventListener('click', () => {
      state = ch.apply(structuredClone(state), pending.targetId, pending.unitIndex);
      // 何号室の話だったかをログにも残す（あとから履歴を見て思い出せるように）
      const nm = tp ? (tp.name || tp.label) : null;
      pushLog(nm ? `${nm}${ui != null ? ` ${ui + 1}号室` : ''}: ${ch.log}` : ch.log);
      m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
      save(); render();
      // クイズ付きの選択肢はここで会場へ切り替わる。買付・クリア判定はクイズ終了後に回す。
      if (ch.quiz) { openQuiz(ch.quiz, () => { const w = (state.listings || []).find(l => l.offer); if (w) showOfferModal(w); else checkEnd(); }); return; }
      const withOffer = (state.listings || []).find(l => l.offer);
      if (withOffer) { showOfferModal(withOffer); return; }
      checkEnd();
    });
    box.appendChild(b);
  });
  m.appendChild(box);
}
