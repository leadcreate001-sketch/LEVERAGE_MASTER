  if (!p) return;
  const m = document.getElementById('diy-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const kit = DIY_KITS[diyKitFor(sel)];
  const items = kit.items;
  const n = items.length;
  const before = Math.min(100, Math.round(sel.progress || 0));
  const mode = DIY_MODES[Math.floor(Math.random() * DIY_MODES.length)];
  const easy = state.difficulty === 'beginner';
  let fixed = 0, misses = 0, apPenalty = 0;
  let pickedTool = null;      // tool モードで持っている動作（DIY_ACTIONS のキー）
  let freeToolMiss = true;    // 持ち替え忘れの1回目はミスにせず、必要な動作を教えるだけにする

  // order モード: 初心者は番号を出しっぱなし。中上級は開始2秒だけ見せて消す。
  const showNums = mode === 'order';
  const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-2">
    <div class="flex justify-between items-center gap-2">
      <button id="diy-back" class="text-xs text-navy font-bold shrink-0">← 戻る</button>
      <h2 class="font-bold truncate flex-1 text-center">🔨 ${sel.label}</h2>
      <button id="diy-close" class="text-slate-400 text-xl shrink-0">✕</button></div>
    <div class="text-xs text-slate-500">材料費 ${L.yen(Math.round(sel.cost * L.DIY_MATERIAL_RATE))}${before > 0 ? '（支払い済み）' : ''}・行動力-${sel.diyAp}。${DIY_MODE_LEAD[mode]}</div>
    ${mode === 'order' ? `<div class="text-[11px] bg-sky-50 text-sky-800 rounded px-2 py-1">📐 ${kit.orderHint}</div>` : ''}
    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden"><div class="bg-emerald-500 h-2 transition-all" style="width:${before}%"></div></div>
    <div class="text-xs text-slate-600 text-center">全体の進捗 ${before}%</div>
    ${mode === 'tool' ? `<div id="diy-tools" class="flex gap-1 justify-center"></div>` : ''}
    <div id="diy-stage" class="relative mx-auto rounded-lg overflow-hidden" style="width:220px;height:176px;">
      <div class="absolute inset-0">${diyBackdrop(kit.bg)}</div>
    </div>
    <div id="diy-timing" class="hidden"></div>
    <div class="text-center text-sm font-bold" id="diy-progress">0 / ${n} 直した</div>
    <div class="text-center text-[11px] h-4" id="diy-note"></div>
    <button id="diy-cancel" class="w-full text-slate-500 text-sm">やめる（この回の作業は行われません）</button></div>`);
  m.appendChild(box);
  const stage = box.querySelector('#diy-stage');
  const noteEl = box.querySelector('#diy-note');
  const note = (text, ok) => {
    noteEl.textContent = text;
    noteEl.className = `text-center text-[11px] h-4 font-bold ${ok ? 'text-emerald-600' : 'text-red-600'}`;
  };
  const shake = (elm) => elm.animate(
    [{ transform: 'translate(-50%,-50%) rotate(0deg)' }, { transform: 'translate(-52%,-50%) rotate(-6deg)' },
     { transform: 'translate(-48%,-50%) rotate(6deg)' }, { transform: 'translate(-50%,-50%) rotate(0deg)' }],
    { duration: 260 });

  // 1箇所の修理を確定させる。3モード共通の後始末（絵の差し替え・進捗・完了判定）。
  const finishSpot = (spot, key) => {
    spot.dataset.done = '1';
    spot.querySelector('svg').innerHTML = DIY_ART[key]('a');
    spot.animate([{ transform: 'translate(-50%,-50%) scale(0.7)' }, { transform: 'translate(-50%,-50%) scale(1.15)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 400, easing: 'ease-out' });
    const num = spot.querySelector('.diy-num'); if (num) num.remove();
    sfxKnock();
    fixed++;
    box.querySelector('#diy-progress').textContent = `${fixed} / ${n} 直した`;
    if (fixed >= n) {
      const q = L.diyQualityOf(misses);
      const rank = misses === 0 ? '✨ 完璧な仕上がり！' : misses <= 1 ? '🔨 まずまずの出来' : '😓 手戻りが多かった…';
      note(rank, misses <= 1);
      setTimeout(() => { close(); applyDiy(propId, sel, category, back, q, apPenalty); }, 700);
    }
  };

  // --- tool モード: 動作パレット（タップで持ち替え → 箇所をタップ。ドラッグはスマホで誤爆しやすいので使わない）---
  // 必要な動作は箇所のバッジに書いてあるので「当てる」要素はない。持ち替えと手数の管理だけを遊ばせる。
  if (mode === 'tool') {
    const palette = box.querySelector('#diy-tools');
    // このキットで実際に使う動作だけを、毎回シャッフルして並べる
    const acts = [...new Set(items.map(k => kit.acts[k]))].sort(() => Math.random() - 0.5);
    acts.forEach(act => {
      const [icon, label] = DIY_ACTIONS[act];
      const b = el(`<button class="diy-tool border-2 rounded-lg px-2 py-1 text-center leading-tight" data-a="${act}">
        <div class="text-lg">${icon}</div><div class="text-[9px] text-slate-600">${label}</div></button>`);
      b.addEventListener('click', () => {
        pickedTool = act;
        palette.querySelectorAll('.diy-tool').forEach(x => {
          x.classList.toggle('border-navy', x.dataset.a === act);
          x.classList.toggle('bg-slate-100', x.dataset.a === act);
        });
        note(`${icon} ${label}`, true);
      });
      palette.appendChild(b);
    });
  }

  // --- timing モード: 往復するマーカーを緑ゾーンで止める ---
  // v8.8: 難しすぎたので緑ゾーンを1.5倍に拡大。加えてミスするほどマーカーが遅くなる
  // 救済を入れた（初速1→0.8→0.6）。3回ミスしたらそれ以上は詰まらせず強制でクリアにする。
  const TIMING_SPEEDS = [1, 0.8, 0.6];
  const runTiming = (onResult, missCount = 0) => {
    const bar = box.querySelector('#diy-timing');
    const zoneW = (easy ? 34 : 20) * 1.5;               // 緑ゾーンの幅（%）
    const zoneL = 8 + Math.random() * (84 - zoneW);     // 端に寄りすぎないよう内側に置く
    bar.className = 'relative w-full h-7 bg-slate-200 rounded-lg overflow-hidden cursor-pointer select-none';
    bar.innerHTML = `<div class="absolute inset-y-0 bg-emerald-400/70" style="left:${zoneL}%;width:${zoneW}%"></div>
      <div id="diy-marker" class="absolute inset-y-0 w-1 bg-navy" style="left:0%"></div>
      <div class="absolute inset-0 flex items-center justify-center text-[11px] font-bold text-navy pointer-events-none">タップで止める</div>`;
    const marker = bar.querySelector('#diy-marker');
    const speedMult = TIMING_SPEEDS[Math.min(missCount, TIMING_SPEEDS.length - 1)];
    const period = (easy ? 1500 : 1050) / speedMult;    // 往復1周にかかる時間（短いほど難しい）
    const t0 = performance.now();
    let stopped = false;
    // 判定位置は「タップした瞬間の実時刻」から計算する。requestAnimationFrame は
    // タブが非アクティブだと止まるので、描画に判定を依存させると全部ミスになってしまう。
    const posAt = (t) => {
      const phase = ((t - t0) % period) / period;       // 0→1
      return phase < 0.5 ? phase * 2 * 100 : (1 - phase) * 2 * 100;
    };
    const tick = () => {
      if (stopped) return;
      marker.style.left = `${posAt(performance.now())}%`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    const stop = () => {
      if (stopped) return;
      stopped = true;
      const pos = posAt(performance.now());
      bar.classList.add('hidden');
      bar.replaceWith(bar.cloneNode(true));             // リスナーごと差し替えて多重発火を防ぐ
      const center = zoneL + zoneW / 2;
      const inZone = pos >= zoneL && pos <= zoneL + zoneW;
      const perfect = inZone && Math.abs(pos - center) <= zoneW * 0.2;
      onResult(perfect ? 'perfect' : inZone ? 'good' : 'miss');
    };
    bar.addEventListener('click', stop);
  };

  // tool モードだけ、箇所ごとに必要タップ数を割り振る（配置は毎回シャッフル）
  const hits = mode === 'tool' ? [...DIY_HITS].sort(() => Math.random() - 0.5) : null;
  items.forEach((key, i) => {
    const pos = DIY_POS[i % DIY_POS.length];
    const orderNo = kit.order.indexOf(key) + 1;
    const act = kit.acts[key];
    const [actIcon, actLabel] = DIY_ACTIONS[act];
    let timingMisses = 0;   // このスポットのtimingモード連続ミス数（3回で強制クリア）
    const spot = el(`<button class="diy-spot absolute" data-k="${key}" data-a="${act}" style="left:${pos.l}%;top:${pos.t}%;transform:translate(-50%,-50%);width:60px;height:60px;padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));">
      <svg viewBox="0 0 64 64" width="60" height="60" style="border-radius:8px;">${DIY_ART[key]('b')}</svg>
      ${showNums ? `<span class="diy-num absolute -top-1 -left-1 bg-navy text-white text-[10px] font-black rounded-full w-4 h-4 flex items-center justify-center">${orderNo}</span>` : ''}
      ${hits ? `<span class="diy-hit absolute -top-2 -right-2 bg-white border-2 border-navy text-navy text-[10px] font-black rounded-full px-1 py-0.5 leading-none whitespace-nowrap">${actIcon}×<span class="diy-hit-n">${hits[i]}</span></span>` : ''}</button>`);
    if (hits) spot.dataset.left = String(hits[i]);
    stage.appendChild(spot);
    spot.addEventListener('click', () => {
      if (spot.dataset.done || spot.dataset.busy) return;

      if (mode === 'order') {
        if (kit.order[fixed] !== key) {
          misses++; shake(spot);
          note(`まだ早い！ ${kit.orderHint}`, false);
          return;
        }
        note('段取りどおり！', true);
        finishSpot(spot, key);

      } else if (mode === 'tool') {
        if (!pickedTool) { note(`先に ${actIcon} ${actLabel} を持とう`, false); shake(spot); return; }
        if (pickedTool !== act) {
          // 必要な動作は箇所に書いてあるので、これは持ち替え忘れ。1回目は無料で気づかせる。
          shake(spot);
          if (freeToolMiss) {
            freeToolMiss = false;
            note(`ここは ${actIcon} ${actLabel}（上から持ち替えよう）`, false);
          } else {
            misses++; apPenalty += 2;
            note(`ここは ${actIcon} ${actLabel}（行動力-2 累計-${apPenalty}）`, false);
          }
          return;
        }
        const left = Number(spot.dataset.left) - 1;
        spot.dataset.left = String(left);
        sfxKnock();
        spot.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(0.88)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 180 });
        if (left > 0) {
          spot.querySelector('.diy-hit-n').textContent = String(left);
          note(`${actLabel}（あと${left}回）`, true);
          return;
        }
        spot.querySelector('.diy-hit')?.remove();
        note(`${actLabel} 完了！`, true);
        finishSpot(spot, key);

      } else {
        spot.dataset.busy = '1';
        runTiming(result => {
          spot.dataset.busy = '';
          if (result === 'miss') {
            misses++; shake(spot);
            timingMisses++;
            if (timingMisses >= 3) {
              note('手元が狂ったが…力技でなんとか収まった！', true);
              finishSpot(spot, key);
              return;
            }
            note('手元が狂った…もう一度（次はゆっくりになる）', false);
            return;
          }
          note(result === 'perfect' ? '✨ Perfect！' : '👍 Good', true);
          finishSpot(spot, key);
        }, timingMisses);
      }
    });
  });

  // 中上級では順番のヒントを2秒で消す（覚えゲーにせず、毎回の判断にする）
  if (showNums && !easy) {
    setTimeout(() => box.querySelectorAll('.diy-num').forEach(x => x.remove()), 2000);
  }
  box.querySelector('#diy-close').addEventListener('click', close);
  box.querySelector('#diy-cancel').addEventListener('click', close);
  // v8.13: ×しか無く工事メニューへ戻れなかったので追加。同じselでstep2から開き直す。
  box.querySelector('#diy-back').addEventListener('click', () => { close(); openWorkMenu(propId, category, back, sel); });
}

function applyDiy(propId, sel, category, back, qualityMult = 1, apPenalty = 0) {
  const r = runWork(propId, sel, true, false, qualityMult);
  if (!r.started) { alert('作業できませんでした'); return; }
  state = r.state;
  // v8: 道具を間違えたぶんの手間。ミニゲームの結果をここで一括して state に反映する。
  if (apPenalty) state.actionPower -= apPenalty;
  const p = state.properties.find(x => x.id === propId);
  if (r.done) {
    pushLog(`${p.name || p.label} の${sel.label}をDIYで完了した`);
    save(); render();
    showRepairEffect(propId, `🔨 ${sel.label} 完了！`);
    // v8.13: 完了後にホーム（地図）まで戻ってしまっていたのを直し、元の画面（物件詳細）に留まる。
    back && back();
  } else {
    const now = sel.type === 'restore'
      ? (p.units[sel.unitIndex].restoreProgress || 0)
      : (p.diyProgress ? p.diyProgress.done : 0);
    pushLog(`${p.name || p.label} の${sel.label}をDIY中（進捗${Math.min(100, Math.round(now))}%・行動力-${sel.diyAp}）`);
    save(); render();
    showRepairEffect(propId, `🔨 進捗 ${Math.min(100, Math.round(now))}%`);
    openWorkMenu(propId, category, back);   // 続けて作業できるよう工事メニューへ戻る
  }
}

function skillRow(name, key){
  const exp = state.skills[key].exp, lv = L.skillLevel(exp), next = L.expToNext(exp);
  return `<div class="flex justify-between text-sm relative" data-skill="${key}"><span class="font-bold">${name} Lv${lv}</span><span class="font-bold hud-sub">${next===null?'MAX':'次まで'+next}</span></div>`;
}

// EXPフロート表示・実績バッジトースト。render()の後で毎回呼び、直前状態との差分から自動検知する。
let lastSkillExp = null;
function showExpFloats() {
  if (!state?.skills) return;
  if (lastSkillExp) {
    for (const key of Object.keys(state.skills)) {
      const before = lastSkillExp[key] ?? state.skills[key].exp;
      const gained = state.skills[key].exp - before;
      if (gained !== 0) {
        const row = document.querySelector(`[data-skill="${key}"]`);
        if (row) {
          // v3.8: 評判ダウン（EXP減少）は赤色で見せる
          const f = el(`<span class="absolute right-0 -top-3 text-xs font-bold ${gained > 0 ? 'text-emerald' : 'text-red-600'} exp-float">${gained > 0 ? '+' : ''}${gained} EXP</span>`);
          row.appendChild(f);
          setTimeout(() => f.remove(), 1200);
        }
      }
    }
  }
  lastSkillExp = Object.fromEntries(Object.keys(state.skills).map(k => [k, state.skills[k].exp]));
}

// v8.14: 現金の増減（特にDIY材料費・業者発注など「減る」side）が地味で気づきにくいという
// 指摘への対応。現金表示の数字自体を旧額→新額まで実際にカウントさせ、ひと突きの拡縮＋
// 差分のフロート表示を添える。検知の仕組みはshowExpFloatsと同じ（render()後に前回値と比較）。
let lastCash = null;
let cashAnimGen = 0;   // 連続して現金が変わってもアニメーションが競合しないよう世代で判定する
function cashDisplayEls() {
  return [
    document.getElementById('hud-cash'),
    document.getElementById('hud-clock-cash'),
    document.querySelector('#mobile-status .ms-kpi[data-kpi="cash"] div:last-child'),
  ].filter(Boolean);
}
// PC/スマホ/ヘッダーのうち、実際にレイアウトされている（display:noneでない）ものを全て返す。
// display:noneの要素はgetBoundingClientRectが幅・高さとも0になることを利用する。
// v8.17: スマホ幅ではヘッダーとスマホ下部バーの現金が同時に見えているため、1箇所だけでなく
// 見えている場所全てにフロートを出す（ヘッダーだけ出て市場ボタン上のタイルに出ない、を解消）。
function visibleCashEls() {
  return cashDisplayEls().filter(elm => {
    const r = elm.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
}
// v8.17: 「増えた/減った」のひと突き拡縮だけを担当（テキストは書き換えない）。
// 働く中はカウントアップ演出を使わない代わりに、tickごとにこれだけ当てて数字に反応を出す。
function pulseCashPunch(elms, gain) {
  elms.forEach(elm => {
    elm.classList.remove('cash-punch-up', 'cash-punch-down');
    void elm.offsetWidth;   // 同じアニメーションが連続でも毎回再生されるようリフローを挟む
    elm.classList.add(gain ? 'cash-punch-up' : 'cash-punch-down');
  });
}
// v8.16: 増減フロートの共通表示。数字の右端に少しかぶる位置から始め、増加は上・減少は下へ、
// 現金の枠（直近のボタン/パネル）を確実に超える距離だけ移動してフェードアウトする
// （行って戻るバウンドはしない一方通行）。働くボタンのfloatEarnAtCashもこれを使う。
function floatCashDelta(anchorEl, amount, gain) {
  if (!anchorEl) return;
  const frame = anchorEl.closest('button, .hud-panel') || anchorEl;
  // v8.18: PC/スマホのタイルはtext-left/text-centerのdivが枠幅いっぱいに広がっているため、
  // getBoundingClientRect()の右端は実際の文字の右端よりずっと外側になる（ヘッダーの<span>は
  // 文字ぴったりに縮むので問題なかった）。Rangeで実際に描画されている文字の範囲を測る。
  const range = document.createRange();
  range.selectNodeContents(anchorEl);
  const textRect = range.getBoundingClientRect();
  const r = (textRect.width > 0 || textRect.height > 0) ? textRect : anchorEl.getBoundingClientRect();
  const dist = Math.max(40, Math.round(frame.getBoundingClientRect().height + 14));
  const startTop = r.top + r.height / 2;
  const endTop = gain ? startTop - dist : startTop + dist;
  const f = el(`<div class="fixed z-[65] font-bold text-sm pointer-events-none ${gain ? 'text-emerald-400' : 'text-red-400'}" style="left:${Math.round(r.right - 8)}px; top:${Math.round(startTop)}px; transform:translate(0,-50%); transition: top 0.6s ease-out, opacity 0.5s;">${gain ? '+' : ''}${L.yen(amount)}</div>`);
  document.body.appendChild(f);
  requestAnimationFrame(() => { f.style.top = Math.round(endTop) + 'px'; f.style.opacity = '0'; });
  setTimeout(() => f.remove(), 650);
}
function showCashFloats() {
  if (!state) return;
  if (lastCash == null) { lastCash = state.cash; return; }
  const diff = state.cash - lastCash;
  const from = lastCash;
  lastCash = state.cash;
  if (diff === 0) return;
  const gain = diff > 0;
  const gen = ++cashAnimGen;
  const els = cashDisplayEls();
  if (!els.length) return;
  const dur = 500;
  const t0 = performance.now();
  pulseCashPunch(els, gain);
  els.forEach(elm => { elm.textContent = L.yen(from); });   // 一旦旧額に戻し、そこからカウントさせる
  const tick = (t) => {
    if (gen !== cashAnimGen) return;   // 途中で次の変化が来たら古いループは打ち切る
    const p = Math.min(1, (t - t0) / dur);
    const cur = Math.round(from + diff * p);
    els.forEach(elm => { elm.textContent = L.yen(cur); });
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  visibleCashEls().forEach(elm => floatCashDelta(elm, Math.abs(diff), gain));
}

// v3.6: 決定的イベント共通の判子スタンプ演出。買付・購入・売却成立・法人化・法人移転で同じトーンに統一。
// ロジックは呼び出し元で完了済み・演出のみ（pointer-events無効で操作は妨げない）。
function playStampFx({ stamp, title, sub, emojis = ['✨', '🎉', '✨'] }) {
  sfxFanfare();
  const overlay = el(`<div class="fixed inset-0 z-[70] overflow-hidden pointer-events-none flex items-center justify-center" style="background:radial-gradient(ellipse at center, rgba(15,23,42,0.82) 0%, rgba(2,6,23,0.94) 100%);transition:opacity 0.45s;">
    <style>
      @keyframes pc-stamp { 0% { transform: scale(3.2) rotate(14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 75% { transform: scale(1.07) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
      @keyframes pc-burst { 0% { transform: scale(0.2) rotate(0deg); opacity: 1; } 100% { transform: scale(1.9) rotate(24deg); opacity: 0; } }
      @keyframes pc-float { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-130px) scale(1.5); opacity: 0; } }
    </style>
    <div class="absolute inset-0 flex items-center justify-center"><div style="width:500px;height:500px;border-radius:50%;background:repeating-conic-gradient(rgba(251,191,36,0.4) 0 10deg, transparent 10deg 30deg);animation: pc-burst 1.0s ease-out forwards;"></div></div>
    <div class="relative text-center text-white space-y-3">
      <div class="mx-auto w-44 h-44 rounded-full bg-white/95 shadow-2xl flex items-center justify-center" style="border:9px solid #dc2626;animation: pc-stamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
        <span class="${stamp.length >= 4 ? 'text-4xl' : 'text-5xl'} font-black" style="color:#dc2626;">${stamp}</span></div>
      <div class="text-3xl font-black tracking-widest"><span style="background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;">${title}</span></div>
      <div class="text-sm opacity-90">${sub}</div>
    </div></div>`);

// v5: 従来は暗い緑（text-emerald-600）で夜の地図に埋もれ、上昇量も38pxしかなく
// スマホでは押している指の裏に出て見えなかった。白＋黒縁で拡大し、指の高さを完全に抜けるまで上げる。
const EARN_RISE = 130;
function floatEarn(btn, earned) {
  const r = btn.getBoundingClientRect();
  const startY = Math.round(r.top - 24);
  const f = el(`<div class="fixed z-[60] pointer-events-none font-bold text-white text-base" style="left:${Math.round(r.left + r.width / 2 + (Math.random() * 44 - 22))}px; top:${startY}px; transform:translateX(-50%); text-shadow:0 1px 0 #0f172a,0 -1px 0 #0f172a,1px 0 0 #0f172a,-1px 0 0 #0f172a,0 2px 8px rgba(0,0,0,0.7); transition: top 1.0s ease-out, opacity 1.0s;">+${L.yen(earned)}</div>`);
  document.body.appendChild(f);
  requestAnimationFrame(() => { f.style.top = (startY - EARN_RISE) + 'px'; f.style.opacity = '0'; });
  setTimeout(() => f.remove(), 1100);
}

// v8.16: 働く中はupdateHudLive()が現金を都度ライブ更新済みなので、showCashFloatsのカウント演出は
// 使わない（stopWork側でlastCashを同期して無効化している）。差分フロートだけはfloatCashDelta
// （現金の増減全般で使う共通表示）と同じ見た目・位置・方向にして、働く以外の場合と統一する。
function floatEarnAtCash(earned) {
  visibleCashEls().forEach(elm => floatCashDelta(elm, earned, true));
}

// v3: DIY・業者発注の直後、地図を該当物件へ向け、どの物件に何が起きたかをフロート表示する。
// v8.13: 「読み終わる前に消える」という指摘を受け、表示を4秒に延長。また表示中でも
// 他の場所をタップ／クリックしたらそこで消せるようにした（読み終えたら次の操作に進める）。
function showRepairEffect(propId, text) {
  focusOnOwned(propId);
  const canvas = document.getElementById('city-canvas');
  const r = canvas ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  const f = el(`<div class="fixed z-[55] pointer-events-none font-bold text-amber-700 bg-white/95 rounded-xl shadow-lg px-4 py-2 text-sm" style="left:${Math.round(r.left + r.width / 2)}px; top:${Math.round(r.top + r.height * 0.34)}px; transform:translate(-50%,-50%); transition: top 2.0s ease-out, opacity 0.6s;">${text}</div>`);
  document.body.appendChild(f);
  let dismissed = false;
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    document.removeEventListener('pointerdown', onOutsideTap, true);
    f.style.opacity = '0';
    setTimeout(() => f.remove(), 600);
  };
  const onOutsideTap = () => dismiss();
  setTimeout(() => { f.style.top = Math.round(r.top + r.height * 0.24) + 'px'; }, 60);
  // 表示した瞬間のクリック（これを呼び出した操作そのもの）で即座に消えないよう、
  // リスナーは次のイベントループから有効にする。
  setTimeout(() => document.addEventListener('pointerdown', onOutsideTap, true), 0);
  setTimeout(dismiss, 4000);
}

function wireWorkButton(btn) {
  let timer = null, sessionEarned = 0, sessionCount = 0;
  const workOnce = () => {
    const r = L.doWork(state, Math.random);
    if (!r.earned) { stopWork(); return; }
    state = r.state; sessionEarned += r.earned; sessionCount += 1;
    updateHudLive();
    // v8.17: カウントアップ演出（戻ってから増える）は使わないが、数字に反応が無いと味気ないので
    // ひと突きの拡縮だけは他の現金増加と同じように毎回当てる。
    pulseCashPunch(visibleCashEls(), true);
    sfxCoin();
    floatEarn(btn, r.earned);
    floatEarnAtCash(r.earned);
    tutMaybeAdvance('work');
  };
  const startWork = (e) => {
    e.preventDefault();
    if (timer) return;
    if (state.actionPower < 1) { alert('行動力が足りません。翌月へ進むと回復します。'); return; }
    workOnce();
    timer = setInterval(workOnce, 120);
  };
  const stopWork = () => {
    if (timer) { clearInterval(timer); timer = null; }
    if (sessionCount) {
      pushLog(`働いて ${L.yen(sessionEarned)} 稼いだ（行動力-${sessionCount}）`);
      sessionEarned = 0; sessionCount = 0;
      // v8.15: updateHudLiveで現金は既に最新表示済み。ここでベースラインを合わせておかないと
      // render()内のshowCashFloatsが「昔の値」との差分と誤認し、一瞬減ってから増え直して見える。
      lastCash = state.cash;
      save(); render();
    }
  };
  btn.addEventListener('pointerdown', startWork);
  btn.addEventListener('pointerup', stopWork);
  btn.addEventListener('pointerleave', stopWork);
  btn.addEventListener('pointercancel', stopWork);
}

}

// 通知に紐づく物件の詳細を開く。市場からも所有からも消えている場合（他決済み等）は、
// v3: 通知に保存されたスナップショットがあれば閲覧専用画面で「最後に見る」ことができる。
function openPropertyFromNotif(n) {
  const propertyId = typeof n === 'object' ? n?.propertyId : n;
  const snapshot = typeof n === 'object' ? n?.snapshot : null;
  if (propertyId == null) return;
  if (state.properties.some(p => p.id === propertyId)) { openDetail(propertyId, 'owned'); return; }
  if (state.market.some(p => p.id === propertyId)) { openDetail(propertyId, 'market'); return; }
  if (snapshot) { openSoldSnapshot(snapshot); return; }
  alert('その物件は既に取引済みのため詳細を表示できません');
}

// v3: 他決済み物件の閲覧専用詳細。買付・指値・お気に入りは不可、見るだけ。
function openSoldSnapshot(p) {
  const m = document.getElementById('detail-modal');

    <div class="p-3 border-b shrink-0">

        <tr class="border-t"><td>${term('yield_gross', '表面利回り')}</td><td class="text-right">${(p.grossYield * 100).toFixed(1)}%</td></tr>
        <tr class="border-t"><td>構造・築年</td><td class="text-right">${p.structure}・築${p.builtAge}年</td></tr>

        <tr class="border-t"><td>🧹 手入れ</td><td class="text-right">${Math.round(p.careState ?? p.repairState)}%</td></tr>
        <tr class="border-t"><td>入居率</td><td class="text-right">${occ}%</td></tr>
        ${p.junkFlags?.length ? `<tr class="border-t"><td>訳あり</td><td class="text-right text-red-600">${p.junkFlags.join('・')}</td></tr>` : ''}
      </table>

// v8.8: 通知の種類ごとの表示設定（持続／一時／非通知）。開閉はバランスシート詳細と同じ「押して開閉」方式。
let notifSettingsOpen = false;
function notifSettingsRows() {
  const mode = (m, label, kind) => {
    const active = L.notifModeOf(state, kind) === m;
    return `<button class="notif-mode-btn text-[10px] rounded px-1.5 py-0.5 border ${active ? 'bg-navy text-white border-navy' : 'text-slate-500'}" data-kind="${kind}" data-mode="${m}">${label}</button>`;
  };
  return Object.entries(L.NOTIF_KIND_INFO).map(([kind, info]) => `
    <div class="flex items-center justify-between gap-1 text-[11px] py-1 border-b last:border-0">
      <span class="flex-1">${info.label}</span>
      <div class="flex gap-1 shrink-0">${mode('persist', '持続', kind)}${mode('temp', '一時', kind)}${mode('off', '非通知', kind)}</div>
    </div>`).join('');
}

// v8.9: どの通知のアドバイスを開いているか（idの集合）。基本は押すまで非表示。
const openAdviceIds = new Set();

// 通知は一覧を開いただけでは既読にならず、行タップ（詳細へ）か✕（閉じる）を個別に押して初めてチェック済みになる。
function openNotificationsModal() {
  const m = document.getElementById('notifications-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const notifs = state.notifications || [];
  // v8.12: ✓（確認／物件詳細へ）ボタンは廃止し、行全体のタップで同じ動作をする。
  // ただし他決済みで snapshot も無い場合は飛び先が無いため、その行だけタップ不可のままにする。
  const rows = notifs.length ? notifs.map(n => {
    const canJump = !(n.kind === 'sold_out' && !n.snapshot);
    return `
    <div class="notif-row border rounded p-2 text-xs space-y-1 ${n.read ? 'opacity-50' : 'bg-amber-50'} ${canJump ? 'cursor-pointer hover:bg-amber-100' : ''}" data-id="${n.id}">
      <div class="flex justify-between items-center">
        <div class="text-slate-500 text-[11px]">${Math.floor(n.month / 12)}年${n.month % 12}ヶ月</div>
        ${n.read ? '' : '<span class="text-[9px] bg-amber-500 text-white rounded px-1">未読</span>'}
      </div>
      <div>${n.kind === 'sold_out' ? '🚫' : n.kind === 'repair_needed' ? '🔧' : n.kind === 'repair_done' ? '✅' : n.kind === 'valueup_done' ? '✨' : '💸'} ${n.message}</div>
      ${n.advice ? `<button class="notif-advice-toggle text-[11px] font-bold text-navy underline" data-id="${n.id}">${openAdviceIds.has(n.id) ? '▲ アドバイスを閉じる' : '▶ アドバイス'}</button>
      ${openAdviceIds.has(n.id) ? `<div class="text-[11px] text-slate-600 bg-slate-50 rounded p-1.5">💡 ${n.advice}</div>` : ''}` : ''}
      <div class="flex gap-1 justify-end">
        <button class="notif-dismiss border rounded px-2 py-0.5" data-id="${n.id}">✕ 閉じる</button>
      </div>
    </div>`;
  }).join('') : '<div class="text-slate-500 text-sm">通知はまだありません</div>';
  const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-md max-h-[75vh] overflow-y-auto space-y-2" style="max-height:75dvh">
    <div class="flex justify-between items-center"><h2 class="font-bold">🔔 通知</h2><button id="notifs-close" class="text-slate-400 text-xl">✕</button></div>
    <div class="flex items-center justify-between gap-2">
      <button id="notifs-settings-toggle" class="text-[11px] font-bold text-navy underline text-left">${notifSettingsOpen ? '▲ 通知の表示設定を閉じる' : '▶ 通知の表示設定'}</button>
      ${notifs.some(n => !n.read) ? '<button id="notifs-read-all" class="text-[11px] border rounded px-2 py-0.5 text-slate-600 shrink-0">✓ 全て既読にする</button>' : ''}
    </div>
    ${notifSettingsOpen ? `<div class="border rounded p-2">${notifSettingsRows()}</div>` : ''}
    ${rows}</div>`);
  m.appendChild(box);
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  box.querySelector('#notifs-close').addEventListener('click', close);
  box.querySelector('#notifs-settings-toggle').addEventListener('click', () => {
    notifSettingsOpen = !notifSettingsOpen; openNotificationsModal();
  });
  box.querySelector('#notifs-read-all')?.addEventListener('click', () => {
    state = L.markAllNotificationsRead(state).state;
    save(); renderPanelRight(); openNotificationsModal();
  });
  box.querySelectorAll('.notif-mode-btn').forEach(b => b.addEventListener('click', () => {
    state = L.setNotifMode(state, b.dataset.kind, b.dataset.mode).state;
    save(); openNotificationsModal();
  }));
  box.querySelectorAll('.notif-advice-toggle').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = Number(b.dataset.id);
    if (openAdviceIds.has(id)) openAdviceIds.delete(id); else openAdviceIds.add(id);
    openNotificationsModal();
  }));
  box.querySelectorAll('.notif-dismiss').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = Number(b.dataset.id);
    state = L.markNotificationRead(state, id).state;
    save(); renderPanelRight(); openNotificationsModal();
  }));
  box.querySelectorAll('.notif-row').forEach(rowEl => rowEl.addEventListener('click', () => {
    const id = Number(rowEl.dataset.id);
    const n = notifs.find(x => x.id === id);
    if (!n || (n.kind === 'sold_out' && !n.snapshot)) return;
    state = L.markNotificationRead(state, id).state;
    save(); renderPanelRight(); close();
    openPropertyFromNotif(n);
  }));
}

// 値下げ・他決などの通知トースト。✕は表示を消すだけ（未読は残る）、タップ（✕以外）は既読化＋物件詳細へ飛ぶ。
const _toasts = [];
function restackToasts() {
  let top = 16;
  _toasts.forEach(t => { t.style.top = top + 'px'; top += (t.offsetHeight || 44) + 8; });
}
function dismissToast(t) {
  const i = _toasts.indexOf(t); if (i < 0) return;
  _toasts.splice(i, 1);
  t.style.transition = 'opacity 0.3s'; t.style.opacity = '0';
  setTimeout(() => t.remove(), 300);
  restackToasts();
}
// v8.8: mode='off' はポップアップを出さない（🔔通知一覧には種類によらず残る）。
// mode='temp' は数秒で自動的に消える。既定・未設定は従来どおり手動で閉じるまで残る（persist）。
const NOTIF_TEMP_MS = 4000;
function showNotifToast(n) {
  const mode = L.notifModeOf(state, n.kind);
  if (mode === 'off') return;
  // v8.9: 幅の制約が無いまま(実質シュリンクツーフィット)だと、スマホ幅では文章がすぐ4行程度に
  // 折り返されていた。画面幅を出来るだけ使う横長のバーにして、この程度の文章なら1〜2行に収める。
  const t = el(`<div class="fixed left-1/2 -translate-x-1/2 w-[94vw] max-w-md bg-amber-500 text-white rounded-lg shadow-lg px-3 py-2 z-[60] text-sm font-bold flex items-center gap-2 cursor-pointer">
    <span class="flex-1">🔔 ${n.message}</span>
    <button class="toast-close bg-white/25 rounded px-2 py-1 text-xs shrink-0" title="閉じる">✕</button>
  </div>`);
  document.body.appendChild(t);
  _toasts.push(t);
  restackToasts();
  t.querySelector('.toast-close').addEventListener('click', (e) => { e.stopPropagation(); dismissToast(t); });
  t.addEventListener('click', () => {
    if (n.id != null) state = L.markNotificationRead(state, n.id).state;
    save(); renderPanelRight();
    dismissToast(t);
    openPropertyFromNotif(n);
  });
  if (mode === 'temp') setTimeout(() => dismissToast(t), NOTIF_TEMP_MS);
}
// Enterキーで一番上（最初に出た）トーストから順に閉じる。
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && _toasts.length) { e.preventDefault(); dismissToast(_toasts[0]); }
});

// v7: チュートリアル専用。乱数の出物待ちにせず、1回の押下で必ずサンプル物件を1件 state.market に追加する。
// 終了時に state はスナップショットへ復元されるため、本編の資産や市場には影響しない。
function tutForceFind(box, closeModal) {
  const rng = () => 0.4;
  const p = L.generateProperty('kodate', 'local', rng, null, {});
  state.nextPropertyId = state.nextPropertyId || 1;
  p.id = 'p' + state.nextPropertyId++;
  p.name = L.propertyName(p.genreKey, p.builtAge, p.id);
  state.market.unshift(p);
  // 体験用に、購入と融資審査が必ず通るぶんだけ所持金を底上げする（不足分のみ）
  state.cash = Math.max(state.cash, Math.round(p.price * 1.5) + 100000);
  setCityState(state);
  save();
  const feed = box.querySelector('#sr-feed');
  feed.querySelector('.sr-empty')?.remove();
  const line = el(`<div class="sr-found font-bold text-emerald-700 underline cursor-pointer">🖥️ ポータルサイトを巡回した…おっ！ ${p.name || p.label} の情報を掴んだ（タップで詳細）</div>`);
  line.addEventListener('click', () => { closeModal(); openDetail(p.id, 'market', openSearchModal); });
  feed.insertBefore(line, feed.firstChild);
  sfxKnock();
  pushLog(`${p.name || p.label}（${p.label}）を発見（表面${(p.grossYield * 100).toFixed(1)}%・${L.yen(p.price)}）`);
  box.querySelector('#sr-progress').textContent = '発見！ 続けて探すこともできます';
  renderPanelRight();
  tutMaybeAdvance('search');
}

// 営業ポップオーバー: 条件（ジャンル/エリア/築年帯）はボタンを押すと出てくる。
function openSearchModal() {
  const m = document.getElementById('search-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const genreBoxes = BASE_GENRE_ORDER.map(k =>

  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <div class="flex justify-between items-start gap-2"><h2 class="font-bold">🏘️ 物件情報を探す（1回 行動力-1）</h2><button id="search-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="grid grid-cols-2 gap-1">${genreBoxes}</div>
    <label class="flex items-center gap-1 text-xs"><input type="checkbox" id="sel-wakeari" ${searchSelection.wakeari ? 'checked' : ''}> 訳あり物件も含める</label>
    <div class="flex gap-3 text-xs">
      <label><input type="checkbox" class="sel-area" value="local" ${searchSelection.areas.includes('local') ? 'checked' : ''}> 地方・郊外</label>
      <label><input type="checkbox" class="sel-area" value="urban" ${searchSelection.areas.includes('urban') ? 'checked' : ''}> 都心・駅近</label>
    </div>
    <div class="flex gap-3 text-xs">
      <label><input type="checkbox" class="sel-age" value="young" ${searchSelection.ages.includes('young') ? 'checked' : ''}> 築浅〜10年</label>
      <label><input type="checkbox" class="sel-age" value="mid" ${searchSelection.ages.includes('mid') ? 'checked' : ''}> 11〜25年</label>
      <label><input type="checkbox" class="sel-age" value="old" ${searchSelection.ages.includes('old') ? 'checked' : ''}> 築古26年〜</label>
    </div>
    <div id="sr-progress" class="text-[11px] font-bold text-slate-600 text-center">${(state.salesSearch?.spent || 0) > 0 ? `調査継続中（累計 行動力${state.salesSearch.spent}消費）` : '足で稼いだ情報が出物につながる'}</div>
    <button id="btn-search" class="w-full bg-navy text-white rounded py-2 text-sm font-bold select-none touch-none">🔍 動いて情報を集める（${term('action_power', '行動力')}-1・長押しOK）</button>
    <div id="sr-feed" class="text-[11px] leading-relaxed h-28 overflow-y-auto space-y-0.5 bg-slate-50 rounded p-2"><div class="sr-empty text-slate-500">ここに調査ログが流れます。物件を見つけたらログをタップで詳細へ。</div></div>
    <button id="btn-search-close" class="w-full text-slate-500 text-sm">閉じる</button></div>`);
  m.appendChild(box);
  // v7.2: モーダルを開いた時点で「物件を探すを押す」ステップは完了。次は中のボタンを指す。
  tutMaybeAdvance('openSearch');
  box.querySelectorAll('.sel-genre, .sel-area, .sel-age, #sel-wakeari').forEach(cb =>
    cb.addEventListener('change', () => { searchSelection = readSearchSelection(); }));
  // v3.8: 働くと同様の長押し対応。押している間は約0.2秒ごとに連続調査し、発見か行動力切れで自動停止。
  const searchBtn = box.querySelector('#btn-search');
  let srTimer = null;
  const srStop = () => { if (srTimer) { clearInterval(srTimer); srTimer = null; } };
  const srOnce = () => {
    const res = onSearchPress(box, close);
    if (!res || !res.pressed || res.found) srStop();
  };
  searchBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();

  box.querySelector('#search-x').addEventListener('click', close);
}

// v3: 営業は1押し=行動力2。ポータルサイト巡回・電話・訪問などの行動がランダムに出て、
// 累計消費が隠し閾値（6〜40）に達すると物件情報を入手する。進捗は月・条件変更を跨いで維持。
const SEARCH_ACTIONS = [
  '🖥️ ポータルサイトを巡回した',
  '📞 不動産屋に電話をかけた',
  '🏢 不動産屋へ飛び込み訪問した',
  '📮 投函チラシ・広告をチェックした',
  '👂 大家仲間の噂話を聞いた',
  '🗺️ 気になるエリアを車で流した',
];
const SEARCH_MISS = [
  '…収穫なし',
  '…それらしい話はあったが空振り',
  '…「良いのが出たら連絡しますよ」',
  '…惜しい物件は既に他で決まっていた',
  '…掘り出し物はまだ見つからない',
];
// v3.11: 平凡（低利回り）物件の淡々とした紹介フレーバー（良い情報ではなく日常の一コマ）
const MUNDANE_LINES = [
  '🖥️ ポータルサイトに普通に載っていた物件を眺めた',
  '📋 長く売りに出ている物件を紹介された',
  '🏢 不動産屋に「一応こんなのも」と勧められた',
  '📰 折込チラシに載っていた売れ残りをチェックした',
  '🤝 業者から「利回りは高くないですが」と案内された',
];

function onSearchPress(box, closeModal) {
  const sel = readSearchSelection();
  if (!sel.genres.length || !sel.areas.length || !sel.ages.length) { alert('ジャンル・エリア・築年帯を1つ以上選んでください'); return { pressed: false }; }
  if (state.actionPower < 1) { alert('行動力が足りません。翌月へ進むと回復します。'); return { pressed: false }; }
  searchSelection = sel;
  const genres = sel.wakeari ? sel.genres.flatMap(k => [k, WAKEARI_MAP[k]]) : sel.genres;
  const r = L.doSalesPress(state, { genres, areas: sel.areas, ages: sel.ages }, Math.random);
  if (!r.pressed) { alert('行動力が足りません。翌月へ進むと回復します。'); return { pressed: false }; }
  state = r.state; save();
  setCityState(state);   // v3.8fix: 新着物件を地図側の状態にも反映（これがないと「地図を見る」が効かない）
  const feed = box.querySelector('#sr-feed');
  feed.querySelector('.sr-empty')?.remove();
  const act = SEARCH_ACTIONS[Math.floor(Math.random() * SEARCH_ACTIONS.length)];
  updateHudLive();
  // v3.11: 平凡（低利回り）物件は淡々と一覧に流す（利回り数字で自分で判断する目利きの場）。長押しは止めない。
  if (r.mundane && r.mundane.length) {
    for (const mp of r.mundane) {
      const ml = MUNDANE_LINES[Math.floor(Math.random() * MUNDANE_LINES.length)];
      const line = el(`<div class="sr-mundane text-slate-500 underline cursor-pointer">${ml}：${mp.name || mp.label}（表面${(mp.grossYield * 100).toFixed(1)}%）</div>`);
      line.addEventListener('click', () => { closeModal(); openDetail(mp.id, 'market', openSearchModal); });
      feed.insertBefore(line, feed.firstChild);
    }
    sfxMundane();
    pushLog(`平凡な出物を${r.mundane.length}件見た（低利回り・売れ残り）`);
    renderPanelRight();
  }
  if (r.found) {
    // v3.5: 自動で一覧へ飛ばず、発見ログをタップで詳細へ（ログは消えず残る）
    const line = el(`<div class="sr-found font-bold text-emerald-700 underline cursor-pointer">${act}…おっ！ ${r.found.name || r.found.label} の情報を掴んだ（タップで詳細）</div>`);
    line.addEventListener('click', () => { closeModal(); openDetail(r.found.id, 'market', openSearchModal); });
    feed.insertBefore(line, feed.firstChild);
    sfxKnock();
    pushLog(r.log);
    box.querySelector('#sr-progress').textContent = '発見！ 続けて探すこともできます';
    renderPanelRight();
    return { pressed: true, found: true };
  }
  sfxStep();   // v6: 「働く」と同じく、1押しごとに手応えの音を返す
  const miss = SEARCH_MISS[Math.floor(Math.random() * SEARCH_MISS.length)];
  feed.insertBefore(el(`<div>${act}${miss}</div>`), feed.firstChild);
  box.querySelector('#sr-progress').textContent = `調査継続中（累計 行動力${state.salesSearch.spent}消費）`;
  renderPanelRight();
  return { pressed: true, found: false };
}

// ================================================================

// ================================================================
// 旧「未開拓エリアのティーザー（いつか新しい街が…）」を、条件と進捗が見えるパネルに置き換えた。

  const box = document.getElementById('region-pills');
  if (!box) return;
  box.classList.toggle('hidden', !state);
  if (!state) return;
  box.innerHTML = `<div class="flex gap-1.5 items-center">` + Object.values(L.REGIONS).map(r => {
    const open = L.isRegionUnlocked(state, r.key);
    const cls = open
      ? 'bg-white/15 hover:bg-white/25 text-white border-white/25'
      : 'bg-black/25 hover:bg-black/35 text-slate-300 border-white/10';
    return `<button class="rp-btn shrink-0 border rounded-full px-2.5 py-1 text-[11px] font-bold ${cls}" data-region="${r.key}">`

// 解放条件パネル。進捗は L.regionUnlockProgress の戻り値だけで描く（条件のロジックをUIに書かない）。
//
// r.ready が false（＝中身がまだ無く、企画を伏せている段階）のあいだは、達成状況を数字で
// 見せない。条件そのものはモザイク（CSSぼかし）の下に隠し、「今後のアップデートで解禁」とだけ
// 伝える——シークレット感を出すための表示上の演出であり、実際の解放判定（ready ゲート）とは別物。
// 中身が実装されて ready:true になったら、この分岐は自然に「実際の進捗を見せる」側へ回る。
function openRegionPanel(key) {
  const r = L.REGIONS[key];
  if (!r) return;
  const pr = L.regionUnlockProgress(state, key);

  if (!pr.unlocked && !r.ready) {
    const overlay = el(`<div class="fixed inset-0 z-[65] bg-black/60 flex items-center justify-center p-4 modal-below-header">
      <div class="bg-white rounded-xl p-5 max-w-xs w-full text-center space-y-3 max-h-[85vh] overflow-y-auto" style="max-height:85dvh">
        <div class="text-4xl">🔒</div>
        <h2 class="font-bold text-lg">${r.icon} ${r.label}</h2>
        ${gateBadgeHtml(r)}
        <p class="text-sm text-slate-600">${r.desc}</p>
        <div class="relative rounded-lg border border-slate-200 bg-slate-50 p-3 text-left overflow-hidden">
          <div class="space-y-1.5" style="filter:blur(4px); opacity:0.55; user-select:none;">
            <div class="flex justify-between text-xs font-bold text-slate-600">
              <span>⬜ 条件A</span><span>？？？</span></div>
            <div class="h-2 rounded bg-slate-300"></div>
            <div class="flex justify-between text-xs font-bold text-slate-600">
              <span>⬜ 条件B</span><span>？？？</span></div>
            <div class="h-2 rounded bg-slate-300"></div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center">
            <span class="text-[11px] font-bold text-slate-500 bg-white/70 rounded px-2 py-1">解放条件は非公開</span>
          </div>
        </div>
        <p class="text-[11px] font-bold text-amber-600">🚧 今後のアップデートで解禁予定</p>
        <button id="rg-ok" class="w-full bg-navy text-white rounded py-2 text-sm font-bold">閉じる</button>
      </div></div>`);
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('#rg-ok').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    return;
  }

  const fmtVal = (c) => c.fmt === 'yen' ? L.yen(c.cur)
    : c.fmt === 'bool' ? (c.cur ? '済み' : 'まだ') : `${c.cur}`;
  const fmtNeed = (c) => c.fmt === 'yen' ? L.yen(c.need)
    : c.fmt === 'bool' ? '必要' : `${c.need}`;
  const rows = pr.conditions.map((c, i) => {
    const ratio = Math.max(0, Math.min(1, c.need ? c.cur / c.need : 1));
    const joiner = i === 0 ? '' :
      `<div class="text-[11px] font-bold text-slate-500 text-center">${pr.mode === 'or' ? 'または' : 'かつ'}</div>`;
    return joiner + `<div>
      <div class="flex justify-between text-xs font-bold ${c.met ? 'text-emerald-600' : 'text-slate-600'}">
        <span>${c.met ? '✅' : '⬜'} ${c.label}</span>
        <span>${fmtVal(c)} / ${fmtNeed(c)}</span>
      </div>
      <div class="h-2 rounded bg-slate-200 overflow-hidden mt-0.5">
        <div class="h-full ${c.met ? 'bg-emerald-500' : 'bg-navy'}" style="width:${Math.round(ratio * 100)}%"></div>
      </div>
    </div>`;
  }).join('');
  const footer = pr.unlocked
    ? `<p class="text-[11px] font-bold text-emerald-600">✅ 解放済み</p>`
    : pr.met
      ? `<p class="text-[11px] font-bold text-amber-600">🚧 まもなく開通</p>`
      : `<p class="text-[11px] text-slate-500">条件を満たすと解放される</p>`;
  const overlay = el(`<div class="fixed inset-0 z-[65] bg-black/60 flex items-center justify-center p-4 modal-below-header">
    <div class="bg-white rounded-xl p-5 max-w-xs w-full text-center space-y-3 max-h-[85vh] overflow-y-auto" style="max-height:85dvh">
      <div class="text-4xl">${pr.unlocked ? r.icon : '🔒'}</div>
      <h2 class="font-bold text-lg">${r.icon} ${r.label}</h2>
      ${gateBadgeHtml(r)}
      <p class="text-sm text-slate-600">${r.desc}</p>
      <div class="space-y-1.5 text-left">${rows}</div>
      ${footer}
      <button id="rg-ok" class="w-full bg-navy text-white rounded py-2 text-sm font-bold">閉じる</button>
    </div></div>`);
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#rg-ok').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

// 翌月へ進む瞬間、シティビューの各建物から現金表示へ💰（ドル袋）が飛ぶ「回収」の動き。
// v5: 🪙のCSS直線移動をやめ、requestAnimationFrame で弧を描かせながら回転させる（ピンハネ帝国の集金の質感）。
// 着弾すると現金表示がポップする。所有件数が多いと待ち時間が長くなるため最大12個までに丸める。
const COIN_MAX = 12, COIN_FLY_MS = 780;
function playCoinCollectAnimation() {
  const cashTile = document.getElementById('hud-cash') || document.querySelector('#mobile-status .ms-kpi[data-kpi="cash"]');
  const all = cityBuildingScreenPositions();
  if (!cashTile || !all.length) return;
  const step = Math.max(1, Math.ceil(all.length / COIN_MAX));
  const spots = all.filter((_, i) => i % step === 0).slice(0, COIN_MAX);
  const dest = cashTile.getBoundingClientRect();
  const destX = dest.left + dest.width / 2, destY = dest.top + dest.height / 2;
  const delay = spots.length > 6 ? 60 : 90;

  spots.forEach((pos, i) => setTimeout(() => {
    const bag = el(`<div class="fixed z-50 pointer-events-none" style="left:0;top:0;font-size:22px;will-change:transform;">💰</div>`);
    document.body.appendChild(bag);
    sfxCoin();
    const sx = pos.x, sy = pos.y - 26;
    // 出発点と着弾点の中間を上に持ち上げた制御点で二次ベジェを描く＝放物線状の弧になる
    const ctrlX = (sx + destX) / 2 + (sx < destX ? 30 : -30);
    const ctrlY = Math.min(sy, destY) - 90;
    const spin = (i % 2 ? 1 : -1) * 320;
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / COIN_FLY_MS);
      const u = 1 - t;
      const x = u * u * sx + 2 * u * t * ctrlX + t * t * destX;
      const y = u * u * sy + 2 * u * t * ctrlY + t * t * destY;
      bag.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%) rotate(${spin * t}deg) scale(${1 - t * 0.45})`;
      bag.style.opacity = String(t > 0.85 ? (1 - t) / 0.15 : 1);
      if (t < 1) requestAnimationFrame(tick);
      else { bag.remove(); popCashTile(cashTile); }
    };
    requestAnimationFrame(tick);
  }, i * delay + 20));
}

// 着弾のたびに現金表示を弾ませる（ピンハネ帝国の cashPop 相当）
function popCashTile(tile) {
  tile.style.transition = 'transform 0.14s ease-out';
  tile.style.transform = 'scale(1.12)';
  setTimeout(() => { tile.style.transform = 'scale(1)'; }, 140);
}

// v5: 翌月ボタンで地球儀が初期位置へ戻るのにかかる時間。集金演出はこれを待ってから始める。
// 先に飛ばすと、プレイヤーが地球儀の裏側を向けたまま翌月を押したときに建物が画面外にあり、
// 演出が丸ごと空振りしてしまう（実機検証で発見）。
const VIEW_RESET_MS = 1400;

// === v8: 巻き戻し（初心者モードのお守り）===
// 月送りの直前の state を1世代だけメモリに持ち、「先月へ戻る」で復元する。
// 保存しないのは意図的。セーブを膨らませたくないのと、リロードしてまで使い回す機能ではないため。
let rewindSnapshot = null;

function maybeOfferRewind() {
  const box = document.getElementById('rewind-bar');
  if (!box) return;
  const can = rewindSnapshot && state.rewindLeft > 0;
  box.classList.toggle('hidden', !can);
  if (!can) return;
  box.innerHTML = '';
  const btn = el(`<button class="bg-white text-navy border-2 border-navy rounded-full px-4 py-2 text-xs font-bold shadow-lg pointer-events-auto">
    🕰️ 先月に戻る（残り${state.rewindLeft}回）</button>`);
  btn.addEventListener('click', () => {
    if (!rewindSnapshot) return;
    if (!confirm('先月のはじめに戻りますか？\n\nこの1ヶ月の収支・イベント・工事の進行はすべて無かったことになります。\n巻き戻しはこのゲームで1回だけです。')) return;
    state = L.deserialize(rewindSnapshot);
    state.rewindLeft = Math.max(0, (state.rewindLeft ?? 0) - 1);
    rewindSnapshot = null;
    pushLog('🕰️ 先月へ巻き戻した');
    save(); render();
    box.classList.add('hidden');
  });
  box.appendChild(btn);
}

function onNextMonth() {
  dangerBannerDismissed = false;   // v8.10: 危険バナーの「今月だけ閉じる」を翌月にリセット
  // v7.4: チュートリアルの「翌月へ進む」では本物の月送り（イベント・空室判定・収支）は走らせない。
  // どのみち捨てる状態なので、伝えたいこと＝「月が変わると行動力が全回復する」だけを見せる。
  // v7.5: 回復の告知はしない。次の段で実際の行動力の欄を指して見せる。
  if (tutIdx >= 0 && TUTORIAL_STEPS[tutIdx].key === 'next') {
    state.actionPower = state.baseActionPower;
    state.month += 1;                       // 左上の経過年数も動かして、次の説明につなげる
    save(); render();
    tutMaybeAdvance('next');
    return;
  }
  animateResetView(VIEW_RESET_MS);   // v5: 翌月のときだけ、地球儀がゆっくり回って初期位置へ戻る
  if (state.properties.length) setTimeout(playCoinCollectAnimation, VIEW_RESET_MS);
  const nextMonth = state.month + 1;
  // v8.1: 決済演出で「短期で売ったのか、長期まで待てたのか」を見せるため、
  // 物件がまだ残っているこの時点で内訳を控えておく（advanceMonth 後には物件が消えている）。
  const settling = (state.pendingSales || []).filter(x => x.settleMonth <= nextMonth)
    .map(x => {
      const pp = state.properties.find(p => p.id === x.propertyId);
      return { sale: x, label: pp ? (pp.name || pp.label) : '物件',
        bd: pp ? L.saleBreakdown(state, pp, x.price) : null,
        corp: pp ? pp.owner === 'corp' : false };
    });
  const priorNotifIds = new Set((state.notifications || []).map(n => n.id));
  // v8: 巻き戻し用のスナップショットは月送りの直前に1世代だけ取る。localStorage には保存しない
  // （セーブが倍に膨らむのを避ける）。リロードで消えるが、お守りとしてはセッション内で足りる。
  rewindSnapshot = (state.rewindLeft > 0) ? L.serialize(state) : null;
  // v8.2: ここが例外で止まると state が更新されず、月も進まず行動力も戻らないまま
  // 「翌月を押しても何も起きない」詰み状態になる（2026-07-26 の不具合がこれ）。
  // 個別の原因は塞いだが、月送りは1点でも壊れると全体が止まる場所なので、
  // 二度と黙って詰まないよう保険をかける。原因はコンソールに残す。
  let r;
  try {
    r = L.advanceMonth(state, Math.random);
  } catch (err) {
    console.error('advanceMonth に失敗しました', err);
    // 掲載や決済待ちの不整合が原因なら、掃除して1回だけやり直す
    try {
      const repaired = L.migrateSave(state);
      r = L.advanceMonth(repaired, Math.random);
      pushLog('⚠️ データの不整合を自動修復して翌月へ進みました');
    } catch (err2) {
      console.error('自動修復にも失敗しました', err2);
      // それでもダメなら、せめて行動力だけは戻して操作不能を避ける
      state.actionPower = state.baseActionPower;
      save(); render();
      alert('翌月の処理でエラーが発生しました。\n行動力は回復させたので操作は続けられます。\n'
        + '繰り返す場合はお手数ですが状況をお知らせください。');
      return;
    }
  }
  state = r.state;
  (r.logs || []).forEach(pushLog);
  save(); render();
  maybeOfferRewind();
  // v9-A: 新しい陸地が解放された月は、その演出を最優先で見せる（通知トーストより先）
  (r.newlyUnlocked || []).forEach((key, i) => setTimeout(() => playRegionUnlock(key), 200 + i * 3200));
  const freshNotifs = (state.notifications || []).filter(n => !priorNotifIds.has(n.id));
  freshNotifs.forEach((n, i) => setTimeout(() => showNotifToast(n), 500 + i * 900));
  // v3.6: 売却成立も買付・購入と同じ判子スタンプ演出に統一
  // v8.1: どの税率で売ったかを必ず添える。ここで印象づけないと、5年ルールは最後まで学習されない。
  settling.forEach((s, i) => setTimeout(() => {
    const bd = s.bd;
    const stamp = !bd ? '売却成立' : s.corp ? '法人30%' : bd.longTerm ? '長期20%' : '短期39%';
    const title = !bd ? '売り抜けた！' : s.corp ? '法人名義で売却！' : bd.longTerm ? '長期まで待った！' : '短期での売却…';
    const sub = bd
      ? `${s.label} ／ ${L.yen(bd.price)}　譲渡税 -${L.yen(bd.tax)}${bd.payoff ? ` ／ 残債 -${L.yen(bd.payoff)}` : ''}<br>手取り <b>${L.yen(bd.net)}</b>`
        + (!s.corp && !bd.longTerm && bd.tax > 0
          ? `<br><span style="color:#fca5a5">長期まで待てば ${L.yen(Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong)))} 手取りが増えていた</span>`
          : '')
      : `${s.label} ／ ${L.yen(s.sale.price)}`;
    playStampFx({ stamp, title, sub, emojis: ['💰', '📈', '✨', '💴', '🎉', '✨'] });
  }, i * 2700));
  if (r.pendingEvent) { showEvent(r.pendingEvent); return; }
  const withOffer = (state.listings || []).find(l => l.offer);
  if (withOffer) { showOfferModal(withOffer); return; }
  checkEnd();
}

function showEvent(pending) {
  const ev = L.EVENTS.find(e => e.id === pending.id);
  if (!ev) { checkEnd(); return; }
  const m = document.getElementById('event-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  // v6: イベントは物件ごとの条件（築年数・構造・戸数・手入れ）で出るようになったので、
  // どの建物で起きているのかを必ず示す。物件を持たない経営イベントのときは出さない。
  const tp = pending.targetId != null ? state.properties.find(x => x.id === pending.targetId) : null;
  // v6.4: 部屋ごとの設備（給湯器・エアコン・火災警報器）は何号室で起きたのかまで示す。
  const ui = pending.unitIndex;
  const unit = (tp && ui != null) ? tp.units[ui] : null;
  const room = unit
    ? `<div class="mt-1 font-bold text-navy">🚪 ${ui + 1}号室（${unit.layout || ''}${unit.occupied ? '・入居中' : '・空室'}）</div>`
    : '';
  const where = tp
    ? `<div class="text-xs text-slate-600 bg-slate-50 rounded-lg p-2">🏠 <b>${tp.name || tp.label}</b>（${structureLabel(tp)}・築${tp.builtAge}年・${tp.units.length}戸）${room}</div>`
    : '';
  // 見出しは発生時に確定済み（セミナーのお題など）。古いセーブには無いので関数側で解決する。
  const title = pending.title || L.eventTitle(ev);
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3"><h2 class="font-bold">${title}</h2>${where}</div>`);
  // v8: 初心者モードでは「クイズを避けて経験値だけもらう」逃げ道（beginnerHidden）を出さない。
  // 学習のための仕掛けなので、選べてしまうと結局使われないため。
  const beginner = state.difficulty === 'beginner';
  ev.choices.filter(ch => !(beginner && ch.beginnerHidden)).forEach(ch => {
    const b = el(`<button class="w-full border rounded py-2 text-sm ${ch.quiz ? 'border-navy bg-slate-50 font-bold' : ''}">${ch.label}</button>`);
    b.addEventListener('click', () => {
      state = ch.apply(structuredClone(state), pending.targetId, pending.unitIndex);
      // 何号室の話だったかをログにも残す（あとから履歴を見て思い出せるように）
      const nm = tp ? (tp.name || tp.label) : null;
      pushLog(nm ? `${nm}${ui != null ? ` ${ui + 1}号室` : ''}: ${ch.log}` : ch.log);
      m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
      save(); render();
      // クイズ付きの選択肢はここで会場へ切り替わる。買付・クリア判定はクイズ終了後に回す。
      if (ch.quiz) { openQuiz(ch.quiz, () => { const w = (state.listings || []).find(l => l.offer); if (w) showOfferModal(w); else checkEnd(); }); return; }
      const withOffer = (state.listings || []).find(l => l.offer);
      if (withOffer) { showOfferModal(withOffer); return; }
      checkEnd();
    });
    box.appendChild(b);
  });
  m.appendChild(box);
}

// === v8: 用語クイズ（勉強会・大家の会）===
// 用語集50語を「読む辞書」から「遊んで覚えるコレクション」に変えるための仕掛け。
// クイズ番組の体裁にして、正解が気持ちいい・間違いがその場で学びに変わる形にしてある。

// 会場の背景。勉強会＝ホワイトボードの部屋／大家の会＝居酒屋。図形だけで描く（画像を持たない）。
const QUIZ_VENUE = {

    bg: `<rect width="320" height="120" fill="#eef2f7"/>

         <rect x="132" y="92" width="56" height="28" fill="#b08968"/>

         <rect y="86" width="320" height="34" fill="#6b4a2f"/>
         <circle cx="60" cy="30" r="17" fill="#e8564a"/><circle cx="60" cy="30" r="13" fill="#f4a259"/>

  },
};

function openQuiz(venueKey, done) {
  const venue = QUIZ_VENUE[venueKey];
  const hard = state.difficulty !== 'beginner';
  const seconds = L.DIFFICULTY[state.difficulty]?.quizSeconds ?? 12;
  const qs = L.buildQuiz(Math.random, { hard });
  const m = document.getElementById('event-modal');
  m.classList.remove('hidden'); m.classList.add('flex');

  let idx = 0, streak = 0, comboBest = 0;
  const correctKeys = [], wrongKeys = [];
  let timer = null;

  const stopTimer = () => { if (timer) { clearInterval(timer); timer = null; } };
  const finish = () => {
    stopTimer();
    const r = L.applyQuizResult(state, { correctKeys, total: qs.length, comboBest,
      cashReward: venueKey === 'oyanokai' });
    state = r.state;
    const cash = venueKey === 'oyanokai' ? L.QUIZ_CASH_PER_CORRECT * correctKeys.length : 0;
    pushLog(`📚 ${venue.title}の用語クイズ ${correctKeys.length}/${qs.length}正解・ランク${r.rank}`
      + `（目利き+${Math.round(5 * correctKeys.length * r.mult)}・交渉+${3 * correctKeys.length} EXP`
      + `${cash ? `・${L.yen(cash)}` : ''}）`);
    save(); render();
    drawResult(r, cash);
  };

  // 1問ぶんの描画。制限時間バーは CSS transition で減らす（1秒ごとの再描画より軽い）。
  const drawQuestion = () => {
    stopTimer();
    const q = qs[idx];
    m.innerHTML = '';
    const box = el(`<div class="bg-white rounded-xl w-full max-w-md overflow-hidden">
      <div class="relative">
        <svg viewBox="0 0 320 120" class="w-full block" preserveAspectRatio="none" style="height:110px">${venue.bg}</svg>
        <div class="absolute inset-0 flex items-center justify-between px-3">
          <div class="text-4xl">${venue.host}</div>
          <div class="text-right">
            <div class="text-[11px] font-bold ${venueKey === 'oyanokai' ? 'text-amber-200' : 'text-slate-500'}">📚 ${venue.title}・用語クイズ</div>
            <div class="text-lg font-black ${venueKey === 'oyanokai' ? 'text-white' : 'text-navy'}">第${idx + 1}問 / ${qs.length}</div>
          </div>
        </div>
        ${streak >= 2 ? `<div class="absolute -bottom-2 left-3 bg-red-500 text-white text-xs font-black rounded-full px-2 py-0.5 shadow-lg" id="qz-combo">🔥 ${streak} COMBO ×${L.quizComboMult(streak).toFixed(1)}</div>` : ''}
      </div>
      <div class="h-1.5 bg-slate-200"><div id="qz-time" class="h-1.5 bg-emerald-500" style="width:100%;transition:width ${seconds}s linear"></div></div>
      <div class="p-4 space-y-3">
        <div class="text-sm leading-relaxed font-bold">${q.type === 'ox' ? q.text : `つぎの説明が指す用語は？<div class="font-normal mt-1">${q.text}</div>`}</div>
        <div id="qz-choices" class="space-y-2"></div>
        <div id="qz-feedback" class="text-sm font-bold text-center h-5"></div>
      </div></div>`);
    m.appendChild(box);
    // transition を効かせるため、次フレームで幅を0にする
    requestAnimationFrame(() => { const t = box.querySelector('#qz-time'); if (t) t.style.width = '0%'; });

    const choices = box.querySelector('#qz-choices');
    const answer = (given) => {
      stopTimer();
      const ok = given === q.answer;
      if (ok) {
        correctKeys.push(q.key); streak++; comboBest = Math.max(comboBest, streak);
        sfxFanfare();
      } else {
        wrongKeys.push(q.key); streak = 0;
        sfxFail();
      }
      choices.querySelectorAll('button').forEach(b => { b.disabled = true; b.classList.add('opacity-60'); });
      const fb = box.querySelector('#qz-feedback');
      fb.textContent = ok ? '⭕ 正解！' : given === null ? `⌛ 時間切れ…（正解: ${L.TERMS[q.key].label}）` : `❌ 不正解…（正解: ${L.TERMS[q.key].label}）`;
      fb.className = `text-sm font-bold text-center h-5 ${ok ? 'text-emerald-600' : 'text-red-600'}`;
      box.style.animation = ok ? '' : 'qzShake 0.4s';
      if (ok) quizSparkle(box);
      setTimeout(() => { idx++; if (idx >= qs.length) finish(); else drawQuestion(); }, 1200);
    };

    if (q.type === 'ox') {
      [[true, '⭕ ○（正しい）'], [false, '❌ ×（間違い）']].forEach(([v, label]) => {
        const b = el(`<button class="w-full border-2 rounded-lg py-3 text-base font-bold hover:bg-slate-50">${label}</button>`);
        b.addEventListener('click', () => answer(v));
        choices.appendChild(b);
      });
    } else {
      q.options.forEach(o => {
        const b = el(`<button class="w-full border-2 rounded-lg py-2.5 text-sm font-bold hover:bg-slate-50">${o.label}</button>`);
        b.addEventListener('click', () => answer(o.key));
        choices.appendChild(b);
      });
    }
    // 制限時間。切れたら不正解扱いで先へ進む（止まらないことを優先する）。
    const deadline = Date.now() + seconds * 1000;
    timer = setInterval(() => { if (Date.now() >= deadline) answer(null); }, 150);
  };

  // 結果画面。ランクの判子＋「今日の学び」で間違えた用語をその場で解説する。
  const drawResult = (r, cash) => {
    const correct = correctKeys.length;
    const RANK_COLOR = { S: '#f59e0b', A: '#10b981', B: '#3b82f6', C: '#94a3b8' };
    m.innerHTML = '';
    const learned = (state.learnedTerms || []).length;
    const box = el(`<div class="bg-white rounded-xl w-full max-w-md max-h-[90vh] overflow-y-auto" style="max-height:90dvh">
      <div class="p-5 text-center space-y-2">
        <div class="text-xs font-bold text-slate-500">📚 ${venue.title}・結果発表</div>
        <div class="mx-auto w-28 h-28 rounded-full bg-white flex items-center justify-center shadow-lg"
             style="border:8px solid ${RANK_COLOR[r.rank]};animation: qzStamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
          <span class="text-5xl font-black" style="color:${RANK_COLOR[r.rank]}">${r.rank}</span></div>
        <div class="text-2xl font-black">${correct} / ${qs.length} 正解</div>
        ${comboBest >= 2 ? `<div class="text-sm font-bold text-red-500">🔥 最高${comboBest}コンボ（EXP ×${r.mult.toFixed(1)}）</div>` : ''}
        <div class="text-sm space-y-0.5 pt-1">
          <div>🎓 目利き <b class="text-emerald-600">+${Math.round(5 * correct * r.mult)} EXP</b>
               ／ 交渉 <b class="text-emerald-600">+${3 * correct} EXP</b></div>
          ${cash ? `<div>🤝 人脈からの情報料 <b class="text-emerald-600">+${L.yen(cash)}</b></div>` : ''}
          ${correct === qs.length ? '<div class="text-amber-600 font-bold">✨ 全問正解！「耳より情報」を手に入れた（次の指値だけ成功率+10pt）</div>' : ''}
        </div>
        <div class="text-[11px] text-slate-500 pt-1">📖 用語の習得 ${learned} / ${Object.keys(L.TERMS).length}</div>
        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
          <div class="bg-navy h-2" style="width:${Math.round(learned / Object.keys(L.TERMS).length * 100)}%"></div></div>
      </div>
      ${wrongKeys.length ? `<div class="border-t bg-slate-50 p-4 space-y-2">
        <div class="font-bold text-sm">📖 今日の学び</div>
        ${wrongKeys.map(k => `<div class="bg-white rounded-lg p-2 text-xs">
          <div class="font-bold text-navy">${L.TERMS[k].label}</div>
          <div class="text-slate-700 mt-0.5">${L.TERMS[k].def}</div>
          ${L.TERMS[k].hint ? `<div class="text-slate-500 mt-0.5">💡 ${L.TERMS[k].hint}</div>` : ''}</div>`).join('')}
      </div>` : ''}
      <div class="p-4"><button id="qz-done" class="w-full bg-navy text-white rounded-lg py-2.5 font-bold">閉じる</button></div></div>`);
    m.appendChild(box);
    if (r.rank === 'S') { sfxFanfare(); quizSparkle(box); }
    box.querySelector('#qz-done').addEventListener('click', () => {
      m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
      save(); render();
      if (done) done();
    });
  };

  drawQuestion();
}

// 正解時の紙吹雪。既存の演出と同じトーン（軽く・短く・操作を邪魔しない）。
function quizSparkle(host) {
  ['✨', '🎉', '✨', '💡', '🎊'].forEach((c, i) => {
    const sp = el(`<div class="absolute text-2xl pointer-events-none" style="left:${12 + i * 18}%;top:40%;animation: qzFloat 1.1s ease-out ${i * 0.07}s forwards;opacity:0;z-index:5;">${c}</div>`);
    host.style.position = host.style.position || 'relative';
    host.appendChild(sp);
    setTimeout(() => sp.remove(), 1300);
  });
}

// === v3.7: フィナーレ＆リザルト ===
let endFxShown = false;   // 演出の多重再生ガード（フリープレイ移行後はstate.freePlayで抑止）

// クリア専用フィナーレ。夜空に打ち上げ花火＋街のライトアップ＋巨大スタンプ。他のどの演出より一段派手に。
function playClearFinale(done) {
  sfxFanfare();
  const overlay = el(`<div class="fixed inset-0 z-[80]" style="background:linear-gradient(180deg,#020617 0%,#0f172a 70%,#1e293b 100%);"></div>`);
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
  overlay.appendChild(cv);
  const label = el(`<div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none" style="opacity:0;transition:opacity 0.6s;">
    <style>@keyframes fin-stamp { 0% { transform: scale(3.4) rotate(14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 75% { transform: scale(1.08) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); } }</style>
    <div class="mx-auto w-52 h-52 rounded-full bg-white/95 shadow-2xl flex items-center justify-center" style="border:12px solid #dc2626;animation: fin-stamp 0.6s cubic-bezier(.2,1.4,.4,1) 0.2s both;">
      <span class="text-4xl font-black" style="color:#dc2626;">目標達成</span></div>
    <div class="mt-6 text-4xl md:text-5xl font-black tracking-widest"><span style="background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;">🏆 メガ大家、達成!!</span></div>
    <div class="mt-3 text-white/90 text-lg font-bold">開始から ${Math.floor(state.month / 12)}年${state.month % 12}ヶ月</div>
  </div>`);
  overlay.appendChild(label);
  document.body.appendChild(overlay);
  const ctx2 = cv.getContext('2d');
  const W = cv.width = overlay.clientWidth || window.innerWidth;
  const H = cv.height = overlay.clientHeight || window.innerHeight;
  const bldgs = Array.from({ length: 18 }, (_, i) => ({ x: i * (W / 18) + Math.random() * 10, w: W / 22, h: 40 + Math.random() * 90 }));
  const COLORS = ['#fbbf24', '#f472b6', '#60a5fa', '#34d399', '#f87171', '#c084fc', '#fde047'];
  const rockets = [], parts = [];
  let launched = 0;
  const launchTimer = setInterval(() => {
    if (launched >= 14) { clearInterval(launchTimer); return; }
    launched += 1;
    rockets.push({ x: W * (0.15 + Math.random() * 0.7), y: H, vy: -(H * 0.012 + Math.random() * H * 0.004),
      color: COLORS[launched % COLORS.length], fuse: H * (0.30 + Math.random() * 0.28) });
    sfxKnock();
  }, 330);
  let raf;
  const step = () => {
    ctx2.clearRect(0, 0, W, H);
    bldgs.forEach(b => {
      ctx2.fillStyle = '#0b1220';
      ctx2.fillRect(b.x, H - b.h, b.w, b.h);
      ctx2.fillStyle = 'rgba(253,224,71,0.85)';
      for (let wy = H - b.h + 8; wy < H - 6; wy += 14) for (let wx = b.x + 4; wx < b.x + b.w - 4; wx += 10)
        if ((Math.round(wx) * 7 + Math.round(wy) * 13) % 5 < 2) ctx2.fillRect(wx, wy, 4, 6);
    });
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.y += r.vy;
      ctx2.fillStyle = '#fff'; ctx2.fillRect(r.x - 1.5, r.y, 3, 10);
      if (r.y <= r.fuse) {
        rockets.splice(i, 1);
        for (let k = 0; k < 46; k++) {
          const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.6;
          parts.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: r.color });
        }
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p2 = parts[i];
      p2.x += p2.vx; p2.y += p2.vy; p2.vy += 0.035; p2.life -= 0.012;
      if (p2.life <= 0) { parts.splice(i, 1); continue; }
      ctx2.globalAlpha = Math.max(0, p2.life);
      ctx2.fillStyle = p2.color;
      ctx2.fillRect(p2.x, p2.y, 3, 3);
    }
    ctx2.globalAlpha = 1;
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  setTimeout(() => { label.style.opacity = '1'; sfxFanfare(); }, 1400);
  setTimeout(() => { cancelAnimationFrame(raf); clearInterval(launchTimer); overlay.remove(); done(); }, 6200);
}

// 敗北演出（破産=暗転＋ひび割れトーン／期限切れ=夕暮れトーン）。この後リザルトで最終チェックできる。
function playDefeatFx(kind, done) {
  sfxFail();
  const conf = kind === 'bankrupt'
    ? { tint: 'rgba(15,23,42,0.95)', stamp: '破産', title: '資金が尽きた…', sub: '手元現金がマイナスになりました' }
    : { tint: 'rgba(69,26,3,0.93)', stamp: '期限切れ', title: '時間切れ…', sub: '期限までに目標へ届きませんでした' };
  const overlay = el(`<div class="fixed inset-0 z-[80] flex items-center justify-center" style="background:${conf.tint};">
    <style>@keyframes df-stamp { 0% { transform: scale(3) rotate(12deg); opacity: 0; } 60% { transform: scale(0.95) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); } }</style>
    <div class="text-center text-white space-y-4">
      <div class="mx-auto w-44 h-44 rounded-full flex items-center justify-center" style="border:10px solid #94a3b8;background:rgba(255,255,255,0.05);animation: df-stamp 0.5s cubic-bezier(.2,1.4,.4,1) both;">
        <span class="${conf.stamp.length >= 4 ? 'text-3xl' : 'text-4xl'} font-black" style="color:#cbd5e1;">${conf.stamp}</span></div>
      <div class="text-2xl font-bold">${conf.title}</div>
      <div class="text-sm opacity-80">${conf.sub}</div>
    </div></div>`);
  document.body.appendChild(overlay);
  setTimeout(() => { overlay.remove(); done(); }, 2300);
}

// リザルト画面。最終バランスシート・ポートフォリオ・生涯実績・称号をまとめて最終チェックできる。
function openResultScreen(kind) {
  const m = document.getElementById('setup-modal');
  m.classList.remove('hidden'); m.innerHTML = '';
  const nw = L.netWorth(state), ta = L.totalAssetsV2(state), td = L.totalDebt(state);
  const title = L.resultTitle(state);
  const goalText = `${state.goal.type === 'networth' ? '純資産' : '月間CF'} ${L.yen(state.goal.amount)}`;
  const persProps = state.properties.filter(p => p.owner !== 'corp');
  const corpProps = state.properties.filter(p => p.owner === 'corp');
  const sumTv = (arr) => arr.reduce((t, p) => t + p.timeValue, 0);
  const propRows = state.properties.length ? state.properties.map(p => `
    <div class="flex items-center gap-2 border rounded p-1.5">${renderBuildingSVG(p, 'w-8 h-8')}
      <div class="min-w-0 flex-1 text-left"><div class="font-bold truncate text-[11px]">${p.name || p.label}</div>
      <div class="text-[11px] text-slate-500">${p.owner === 'corp' ? '🏢法人' : '👤個人'}・時価 ${L.yen(p.timeValue)}</div></div></div>`).join('')
    : '<div class="text-slate-500 text-xs col-span-2">所有物件なし</div>';
  const st = state.stats || {};
  const badgeIds = L.evaluateBadges(state);
  const badges = badgeIds.length ? badgeIds.map(id => `<span class="inline-block border rounded px-1.5 py-0.5 mr-1 mb-1">${L.BADGES[id].icon}${L.BADGES[id].label}</span>`).join('') : 'なし';
  const head = kind === 'clear'
    ? `<div class="text-3xl font-black"><span style="background:linear-gradient(180deg,#f59e0b,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent;">🏆 称号「${title}」</span></div>
       <div class="text-sm text-slate-600">目標 ${goalText} を ${Math.floor(state.month / 12)}年${state.month % 12}ヶ月 で達成！</div>`
    : `<div class="text-2xl font-black text-slate-700">${kind === 'bankrupt' ? '💥' : '⏰'} 称号「${title}」</div>
       <div class="text-sm text-slate-600">${Math.floor(state.month / 12)}年${state.month % 12}ヶ月の挑戦でした（目標 ${goalText}）</div>`;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-3 text-center" style="max-height:90dvh">
    ${head}
    <div class="text-left">
      <div class="font-bold text-sm mb-1">📒 最終バランスシート</div>
      <table class="w-full text-sm">
        <tr><td>手元現金</td><td class="text-right font-bold">${L.yen(state.cash)}</td></tr>
        <tr class="border-t"><td>総資産（現金＋物件時価）</td><td class="text-right">${L.yen(ta)}</td></tr>
        <tr><td>総負債（残債）</td><td class="text-right text-red-600">-${L.yen(td)}</td></tr>
        <tr class="border-t font-bold"><td>${term('net_worth', '純資産')}</td><td class="text-right text-emerald-700">${L.yen(nw)}</td></tr>
        <tr class="border-t"><td>月間キャッシュフロー</td><td class="text-right">${L.yen(L.monthlyCF(state))}</td></tr>
      </table>
    </div>
    <div class="text-left">
      <div class="font-bold text-sm mb-1">🏙️ ポートフォリオ（👤${persProps.length}件 ${L.yen(sumTv(persProps))} ・ 🏢${corpProps.length}件 ${L.yen(sumTv(corpProps))}）</div>
      <div class="grid grid-cols-2 gap-1">${propRows}</div>
    </div>
    <div class="text-left text-xs">
      <div class="font-bold text-sm mb-1">📜 生涯実績</div>
      <div>購入 ${st.buys || 0}件 ／ 売却 ${st.sales || 0}件（うち利益売却 ${st.profitSales || 0}件）／ 訳あり再生 ${st.junkRepairs || 0}件・転売 ${st.junkFlips || 0}件 ／ 最大月CF ${L.yen(st.maxMonthlyCF ?? 0)}</div>
      <div class="mt-1 leading-relaxed">${badges}</div>
    </div>
    <div class="flex gap-2 pt-2 border-t">
      <button id="rs-retry" class="flex-1 bg-navy text-white rounded-lg py-2.5 text-sm font-bold">🔁 新しい人生でもう一度</button>
      ${kind === 'clear' ? '<button id="rs-continue" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg py-2.5 text-sm font-bold">🏙️ このまま経営を続ける</button>' : ''}
    </div></div>`);
  m.appendChild(box);
  box.querySelector('#rs-retry').addEventListener('click', () => {
    if (confirm('この人生を終えて、新しい人生をはじめますか？')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
  });
  box.querySelector('#rs-continue')?.addEventListener('click', () => {
    state.freePlay = true; save();
    m.classList.add('hidden'); m.innerHTML = '';
    render();
  });
}

function checkEnd() {
  if (!state || state.freePlay) return;   // クリア後フリープレイ中は再判定しない
  if (L.isClearedV2(state)) {
    if (!endFxShown) { endFxShown = true; playClearFinale(() => openResultScreen('clear')); }
    return;
  }
  if (L.isBankrupt(state)) {
    if (!endFxShown) { endFxShown = true; playDefeatFx('bankrupt', () => openResultScreen('bankrupt')); }
    return;
  }
  if (L.isTimeUpV2(state)) {
    if (!endFxShown) { endFxShown = true; playDefeatFx('timeup', () => openResultScreen('timeup')); }
  }
}

wireGlobalAudioHooks();
initTermHelp();   // v6: 用語の吹き出しは document 委譲で拾う（モーダル内に動的に生えるため）

// シティビュー初期化（建物タップ→詳細、売出し看板タップ→詳細）
// v8.9: マップ上のお気に入り（market）タップは、いきなり買付画面へ飛ばず概要（詳細）ページへ。
// 買付はそこから改めて選ぶ。ピンタップ（onTapMarketDetail）と同じ遷移先に揃えた。
initCity(document.getElementById('city-canvas'), {
  onTapProperty: (id) => { if (state) openDetail(id, 'owned'); },
  onTapMarket: (id) => { if (state) openDetail(id, 'market'); },
  onTapMarketDetail: (id) => { if (state) openDetail(id, 'market'); },   // 地図のピンをクリック→詳細画面
  onTapLock: (key) => openRegionPanel(key),                               // 🔒未解放エリアをクリック→解放条件パネル
});

// 起動（v3.7: まずタイトル画面。セーブがあれば「続きから」）
showTitle(load());

// v9-A: 検証用の強制解放。A段階では REGIONS[].ready が false で自然には解放されないため、
// 地形と演出をこれで確認する。`?unlock=newbuild` / `?unlock=all`。
// 製品コードとして残してよい（デバッグフックのように後で消す必要はない）。
{
  const want = new URLSearchParams(location.search).get('unlock');
  if (want && state) {
    const keys = want === 'all' ? Object.keys(L.REGIONS).filter(k => k !== 'main') : want.split(',');
    let changed = false;
    keys.forEach(k => { if (L.unlockRegion(state, k.trim())) changed = true; });
    if (changed) { save(); render(); }
  }
}
document.getElementById('btn-result')?.addEventListener('click', () => openResultScreen('clear'));

document.getElementById('btn-reset').addEventListener('click', () => {
  if (confirm('データをリセットしますか？')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
});

const btnMute = document.getElementById('btn-mute');
if (btnMute) {
  btnMute.textContent = muted ? '🔇' : '🔊';
  btnMute.addEventListener('click', () => {
    setMuted(!muted);
    updateMuteButton();
  });
}
const btnBgm = document.getElementById('btn-bgm');
if (btnBgm) btnBgm.addEventListener('click', openBgmModal);

// v6.2: 用語ヘルプのON/OFF（音のON/OFFと同じ並び）。長押しで用語集を開く。
const btnTerms = document.getElementById('btn-terms');
if (btnTerms) {
  let held = false, holdTimer = null;
  btnTerms.addEventListener('pointerdown', () => {
    held = false;
    holdTimer = setTimeout(() => { held = true; openGlossaryModal(); }, 500);
  });
  const cancelHold = () => { clearTimeout(holdTimer); };
  btnTerms.addEventListener('pointerup', cancelHold);
  btnTerms.addEventListener('pointerleave', cancelHold);
  btnTerms.addEventListener('pointercancel', cancelHold);
  btnTerms.addEventListener('click', () => { if (!held) setTermsOff(!termsOff); });
}
