<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レバレッジ・マスター 〜メガ大家への道〜</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // emerald をスカラーで書くと Tailwind 既定の emerald スケール(50〜950)を丸ごと上書きしてしまい、
  // bg-emerald-100 / text-emerald-700 といった濃淡指定が全て無効（背景色なし）になる。
  // DEFAULT 付きのオブジェクトにすることで、bg-emerald（既存コードが多用）と濃淡の両方が使える。
  tailwind.config = { theme: { extend: { colors: {
    ink: '#1e293b', navy: '#1e3a5f', canvas: '#f8fafc',
    emerald: { DEFAULT: '#059669',
      50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399',
      500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
  } } } };
</script>
<style>
  html, body { font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; height: 100%; overscroll-behavior: none; }

  /* v5: 地図の上に浮くパネル類をピンハネ帝国と同じ濃紺のガラス調に統一する。
     従来は白カードで、夜の地図の上に置くと上物だけが浮いて見えていた。
     モーダルの中身は情報量が多いため白のまま据え置き、対象は地図上のHUDだけ。 */
  .hud-panel {
    background: rgba(15,23,42,0.86);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid #334155; color: #f1f5f9;
  }
  .hud-sub    { color: #94a3b8; }   /* サブラベル */
  .hud-accent { color: #fbbf24; }   /* 見出し・注記 */
  .hud-money  { color: #4ade80; }   /* 金額（プラス） */
  .hud-bad    { color: #f87171; }   /* 金額（マイナス） */
  .hud-tile   { background: rgba(51,65,85,0.55); border: 1px solid #475569; color: #f1f5f9; }
  .hud-tile:hover { background: rgba(71,85,105,0.75); }
  .hud-track  { background: rgba(2,6,23,0.75); border: 1px solid #334155; }
  .hud-divide { border-top: 1px solid #334155; }

  /* v6.2: 用語ヘルプ。目印は点線の下線だけにする（色や太字で強調すると本文が読みにくくなる）。
     ポインタを合わせるだけで吹き出しが出る。タッチ端末にはホバーが無いのでタップでも出す。
     ヘッダーの 📖 トグルがOFFのときは .terms-off が付き、下線も反応も消える。 */
  .term {
    border-bottom: 1px dotted currentColor;
    cursor: help; white-space: nowrap;
  }
  .terms-off .term { border-bottom: none; cursor: inherit; }
  /* 吹き出し本体。画面端でははみ出さないよう、JS側で left を丸めて配置する。 */
  .term-pop {
    position: fixed; z-index: 80; max-width: 19rem;
    background: #1e293b; color: #f1f5f9;
    border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .term-pop b { color: #fbbf24; }
  .term-pop .tp-hint { color: #94a3b8; }
  .term-pop .tp-calc {
    background: rgba(148,163,184,0.18); border-left: 3px solid #38bdf8;
    border-radius: 4px; padding: 4px 6px; color: #e0f2fe;
  }
  /* 実務でも通じる用語か、このゲームだけの指標かのバッジ */
  .term-pop .tp-scope {
    font-size: 10px; border-radius: 999px; padding: 1px 7px; vertical-align: middle;
  }
  .term-pop .tp-real { background: rgba(148,163,184,0.28); color: #cbd5e1; }
  .term-pop .tp-game { background: rgba(251,191,36,0.22); color: #fcd34d; }
  /* 読み仮名（種銭＝たねせん のように初見で読み違えやすい語に付ける） */
  .term-pop .tp-yomi { font-size: 11px; color: #94a3b8; font-weight: normal; }
  /* 吹き出しの脚注。用語集の開き方をここでも案内する（チュートリアルを飛ばした人にも届く） */
  .term-pop .tp-foot {
    font-size: 10px; color: #94a3b8;
    border-top: 1px solid rgba(148,163,184,0.28); padding-top: 5px;
  }

  /* v7.2: チュートリアルで押すべきボタンを目立たせる。周囲は暗幕で覆われているので、
     ここは「光って脈打つ」ことだけに集中させる（暗い中で動くものに目が行く）。 */
  .tut-hl {
    position: relative; z-index: 66;
    animation: tutPulse 1.2s ease-in-out infinite;
    border-radius: 8px;
  }
  @keyframes tutPulse {
    0%, 100% { box-shadow: 0 0 0 3px #fbbf24, 0 0 12px 4px rgba(251,191,36,0.55); }
    50%      { box-shadow: 0 0 0 5px #fde68a, 0 0 22px 8px rgba(251,191,36,0.85); }
  }

  /* v8: 用語クイズの演出。既存のスタンプ演出はオーバーレイ内の <style> に閉じていて
     クイズ画面からは使えないので、クイズ用のキーフレームをここへ常設する。 */
  @keyframes qzStamp { 0% { transform: scale(3.2) rotate(14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 75% { transform: scale(1.07) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  @keyframes qzFloat { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-90px) scale(1.4); opacity: 0; } }
  @keyframes qzShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* v8: 使用不能・管理崩壊のゲージ。数字を読まなくても「止まっている」ことが分かるよう点滅させる。 */
  .lm-blink { animation: lmBlink 1s ease-in-out infinite; }
  @keyframes lmBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  /* v9-A: エリア解放の演出。v8の教訓（オーバーレイ内の<style>に閉じると要素を消したとき
     定義ごと消える）に従い、キーフレームはここに常設する。 */
  @keyframes rgUnlock { 0% { transform: scale(0.4); opacity: 0; } 25% { transform: scale(1.12); opacity: 1; }
    70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.02); opacity: 0; } }

  /* v8.14: 現金が減った/増えた瞬間の一発演出。数字自体は showCashFloats() が旧額→新額へ
     カウントさせるので、ここでは「ぐっと縮む／伸びる」ひと突きの動きだけを担当する。
     v8.18: display:inline-block を付けていたせいで、inline要素が行内配置の余白ぶん
     親の高さを押し広げていた（働くの連打で常時再発火するため特に目立った）。transformは
     block要素にもinline要素にもそのまま効くので、displayには一切触れない。 */
  .cash-punch-down { animation: cashPunchDown 0.45s ease-out; }
  @keyframes cashPunchDown { 0% { transform: scale(1); } 30% { transform: scale(0.82); } 100% { transform: scale(1); } }
  .cash-punch-up { animation: cashPunchUp 0.45s ease-out; }
  @keyframes cashPunchUp { 0% { transform: scale(1); } 30% { transform: scale(1.18); } 100% { transform: scale(1); } }

  /* v8: 初心者モードの危険域バナー。地図の上に重ねるので、地図操作は透過させる。 */
  #danger-banner {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    z-index: 15; pointer-events: none; max-width: min(92%, 480px);
  }

  /* v3.12: iOSでは 100vh が「ブラウザのバーを隠した高さ」を指すため、h-screen だと画面下端が
     アドレスバーの裏に潜り込み、下部のボタン（翌月へ進む等）に一切触れなくなっていた。
     実際に見えている高さを指す 100dvh を使う（非対応ブラウザは 100vh にフォールバック）。 */
  body { height: 100vh; height: 100dvh; }

  /* v3.12: スマホUIとPCパネルの出し分けを「幅」だけでなく「高さ」でも判定する。
     従来は幅640px以上でPCパネルに切り替わっていたため、横向きのiPhone（幅812px・高さ375px）で
     縦に並ぶPCパネルが画面からはみ出し、翌月へ進むボタンが画面外に出ていた。 */
  #panel-left, #panel-right, #mobile-status, #mobile-actions { display: none; }
  /* v8.9: スマホ版のみヘッダーの現金・行動力を常時表示にする（#hud-clock-extra）。
     デスクトップでは従来どおり非表示（PC側パネルに現金・行動力が常設されているため）。
     ※メディアクエリより先に書く（後勝ちの同一詳細度ルールに上書きされないように）。 */
  #hud-clock-extra { display: none; }
  /* v11.4: #hud-clockの中身(📆経過月＋🎂年齢＋モバイル版の💰現金/📈CF/⚡行動力)が
     幅に対して長すぎると内部で改行し、ヘッダーの高さが不安定になっていた。
     折り返さず幅に応じて縮小し、それでも収まらない極狭幅(iPhone SE未満相当)では
     #mobile-statusと重複するhud-clock-extraだけを間引く。 */
  #hud-clock, #hud-clock * { white-space: nowrap; }
  #hud-clock { min-width: 0; overflow: hidden; gap: 6px; font-size: clamp(10px, 3vw, 14px); }
  @media (max-width: 360px) {
    #hud-clock-extra { display: none !important; }
  }
  /* v11.7: v11.6はclamp()で縮めても#hud-clockからはみ出す時、JS側(renderHeaderClock)で
     実測して#hud-clock-extra（💰現金/📈CF/⚡行動力）を丸ごと隠す対策にしていた。
     しかし現金・CFは投資が進むほど桁が増え続ける一方なので、一度はみ出すと二度と収まらず、
     現金・CF・行動力が全く表示されないまま復活しなくなる不具合だった。
     金額side（現金・CF）だけを個別に…省略させ、⚡行動力を含む全体は必ず表示され続けるようにする。 */
  #hud-clock-cash { display: inline-block; max-width: 11ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  #hud-clock-cf { display: inline-block; max-width: 8ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  /* v11.6: 縦幅が狭い端末で#mobile-status（現金/CF/行動力＋市場/所有）と#mobile-actions
     （探す/働く/翌月）が重なるのを避けるため、JS側(fitMobileHud)が実測して現金/CF/行動力の
     1段目（ヘッダーのhud-clock-extraと重複する情報）だけを畳む時に付与するクラス。 */
  .hud-row1-hide { display: none !important; }
  @media (min-width: 640px) and (min-height: 520px) {
    #panel-left, #panel-right { display: flex; }
  }
  @media (max-width: 639.98px), (max-height: 519.98px) {
    /* v5: 上段=情報3つ／下段=市場・所有の2ボタン、の2行構成にするため flex 縦積みにする */
    #mobile-status  { display: flex; flex-direction: column; }
    #mobile-actions { display: flex; }
    /* v8.9: スマホ版はヘッダーの🎵🔊📖リセットを削除し、代わりに現金・行動力を
       常時表示にする（#hud-clock-extra）。ヘッダー自体をモーダル群（最大z-50）より
       前面にして、物件情報などを開いても最上部の帯だけは常に見えるようにする。 */
    #btn-bgm, #btn-mute, #btn-terms, #btn-reset { display: none; }
    header { position: relative; z-index: 55 !important; }
    /* v8.17: 💰現金・📈月CF・⚡行動力の3項目が詰まって見えたのでinline-flex+gapで間隔を空ける。 */
    #hud-clock-extra { display: inline-flex; align-items: center; gap: 10px; }
    /* v11.5: ヘッダーをモーダルより前面(z-55>z-50/40/30)にしたことで、中身が長い(94vh近い)
       モーダルは中央寄せの結果、上端がヘッダーの帯(実測36px)と重なり、モーダル自身の見出しや
       先頭のボタンがヘッダーの下に隠れて操作できなくなっていた。全モーダルの上パディングを
       ヘッダー高さぶん確保し、モーダルの中身が必ずヘッダーの下から始まるようにする。 */
    #setup-modal, #event-modal, #detail-modal, #purchase-modal, #sell-modal, #repair-modal,
    #search-modal, #log-modal, #listings-modal, #notifications-modal, #kpi-modal, #bgm-modal,
    #diy-modal {
      padding-top: calc(36px + env(safe-area-inset-top, 0px) + 8px) !important;
      align-items: flex-start !important;
      /* v11.9: 上のflex-startは「中身が長い」前提の対策だったため、中身が短い（物件1件だけ等）
         時は使用可能領域の下半分が丸ごと空白になり「上に寄って見える」不具合になっていた。
         中身が使用可能領域に収まる時だけ実際に中央へ、はみ出す時は安全に上のflex-startへ留まる
         align-items: safe center で解決する（中身の長さ判定にJS計測は不要）。
         safe/unsafeキーワード未対応ブラウザはこの行が構文エラーとして無視され、
         直前のflex-startへ自然にフォールバックする（同じ考え方をmax-height:dvhでも使用済み）。 */
      align-items: safe center !important;
    }
    /* v11.8: 上記13モーダルは中身が長い前提で「ヘッダー直下から開始」（flex-start）にしたが、
       募集ポップアップ等のように中身が短いウインドは同じpadding-topだけ足してalign-itemsは
       centerのまま（デフォルト）にする。ヘッダー分の余白を除いた領域のちょうど中央に来る。 */
    .modal-below-header {
      padding-top: calc(36px + env(safe-area-inset-top, 0px) + 8px) !important;
    }
  }
  /* ノッチ／ホームインジケータを避ける（viewport-fit=cover と対で機能する） */
  #mobile-actions {
    left:   calc(env(safe-area-inset-left,  0px) + 8px);
    right:  calc(env(safe-area-inset-right, 0px) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  #mobile-status {
    top:   calc(env(safe-area-inset-top,   0px) + 4px);
    left:  calc(env(safe-area-inset-left,  0px) + 4px);
    right: calc(env(safe-area-inset-right, 0px) + 4px);
  }
</style>
</head>
<body class="bg-canvas text-ink overflow-hidden flex flex-col">
  <header class="bg-navy text-white px-3 py-2 flex items-center justify-between shrink-0 z-10">
    <!-- v8: ゲーム名を置いていた枠を「経過年数・年齢」に明け渡す。ヘッダーは常時表示なので
         PCの左パネルが出ないスマホでも、いま何年目で何歳なのかが必ず目に入る。
         ゲーム名は初期設定ウィザードで名乗る。state が無いあいだは hidden。 -->
    <div id="hud-clock" class="flex items-center gap-2 font-bold text-sm md:text-base hidden">
      <span>📆 <span id="hud-elapsed">0年0ヶ月</span></span>
      <span>🎂 <span id="hud-age">-</span>歳</span>
      <!-- v8.9: スマホ版のみ。🎵🔊📖リセットを削除する代わりに、現金・行動力を常時表示にして
           物件情報などを開いてもここだけは見えるようにする（現金・月CFは従来どおり#mobile-statusで表示）。 -->
      <span id="hud-clock-extra"><span>💰<span id="hud-clock-cash" class="hud-money">¥0</span></span><span>📈<span id="hud-clock-cf">¥0</span></span><span>⚡<span id="hud-clock-ap">0/0</span></span></span>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-result" class="text-lg leading-none hidden" title="リザルトを見る">🏆</button><button id="btn-bgm" class="text-lg leading-none" title="BGMの気分を変える">🎵</button>
      <button id="btn-mute" class="text-lg leading-none" title="音のON/OFF">🔊</button>
      <button id="btn-terms" class="text-lg leading-none" title="用語ヘルプのON/OFF">📖</button>
      <button id="btn-reset" class="text-xs underline">リセット</button>
    </div>
  </header>

  <!-- v9-A: エリアピル。世界のどこを見るかを切り替える唯一の常設UI。
       地図の上に浮かせると左右パネル（PC）や上部情報バー（スマホ）と当たるため、
       ヘッダーの直下に独立した帯として置く。解放前は🔒付きで、押すと解放条件が出る。 -->
  <div id="region-pills" class="bg-navy/95 text-white px-2 pb-1.5 shrink-0 z-10 hidden overflow-x-auto whitespace-nowrap"></div>

  <!-- 初期設定モーダル -->
  <div id="setup-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-30"></div>

  <!-- メイン: 地図フル画面＋左右の情報パネル（スクロールなし・1画面固定） -->
  <main class="relative flex-1 min-h-0">
    <canvas id="city-canvas" class="absolute inset-0 w-full h-full touch-none select-none" style="cursor:grab;"></canvas>

    <!-- PC/タブレット用の左右パネル（表示条件は<style>のメディアクエリ側で判定） -->
    <div id="panel-left" class="absolute left-1 top-1 bottom-1 w-44 md:w-52 flex-col gap-1.5 pointer-events-none z-10 overflow-y-auto"></div>
    <div id="panel-right" class="absolute right-1 top-1 bottom-1 w-44 md:w-52 flex-col gap-1.5 items-stretch pointer-events-none z-10 overflow-y-auto"></div>

    <!-- v3.9: スマホ用UI。上部に主要3情報、下部に主要3アクション＋メニュー -->
    <!-- v3.12: 表示条件（幅が狭い or 高さが低い）と位置（セーフエリア）は<style>側で指定する -->
    <div id="mobile-status" class="absolute z-10 gap-1"></div>
    <div id="mobile-actions" class="absolute z-20 gap-2"></div>

    <!-- v8: 初心者モードの危険域バナー。通知に気づかないまま家賃が止まるのを防ぐ -->
    <div id="danger-banner" class="hidden"></div>
    <!-- v8: 初心者モードの巻き戻しボタン。月送り直後だけ出る -->
    <div id="rewind-bar" class="absolute left-1/2 -translate-x-1/2 z-20 hidden pointer-events-none" style="bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);"></div>
  </main>

  <!-- 選択肢イベント／各種モーダル -->
  <div id="event-modal" class="fixed inset-0 bg-black/40 items-center justify-center p-4 z-30 hidden"></div>
  <div id="detail-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"></div>
  <div id="purchase-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"></div>
  <div id="sell-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"></div>
  <div id="repair-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"></div>
  <div id="search-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="log-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="listings-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="notifications-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="kpi-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="bgm-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="diy-modal" class="fixed inset-0 bg-black/40 z-40 hidden items-center justify-center p-4"></div>
  <div id="mobile-drawer" class="fixed inset-0 z-40 hidden"></div>
  <script type="module">
  // ==== inlined from src/logic.mjs（このビルドは scripts/build-inline.mjs が自動生成）====
export const CONFIG = {
  closingCostRate: 0.07,   // 諸費用率
  baseRate: 0.03,          // 融資基準金利
  rateFloor: 0.009,        // 適用金利の下限
  deadCrossTaxRate: 0.40,  // 償却切れ後のNOI課税率
  capGainTaxShort: 0.39,   // 譲渡税（保有5年以内）
  capGainTaxLong: 0.20,    // 譲渡税（5年超）
  defaultTermYears: 25,    // 融資期間デフォルト
  creditEmployee: 60,      // 信用度 初期（サラリーマン）
  creditSelf: 10,          // 信用度 初期（自営業）
  ltvMax: 0.90,            // LTV上限
  minCreditToFinance: 20,  // 融資可能な最低信用度
  minDscr: 1.3,            // 融資可能な最低DSCR
  eventChance: 0.15,       // 月送りイベント発生率
  troubleChance: 0.03,     // 月次トラブル発生率
  troubleMin: 50000, troubleMax: 300000,
  maxAge: 80,              // 融資・ゲーム期限の上限年齢
  seedMin: 0, seedMax: 50_000_000,        // 種銭の設定可能範囲
  ageLoanPenaltyStart: 60, // この年齢からLTVが徐々に縮む
  reformLoanYears: 10,     // リフォームローン期間
  corporateTaxRate: 0.30,  // 法人税率（簡易）
  corporateSetupCost: 2_000_000, // 法人設立費用
  corpTransferCostRate: 0.05,    // 個人→法人移転時の取得コスト（不動産取得税・登記費用相当）
};

export function yen(n) {
  const r = Math.round(n);
  const sign = r < 0 ? '-' : '';
  return sign + '¥' + Math.abs(r).toLocaleString('en-US');
}

export function monthlyPayment(principal, annualRate, years) {
  if (principal <= 0) return 0;
  const n = Math.round(years * 12);
  const r = annualRate / 12;
  if (r === 0) return principal / n;
  const pow = Math.pow(1 + r, n);
  return principal * (r * pow) / (pow - 1);
}

export function remainingPrincipal(principal, annualRate, years, paymentsMade) {
  if (principal <= 0) return 0;
  const n = Math.round(years * 12);
  const k = Math.min(Math.max(paymentsMade, 0), n);
  const r = annualRate / 12;
  if (r === 0) return principal * (1 - k / n);
  const pow = Math.pow(1 + r, n);
  const powK = Math.pow(1 + r, k);
  return principal * (pow - powK) / (pow - 1);
}

export function noiAnnual(annualRentFull, opexRate) {
  return annualRentFull * (1 - opexRate);
}

export function dscr(noiAnnualVal, annualDebtService) {
  if (annualDebtService <= 0) return Infinity;
  return noiAnnualVal / annualDebtService;
}

export function monthlyDepreciation(price, bldgRatio, deprMonths) {
  return (price * bldgRatio) / deprMonths;
}

// 法人税率または所得税率の適用
export function monthlyTax(noiAnnualVal, deprRemainingMonths, isIncorporated) {
  if (deprRemainingMonths > 0) return 0;
  // 法人の場合：一律、個人の場合：簡易累進（ここではシンプルにNOI×40%とする旧来ロジックをベースに調整）
  const rate = isIncorporated ? CONFIG.corporateTaxRate : CONFIG.deadCrossTaxRate;
  return (noiAnnualVal / 12) * rate;
}

// 法人化を実行する関数
export function incorporate(state) {
  const s = structuredClone(state);
  if (s.isIncorporated || s.cash < CONFIG.corporateSetupCost) return { state };
  s.cash -= CONFIG.corporateSetupCost;
  s.isIncorporated = true;
  return { state: s };
}

export function negotiationRateCut(level) { return Math.min((level - 1) * 0.0025, 0.01); }
export function termBonusYears(level) { return Math.round(Math.min((level - 1) * 1.25, 5)); }
export function ltvCap(creditScore) { return Math.min(creditScore / 100, CONFIG.ltvMax); }
export function applicableRate(creditScore, negotiationLevel) {
  const r = CONFIG.baseRate - (creditScore / 100) * 0.015 - negotiationRateCut(negotiationLevel);
  return Math.max(r, CONFIG.rateFloor);
}
export function canFinance(creditScore, dscrValue) {
  return creditScore >= CONFIG.minCreditToFinance && dscrValue >= CONFIG.minDscr;
}
// v8.5: 諸費用は項目ごとの実額（purchaseCosts）で出す。property を渡さない古い呼び出しでも
// 建物割合0.5の標準的な物件として計算できるようにしてある。
export function requiredCash({ price, ltv, useLoan, property = null }) {
  const loanAmount = useLoan ? Math.round(price * ltv) : 0;
  const closing = closingCostOf(property, price, loanAmount);
  return useLoan ? price * (1 - ltv) + closing : price + closing;
}

export const EXP_THRESHOLDS = [0, 100, 350, 850, 1850];

export function skillLevel(exp) {
  let lv = 1;
  for (let i = 1; i < EXP_THRESHOLDS.length; i++) if (exp >= EXP_THRESHOLDS[i]) lv = i + 1;
  return lv;
}

export function expToNext(exp) {
  const lv = skillLevel(exp);
  if (lv >= 5) return null;
  return EXP_THRESHOLDS[lv] - exp;
}

export function troubleRepairCost(base, selfMgmtLevel) {
  return base * (1 - Math.min(selfMgmtLevel * 0.10, 0.5));
}

// === v2: 物件生成（レントロール・費用・訳あり） ===

let __pidCounter = 0;
function __pid() { return ++__pidCounter; }

const AGE_BANDS = { young: [0, 10], mid: [11, 25], old: [26, 100] };

function pickJunk(genreKey, rng) {
  const pool = genreKey.includes('kubun') ? ['事故歴', '管理崩壊', '残置物']
    : genreKey === 'w_kodate' ? ['残置物', '再建築不可', '傾き', '事故歴']
    : ['残置物', '事故歴', '管理崩壊', '立退き交渉中'];
  const n = Math.min(pool.length, 1 + (rng() < 0.3 ? 1 : 0));
  const out = [];
  // 引き直しは有限回に留める。定数を返すrng（テスト用のスタブ等）だと同じ要素しか出ず、
  // 無条件のwhileでは無限ループになるため。
  for (let guard = 0; out.length < n && guard < 40; guard++) {
    const f = pool[Math.floor(rng() * pool.length)];
    if (!out.includes(f)) out.push(f);
  }
  for (const f of pool) { if (out.length >= n) break; if (!out.includes(f)) out.push(f); }
  return out;
}

// === v6: 築年帯と構造による傾斜 ===
// 築浅も築古も同じ頻度でトラブルが来る状態を解消し、「築浅はほとんど手がかからない」を成立させる。
export function ageBandOf(builtAge) {
  return builtAge <= 10 ? 'young' : builtAge <= 25 ? 'mid' : 'old';
}

// 🏚 躯体（repairState）の経年劣化。外壁・屋根・防水は築年が進むほど、また木造ほど早く傷む。
export const DECAY_BY_AGE = { young: 0.10, mid: 0.25, old: 0.35 };
export const DECAY_BY_STRUCTURE = { '木造': 1.3, 'S': 1.0, 'RC': 0.8 };
// 🧹 手入れ（careState）の劣化。清掃・草刈りの必要性は築年数と無関係なので一律。
export const CARE_DECAY_PER_MONTH = 2.0;

export function structuralDecay(property) {
  return DECAY_BY_AGE[ageBandOf(property.builtAge)] * (DECAY_BY_STRUCTURE[property.structure] ?? 1.0);
}

// === v8: 難易度モード ===
// 中上級（normal）は v7 までと完全に同じ挙動になるよう、すべての係数を 1.0 / 0 に置いている。
// 初心者（beginner）は「厳しさ」ではなく「取り返しのつかなさ」を削る方向で緩める——
// 数字を甘くするだけでなく、劣化を遅くして考える時間を与え、巻き戻しで一度だけ失敗を帳消しにできる。
export const DIFFICULTY = {
  beginner: { label: '初心者向け', seedMult: 1.5, creditBonus: 10, rateAdj: -0.003, decayMult: 0.7,
              eventMult: 0.6, fillBonus: 0.10, rewind: 1, quizForced: true,
              diyEasy: true, goalScale: 0.5, yearsBonus: 5, quizSeconds: 54 },
  normal:   { label: '中上級者向け', seedMult: 1.0, creditBonus: 0, rateAdj: 0, decayMult: 1.0,
              eventMult: 1.0, fillBonus: 0, rewind: 0, quizForced: false,
              // v8.4: 用語を読んで考える時間としては短すぎたので3倍にした（12→36 / 18→54）
              diyEasy: false, goalScale: 1.0, yearsBonus: 0, quizSeconds: 36 },
};
// state を持たない純関数（generateProperty 等）からも呼ぶので、undefined でも落ちないようにする。
export function difficultyOf(state) { return DIFFICULTY[state?.difficulty] || DIFFICULTY.normal; }

// === v8: 危険域（帯）===
// v7まで、2つのゲージは0まで落ちても実害がほとんど無かった（手入れ<50で退去1.5倍になるだけ）。
// 放置のコストが軽すぎて2ゲージ制が機能していなかったので、3段階の帯を切って段階的に痛くする。
// 設計の芯は「0にしてから直すと高くつく」——予防に経済合理性を持たせること。
export const STRUCT_BANDS = { warn: 30, danger: 10 };   // 🏚 躯体 repairState
export const CARE_BANDS   = { warn: 40, danger: 20 };   // 🧹 手入れ careState
export const BAND_RANK = { ok: 0, warn: 1, danger: 2, dead: 3 };

function bandOf(value, bands) {
  const v = value ?? 100;
  if (v <= 0) return 'dead';
  if (v < bands.danger) return 'danger';
  if (v < bands.warn) return 'warn';
  return 'ok';
}
export function structBandOf(property) { return bandOf(property.repairState, STRUCT_BANDS); }
export function careBandOf(property)   { return bandOf(property.careState, CARE_BANDS); }
// 2ゲージのうち悪い方。一覧のソートや警告バナーの判定に使う。
export function worstBandOf(property) {
  return BAND_RANK[structBandOf(property)] >= BAND_RANK[careBandOf(property)]
    ? structBandOf(property) : careBandOf(property);
}

// 躯体が傷んだ建物は市場で買い叩かれる。fairValue は独自の repairFactor を持っているので、
// ここで割り引くのは「timeValue をそのまま資産額として使っている経路」だけ（実際の呼び出し元は
// totalAssetsV2＝純資産集計のみ。法人移転transferToCorpはtimeValueを直接使い、ここを通らない）。
// v11: 買付判定(rollBuyOffer)は査定額(listing.appraisal・無ければfairValue)ベースになり、ここは通らなくなった。
export const STRUCT_VALUE_FACTOR = { ok: 1.0, warn: 0.95, danger: 0.90, dead: 0.85 };
export function marketValueOf(property) {
  return Math.round((property.timeValue ?? 0) * STRUCT_VALUE_FACTOR[structBandOf(property)]);
}

// 危険域の物件を抱えていると銀行からの評価が下がる。担保評価を個別に持たせる代わりに、
// 「管理のできない大家」として信用度の実効値を削る形で表現する（審査ロジックを増やさずに済む）。
export const CREDIT_HIT_DANGER = 3;
export const CREDIT_HIT_DEAD = 8;
export const CREDIT_HIT_CAP = 20;
export function creditPenalty(state) {
  let hit = 0;
  for (const p of state.properties || []) {
    const b = worstBandOf(p);
    if (b === 'dead') hit += CREDIT_HIT_DEAD;
    else if (b === 'danger') hit += CREDIT_HIT_DANGER;
  }
  return Math.min(CREDIT_HIT_CAP, hit);
}
export function effectiveCredit(state) {
  return Math.max(0, (state.creditScore ?? 0) - creditPenalty(state));
}

// === v8.7: 資産背景と自己資金の厚みを審査に反映する ===
// v8.6までの審査は「本人属性（信用度）が銀行の最低値を超えているか」の一発判定で、
// 現金・純資産・頭金比率が一切考慮されなかった。そのため自営業（信用度10）は
// **現金1億を持っていても全4行が否決**され、「自己資金を入れれば借りられる」が成立しない。
// 現金300万のサラリーマンのほうが借りられる、という現実と逆の状態になっていた。
//
// 実際の銀行は ①本人属性 ②資産背景 ③その案件の自己資金の厚み の3つを見る。
// ②③を加点として足すことで、「属性が弱くても資産と頭金でカバーできる」を成立させる。
// なお金利（bankRate）には効かせない。**通るかどうか**は資産で動かせるが、
// **いくらで借りられるか**は本人属性と取引実績で決まる、という線引きにしてある。
export const ASSET_BACKING_MAX = 25;
export const DOWN_PAYMENT_BONUS_MAX = 25;
export const DOWN_BONUS_START = 0.20;   // 頭金がこれを超えたぶんだけ加点する
export const DOWN_BONUS_FULL = 0.80;    // ここで加点が上限に達する

// 資産背景。純資産の規模を対数で効かせる（1000万で+12・1億で+24・3億以上で上限）。
export function assetBackingBonus(state) {
  const nw = netWorth(state);
  if (nw <= 0) return 0;
  return Math.min(ASSET_BACKING_MAX, Math.round(Math.log10(Math.max(1, nw / 1_000_000)) * 12));
}

// その案件に入れる自己資金の厚み。頭金20%で0、80%以上で上限。
export function downPaymentBonus(downRatio) {
  const r = (downRatio - DOWN_BONUS_START) / (DOWN_BONUS_FULL - DOWN_BONUS_START);
  return Math.max(0, Math.min(DOWN_PAYMENT_BONUS_MAX, Math.round(r * DOWN_PAYMENT_BONUS_MAX)));
}

// 審査で使う実効信用度。内訳も返して、UIで「なぜ通った／通らなかった」を見せられるようにする。
export function creditForReview(state, downRatio = 0) {
  const base = effectiveCredit(state);
  const asset = assetBackingBonus(state);
  const down = downPaymentBonus(downRatio);
  return { base, asset, down, total: base + asset + down, penalty: creditPenalty(state) };
}

// 躯体0＝使用不能。全戸退去のうえ募集を止め、大規模修繕を終えるまで家賃がゼロになる。
export function isCondemned(property) { return structBandOf(property) === 'dead'; }
// 使用不能からの復旧は割高・長期。傷む前に直した方が安い、を成立させるための係数。
export const CONDEMNED_COST_MULT = 1.5;
export const CONDEMNED_EXTRA_MONTHS = 1;
// 危険域（躯体10%未満）では毎月この確率で1戸が退去する。
export const STRUCT_DANGER_VACATE_CHANCE = 0.20;
// 手入れ危険域（20%未満）では毎月この確率でクレームが起きて行動力を持っていかれる。
export const CARE_DANGER_CLAIM_CHANCE = 0.25;
export const CARE_DANGER_CLAIM_AP = 10;

// 退去率と突発修繕も築年帯で傾斜させる（旧: 退去1.0%・突発3%の一律）
export const VACANCY_BY_AGE = { young: 0.004, mid: 0.008, old: 0.015 };
export const TROUBLE_BY_AGE = { young: 0.01, mid: 0.03, old: 0.05 };

export function vacancyRate(property) {
  let r = VACANCY_BY_AGE[ageBandOf(property.builtAge)];
  if ((property.junkFlags || []).includes('管理崩壊')) r += 0.01;
  // 荒れた物件は住み続けてもらえない。v8で閾値を50→40（注意帯の入口）に揃えた。
  if (careBandOf(property) !== 'ok') r *= 1.5;
  return r;
}

export function troubleChanceFor(property) {
  const base = TROUBLE_BY_AGE[ageBandOf(property.builtAge)];
  // v8: 躯体が注意帯に入ると突発修繕が増える。傷んだ建物は壊れやすい。
  return structBandOf(property) === 'ok' ? base : base * 1.5;
}

// 物件名を築年数に応じて生成（築浅=モダン／築古=荘・文化・第一ビル等の古い名前）。
// 共有rngは消費せず、idベースのハッシュで決定的に決める（生成時にp.nameへ保存されるので以後は再計算しない）。
function _hashRng(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i++) { h ^= String(str).charCodeAt(i); h = Math.imul(h, 16777619); }
  let s = h >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const PLACE_TOKENS = ['本町', '緑丘', '桜台', '旭', '港南', '松原', '若葉', '泉', '月見', 'みどり', '東雲', '富士見', '栄', '幸', '錦', '宮前', '高砂', '日之出', '大手', '花水木'];
export function propertyName(genreKey, builtAge, seed) {
  const rnd = _hashRng('name:' + seed);
  const place = PLACE_TOKENS[Math.floor(rnd() * PLACE_TOKENS.length)];
  const detached = genreKey === 'kodate' || genreKey === 'w_kodate';
  if (detached) {
    if (builtAge >= 26) return `${place}の古家`;
    if (builtAge >= 11) return `${place}の一戸建て`;
    return `${place}ハウス`;
  }
  if (builtAge >= 26) {   // 築古: 古めかしい名前
    const pool = [`${place}荘`, `コーポ${place}`, `${place}文化`, `第${1 + Math.floor(rnd() * 3)}${place}ビル`, `${place}アパート`];
    return pool[Math.floor(rnd() * pool.length)];
  }
  if (builtAge >= 11) {   // 中古: 標準的な名前
    const pool = [`${place}ハイツ`, `${place}コーポ`, `サンハイツ${place}`, `${place}プラザ`, `${place}ハイム`];
    return pool[Math.floor(rnd() * pool.length)];
  }
  const pool = [`グランレジデンス${place}`, `パーク${place}テラス`, `ザ・${place}ヒルズ`, `${place}ガーデンズ`, `リヴェール${place}`];   // 築浅: モダンな名前
  return pool[Math.floor(rnd() * pool.length)];
}

// v3.10: 間取りごとの専有面積帯（㎡）。家賃はこの面積から算出する。
export const LAYOUT_SIZES = {
  '1R':   [16, 25], '1K':  [20, 30], '1DK': [25, 35], '1LDK': [30, 45],
  '2LDK': [45, 65], '3LDK': [60, 85], '4LDK': [80, 110],
};
// 各構造でどの間取りもあり得る（可能性は排除しない）。よくある間取りを重み付けで多めにしただけの重み配列。
const GENRE_LAYOUTS = {
  // 戸建てはファミリー向けが基本（単身1R/1Kは現実的に稀なので出さない・極小の1DKだけ稀に）
  kodate:   ['2LDK', '3LDK', '3LDK', '3LDK', '4LDK', '4LDK', '4LDK', '1DK'],
  // アパートは単身〜小家族向け中心（3LDK以上のアパートは稀なので出さない）
  apart:    ['1R', '1R', '1K', '1K', '1K', '1DK', '1DK', '1LDK', '2LDK'],
  // 鉄骨マンションは単身〜ファミリーまで（4LDKは稀なので出さない）
  tekkotsu: ['1K', '1K', '1DK', '1LDK', '1LDK', '2LDK', '2LDK', '3LDK'],
  // 区分は単身〜ファミリー
  kubun:    ['1R', '1K', '1K', '1DK', '1LDK', '1LDK', '2LDK', '3LDK'],
  // RCマンションは単身〜ファミリー
  rc:       ['1K', '1K', '1DK', '1LDK', '1LDK', '2LDK', '2LDK', '3LDK'],
};
// エリア別の㎡あたり月額家賃相場（円）。都心は高く地方は安い。
const RENT_PER_SQM = { urban: [2400, 3400], local: [1200, 1800] };

// 面積・エリア・築年・タイプから現実的な月額家賃を算出（家賃先行モデル）。
export function estimateRent(sizeSqm, areaKey, builtAge, genreKey, rng = Math.random) {
  const [lo, hi] = RENT_PER_SQM[areaKey] || RENT_PER_SQM.local;
  const perSqm = lo + (hi - lo) * rng();
  const ageFactor = Math.max(0.55, Math.min(1, 1 - Math.max(0, builtAge - 5) * 0.008));
  const isKodate = genreKey === 'kodate' || genreKey === 'w_kodate';
  const typeFactor = isKodate ? 0.65 : 1.0;   // 戸建ては㎡単価が割安
  const junkFactor = genreKey.startsWith('w_') ? 0.85 : 1.0;   // 訳ありは状態相応に安い
  const noise = 0.92 + rng() * 0.16;
  const rent = sizeSqm * perSqm * ageFactor * typeFactor * junkFactor * noise;
  return Math.max(15000, Math.round(rent / 1000) * 1000);
}

export function generateProperty(genreKey, areaKey, rng = Math.random, ageBands = null, opts = {}) {
  const g = GENRE[genreKey], a = AREA_ADJ[areaKey];
  const lr = (lo, hi) => lo + (hi - lo) * rng();
  let ageMin = g.ageMin, ageMax = g.ageMax;
  if (ageBands && ageBands.length) {
    const ok = ageBands.map(k => AGE_BANDS[k]).filter(([lo, hi]) => hi >= g.ageMin && lo <= g.ageMax);
    if (ok.length) { const [lo, hi] = ok[Math.floor(rng() * ok.length)]; ageMin = Math.max(lo, g.ageMin); ageMax = Math.min(hi, g.ageMax); }
  }
  const builtAge = Math.round(lr(ageMin, ageMax));
  const unitCount = Math.round(lr(g.unitsMin, g.unitsMax));
  // v3.10: 家賃先行。建物ごとに1つの間取りを選び（同じ建物は概ね同じ間取り）、各室に面積のばらつきを付ける。
  const normalKey = genreKey.startsWith('w_') ? genreKey.slice(2) : genreKey;
  const layoutPool = GENRE_LAYOUTS[normalKey] || GENRE_LAYOUTS.kubun;
  const layout = layoutPool[Math.floor(rng() * layoutPool.length)];
  const [szLo, szHi] = LAYOUT_SIZES[layout];
  const units = Array.from({ length: unitCount }, () => {
    const sizeSqm = Math.round(lr(szLo, szHi));
    const rent = estimateRent(sizeSqm, areaKey, builtAge, genreKey, rng);
    const occupied = g.wake ? rng() < 0.4 : rng() > Math.max(0.03, 0.10 + a.vacancyAdd);
    // v4: 原状回復は部屋ごと。tenantMonths（在室月数）は退去時の原状回復費に効く。
    return { rent, occupied, vacantMonths: occupied ? 0 : Math.round(lr(1, 6)), layout, sizeSqm,
      needsRestore: false, tenantMonths: occupied ? Math.round(lr(1, 60)) : 0,
      restoreJob: null, restoreProgress: 0 };
  });
  // v3.10: 価格は家賃から導く（年間家賃 ÷ 想定利回り帯）。訳ありは高利回り帯＝安い掘り出し物のまま。
  // v3.11: opts.lowYield=true は利回り帯の下限寄り（家賃に対して割高＝買う魅力の薄い「平凡物件」）を生成。
  const gpiM = units.reduce((s, u) => s + u.rent, 0);
  const yr = g.yieldMax - g.yieldMin;
  const yieldPick = opts.lowYield ? (g.yieldMin + lr(0, 0.30) * yr) : lr(g.yieldMin, g.yieldMax);
  const grossYield = Math.max(0.03, yieldPick + a.yieldAdd);
  const price = Math.max(10000, Math.round(gpiM * 12 / grossYield / 10000) * 10000);
  const rentTotalM = gpiM;
  const isKubun = genreKey === 'kubun' || genreKey === 'w_kubun';
  const id = __pid();
  // v8.9: 固定資産税評価額は売買価格と無関係に、構造・延床面積・築年・エリアだけで決める（実務どおり）
  // v8.21: 内訳（土地・建物）も保持し、UIの計算過程表示にそのまま使えるようにする。
  const assessedDetail = estimateAssessedValueDetail(g.structure, builtAge, units.reduce((s, u) => s + u.sizeSqm, 0), areaKey, rng);
  const assessedVal = assessedDetail.total;
  const p = {
    id, genreKey, areaKey, region: opts.region || 'main',   // v9-A: どの陸地にあるか
    name: propertyName(genreKey, builtAge, id), label: `${g.label}（${a.label}）`,
    builtAge, structure: g.structure, units, layout,
    price, askingPrice: price, origPrice: price, timeValue: Math.round(price * lr(0.95, 1.15)),
    grossYield,
    mgmtFeeM: isKubun ? Math.round(lr(10000, 20000)) : Math.round(rentTotalM * 0.03),
    repairReserveM: isKubun ? Math.round(lr(5000, 15000)) : Math.round(rentTotalM * 0.02),
    pmFeeRate: 0.05,
    // v8.20: 固都税は評価額（売買価格ではない）が課税標準。標準税率1.4%（固定資産税）を適用。
    // v8.21: 一律3万円の下限は実務に無い数字だったため撤廃。実務の下限は「免税点」
    // （土地30万円未満・家屋20万円未満の評価額はその区分が非課税）であって定額の最低税額
    // ではない。評価額自体が構造・築年・土地単価の下限で既に極端に小さくならない設計のため、
    // 下限なしでも不自然に0円へ張り付くことはない。
    propTaxA: Math.round(assessedVal * PROPERTY_TAX_RATE),
    // v6: 🏚躯体（大規模修繕でのみ回復）と 🧹手入れ（日常メンテで100%まで回復）の2ゲージ
    repairState: Math.round(g.wake ? lr(0, 40) : lr(40, 90)),
    careState: Math.round(g.wake ? lr(20, 60) : lr(70, 100)),
    autoManage: false,
    junkFlags: g.wake ? pickJunk(genreKey, rng) : [],
    resolvedJunk: [],   // v8.9: junkFlagsは生成時のまま消えないので、実際に手を入れた種類だけ別記録する
    assessedValue: assessedVal,
    assessedLand: assessedDetail.land, assessedBldg: assessedDetail.bldg,   // v8.21: 内訳（表示用）
    bldgRatio: g.structure === '木造' ? 0.5 : 0.45,
    deprRemaining: deprMonthsFor(g.structure, builtAge),
    listedMonths: 0, staleFlag: false, refusedOffer: false,
    loan: null, reformLoans: [], boughtPrice: null, boughtMonth: null, selfManaged: false,
    history: [], cum: { cf: 0, months: 0 },
  };
  // v3.8: 売主事情。売り急ぎ（相続・資金繰り等）の売主は深い指値にも応じやすい（レアな掘り出し物・訳ありはやや高め）
  const urgent = rng() < (g.wake ? 0.15 : 0.07);
  p.sellerUrgency = urgent ? { reason: URGENCY_REASONS[Math.floor(rng() * URGENCY_REASONS.length)] } : null;
  return p;
}

const URGENCY_REASONS = ['相続で現金化を急いでいる', '資金繰りで今月中に売りたい', '海外転勤が決まった', '離婚による財産分与', '高齢で管理が難しくなった'];

// === Task 5: 購入フロー（指値・銀行選択・buyProperty v2） ===

// v3.8: 不動産会社の「取次ライン」。この値引き幅までは普通に取り次いでもらえる。
// 交渉力・訳あり・売れ残り・売り急ぎで広がる。
export function maxBrokerCut(property, negotiationLv) {
  let c = 0.15 + (negotiationLv - 1) * 0.02;
  if (property.junkFlags?.length) c += 0.10;
  if (property.staleFlag) c += 0.10;
  if (property.sellerUrgency) c += 0.25;
  return Math.min(0.95, c);
}

// 売主に「安くても売りたい背景」があるか（鬼指値のペナルティ有無の分岐に使う）
export function hasSellerBackground(property) {
  return !!(property.junkFlags?.length || property.staleFlag || property.sellerUrgency);
}

export function offerSuccessChance(property, cutRate, negotiationLv) {
  if (cutRate === 0) return 1;
  const line = maxBrokerCut(property, negotiationLv);
  if (cutRate > line) {
    // 鬼指値ゾーン: 背景ありは「ダメ元」（柔軟度で2〜10%・1万円の奇跡もありうる）、背景なしは1%
    if (!hasSellerBackground(property)) return 0.01;
    let flex = 0.02;
    if (property.sellerUrgency) flex += 0.04;
    if (property.staleFlag) flex += 0.02;
    if (property.junkFlags?.length) flex += 0.02;
    return flex;
  }
  let p = 0.5 - cutRate * 3;
  if (property.staleFlag) p += 0.25;
  if (property.junkFlags.length > 0) p += 0.15;
  if (property.sellerUrgency) p += 0.25;
  p += (negotiationLv - 1) * 0.05;
  return Math.max(0.02, Math.min(0.95, p));
}

// v8.3: 一度断られた物件は、売主が折れるまで買付そのものを受け付けない。
// v8.2までは満額だけ素通りできたため、「鬼指値で外しても満額で買い直せばいい」となり、
// 指値にリスクが無かった。断られたら売主の態度が固まる、という当たり前の反応にする。
// 解除されるのは ①売主が値下げした（tickMarketでrefusedOfferを解除）
//                ②6ヶ月以上売れ残った（staleFlag）の2つだけ。
export function offerBlockedReason(property) {
  if (!property) return null;
  if (property.refusedOffer && !property.staleFlag) return 'refused';
  return null;
}

export function makeOffer(state, propertyId, cutRate, rng = Math.random) {
  const s = structuredClone(state);
  const p = s.market.find(x => x.id === propertyId);
  if (!p) return { state: s, accepted: false, price: 0, blocked: true, reason: 'notFound' };
  const blocked = offerBlockedReason(p);
  if (blocked) return { state: s, accepted: false, price: 0, blocked: true, reason: blocked };
  s.actionPower -= 10;
  const lv = skillLevel(s.skills.negotiation.exp);
  const beyondLine = cutRate > maxBrokerCut(p, lv);
  // v8: 用語クイズ全問正解の「耳より情報」は、この1回の指値だけ成功率を底上げして消える。
  // s.market の参照（p）を保ったまま消費したいので、clone を返す consumeSashineBuff ではなく
  // ここで直接 s.buffs を削る（結果は同じ）。
  const buff = sashineBuffBonus(s);
  const base = offerSuccessChance(p, cutRate, lv);
  // 満額（base=1）は「必ず通る」が仕様なので、上乗せもクランプもしない。
  const chance = base >= 1 ? base : Math.min(0.95, base + buff);
  if (buff > 0 && base < 1) {
    const bi = s.buffs.findIndex(b => b.type === 'sashine');
    if (bi >= 0 && --s.buffs[bi].uses <= 0) s.buffs.splice(bi, 1);
  }
  if (rng() < chance) {
    // v3.8: 深い指値を通すほど交渉EXPが多く入る
    s.skills.negotiation.exp += 5 + Math.round(cutRate * 100);
    return { state: s, accepted: true, price: Math.max(10000, Math.round(p.price * (1 - cutRate))) };
  }
  p.refusedOffer = true;
  // v3.8: 背景のない物件への鬼指値は評判ダウン（交渉EXP-15・レベルが下がることもある）
  let penalized = false;
  if (beyondLine && !hasSellerBackground(p)) {
    s.skills.negotiation.exp = Math.max(0, s.skills.negotiation.exp - 15);
    penalized = true;
  }
  // v3.8: 鬼指値で断られたとき、約30%で不動産会社から「逆提案」（激安寄りの物件を紹介してくれる）
  let counterProposal = null;
  if (beyondLine && rng() < 0.30) {
    const wk = p.genreKey.startsWith('w_') ? p.genreKey : ('w_' + p.genreKey);
    const cp = generateProperty(GENRE[wk] ? wk : 'w_kodate', p.areaKey, rng);
    cp.origPrice = cp.price;
    cp.price = Math.max(10000, Math.round(cp.price * (0.55 + rng() * 0.2) / 10000) * 10000);
    cp.askingPrice = cp.price;
    cp.staleFlag = true;
    cp.listedMonths = 6 + Math.floor(rng() * 6);
    s.nextPropertyId = s.nextPropertyId || 1;
    cp.id = 'p' + s.nextPropertyId++;
    cp.name = propertyName(cp.genreKey, cp.builtAge, cp.id);
    s.market.unshift(cp);
    counterProposal = cp;
  }
  return { state: s, accepted: false, price: 0, penalized, counterProposal };
}

export function buyPropertyV2(state, propertyId, { method, downRatio = 0, price, owner = 'personal' }) {
  const s = structuredClone(state);
  const i = s.market.findIndex(x => x.id === propertyId);
  const p = s.market[i];
  // v3.5: 名義。法人名義は法人設立済みの場合のみ有効（それ以外は個人）
  p.owner = (owner === 'corp' && s.isIncorporated) ? 'corp' : 'personal';
  const logs = [];
  // v8.5: 諸費用は項目ごとの実額。融資を使うと抵当権設定登記と融資事務手数料が上乗せされる。
  const loanAmount = method === 'cash' ? 0 : Math.round(price * (1 - downRatio));
  const closing = closingCostOf(p, price, loanAmount);
  p.acquisitionCost = closing;   // 自己資金回収率の計算に使うので実額を残す
  if (method === 'cash') {
    s.cash -= price + closing;
    p.loan = null;
  } else {
    const terms = reviewLoan(method, p, price, downRatio, s).terms;
    s.cash -= Math.round(price * downRatio) + closing;
    p.loan = { bankKey: method, principal: Math.round(price * (1 - downRatio)),
      rate: bankRate(method, s), years: terms?.years ?? BANKS[method].termMax, monthsPaid: 0 };
    s.bankRelations[method].loans += 1;
  }
  p.boughtPrice = price; p.boughtMonth = s.month;
  p.listedMonths = 0; p.staleFlag = false; p.askingPrice = null;
  if (['apart', 'tekkotsu', 'rc'].includes(p.genreKey)) s.creditScore = Math.min(100, s.creditScore + 5);
  s.properties.push(p); s.market.splice(i, 1);
  logs.push(`${p.label} を${method === 'cash' ? '現金' : BANKS[method].label + 'の融資'}で購入（${yen(price)}）`);
  s.stats = s.stats || { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false };
  s.stats.buys += 1;
  if (method !== 'cash') s.stats.hadLoan = true;
  return { state: s, logs };
}

// === Task 8: 売却処理 ===

export function currentMarketValue(prop) {
  const years = prop.monthsHeld / 12;
  return prop.price * Math.pow(1 + prop.annualDrift, years) * (0.9 + 0.1 * prop.repair);
}

// === Task 3: v2 物件収支ヘルパー ===

export function gpiAnnual(p) {
  return p.units.reduce((s, u) => s + u.rent, 0) * 12;
}

export function vacancyLossAnnual(p) {
  return p.units.filter(u => !u.occupied).reduce((s, u) => s + u.rent, 0) * 12;
}

export function egiAnnual(p) {
  return gpiAnnual(p) - vacancyLossAnnual(p);
}

export function opexAnnual(p) {
  const pm = p.selfManaged ? 0 : Math.round(egiAnnual(p) * p.pmFeeRate);
  return p.mgmtFeeM * 12 + p.repairReserveM * 12 + pm + p.propTaxA;
}

export function noiAnnualV2(p) {
  return egiAnnual(p) - opexAnnual(p);
}

function loanMonthlyBreakdown(loan) {
  if (!loan) return { interest: 0, principal: 0 };
  const rem = remainingPrincipal(loan.principal, loan.rate, loan.years, loan.monthsPaid);
  const pay = monthlyPayment(loan.principal, loan.rate, loan.years);
  const interest = Math.round(rem * loan.rate / 12);
  return { interest, principal: Math.round(pay - interest) };
}

// v3.5: 課税はstateの法人化フラグではなく物件の名義(owner)で決まる（個人=デッドクロス後40%・法人=30%）
export function propertyMonthlyPL(p) {
  const rentIn = p.units.filter(u => u.occupied).reduce((s, u) => s + u.rent, 0);
  const vacancyLoss = p.units.filter(u => !u.occupied).reduce((s, u) => s + u.rent, 0);
  const pm = p.selfManaged ? 0 : Math.round(rentIn * p.pmFeeRate);
  const opex = p.mgmtFeeM + p.repairReserveM + pm + Math.round(p.propTaxA / 12);
  const loanBd = loanMonthlyBreakdown(p.loan);
  // v4: リフォームローンは複数本を同時に抱えられる（工事ごとに借りられるため）
  const reformBd = (p.reformLoans || []).map(loanMonthlyBreakdown)
    .reduce((t, b) => ({ interest: t.interest + b.interest, principal: t.principal + b.principal }),
      { interest: 0, principal: 0 });
  const interest = loanBd.interest + reformBd.interest;
  const principalPay = loanBd.principal + reformBd.principal;
  const noiM = rentIn - opex;
  const tax = monthlyTax(noiM * 12, p.deprRemaining, p.owner === 'corp');
  return { rentIn, vacancyLoss, opex, interest, principal: principalPay, tax,
    cf: rentIn - opex - interest - principalPay - tax };
}

export function bookValueV2(p) {
  const deprTotalM = deprMonthsFor(p.structure, p.builtAge);
  const done = deprTotalM - p.deprRemaining;
  const bldg = (p.boughtPrice ?? p.price) * p.bldgRatio;
  const land = (p.boughtPrice ?? p.price) * (1 - p.bldgRatio);
  return Math.round(land + Math.max(0, bldg * (1 - done / Math.max(1, deprTotalM))));
}

// v11: 1.1倍超を一律5%固定にせず、割高になるほど段階的に確率を下げる。
export function offerChance(askingPrice, refValue, fullyOccupied, listedMonths) {
  const ratio = askingPrice / refValue;
  let p = ratio <= 0.9 ? 0.50
    : ratio <= 1.0 ? 0.30
    : ratio <= 1.1 ? 0.15
    : ratio <= 1.3 ? 0.06
    : ratio <= 1.6 ? 0.03
    : 0.01;
  p *= fullyOccupied ? 1.3 : 0.7;   // v11.1: 加算だと新設の割高帯(6%/3%/1%)の相対差がほぼ潰れるため乗算に変更
  return Math.max(0.01, Math.min(0.8, p));
}

// v11: 割高な売出ほど「満額提示」ではなく「指値」になりやすくする。offerChanceとは独立した軸
// （offerChance=そもそも買付が来るか、sashineChance=来た買付が満額か指値か）。
export function sashineChance(ratio) {
  return ratio <= 0.9 ? 0.20
    : ratio <= 1.0 ? 0.35
    : ratio <= 1.1 ? 0.55
    : ratio <= 1.3 ? 0.75
    : 0.90;
}

export function rollBuyOffer(listing, property, rng = Math.random) {
  const full = property.units.every(u => u.occupied);
  // v11.1: プレイヤーが実際に見た査定額(listing.appraisal)を基準にする。都度fairValueを再計算すると、
  // 査定表示に乗っている±ノイズ・0.92掛けの分だけ「見た数字」と「判定される数字」がズレてしまうため
  // （例: 査定×120%で売り出しても、fairValue比では0.99〜1.21倍にばらつき約半数が狙った帯に入らない）。
  // 査定未取得の掲載（想定外経路・旧セーブ）だけfairValueへフォールバックする。
  const fv = listing.appraisal ?? fairValue(property);
  if (rng() >= offerChance(listing.askingPrice, fv, full, listing.listedMonths)) return null;
  const mustSashine = listing.listedMonths >= 6;
  const sashine = mustSashine || rng() < sashineChance(listing.askingPrice / fv);   // v11: 比率で指値/満額を振り分け
  if (!sashine) return { price: listing.askingPrice, type: 'full' };
  const cut = 0.03 + rng() * 0.09;
  return { price: Math.round(listing.askingPrice * (1 - cut) / 10000) * 10000, type: 'sashine' };
}

export function respondToOffer(state, propertyId, action, negotiationLv, rng = Math.random) {
  const s = structuredClone(state);
  const l = s.listings.find(x => x.propertyId === propertyId);
  const offer = l?.offer;
  if (!offer) return { state: s, result: 'rejected' };
  const queue = (price) => { s.pendingSales.push({ propertyId, price, settleMonth: s.month + 1 });
    s.listings = s.listings.filter(x => x.propertyId !== propertyId); };
  if (action === 'accept') { queue(offer.price); return { state: s, result: 'accepted', settlePrice: offer.price }; }
  if (action === 'reject') { l.offer = null; return { state: s, result: 'rejected' }; }
  // counter: 中間価格
  const counterPrice = Math.round((offer.price + l.askingPrice) / 2 / 10000) * 10000;
  if (rng() < 0.5 + (negotiationLv - 1) * 0.05) { queue(counterPrice); return { state: s, result: 'counter_ok', settlePrice: counterPrice }; }
  l.offer = null;
  return { state: s, result: 'counter_ng' };
}

// === v8.1: 売却の損得を「決める前」に見せるための計算 ===
// v8までは譲渡税が settleSale の中だけで計算され、プレイヤーは決済後のログで初めて金額を知った。
// このゲームの一番おいしい判断（短期で売るか、長期まで待つか）が見えないままだったので、
// 実際の精算と同じ関数を UI からも呼べるように切り出した（表示と実処理が食い違わないことが肝）。
export const LONG_TERM_MONTHS = 60;   // これを超えて保有すると長期譲渡（税率が下がる）

export function heldMonthsOf(state, property) {
  return Math.max(0, (state.month ?? 0) - (property.boughtMonth ?? state.month ?? 0));
}
export function isLongTermHold(state, property) {
  return heldMonthsOf(state, property) > LONG_TERM_MONTHS;
}
// 長期になるまであと何ヶ月か（法人名義・すでに長期なら0）
export function monthsToLongTerm(state, property) {
  if (property.owner === 'corp' || isLongTermHold(state, property)) return 0;
  return LONG_TERM_MONTHS + 1 - heldMonthsOf(state, property);
}
// v3.5: 法人名義は保有期間に関係なく法人税率（短期転売の5年ルールは個人のみ）
export function capGainTaxRate(state, property) {
  if (property.owner === 'corp') return CONFIG.corporateTaxRate;
  return isLongTermHold(state, property) ? CONFIG.capGainTaxLong : CONFIG.capGainTaxShort;
}
// 課税対象益は「売却価格 − 簿価」。簿価は減価償却で毎月下がるので、
// 画面に出ている「購入差額（時価−購入価格）」よりも大きくなるのが普通。
export function capGainOf(property, price) {
  return Math.max(0, price - bookValueV2(property));
}
export function capGainTaxOf(state, property, price) {
  return Math.round(capGainOf(property, price) * capGainTaxRate(state, property));
}
export function loanPayoffOf(property) {
  let payoff = 0;
  if (property.loan) {
    payoff += Math.round(remainingPrincipal(property.loan.principal, property.loan.rate,
      property.loan.years, property.loan.monthsPaid));
  }
  return payoff + reformLoansRemaining(property);
}
// === v8.4: 売却諸費用 ===
// v8.3までは「売却価格 − 譲渡税 − 残債」だけで手取りを出していたが、実際は売主にも実費がかかる。
// 手取りが数%変わるので、利益が薄い物件では売る／売らないの判断そのものがひっくり返る。
// 所有権移転登記（名義変更）は**買主負担**が慣習なので売主側では計上しない
// （このゲームでも購入時のpurchaseCosts()にregTransferとして含まれている）。

// 仲介手数料（速算法・消費税10%込み）。実際の宅建業法の上限式。
// v8.20: 2024年7月施行「低廉な空家等の売買又は交換の媒介における媒介報酬の特例」により、
// 価格800万円以下の取引は速算式に代えて税込33万円まで定額請求できる（訳あり・激安物件は
// 現地調査等の実費が速算式の報酬を上回りやすいための特例）。このゲームは訳あり物件が
// 主戦場のため、対象価格帯では特例の法定上限をそのまま適用する。
export const CONSUMPTION_TAX = 0.10;
export const LOW_PRICE_BROKER_FEE_MAX_PRICE = 8_000_000;   // 特例の対象上限（税抜価格）
export const LOW_PRICE_BROKER_FEE_CAP = 330_000;            // 特例の報酬上限（30万円＋消費税10%）
export function brokerFee(price) {
  if (price <= LOW_PRICE_BROKER_FEE_MAX_PRICE) return LOW_PRICE_BROKER_FEE_CAP;
  let base;
  if (price <= 2_000_000) base = price * 0.05;
  else if (price <= 4_000_000) base = price * 0.04 + 20_000;
  else base = price * 0.03 + 60_000;
  return Math.round(base * (1 + CONSUMPTION_TAX));
}

// 印紙税（不動産売買契約書・軽減税率）。契約金額の階段で決まる。
export const STAMP_DUTY_TABLE = [
  [1_000_000, 500], [5_000_000, 1_000], [10_000_000, 5_000], [50_000_000, 10_000],
  [100_000_000, 30_000], [500_000_000, 60_000], [1_000_000_000, 160_000],
];
export function stampDuty(price) {
  for (const [limit, duty] of STAMP_DUTY_TABLE) if (price <= limit) return duty;
  return 320_000;
}

// 抵当権抹消費用。ローンが残っている物件を売るときだけ発生する。
// 登録免許税（不動産1個1,000円・土地+建物で2,000円）＋司法書士報酬の実勢。
export const MORTGAGE_RELEASE_FEE = 20_000;
export function mortgageReleaseFee(property) {
  const hasLoan = !!property.loan || (property.reformLoans || []).length > 0;
  return hasLoan ? MORTGAGE_RELEASE_FEE : 0;
}

// === v8.5: 購入時の諸費用 ===
// v8.4までは「価格の7%」という一本の数字だけで、内訳が見えなかった。
// 売却側を実在の計算式で出したのに購入側がどんぶり勘定では釣り合わないので、こちらも項目に分ける。
export const REG_TAX_LAND = 0.015;            // 登録免許税（所有権移転・土地）
export const REG_TAX_BLDG = 0.020;            // 登録免許税（所有権移転・建物）
export const REG_TAX_MORTGAGE = 0.004;        // 登録免許税（抵当権設定・借入額に対して）
export const ACQUISITION_TAX_RATE = 0.03;     // 不動産取得税（評価額に対して）
// v8.9で下限額（司法書士5万円・融資事務手数料3.3万円）を一度撤廃したが、v8.20で復活。
// 極端に安い訳あり物件では諸費用が価格の何割にもなりうるが、それ自体は実務の実態
// （評価額が価格と独立になった今は登録免許税・不動産取得税だけでも既に相応の負担になる）。
// 司法書士報酬は登記1件あたりの実費に近く、価格が安くても数千円まで下がることはない。
export function scrivenerFee(price) {
  return Math.round(Math.min(100_000, Math.max(50_000, price * 0.004)) / 1000) * 1000;
}
export function loanArrangementFee(loanAmount) {
  if (loanAmount <= 0) return 0;
  return Math.round(Math.min(110_000, Math.max(33_000, loanAmount * 0.022)) / 1000) * 1000;
}

// v8.9: 固定資産税評価額（公課証明書相当）。以前は「売買価格の6割」という一律推定だったため、
// 指値や売り急ぎで大幅に値引きされた物件ほど登録免許税・不動産取得税まで一緒に下がってしまい、
// 実務と乖離していた（評価額は売買価格と無関係に、建物の構造・延床面積・築年で決まる）。
// 物件生成時（generateProperty）に構造・延床面積・築年から独立に算出し、p.assessedValue として
// 保持する。ASSESSED_VALUE_RATE はその値を持たない旧セーブ・テスト用の簡易フォールバックに残す。
export const ASSESSED_VALUE_RATE = 0.60;
// v8.9: 通常物件の評価額が旧来の「価格の6割」目安と揃うように、実勢の再建築費・路線価より
// 控えめな単価で校正している（訳あり物件は築古で depreciation floor に張り付きやすく、
// 価格が利回り優先で叩き売られる分だけ評価額との乖離＝リアルな重さが自然に出る）。
export const REBUILD_COST_PER_SQM = { RC: 100_000, S: 85_000, '木造': 70_000 };  // 円/㎡（再建築費の目安）
export const ASSESSED_USEFUL_LIFE = { RC: 47, S: 34, '木造': 22 };               // 法定耐用年数
export const ASSESSED_DEPRECIATION_FLOOR = 0.20;  // 建物の評価額はここ（再建築費の20%）を下限に逓減
// v8.20: 固都税（毎年の保有税）は本来この評価額が課税標準。以前は「価格×0.7%」のままで、
// 登録免許税・不動産取得税だけが評価額連動になっていて整合していなかった。
// 固定資産税の標準税率1.4%をそのまま採用する（都市計画税・住宅用地特例は簡略化のため省略）。
export const PROPERTY_TAX_RATE = 0.014;
// v8.20: 土地単価をエリアごとの単一固定値にすると「都心はどこでも同じ㎡単価」という
// 不自然さが出るため、エリアごとに現実的な下限〜上限のレンジを持たせ、物件生成時に
// その中から引く。areaKeyは土地単価だけでなく家賃・利回り帯・銀行の営業エリア制限・
// 地図上の配置（city.mjsのbandFor）まで使う中核区分なので、3区分化などの再設計はせず、
// 既存のlocal/urban 2区分のまま分布のほうを実勢に合わせて広げる（2026-08-01方針確定）。
// urbanは「地方中核市の中心部〜政令市住宅地」が大半（路線価目安6万〜40万円/㎡）を占め、
// 一部だけ「政令市中心部〜東京23区」クラス（同40万〜80万円/㎡）まで届く、という実勢の
// 分布を再現するため、営業閾値の抽選（drawSearchThreshold）と同じべき乗カーブで
// 安いほうへ寄せる（LAND_VALUE_SKEW>1ほど下限寄りに偏る）。localも同じ考え方で
// 「過疎地〜地方都市郊外」の大半が下限寄りになるようにする。
export const LAND_VALUE_RANGE_BY_AREA = {
  local: [3_000, 40_000],     // 円/㎡（地方・郊外：過疎地の空き家バンク物件〜地方都市郊外）
  urban: [60_000, 800_000],   // 円/㎡（都心・駅近：地方中核市中心部〜東京23区の住宅地）
};
export const LAND_VALUE_SKEW = 2.5;   // 大きいほど下限（ありふれた立地）寄りに偏る
export function landValuePerSqm(areaKey, rng = Math.random) {
  const [lo, hi] = LAND_VALUE_RANGE_BY_AREA[areaKey] ?? LAND_VALUE_RANGE_BY_AREA.local;
  const skewed = Math.pow(rng(), LAND_VALUE_SKEW);
  return Math.round((lo + skewed * (hi - lo)) / 1000) * 1000;
}

export function totalFloorSqm(property) {
  return (property.units || []).reduce((s, u) => s + (u.sizeSqm ?? 30), 0);
}

// 構造・延床面積・築年・エリアから評価額を出す。売買価格を一切参照しないのが要点。
// v8.21: 土地・建物それぞれの評価額を内訳として返す版。UIの「計算過程を見せる」表示から使う。
// 単価（円/㎡）も一緒に返し、内訳表示で「単価×面積」の計算式をそのまま出せるようにする。
export function estimateAssessedValueDetail(structure, builtAge, totalSqm, areaKey = 'local', rng = Math.random) {
  const life = ASSESSED_USEFUL_LIFE[structure] ?? ASSESSED_USEFUL_LIFE['木造'];
  const remain = Math.max(ASSESSED_DEPRECIATION_FLOOR, 1 - (builtAge ?? 0) / life);
  const bldgUnitPrice = REBUILD_COST_PER_SQM[structure] ?? REBUILD_COST_PER_SQM['木造'];
  const bldg = Math.round(bldgUnitPrice * totalSqm * remain);
  const landUnitPrice = landValuePerSqm(areaKey, rng);
  const landSqm = totalSqm * 0.5;   // 簡易モデル：敷地は延床の半分程度とみなす
  const land = Math.round(landUnitPrice * landSqm);
  return { land, bldg, total: land + bldg, bldgUnitPrice, landUnitPrice, landSqm, remain };
}

export function estimateAssessedValue(structure, builtAge, totalSqm, areaKey = 'local', rng = Math.random) {
  return estimateAssessedValueDetail(structure, builtAge, totalSqm, areaKey, rng).total;
}

// v8.21: UIの「計算過程を見せる」表示（固都税・不動産取得税の内訳）用。物件に保存済みの
// assessedLand/assessedBldgから単価・面積・残存率を逆算する（乱数を引き直さないよう、
// 保存済みの土地評価額から単価を割り戻す）。
export function assessedValueBreakdown(property) {
  const totalSqm = totalFloorSqm(property);
  const landSqm = totalSqm * 0.5;
  const life = ASSESSED_USEFUL_LIFE[property.structure] ?? ASSESSED_USEFUL_LIFE['木造'];
  const remain = Math.max(ASSESSED_DEPRECIATION_FLOOR, 1 - (property.builtAge ?? 0) / life);
  const bldgUnitPrice = REBUILD_COST_PER_SQM[property.structure] ?? REBUILD_COST_PER_SQM['木造'];
  // v8.21: assessedLand/assessedBldgを持たない物件（migrateSave前・想定外の経路）でも
  // ¥0という嘘の内訳を出さないよう、決定的な式でその場から算出するフォールバックを持つ。
  const bldg = property.assessedBldg ?? Math.round(bldgUnitPrice * totalSqm * remain);
  const land = property.assessedLand ?? Math.max(0, (property.assessedValue ?? bldg) - bldg);
  const landUnitPrice = landSqm > 0 ? Math.round(land / landSqm) : 0;
  return { totalSqm, landSqm, remain, bldgUnitPrice, landUnitPrice, land, bldg, total: land + bldg };
}

// 価格だけからの簡易推定（旧方式）。property.assessedValue を持たないテスト用スタブ・
// 移行前の旧セーブに対するフォールバックとしてのみ使う。
export function assessedValue(price) { return Math.round(price * ASSESSED_VALUE_RATE); }

// property.assessedValue が無い場合（購入諸費用のテスト用スタブ・移行前の旧セーブ）だけ、
// 従来どおり価格から推定する。
export function assessedValueOf(property, price) {
  return property?.assessedValue ?? assessedValue(price);
}

// 買主が負担する諸費用の内訳。loanAmount が0なら抵当権設定と融資事務手数料はかからない
//（現金購入のほうが諸費用も安い、という当たり前の差が出る）。
export function purchaseCosts(property, price, loanAmount = 0) {
  const assessed = assessedValueOf(property, price);
  const bldgRatio = property?.bldgRatio ?? 0.5;
  const broker = brokerFee(price);
  const stamp = stampDuty(price);
  const regTransfer = Math.round(assessed * (1 - bldgRatio) * REG_TAX_LAND
                               + assessed * bldgRatio * REG_TAX_BLDG);
  const acquisition = Math.round(assessed * ACQUISITION_TAX_RATE);
  const scrivener = scrivenerFee(price);
  const regMortgage = loanAmount > 0 ? Math.round(loanAmount * REG_TAX_MORTGAGE) : 0;
  const loanFee = loanArrangementFee(loanAmount);
  return { broker, stamp, regTransfer, acquisition, scrivener, regMortgage, loanFee,
    total: broker + stamp + regTransfer + acquisition + scrivener + regMortgage + loanFee };
}
// 購入諸費用の合計だけが欲しい場面（必要現金の計算など）で使う薄いラッパ。
export function closingCostOf(property, price, loanAmount = 0) {
  return purchaseCosts(property, price, loanAmount).total;
}

// 売主が負担する諸費用の内訳。
export function saleCosts(property, price) {
  const broker = brokerFee(price);
  const stamp = stampDuty(price);
  const release = mortgageReleaseFee(property);
  return { broker, stamp, release, total: broker + stamp + release };
}

// 売却の手取り一式。価格決定・買付承諾・決済演出のすべてがこれを使う。
export function saleBreakdown(state, property, price) {
  const book = bookValueV2(property);
  const gain = capGainOf(property, price);
  const rate = capGainTaxRate(state, property);
  const tax = Math.round(gain * rate);
  const payoff = loanPayoffOf(property);
  const costs = saleCosts(property, price);
  return { price, book, gain, rate, tax, payoff, costs,
    net: price - tax - payoff - costs.total,
    longTerm: property.owner === 'corp' || isLongTermHold(state, property) };
}

// v8.1: 個人名義の物件がすべて法人名義だったら、年間の税額がいくら変わるか。
// 法人化の判断を「雰囲気」ではなく数字でできるようにするための試算。
// 課税はデッドクロス後にしか発生しないので、償却が残っている物件では0になる（それが正しい）。
export function incorporationSaving(state) {
  let monthly = 0;
  for (const p of state.properties || []) {
    if (p.owner === 'corp') continue;
    monthly += propertyMonthlyPL({ ...p, owner: 'personal' }).tax
             - propertyMonthlyPL({ ...p, owner: 'corp' }).tax;
  }
  return Math.round(monthly * 12);
}
// 設立費用を年間節税額で割った回収年数。まだ節税が発生しない場合は null。
export function incorporationPaybackYears(state) {
  const saving = incorporationSaving(state);
  return saving > 0 ? CONFIG.corporateSetupCost / saving : null;
}

export function settleSale(state, sale) {
  const s = structuredClone(state);
  const i = s.properties.findIndex(x => x.id === sale.propertyId);
  const p = s.properties[i];
  const logs = [];
  // 表示（売却前の試算）と同じ関数で精算する。数字がズレると信用を失うので必ず共通化する。
  const bd = saleBreakdown(s, p, sale.price);
  const { gain, tax: capTax, payoff, costs } = bd;
  s.cash += bd.net;   // 売却価格 − 譲渡税 − 残債 − 諸費用（仲介手数料・印紙税・抵当権抹消）
  if (p.loan) { const rel = s.bankRelations?.[p.loan.bankKey]; if (rel) rel.paidOff += 1; }
  const taxLabel = p.owner === 'corp' ? '法人30%'
    : `${bd.longTerm ? '長期' : '短期'}${Math.round(bd.rate * 100)}%`;
  logs.push(`${p.label} を ${yen(sale.price)} で売却（${taxLabel} 譲渡税 ${yen(capTax)}・諸費用 ${yen(costs.total)}・残債精算 ${yen(payoff)}・手取り ${yen(bd.net)}）`);
  s.stats = s.stats || { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false };
  s.stats.sales += 1;
  if (gain > 0) s.stats.profitSales += 1;
  if (p.junkFlags && p.junkFlags.length > 0) s.stats.junkFlips += 1;
  s.properties.splice(i, 1);
  s.pendingSales = s.pendingSales.filter(x => x.propertyId !== sale.propertyId);
  return { state: s, logs };
}

// === Task 9: 空室・退去・客付け＋DIY v2 ===

export function monthlyVacancyRoll(property, rng = Math.random) {
  let vacated = 0;
  // v6: 退去率は築年帯で傾斜し、手入れが荒れているとさらに跳ねる（vacancyRate に集約）
  const rate = vacancyRate(property);
  property.units.forEach(u => {
    if (u.occupied && rng() < rate) {
      // v4: 退去した部屋は「要原状回復」。回復するまで客付けできない。
      // tenantMonths は原状回復費の算定に使うため、ここでは0に戻さない（入居時にリセットする）。
      u.occupied = false; u.vacantMonths = 0; vacated += 1;
      u.needsRestore = true; u.restoreProgress = 0;
    } else if (u.occupied) {
      u.tenantMonths = (u.tenantMonths || 0) + 1;
    }
  });
  return { property, vacated };
}

// v6: 自然客付け率。基準20%を手入れの状態で ±5pt 動かす（手入れ100%で25%・0%で15%）。
// v8: 使用不能（躯体0）と管理崩壊（手入れ0）では、そもそも募集が成立しないのでゼロにする。
// === v8.6: 物件の魅力度 ===
// v8.5までは客付け率に効くのが「手入れ」だけで、しかも 15%〜25% の幅しかなかった。
// どれだけ物件を良くしても月25%が上限＝平均4ヶ月かかるため、ADが実質必須になっていた。
// バリューアップも躯体も築年数も客付けには無関係で、「良い物件にする」努力が報われない。
// 魅力度を作って客付け率の主軸に据え、8%〜63% の幅を持たせる。
// これで「ADを買う」か「物件を良くする」かが本当の選択になる。
export const APPEAL_WEIGHTS = { care: 30, valueUp: 30, struct: 15, age: 15, layout: 10 };
export const APPEAL_AGE_LIMIT = 35;    // 築35年で築年スコア0
export const APPEAL_SQM_MIN = 20;      // 20㎡以下は広さスコア0
export const APPEAL_SQM_MAX = 45;      // 45㎡以上で満点
export const FILL_BASE = 0.08;         // 魅力度0でも最低これだけは決まる
export const FILL_APPEAL_SPAN = 0.55;  // 魅力度100で +55pt → 合計63%

// 内訳。UIで「どこを伸ばせるか」を見せるために配点ごとに返す。
export function appealBreakdown(property, unit = null) {
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const care = clamp01((property.careState ?? 100) / 100);
  const struct = clamp01((property.repairState ?? 100) / 100);
  const vLv = Math.min(VALUE_UP_MAX_LEVEL, property.valueUpLevel || 0);
  const age = clamp01((APPEAL_AGE_LIMIT - (property.builtAge ?? 0)) / APPEAL_AGE_LIMIT);
  const sqm = unit?.sizeSqm ?? 30;
  const layout = clamp01((sqm - APPEAL_SQM_MIN) / (APPEAL_SQM_MAX - APPEAL_SQM_MIN));
  return {
    care:    Math.round(APPEAL_WEIGHTS.care * care),
    valueUp: Math.round(APPEAL_WEIGHTS.valueUp * vLv / VALUE_UP_MAX_LEVEL),
    struct:  Math.round(APPEAL_WEIGHTS.struct * struct),
    age:     Math.round(APPEAL_WEIGHTS.age * age),
    layout:  Math.round(APPEAL_WEIGHTS.layout * layout),
  };
}
export function appealScore(property, unit = null) {
  const b = appealBreakdown(property, unit);
  return b.care + b.valueUp + b.struct + b.age + b.layout;
}

export function naturalFillChance(property, unit = null) {
  if (isCondemned(property) || careBandOf(property) === 'dead') return 0;
  return FILL_BASE + FILL_APPEAL_SPAN * appealScore(property, unit) / 100;
}

// === v8.4: 広告料（AD）===
// v8.3までは「広告を出す＝その月に必ず（70%で）決まる」だったので、空室は現金で即解決できた。
// 実際のADは客付け業者へのインセンティブで、出せば決まりやすくはなるが決め打ちはできない。
// 1〜3ヶ月分から選び、**決まるまで毎月の客付け率を底上げし続ける**形にした。
// 3ヶ月分の方が明らかに早いが、1ヶ月分でも初月に決まることはある。
export const AD_PLANS = {
  1: { months: 1, bonus: 0.15, label: 'AD 1ヶ月分' },
  2: { months: 2, bonus: 0.30, label: 'AD 2ヶ月分' },
  3: { months: 3, bonus: 0.45, label: 'AD 3ヶ月分' },
};
export const AD_MAX_CHANCE = 0.90;        // どれだけ積んでも「確実」にはしない
export const SELF_FILL_AP = 30;           // 自主客付け1回の行動力
export const SELF_FILL_BASE = 0.25;       // 自主客付けの上乗せ（基礎）
export const SELF_FILL_PER_LV = 0.05;     // 自主管理レベルごとの上乗せ

export function adCost(unit, adMonths) {
  const plan = AD_PLANS[adMonths];
  return plan ? unit.rent * plan.months : 0;
}
// その部屋に効いているADの上乗せ。決まるまで続く。
export function adBonusOf(unit) {
  const plan = unit?.ad ? AD_PLANS[unit.ad.months] : null;
  return plan ? plan.bonus : 0;
}
// 部屋ごとの最終的な客付け率。物件の魅力度＋ADの上乗せ＋難易度の下駄。
export function unitFillChance(property, unit, bonus = 0) {
  const base = naturalFillChance(property, unit);
  if (base <= 0) return 0;                // 使用不能・管理崩壊では何をしても決まらない
  return Math.min(AD_MAX_CHANCE, base + adBonusOf(unit) + bonus);
}

// 入居が決まったときの後始末。ADは役目を終えるのでここで外す。
// v8.6: ADを使わずに決まった回数を数える。「物件の力だけで決めた」を評価するため。
function moveIn(unit, state = null) {
  const withoutAd = !unit.ad;
  unit.occupied = true; unit.vacantMonths = 0; unit.tenantMonths = 0;
  unit.ad = null;
  unit.vacancyAlerted = false;
  if (state && withoutAd) {
    state.stats = state.stats || {};
    state.stats.adFreeFills = (state.stats.adFreeFills || 0) + 1;
  }
  return withoutAd;
}

// v8.6: 空室が長引いたときに「なぜ決まらないのか」を教える閾値。
export const LONG_VACANCY_MONTHS = 3;
export const APPEAL_ALERT_SCORE = 55;   // これ未満なら魅力度が原因だと判断する

// v8: bonus は難易度による下駄（初心者+10pt）。募集そのものが止まっている物件には効かせない。
// state を渡すと「ADなしで決まった回数」を stats に積む（実績バッジ用）。
export function naturalFillRoll(property, rng = Math.random, bonus = 0, state = null) {
  let filled = 0, adFree = 0;
  property.units.forEach(u => {
    if (!u.occupied) {
      if (u.needsRestore) { u.vacantMonths += 1; return; }   // v4: 原状回復前は埋まらない
      // v8.6: 魅力度（手入れ・バリューアップ・躯体・築年・広さ）で決まりやすさが変わる
      // v8.4: ADを出している部屋はここに上乗せが乗る（決まるまで毎月効く）
      if (rng() < unitFillChance(property, u, bonus)) {
        if (moveIn(u, state)) adFree += 1;
        filled += 1;
      } else u.vacantMonths += 1;
    }
  });
  return { property, filled, adFree };
}

// method: 'ad'（広告料を出す・adMonths で 1〜3 を指定）／'self'（自主客付け・行動力を使う）
// どちらも「その場で1回抽選し、外れても次月以降に持ち越す」。自主客付けは行動力の続く限り何度でも可。
export function fillVacancy(state, propertyId, unitIndex, method, rng = Math.random, opts = {}) {
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const u = p?.units?.[unitIndex];
  if (!u || u.occupied) return { state: s, success: false };
  // v4: 原状回復が済むまでは募集できない。費用・行動力を消費する前に弾く。
  if (u.needsRestore) return { state: s, success: false, reason: 'needsRestore' };
  // v8: 使用不能・管理崩壊の建物は、部屋が直っていても募集そのものが通らない。
  if (isCondemned(p)) return { state: s, success: false, reason: 'condemned' };
  if (careBandOf(p) === 'dead') return { state: s, success: false, reason: 'careCollapsed' };

  let chance, cost = 0;
  if (method === 'ad') {
    const adMonths = Number(opts.adMonths ?? 1);
    if (!AD_PLANS[adMonths]) return { state: s, success: false, reason: 'badPlan' };
    cost = adCost(u, adMonths);
    if (s.cash < cost) return { state: s, success: false, reason: 'noCash', cost };
    s.cash -= cost;
    // 出したADは「決まるまで」効き続ける。強い方で上書きし、弱いプランへの下げは行わない。
    if (!u.ad || u.ad.months < adMonths) u.ad = { months: adMonths, since: s.month };
    chance = unitFillChance(p, u);
  } else {
    if (s.actionPower < SELF_FILL_AP) return { state: s, success: false, reason: 'noActionPower' };
    s.actionPower -= SELF_FILL_AP;
    const lv = skillLevel(s.skills.selfmgmt.exp);
    s.skills.selfmgmt.exp += 10;
    chance = Math.min(AD_MAX_CHANCE,
      unitFillChance(p, u) + SELF_FILL_BASE + (lv - 1) * SELF_FILL_PER_LV);
  }
  const success = rng() < chance;
  if (success) moveIn(u, s);
  return { state: s, success, chance, cost, method };
}

// === v4: 現状回復（部屋ごと・退去起点）===
export const DIY_WORK_TOTAL = 100;       // DIY完了に必要な作業量（修繕・原状回復・価値UP共通）
export const RESTORE_DIY_AP = 10;        // DIY1回の行動力
export const RESTORE_DIY_STEP = 25;      // DIY1回の基準作業量（スキルで増える）
export const DIY_MATERIAL_RATE = 0.30;   // DIYの材料費 ＝ 業者見積の30%

// 自主管理スキルが高いほどDIY1回で進む量が増える
// v8: qualityMult はミニゲームの出来ばえ。DIY_QUALITY を参照。
export function diyWorkStep(base, state, qualityMult = 1) {
  return base * (1 + skillLevel(state.skills.selfmgmt.exp) * 0.12) * qualityMult;
}

// v8: DIYの出来ばえ。基準ステップ25に対して ノーミス35 ／ ミス1回まで25 ／ ミス2回以上18 になる倍率。
// 失敗しても進むこと（＝詰まないこと）を保証しつつ、上手いほどセッション数が減るようにしてある。
export const DIY_QUALITY = { perfect: 1.4, good: 1.0, sloppy: 0.72 };
export function diyQualityOf(misses) {
  return misses === 0 ? DIY_QUALITY.perfect : misses <= 1 ? DIY_QUALITY.good : DIY_QUALITY.sloppy;
}

// v8.9: 「あと何回DIYが必要か」の目安。実際の回数はミニゲームの出来ばえ(quality)次第で前後するため、
// 平均的な出来（good=1.0）を基準にした見込みとして計算する（現状回復・日常メンテ・価値UP共通で使う）。
export function estimateDiySessionsLeft(done, diyStepBase, state) {
  const remain = DIY_WORK_TOTAL - (done || 0);
  if (remain <= 0) return 0;
  const perSession = diyWorkStep(diyStepBase, state, DIY_QUALITY.good);
  return Math.max(1, Math.ceil(remain / perSession));
}

// 原状回復費: 家賃ベース。修繕度が低いほど高く、長期入居ほど高い（10年で約2倍）。
export function restoreCost(property, unit) {
  const gap = Math.max(0, 100 - property.repairState);
  const wear = 2 + gap / 50;
  const tenure = 1 + (unit.tenantMonths || 0) / 120;
  return Math.max(50_000, Math.round(unit.rent * wear * tenure / 1000) * 1000);
}

// 原状回復に着手する。diy=true は材料費のみで作業量を貯める方式、false は業者へ発注（借入可）。
export function startRestore(state, propertyId, unitIndex, opts = {}) {
  const p0 = state.properties.find(x => x.id === propertyId);
  const u0 = p0 && p0.units[unitIndex];
  if (!p0 || !u0 || !u0.needsRestore || u0.restoreJob) return { state, started: false };
  // v6: おまかせ契約中は原状回復も業者任せになる（そのぶん自動で発注される）
  if (opts.diy && p0.autoManage) return { state, started: false, reason: 'autoManaged' };
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const u = p.units[unitIndex];
  const cost = restoreCost(p, u);

  if (opts.diy) {
    const material = Math.round(cost * DIY_MATERIAL_RATE);
    // 材料費は着手時（作業量0）の1回だけ。以降のタップは行動力のみ。
    if ((u.restoreProgress || 0) <= 0) s.cash -= material;
    s.actionPower -= RESTORE_DIY_AP;
    u.restoreProgress = (u.restoreProgress || 0) + diyWorkStep(RESTORE_DIY_STEP, s, opts.qualityMult);
    s.skills.selfmgmt.exp += 10;
    const done = u.restoreProgress >= DIY_WORK_TOTAL;
    if (done) { u.needsRestore = false; u.restoreProgress = 0; }
    return { state: s, started: true, diy: true, cost: material, done };
  }

  if (opts.financed && !canUseReformLoan(cost, s.creditScore)) return { state, started: false, reason: 'reformLoanBlocked' };
  s.actionPower -= 5;
  let loanAmount = 0;
  if (opts.financed) {
    loanAmount = reformLoanAmount(cost, s.creditScore);
    s.cash -= (cost - loanAmount);
    p.reformLoans = p.reformLoans || [];
    p.reformLoans.push({ principal: loanAmount, rate: reformLoanRateFor(cost), years: CONFIG.reformLoanYears, monthsPaid: 0 });
  } else {
    s.cash -= cost;
  }
  u.restoreJob = { monthsTotal: 1, monthsLeft: 1 };
  return { state: s, started: true, diy: false, cost, loanAmount, financed: !!opts.financed, months: 1 };
}

// === v4/v6: 修繕は「日常メンテ・小規模補修」と「大規模修繕」の2種類 ===
// v6: 両者は別々のゲージを動かす。日常メンテは 🧹手入れ（careState）を100%まで戻し、
// 大規模修繕は 🏚躯体（repairState）を100%まで戻す。清掃・草刈りで躯体が回復することはない。
// v4にあった「日常メンテは修繕度70%が上限」という対症療法のキャップは、ゲージが分かれたので撤廃した。
export const REPAIR_KINDS = {
  maint: { label: '日常メンテ・小規模補修', detail: '清掃・草刈り・部分クロス張替',
    gauge: 'care',       diyable: true,  cap: 100, diyAp: 10, diyStep: 25 },
  large: { label: '大規模修繕', detail: '外壁・屋根・防水（足場）',
    gauge: 'structural', diyable: false, cap: 100, diyAp: 0, diyStep: 0,
    blockedReason: '足場の設置と高所・構造の作業が必要なため、業者にしか頼めません' },
  // v8: 管理崩壊（手入れ0）からの復旧専用。日常メンテで戻せてしまうと
  // 「0まで放置してから一度で直す」のが最安になり、予防する動機が消える。
  deepclean: { label: '特別清掃・原状復旧', detail: '害虫駆除・残置物撤去・全面清掃',
    gauge: 'care',       diyable: false, cap: 100, diyAp: 0, diyStep: 0,
    blockedReason: '手に負えない状態まで荒れているため、専門業者にしか頼めません' },
};

// その工事種別を、いまこの物件で選べるか。
// 手入れ0のときは deepclean だけ、それ以外のときは maint だけを出す（両方は出さない）。
export function repairKindAvailable(property, kind) {
  const collapsed = careBandOf(property) === 'dead';
  if (kind === 'deepclean') return collapsed;
  if (kind === 'maint') return !collapsed;
  return true;
}
export const DEEPCLEAN_COST_MULT = 2;   // 特別清掃は日常メンテ見積の2倍

// 工事種別が対象とするゲージの現在値
export function repairGaugeValue(property, kind) {
  return REPAIR_KINDS[kind]?.gauge === 'care' ? (property.careState ?? 100) : (property.repairState ?? 100);
}

// 工事種別が対象とするゲージへ値を書き込む
function setRepairGauge(property, kind, value) {
  if (REPAIR_KINDS[kind]?.gauge === 'care') property.careState = value;
  else property.repairState = value;
}

// v5.1: 修繕費は「建物の規模（戸数・構造）」で決める。物件価格には依存させない。
// 従来は price×係数だったため、40万円の訳あり戸建ての大規模修繕が5万円で直る／
// RCマンションの清掃が630万円になる、といった非現実が出ていた。実際の工事費は
// 足場・外壁面積・戸数といった物理量で決まり、市場価格とは無関係。
const LARGE_SCAFFOLD    = { '木造': 300_000, 'S': 500_000, 'RC': 700_000 };  // 足場・共通仮設の基本額
const LARGE_SCAFFOLD_PU = 60_000;                                            // 戸数ぶんの足場加算
const LARGE_PER_UNIT    = { '木造': 700_000, 'S': 900_000, 'RC': 1_150_000 };// 外壁・屋根・防水の1戸あたり材工
const MAINT_PER_UNIT    = 25_000;   // 日常メンテ（清掃・草刈り・部分クロス）の1戸あたり
const MAINT_CAP         = 400_000;  // 小工事なので上限を低く（清掃が数百万円になる非現実を防ぐ）
const MAINT_FLOOR       = 30_000;

// 工事種別ごとの業者見積もり（建物規模ベース）
export function repairCost(property, kind) {
  // v6: 見積は「その工事が直すゲージ」のギャップで決まる。
  // 日常メンテの額を躯体の傷み具合で決めていたのが v5 までの誤りだった。
  const gap = Math.max(0, 100 - repairGaugeValue(property, kind));
  const units = property.units.length;
  const st = property.structure;
  if (kind === 'maint' || kind === 'deepclean') {
    const raw = Math.round(MAINT_PER_UNIT * units * gap / 100 / 1000) * 1000;
    const base = Math.min(MAINT_CAP, Math.max(MAINT_FLOOR, raw));
    // v8: 特別清掃は日常メンテの2倍。0まで放置した分だけ余計に払う。
    return kind === 'deepclean' ? base * DEEPCLEAN_COST_MULT : base;
  }
  if (kind === 'large') {
    const scaffold = (LARGE_SCAFFOLD[st] ?? 400_000) + LARGE_SCAFFOLD_PU * units;
    const material = (LARGE_PER_UNIT[st] ?? 800_000) * units * (gap / 100);
    const base = Math.round((scaffold + material) / 10000) * 10000;
    // v8: 使用不能まで落ちた建物の復旧は割増。傷む前に直した方が安い、を成立させる。
    return isCondemned(property) ? Math.round(base * CONDEMNED_COST_MULT) : base;
  }
  return 0;
}

// 大規模修繕の工期は建物規模で決まる（足場を伴うため戸数が多いほど長い）。
// v8: 使用不能からの復旧は解体・下地からやり直すぶん1ヶ月余計にかかる。
export function largeRepairMonths(property) {
  const u = property.units.length;
  const base = u <= 1 ? 1 : u <= 8 ? 2 : u <= 16 ? 3 : 4;
  return isCondemned(property) ? base + CONDEMNED_EXTRA_MONTHS : base;
}
// 工事の工期（日常メンテ・特別清掃は常に1ヶ月・大規模修繕は規模ベース）。
export function repairJobMonths(property, kind) {
  return kind === 'large' ? largeRepairMonths(property) : 1;
}

// 大規模修繕の工事内容は建物種別で異なる。区分は建物外壁ではなく専有部（室内）を直す。
export function repairDetail(property, kind) {
  if (kind !== 'large') return REPAIR_KINDS[kind]?.detail || '';
  const isKubun = property.genreKey === 'kubun' || property.genreKey === 'w_kubun';
  return isKubun ? '専有部フルリフォーム（内装・設備）' : '外壁・屋根・防水（足場）';
}

// 工事後に到達する値（v6: 日常メンテは手入れを、大規模修繕は躯体を、それぞれ100%まで戻す）
export function repairResultState(property, kind) {
  const k = REPAIR_KINDS[kind];
  if (!k) return repairGaugeValue(property, kind);
  return k.cap;
}

// 修繕に着手する。diy=true は材料費のみで作業量を貯める方式、false は業者へ発注（借入可）。
export function startRepair(state, propertyId, kind, opts = {}) {
  const p0 = state.properties.find(x => x.id === propertyId);
  const k = REPAIR_KINDS[kind];
  if (!p0 || !k || p0.repairJob) return { state, started: false, reason: 'busy' };
  // v8: 手入れ0のときは日常メンテを封じ、特別清掃だけを通す（逆もまた然り）。
  if (!repairKindAvailable(p0, kind)) return { state, started: false, reason: 'notAvailable' };
  if (opts.diy && !k.diyable) return { state, started: false, reason: 'diyNotAllowed' };
  // v6: おまかせ契約中は工事がすべて業者任せになる（自分で手を動かす余地がなくなるのが対価）
  if (opts.diy && p0.autoManage) return { state, started: false, reason: 'autoManaged' };
  if (repairResultState(p0, kind) <= repairGaugeValue(p0, kind)) return { state, started: false, reason: 'noGain' };

  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const cost = repairCost(p, kind);

  if (opts.diy) {
    const material = Math.round(cost * DIY_MATERIAL_RATE);
    const prog = (p.diyProgress && p.diyProgress.kind === kind) ? p.diyProgress : null;
    if (!prog) s.cash -= material;                       // 材料費は着手時の1回だけ
    s.actionPower -= k.diyAp;
    const done = (prog ? prog.done : 0) + diyWorkStep(k.diyStep, s, opts.qualityMult);
    s.skills.selfmgmt.exp += 10;
    if (done >= DIY_WORK_TOTAL) {
      // DIYできるのは日常メンテ（🧹手入れ）だけ。躯体は足場が要るので業者にしか直せない。
      // 訳あり物件の修繕実績は大規模修繕（業者）の完了時に記録される。
      setRepairGauge(p, kind, repairResultState(p, kind));
      p.diyProgress = null;
      return { state: s, started: true, diy: true, cost: material, done: true };
    }
    p.diyProgress = { kind, planKey: null, done };
    return { state: s, started: true, diy: true, cost: prog ? 0 : material, done: false };
  }

  if (opts.financed && !canUseReformLoan(cost, s.creditScore)) return { state, started: false, reason: 'reformLoanBlocked' };
  s.actionPower -= 5;
  let loanAmount = 0;
  if (opts.financed) {
    loanAmount = reformLoanAmount(cost, s.creditScore);
    s.cash -= (cost - loanAmount);
    p.reformLoans = p.reformLoans || [];
    p.reformLoans.push({ principal: loanAmount, rate: reformLoanRateFor(cost), years: CONFIG.reformLoanYears, monthsPaid: 0 });
  } else {
    s.cash -= cost;
  }
  const monthsTotal = repairJobMonths(p, kind);
  p.repairJob = { kind, monthsTotal, monthsLeft: monthsTotal, startState: repairGaugeValue(p, kind) };
  return { state: s, started: true, diy: false, cost, loanAmount, financed: !!opts.financed, monthsTotal };
}

// === v6: 管理会社おまかせ契約 ===
// 手入れの維持と原状回復の発注を自動化する代わりに、工事費に手数料が乗り、DIYができなくなる。
// v4の「金 vs 時間・手間」を最も素直に形にしたもの。大規模修繕・価値UPは金額が大きいので対象外。
export const AUTO_MANAGE_MARKUP = 1.1;     // おまかせ工事の割増（自動で任せるぶんのマージン）
export const AUTO_MANAGE_CARE_FLOOR = 70;  // 手入れがこの値を下回ると自動で日常メンテを発注する

export function autoManageCost(cost) { return Math.round(cost * AUTO_MANAGE_MARKUP); }

export function setAutoManage(state, propertyId, on) {
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  if (!p) return { state: s, changed: false };
  p.autoManage = !!on;
  // 契約した時点で手入れが荒れていれば、その場で初回の工事が走る（＝契約と同時に出費が出る）
  if (p.autoManage && (p.careState ?? 100) < AUTO_MANAGE_CARE_FLOOR && !p.repairJob) {
    const cost = autoManageCost(repairCost(p, 'maint'));
    if (s.cash >= cost) {
      s.cash -= cost;
      p.repairJob = { kind: 'maint', monthsTotal: repairJobMonths(p, 'maint'), monthsLeft: repairJobMonths(p, 'maint'),
        startState: p.careState, auto: true };
      return { state: s, changed: true, started: true, cost };
    }
    return { state: s, changed: true, started: false, reason: 'noCash', cost };
  }
  return { state: s, changed: true, started: false };
}

// v4: 旧 repairTier / repairTierInfo / doDIY は廃止。
// ギャップで小/中/大を自動判定する方式をやめ、プレイヤーが工事内容（maint / large）を選び、
// 実施方法（DIY / 業者）も選ぶ REPAIR_KINDS + startRepair に置き換えた。

export function totalDebt(state) {
  return Math.round((state.properties || []).reduce((t, p) => t
    + (p.loan ? remainingPrincipal(p.loan.principal, p.loan.rate, p.loan.years, p.loan.monthsPaid) : 0)
    + reformLoansRemaining(p), 0));
}

// v4: リフォームローンは1物件に複数本。残債の合計を返す。
export function reformLoansRemaining(p) {
  return Math.round((p.reformLoans || []).reduce((t, l) =>
    t + remainingPrincipal(l.principal, l.rate, l.years, l.monthsPaid), 0));
}

// === 業者への修繕依頼（DIYより高コストだが一括で修繕度100・リフォームローン利用可）===
// v5.1: 大規模修繕(large)と同じ規模ベースの見積もりを使う（旧APIの互換維持のため薄い委譲）。
export function professionalRepairCost(property) {
  return repairCost(property, 'large');
}

export function reformLoanAmount(cost, creditScore) {
  const ratio = Math.max(0.3, Math.min(0.9, creditScore / 100));
  return Math.round(cost * ratio / 10000) * 10000;
}

// v8.20: リフォームローンは実務同様、あまりに少額な工事（客付け・清掃程度）では
// 金融機関が取り扱わず、信用力が基準未満の借り手にも組めない。少額工事・信用不足の
// どちらも現金払いのみとする（本体ローンと同じ CONFIG.minCreditToFinance を流用）。
export const REFORM_LOAN_MIN_COST = 300_000;
export function canUseReformLoan(cost, creditScore) {
  return cost >= REFORM_LOAN_MIN_COST && creditScore >= CONFIG.minCreditToFinance;
}

// v8.20: リフォームローンの金利は工事金額の帯で相場に連動させる。小口の内装・原状回復は
// 無担保ローン相当で高め、大規模修繕・フルリノベは担保付き融資に近い低金利になるのが実勢。
export const REFORM_LOAN_RATE_BANDS = [
  [500_000, 0.040],
  [3_000_000, 0.035],
  [15_000_000, 0.025],
  [Infinity, 0.018],
];
export function reformLoanRateFor(cost) {
  for (const [limit, rate] of REFORM_LOAN_RATE_BANDS) if (cost <= limit) return rate;
  return REFORM_LOAN_RATE_BANDS.at(-1)[1];
}

// v3.1: 工期は見積金額で決まる（安い工事は早い・高い工事は長い）。月次回復もこの工期で按分される。
export function repairMonthsForCost(cost) {
  return cost < 500_000 ? 1 : cost < 3_000_000 ? 2 : cost < 15_000_000 ? 3 : 4;
}

// v3: 業者修繕は即時完了せず「修繕中」を経て翌月以降に回復する。発注手続きは行動力5。
export function startProfessionalRepair(state, propertyId, financed = false) {
  const p0 = state.properties.find(x => x.id === propertyId);
  if (!p0 || p0.repairJob) return { state, started: false, cost: 0, loanAmount: 0, financed: false };
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const cost = professionalRepairCost(p);
  // v4: 工事ごとに借りられるよう複数本を許可（配列化で残債・返済を本数ぶん正しく処理する）
  const canFinance = !!financed;
  if (canFinance && !canUseReformLoan(cost, s.creditScore)) return { state, started: false, cost: 0, loanAmount: 0, financed: false, reason: 'reformLoanBlocked' };
  s.actionPower -= 5;
  let loanAmount = 0;
  if (canFinance) {
    loanAmount = reformLoanAmount(cost, s.creditScore);
    s.cash -= (cost - loanAmount);
    p.reformLoans = p.reformLoans || [];
    p.reformLoans.push({ principal: loanAmount, rate: reformLoanRateFor(cost), years: CONFIG.reformLoanYears, monthsPaid: 0 });
  } else {
    s.cash -= cost;
  }
  const monthsTotal = largeRepairMonths(p);
  p.repairJob = { monthsTotal, monthsLeft: monthsTotal, startState: p.repairState };
  return { state: s, started: true, cost, loanAmount, financed: canFinance, monthsTotal };
}

// === v3.11: バリューアップ投資（設備更新・リノベで家賃自体を上げる）===
// v4: 各プランに diyable / diyAp / diyStep を持たせ、修繕と同じ「DIY か 業者か」を選べるようにした。
// フルリノベは間取り変更に確認申請が要るため業者のみ。
export const VALUE_UP_PLANS = {
  light:    { label: '設備更新（エアコン・建具・照明）',   rentMult: 1.06, months: 1, costRate: 0.6,
    diyable: true,  diyAp: 15, diyStep: 20 },
  standard: { label: '水回り刷新・内装フルチェンジ',       rentMult: 1.12, months: 2, costRate: 1.2,
    diyable: true,  diyAp: 15, diyStep: 12.5 },
  full:     { label: 'フルリノベーション・間取り改善',     rentMult: 1.20, months: 3, costRate: 2.0,
    diyable: false, diyAp: 0,  diyStep: 0,
    blockedReason: '間取り変更には確認申請が必要なため、業者にしか頼めません' },
};
export const VALUE_UP_MAX_LEVEL = 2;   // 1物件につき2回まで

// バリューアップ費用は年間家賃 × プラン係数（最低30万円）
export function valueUpCost(property, planKey) {
  const plan = VALUE_UP_PLANS[planKey];
  if (!plan) return 0;
  return Math.max(300000, Math.round(gpiAnnual(property) * plan.costRate / 10000) * 10000);
}

// バリューアップを発注。工期を経て家賃・時価が上がる（修繕とは別枠のjob）。
export function startValueUp(state, propertyId, planKey, opts = {}) {
  const p0 = state.properties.find(x => x.id === propertyId);
  const plan = VALUE_UP_PLANS[planKey];
  if (!p0 || !plan || p0.repairJob || p0.valueUpJob) return { state, started: false, reason: 'busy' };
  if ((p0.valueUpLevel || 0) >= VALUE_UP_MAX_LEVEL) return { state, started: false, reason: 'maxed' };
  if (opts.diy && !plan.diyable) return { state, started: false, reason: 'diyNotAllowed' };
  const cost = valueUpCost(p0, planKey);

  if (opts.diy) {
    const material = Math.round(cost * DIY_MATERIAL_RATE);
    const prog = (p0.diyProgress && p0.diyProgress.kind === 'valueup' && p0.diyProgress.planKey === planKey)
      ? p0.diyProgress : null;
    if (!prog && state.cash < material) return { state, started: false, reason: 'cash' };
    const s = structuredClone(state);
    const p = s.properties.find(x => x.id === propertyId);
    if (!prog) s.cash -= material;                       // 材料費は着手時の1回だけ
    s.actionPower -= plan.diyAp;
    const done = (prog ? prog.done : 0) + diyWorkStep(plan.diyStep, s, opts.qualityMult);
    s.skills.selfmgmt.exp += 10;
    if (done >= DIY_WORK_TOTAL) {
      applyValueUp(p, plan.rentMult);
      p.diyProgress = null;
      return { state: s, started: true, diy: true, cost: prog ? 0 : material, done: true };
    }
    p.diyProgress = { kind: 'valueup', planKey, done };
    return { state: s, started: true, diy: true, cost: prog ? 0 : material, done: false };
  }

  if (!opts.financed && state.cash < cost) return { state, started: false, reason: 'cash' };
  if (opts.financed && !canUseReformLoan(cost, state.creditScore)) return { state, started: false, reason: 'reformLoanBlocked' };
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  s.actionPower -= 5;
  let loanAmount = 0;
  if (opts.financed) {
    loanAmount = reformLoanAmount(cost, s.creditScore);
    s.cash -= (cost - loanAmount);
    p.reformLoans = p.reformLoans || [];
    p.reformLoans.push({ principal: loanAmount, rate: reformLoanRateFor(cost), years: CONFIG.reformLoanYears, monthsPaid: 0 });
  } else {
    s.cash -= cost;
  }
  p.valueUpJob = { monthsTotal: plan.months, monthsLeft: plan.months, rentMult: plan.rentMult, label: plan.label };
