// v8.21: LTV・DSCRは否決理由に埋もれさせず、承認・否決を問わず銀行名の隣に常時表示する
// （範囲内でも数値を出しておくことで、判断材料になる）。支払い方法画面（showPayment）と
// 物件詳細の融資タブ（bankReviewList）の両方で使う共通部品。
function metricsBadge(r, muted) {
  const ltvOk = r.ltv <= r.ltvMax, dscrOk = r.dscr >= r.dscrMin;
  const tone = (ok) => muted ? '' : ok ? 'text-slate-500' : 'text-red-600 font-bold';
  // v11.4: 「65/90%」という分数風の表記は、どちらが良い方向か分からず読み取りにくかった。
  // LTVは低いほど安全（実際値＜上限）・DSCRは高いほど安全（実際値＞下限）という向きを
  // 記号自体に持たせ、実際の値がその向きを満たしているかで＜／＞を動的に選ぶ
  // （満たしていれば向き通り、満たしていなければ逆向きの記号になり赤字と揃って一目で分かる）。
  const ltvSym = ltvOk ? '＜' : '＞';
  const dscrSym = dscrOk ? '＞' : '＜';
  return `<span class="text-[10px] font-normal shrink-0 whitespace-nowrap">
    <span class="${tone(ltvOk)}">${term('ltv')}${Math.round(r.ltv * 100)}%${ltvSym}${Math.round(r.ltvMax * 100)}%</span>
    <span class="${tone(dscrOk)}">${term('dscr')}${r.dscr.toFixed(2)}${dscrSym}${r.dscrMin}</span></span>`;
}

// v11.6: 融資タブはあくまで下見用のプレビューなので、可否は○×とLTV/DSCR・条件の数値だけで
// 示す。色分け・否決理由・借りる操作は支払い方法画面（showPayment）側だけの役目にする。
function bankReviewList(rs) {
  return `<div class="space-y-1">${rs.map(r => r.approved
    ? `<div class="border rounded p-2"><div class="flex items-center gap-2"><b class="min-w-0">◯ ${r.label}</b>${metricsBadge(r, true)}</div><div class="text-xs">金利${(r.terms.rate * 100).toFixed(2)}%・${r.terms.years}年・月返済${L.yen(r.terms.monthlyPay)}・要${term('own_cash', '自己資金')}${L.yen(r.terms.requiredCash)}</div></div>`
    : `<div class="border rounded p-2"><div class="flex items-center gap-2"><b class="min-w-0">✕ ${r.label}</b>${metricsBadge(r, true)}</div></div>`).join('')}</div>`;
}

// v8: 募集が建物ごと止まっている状態は、費用・行動力を払う前に理由を出して止める。
const FILL_BLOCKED = {
  condemned: '躯体0%で使用不能です。大規模修繕が完了するまで募集できません。',
  careCollapsed: '管理崩壊の状態です。「特別清掃」で手入れを戻すまで募集できません。',
  needsRestore: 'この部屋は原状回復が済んでいません。',
};

// v8.5: 空室1件につきボタンは「📣 入居者を募集」の1つだけ。
// AD（1〜3ヶ月分）と自主客付けの選択は、押した先の画面でまとめて行う。
function wireFillButtons(body, p, from) {
  body.querySelectorAll('.fill-open').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.i);
    const nm = `${i + 1}号室`;
    const done = () => { save(); render(); openDetail(p.id, from); };
    openRecruitPicker(p, i,
      // ADを出す（払っても確定はせず、決まるまで毎月効き続ける）
      (adMonths) => {
        const r = L.fillVacancy(state, p.id, i, 'ad', Math.random, { adMonths });
        if (FILL_BLOCKED[r.reason]) { alert(FILL_BLOCKED[r.reason]); return; }
        if (r.reason === 'noCash') { alert(`現金が足りません（必要 ${L.yen(r.cost)}）`); return; }
        state = r.state;
        pushLog(r.success
          ? `${nm} にAD${adMonths}ヶ月分（${L.yen(r.cost)}）を出し、その月のうちに入居が決まった！`
          : `${nm} にAD${adMonths}ヶ月分（${L.yen(r.cost)}）を出した（今月は決まらず・掲出は継続中）`);
        done();
      },
      // 自主客付け（行動力の続く限り何度でも）
      () => {
        const r = L.fillVacancy(state, p.id, i, 'self', Math.random);
        if (FILL_BLOCKED[r.reason]) { alert(FILL_BLOCKED[r.reason]); return; }
        if (r.reason === 'noActionPower') { alert('行動力が足りません'); return; }
        state = r.state;
        pushLog(r.success
          ? `${nm} の自主客付けに成功！（自主管理+10 EXP）`
          : `${nm} は内見はあったが決まらず…（自主管理+10 EXP・何度でも挑戦できる）`);
        done();
      });
  }));
}

// back を渡すと「← 戻る」を表示し、元のモーダルへ戻れる。
function openPurchase(propId, back) {
  const p = state.market.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('purchase-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  // v8.3: 一度断られた物件は満額も含めて買付できない（売主が態度を固めた状態）。
  const blocked = !!L.offerBlockedReason(p);
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <div class="flex justify-between items-center gap-2">
      ${back ? '<button id="of-back" class="text-xs text-navy">← 戻る</button>' : '<span></span>'}
      <button id="of-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div><h2 class="font-bold" style="font-size:clamp(0.75rem,4vw,0.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name || p.label} に買付を入れる（行動力-10）</h2><div class="text-[11px] text-slate-500">${p.label}</div></div>
    <div class="text-sm">売出価格: ${p.origPrice && p.price < p.origPrice ? `<span class="line-through text-slate-400">${L.yen(p.origPrice)}</span> → ` : ''}<b>${L.yen(p.price)}</b>${p.origPrice && p.price < p.origPrice ? ' <span class="text-[11px] bg-red-500 text-white rounded px-1">値下げ中</span>' : ''}${p.staleFlag ? ' <span class="text-[11px] bg-amber-500 text-white rounded px-1">売れ残り中</span>' : ''}</div>
    ${p.sellerUrgency ? `<div class="text-xs"><span class="bg-rose-100 text-rose-700 rounded px-1.5 py-0.5 font-bold">🏃 売り急ぎ</span> <span class="text-slate-600">${p.sellerUrgency.reason}そうだ</span></div>` : ''}
    ${blocked ? `<div class="rounded-lg bg-red-50 text-red-800 p-2 text-xs space-y-1">
      <div class="font-bold">🚫 この物件には買付を入れられません</div>
      <div>一度断られたため、売主が態度を固めています。<b>満額でも受け付けてもらえません。</b></div>
      <div class="text-red-700">次のどちらかで交渉が再開できます：<br>・売主が<b>値下げ</b>する<br>・<b>6ヶ月以上売れ残る</b>（現在 ${p.listedMonths ?? 0}ヶ月）</div>
    </div>` : ''}
    <button id="of-detail" class="w-full text-xs text-navy underline">📋 ${term('rentroll', 'レントロール')}・収支・融資の詳細を見る</button>
    <button id="of-full" class="w-full ${blocked ? 'bg-slate-300 text-slate-500' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} rounded py-2 text-sm font-bold" ${blocked ? 'disabled' : ''}>満額 ${L.yen(p.price)}${blocked ? '（受け付けてもらえない）' : '（必ず通る）'}</button>
    ${(!blocked && L.sashineBuffBonus(state) > 0) ? `<div class="text-[11px] bg-amber-100 text-amber-800 rounded px-2 py-1 font-bold">✨ 耳より情報：この指値だけ成功率 +${Math.round(L.sashineBuffBonus(state) * 100)}pt（使うと消えます）</div>` : ''}
    <div class="pt-1 border-t ${blocked ? 'opacity-50' : ''}">
      <div class="text-sm">${term('sashine', '指値')} <b id="of-cutpct">5%</b>引き → <b id="of-cutprice">${L.yen(Math.round(p.price * 0.95))}</b></div>
      <input id="of-slider" type="range" min="1" max="99" step="1" value="5" class="w-full" ${blocked ? 'disabled' : ''}>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-500 shrink-0">成功率</span>
        <div class="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden"><div id="of-gauge" class="h-2 rounded-full"></div></div>
        <span id="of-chance" class="font-bold w-12 text-right"></span></div>
      <div id="of-note" class="text-[11px] mt-1"></div>
      <button id="of-submit" class="w-full bg-navy text-white rounded py-2 text-sm font-bold mt-1" ${blocked ? 'disabled' : ''}>この指値で申し込む（行動力-10）</button>
    </div>
    <button id="of-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  // 詳細は買付モーダルを閉じてから開く（重なりで見えなくなる問題を解消）。詳細から買付へ「戻る」で戻れる。
  box.querySelector('#of-detail').addEventListener('click', () => { close(); openDetail(propId, 'market', () => openPurchase(propId, back)); });
  box.querySelector('#of-cancel').addEventListener('click', close);
  box.querySelector('#of-x').addEventListener('click', close);
  if (back) box.querySelector('#of-back').addEventListener('click', () => { close(); back(); });
  // v3.8: 指値スライダー。取次ライン内は通常交渉、超えると「ダメ元」（背景あり）／「非常識」（背景なし・評判リスク）に変化
  const lv = L.skillLevel(state.skills.negotiation.exp);
  const line = L.maxBrokerCut(p, lv);
  const slider = box.querySelector('#of-slider');
  const submit = box.querySelector('#of-submit');
  const noteEl = box.querySelector('#of-note');
  const gauge = box.querySelector('#of-gauge');
  const update = () => {
    const cut = Number(slider.value) / 100;
    const chance = L.offerSuccessChance(p, cut, lv);
    // v8.9: 取次ラインを超えた鬼指値ゾーンでは、背景あり物件ほど内部の成功率がわずかに
    // 上振れすることがある（ダメ元の柔軟度）。それは判定にだけ使う内部情報にとどめ、
    // 表示は「指値を深くするほど成功率が上がって見える」逆転が起きないよう常に1%で固定する。
    const displayChance = cut > line ? 0.01 : chance;
    box.querySelector('#of-cutpct').textContent = `${slider.value}%`;
    box.querySelector('#of-cutprice').textContent = L.yen(Math.max(10000, Math.round(p.price * (1 - cut))));
    box.querySelector('#of-chance').textContent = `${Math.round(displayChance * 100)}%`;
    gauge.style.width = `${Math.max(3, Math.round(displayChance * 100))}%`;
    gauge.style.background = displayChance >= 0.5 ? '#059669' : displayChance >= 0.2 ? '#f59e0b' : '#dc2626';
    if (cut <= line) {
      // 用語ヘルプのspanを出すため innerHTML で入れる（中身は自前の文字列のみ）
      noteEl.innerHTML = `🏢「頑張って交渉します」（${term('toritsugi', '取次ライン')}: ${Math.round(line * 100)}%引きまで）`;
      noteEl.className = 'text-[11px] mt-1 text-slate-600';
      submit.textContent = 'この指値で申し込む（行動力-10）';
      submit.className = 'w-full bg-navy text-white rounded py-2 text-sm font-bold mt-1';
    } else if (L.hasSellerBackground(p)) {
      noteEl.textContent = '🏢「売主さんには事情があるようです。ダメ元で当たってみます…」（失敗してもペナルティなし）';
      noteEl.className = 'text-[11px] mt-1 text-amber-700 font-bold';
      submit.textContent = '🙏 ダメ元で打診してもらう（行動力-10）';
      submit.className = 'w-full bg-amber-500 hover:bg-amber-600 text-white rounded py-2 text-sm font-bold mt-1';
    } else {
      noteEl.textContent = '🏢「この価格はさすがに…無謀な指値は評判に関わりますよ」（失敗すると交渉力の評判ダウン）';
      noteEl.className = 'text-[11px] mt-1 text-red-600 font-bold';
      submit.textContent = '⚠️ 非常識な指値を強行する（行動力-10）';
      submit.className = 'w-full bg-red-600 hover:bg-red-700 text-white rounded py-2 text-sm font-bold mt-1';
    }
  };
  slider.addEventListener('input', update);
  update();
  const doOffer = (cut) => {
    if (state.actionPower < 10) { alert('行動力が足りません'); return; }
    const r = L.makeOffer(state, propId, cut, Math.random);
    // v8.3: 断られた物件は logic 側で弾かれる。行動力を使う演出に入る前に止める。
    if (r.blocked) {
      alert('この物件には買付を入れられません。\n一度断られているため、売主が値下げするか、6ヶ月以上売れ残るまで交渉を再開できません。');
      close(); return;
    }
    state = r.state; save();
    // 買付は一番ドキドキするポイント。結果を即出さず「交渉中…」の溜め演出を挟んでから発表する。
    playOfferSuspense(r.accepted, cut, () => {
      if (!r.accepted) {
        pushLog(r.penalized
          ? `${p.label} への無謀な指値で評判を落とした…（交渉-15 EXP・売主が態度を固めた）`
          : `${p.label} への指値は断られた…（値下げか6ヶ月の売れ残りまで買付できない）`);
        render(); close();
        if (r.counterProposal) showCounterProposal(r.counterProposal);
        return;
      }
      pushLog(`${p.label} の買付が通った！（${L.yen(r.price)}・交渉+${5 + Math.round(cut * 100)} EXP）`);
      showPayment(propId, r.price, close);
      tutMaybeAdvance('offer');
    });
  };
  box.querySelector('#of-full').addEventListener('click', () => doOffer(0));
  submit.addEventListener('click', () => doOffer(Number(slider.value) / 100));
}

// v3.8: 鬼指値で断られたときの「逆提案」。不動産会社が予算感に合う激安寄りの物件を紹介してくれる。
function showCounterProposal(cp) {
  const m = document.getElementById('purchase-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-center"><h2 class="font-bold">🙋 不動産会社からの逆提案</h2><button id="cp-x" class="text-slate-400 text-xl leading-none">✕</button></div>
    <div class="text-sm text-slate-700 bg-slate-50 rounded-lg p-3">「その予算感でしたら…実は<b>こういう物件</b>がありますよ。訳ありですが、価格は頑張れます」</div>
    <div class="flex items-center gap-2 border rounded-lg p-2">${renderBuildingSVG(cp, 'w-14 h-14')}
      <div class="min-w-0 flex-1 text-left">
        <div class="font-bold truncate">${cp.name || cp.label}</div>
        <div class="text-[11px] text-slate-500">${cp.label}</div>
        <div class="text-sm"><span class="line-through text-slate-400">${L.yen(cp.origPrice)}</span> → <b class="text-emerald-700">${L.yen(cp.price)}</b>・表面${(cp.grossYield * 100).toFixed(1)}%</div>
        ${cp.junkFlags?.length ? `<div class="text-[11px] text-red-600 font-bold">訳あり: ${cp.junkFlags.join('・')}</div>` : ''}
        ${cp.sellerUrgency ? `<div class="text-[11px] text-rose-600 font-bold">🏃 売り急ぎ: ${cp.sellerUrgency.reason}そうだ</div>` : ''}
      </div></div>
    <button id="cp-detail" class="w-full bg-navy text-white rounded-lg py-2 text-sm font-bold">📋 詳細を見る</button>
    <button id="cp-later" class="w-full text-slate-500 text-sm">あとで（🗂️市場一覧に追加されています）</button></div>`);
  m.appendChild(box);
  box.querySelector('#cp-x').addEventListener('click', close);
  box.querySelector('#cp-later').addEventListener('click', close);
  box.querySelector('#cp-detail').addEventListener('click', () => { close(); openDetail(cp.id, 'market'); });
}

// 買付の結果発表: 交渉中の溜め（ドラムロール＋鼓動）→ ドラマチックな成立/残念の発表 → done()。
// v3.2: 買付の結果発表をリッチに。暗転＋金色の鼓動リング→成立は放射バースト＋判子風「成立」スタンプ、
// 見送りは画面シェイク＋「見送り」スタンプ。コスト・確率などのロジックは一切変更しない。
function playOfferSuspense(accepted, cut, done) {
  const overlay = el(`<div class="fixed inset-0 z-[70] overflow-hidden flex items-center justify-center p-4" style="background:radial-gradient(ellipse at center, rgba(15,23,42,0.88) 0%, rgba(2,6,23,0.97) 100%);">
    <style>
      @keyframes ofs-ring { 0% { transform: scale(0.55); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes ofs-stamp { 0% { transform: scale(3.2) rotate(14deg); opacity: 0; } 55% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 75% { transform: scale(1.07) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
      @keyframes ofs-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-14px); } 40% { transform: translateX(11px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }
      @keyframes ofs-burst { 0% { transform: scale(0.2) rotate(0deg); opacity: 1; } 100% { transform: scale(1.8) rotate(22deg); opacity: 0; } }
      @keyframes ofs-float { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-110px) scale(1.4); opacity: 0; } }
    </style>
    <div id="ofs-rings" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>
    <div id="ofs-burst-layer" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>
    <div id="ofs-box" class="relative text-center text-white space-y-4">
      <div id="ofs-emoji" class="text-7xl" style="filter: drop-shadow(0 0 25px rgba(251,191,36,0.4));">🤝</div>
      <div id="ofs-title" class="text-2xl font-bold tracking-[0.3em]">交 渉 中<span id="ofs-dots" class="tracking-normal"></span></div>
      <div id="ofs-sub" class="text-sm opacity-80">${cut > 0 ? `指値 -${Math.round(cut * 100)}% で相手の返事を待っています…` : '満額で申し込み中…'}</div>
    </div></div>`);
  document.body.appendChild(overlay);
  const dotsEl = overlay.querySelector('#ofs-dots');
  const emojiEl = overlay.querySelector('#ofs-emoji');
  const titleEl = overlay.querySelector('#ofs-title');
  const subEl = overlay.querySelector('#ofs-sub');
  const ringsEl = overlay.querySelector('#ofs-rings');
  const boxEl = overlay.querySelector('#ofs-box');
  // 溜め: ドット点滅＋鼓動＋外へ広がる金色リング＋ドラムロール音
  let dots = 0;
  const dotTimer = setInterval(() => { dots = (dots + 1) % 4; dotsEl.textContent = '.'.repeat(dots); }, 300);
  emojiEl.style.transition = 'transform 0.35s ease-in-out';
  const beatTimer = setInterval(() => {
    emojiEl.style.transform = emojiEl.style.transform === 'scale(1.15)' ? 'scale(1)' : 'scale(1.15)';
  }, 350);
  const ringTimer = setInterval(() => {
    const ring = el(`<div class="absolute rounded-full" style="width:190px;height:190px;border:2px solid rgba(251,191,36,0.55);animation: ofs-ring 1.1s ease-out forwards;"></div>`);
    ringsEl.appendChild(ring);
    setTimeout(() => ring.remove(), 1150);
  }, 420);
  sfxDrumroll();
  const suspenseMs = cut > 0 ? 2000 : 1100;   // 満額は必ず通るので溜めは短め
  setTimeout(() => {
    clearInterval(dotTimer); clearInterval(beatTimer); clearInterval(ringTimer);
    ringsEl.innerHTML = '';
    if (accepted) {
      // 金色の放射バースト＋判子風「成立」スタンプ＋キラキラ
      overlay.querySelector('#ofs-burst-layer').appendChild(el(
        `<div style="width:460px;height:460px;border-radius:50%;background:repeating-conic-gradient(rgba(251,191,36,0.45) 0 10deg, transparent 10deg 30deg);animation: ofs-burst 0.9s ease-out forwards;"></div>`));
      emojiEl.remove();
      boxEl.insertBefore(el(
        `<div class="mx-auto w-44 h-44 rounded-full bg-white/95 shadow-2xl flex items-center justify-center" style="border:9px solid #dc2626;animation: ofs-stamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
          <span class="text-5xl font-black" style="color:#dc2626;">成立</span></div>`), titleEl);
      ['✨', '💴', '✨', '🎉', '💴', '✨'].forEach((c, i) => {
        const sp = el(`<div class="absolute text-3xl pointer-events-none" style="left:${18 + i * 13}%;top:58%;animation: ofs-float 1.2s ease-out ${i * 0.09}s forwards;opacity:0;">${c}</div>`);
        overlay.appendChild(sp);
      });
      titleEl.textContent = '買付 成立！';
      titleEl.className = 'text-3xl font-black tracking-widest';
      titleEl.style.background = 'linear-gradient(180deg,#fde68a,#f59e0b)';
      titleEl.style.webkitBackgroundClip = 'text';
      titleEl.style.backgroundClip = 'text';
      titleEl.style.color = 'transparent';
      subEl.textContent = '契約に進みましょう';
      sfxFanfare();
    } else {
      boxEl.style.animation = 'ofs-shake 0.5s';
      emojiEl.remove();
      boxEl.insertBefore(el(
        `<div class="mx-auto w-44 h-44 rounded-full flex items-center justify-center" style="border:9px solid #94a3b8;background:rgba(255,255,255,0.06);animation: ofs-stamp 0.55s cubic-bezier(.2,1.4,.4,1) forwards;">
          <span class="text-5xl font-black" style="color:#cbd5e1;">見送り</span></div>`), titleEl);
      titleEl.textContent = '残念…見送りに';
      titleEl.className = 'text-3xl font-bold text-red-400 tracking-widest';
      subEl.textContent = '値下げか売れ残りのタイミングで再指値できます';
      sfxFail();
    }
    setTimeout(() => { overlay.remove(); done(); }, accepted ? 1400 : 1600);
  }, suspenseMs);
}

// v8.5: 購入諸費用の内訳。売却側と同じ粒度で「何にいくら払うのか」を必ず見せる。
// loanAmount が0（現金購入）のときは抵当権設定と融資事務手数料の行が消える。
// v8.8: 内訳はプルダウン開閉式に。タイトル行（合計額）は常に見え、押すと内訳が開閉する。
function purchaseCostBox(p, price, loanAmount, title, id, open) {
  const c = L.purchaseCosts(p, price, loanAmount);
  // v8.20: 800万円以下は低廉物件特例で定額33万円（税込）。超えると速算式の階段
  // （400万以下4%+2万／それ以上3%+6万＋税、200万以下5%は特例に完全に包含されるため到達しない）。
  const brokerLabel = price <= L.LOW_PRICE_BROKER_FEE_MAX_PRICE ? '低廉物件特例・定額33万円（税込）'
    : price <= 4_000_000 ? '価格の4%＋2万＋税'
    : '価格の3%＋6万＋税';
  const row = (label, v) => v ? `<tr><td class="text-slate-600">${label}</td><td class="text-right">${L.yen(v)}</td></tr>` : '';
  return `<div class="rounded-lg bg-slate-50 p-1.5 text-xs">
    <button type="button" data-toggle="${id}" class="w-full flex justify-between font-bold ${open ? 'mb-1' : ''} text-left"><span>${open ? '▲' : '▶'} ${title}</span><span>${L.yen(c.total)}<span class="font-normal text-slate-500">（価格の${(c.total / price * 100).toFixed(1)}%）</span></span></button>
    <div class="${open ? '' : 'hidden'}">
    <table class="w-full">
      ${row(`${term('chukai_tesuryo', '仲介手数料')}（${brokerLabel}）`, c.broker)}
      ${row(term('inshizei', '印紙税'), c.stamp)}
      ${row(`${term('toroku_menkyozei', '登録免許税')}（所有権移転）`, c.regTransfer)}
      ${row(`${term('toroku_menkyozei', '登録免許税')}（抵当権設定）`, c.regMortgage)}
      ${c.acquisition ? `<tr><td class="text-slate-600"><button type="button" class="acq-toggle inline-flex items-center gap-0.5 text-left">
          <span class="inline-block transition-transform text-[9px]">▶</span>${term('fudosan_shutokuzei', '不動産取得税')}</button></td><td class="text-right">${L.yen(c.acquisition)}</td></tr>
        <tr class="acq-detail hidden bg-white"><td colspan="2" class="pl-3 py-1"><table class="w-full">${assessedBreakdownRows(p)}
          <tr><td class="text-slate-500">${term('fudosan_shutokuzei', '不動産取得税')} = 評価額 × ${(L.ACQUISITION_TAX_RATE * 100).toFixed(0)}%</td><td class="text-right font-bold">${L.yen(c.acquisition)}</td></tr>
        </table></td></tr>` : ''}
      ${row('司法書士報酬', c.scrivener)}
      ${row('融資事務手数料', c.loanFee)}
    </table>
    <div class="text-[10px] text-slate-500 mt-1">登録免許税と不動産取得税は${term('hyoka_gaku', '固定資産税評価額')}が基準です。指値や売り急ぎで価格が下がっても評価額は変わりません。${loanAmount > 0 ? '融資を使うと抵当権設定と事務手数料が上乗せされます。' : '現金購入なので抵当権設定と事務手数料はかかりません。'}</div>
    </div>
  </div>`;
}

// v8.7: 銀行が何を見て判断しているかを表に出す。
// v8.6までは「属性・信用度が基準未満」としか出ず、現金を積んでも変わらないので
// 打つ手が分からなかった。頭金を厚くすれば評価が上がることを、その場で見せる。
// v8.8: こちらもプルダウン開閉式（タイトル行の点数は常に見える）。
function creditSummaryBox(downRatio, open) {
  const cr = L.creditForReview(state, downRatio);
  const need = Object.values(L.BANKS).map(b => b.minCredit).sort((a, b) => a - b);
  const passes = need.filter(n => cr.total >= n).length;
  return `<div class="rounded-lg bg-slate-50 p-1.5 text-[11px]">
    <button type="button" data-toggle="credit" class="w-full flex justify-between font-bold text-left">
      <span>${open ? '▲' : '▶'} 🏦 銀行から見たあなたの評価</span>
      <span class="${passes >= 3 ? 'text-emerald-700' : passes >= 1 ? 'text-amber-600' : 'text-red-600'}">${cr.total} 点</span></button>
    <div class="${open ? '' : 'hidden'}">
    <div class="text-slate-600 mt-0.5">
      属性 <b>${cr.base}</b>${cr.penalty ? `<span class="text-red-600">（管理状態 -${cr.penalty}）</span>` : ''}
      ＋ ${term('shisan_haikei', '資産背景')} <b>${cr.asset}</b>
      ＋ ${term('own_cash', '自己資金')}の厚み <b>${cr.down}</b></div>
    ${cr.down < L.DOWN_PAYMENT_BONUS_MAX
      ? '<div class="text-navy mt-0.5">💡 頭金を厚くすると評価が上がり、通る銀行が増えます（80%で上限）</div>'
      : '<div class="text-emerald-700 mt-0.5">✅ 自己資金の評価は上限に達しています</div>'}
    <div class="text-[10px] text-slate-500 mt-0.5">必要な評価: 公庫20／ノンバンク25／信金35／地銀50</div>
    </div>
  </div>`;
}

function showPayment(propId, price, close) {
  const p = state.market.find(x => x.id === propId);
  const m = document.getElementById('purchase-modal');
  const cashClosing = L.closingCostOf(p, price, 0);
  const cashNeed = price + cashClosing;
  let downRatio = 0.2;
  let buyOwner = 'personal';   // v3.5: 法人設立済みなら購入名義を選べる
  // v8.8: 諸費用・評価の内訳はプルダウン開閉式。押すと開き、もう一度押すと格納する。
  let openCash = false, openCredit = false, openLoan = false;
  const draw = () => {
    m.innerHTML = '';
    // v3.6: 頭金は0%〜「手持ち現金で払える上限」まで1%刻みで自由に設定できる（3割上限を撤廃）
    // v8.5: 諸費用は借入額でも変わるので、頭金の上限判定はいったん現金購入ベースの額で見る
    const closing = L.closingCostOf(p, price, Math.round(price * (1 - downRatio)));
    const maxDownPct = Math.max(0, Math.min(100, Math.floor((state.cash - closing) / price * 100)));
    if (downRatio > maxDownPct / 100) downRatio = maxDownPct / 100;
    const rs = L.reviewAllBanks(p, price, downRatio, state);
    // v8.21: スマホの低い画面高だと内容が入りきらず、末尾の「買付を取り下げる」までスクロールが
    // 必要と気づきにくかった（見た目上そこで終わっているように見える）。openDetail等と同じ
    // 「ヘッダー固定・中央だけスクロール・フッター固定」の3段構成にし、取り下げボタンを常に
    // 画面内に残す。高さもmax-h-[85vh]→94vhに広げ、そもそものスクロール量自体を減らす。
    // さらに「4行同時審査」の一覧が初見で全部見えることを優先し、各行・各ボックスの余白を
    // 詰めて375×667のような低い画面高でも4行が最初のスクロール位置で収まるようにしている。
    const box = el(`<div class="bg-white rounded-xl w-full max-w-md max-h-[94vh] flex flex-col" style="max-height:94dvh">
      <div class="p-4 pb-1.5 shrink-0 flex justify-between items-center gap-2"><h2 class="font-bold" style="font-size:clamp(0.7rem,4vw,0.9rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto">支払い方法（成約価格 ${L.yen(price)}）</h2><button id="pay-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
      <div class="px-4 pb-1.5 space-y-1.5 overflow-y-auto flex-1 min-h-0">
      ${state.isIncorporated ? `<div class="flex gap-2 text-sm items-center"><span class="font-bold shrink-0">名義:</span>
        <label class="flex-1 border rounded p-1 text-center cursor-pointer ${buyOwner === 'personal' ? 'bg-slate-100 font-bold border-navy' : ''}"><input type="radio" name="buy-owner" value="personal" ${buyOwner === 'personal' ? 'checked' : ''} class="mr-1">👤 個人</label>
        <label class="flex-1 border rounded p-1 text-center cursor-pointer ${buyOwner === 'corp' ? 'bg-slate-100 font-bold border-navy' : ''}"><input type="radio" name="buy-owner" value="corp" ${buyOwner === 'corp' ? 'checked' : ''} class="mr-1">🏢 法人</label></div>` : ''}
      <div class="rounded-lg bg-emerald-50 border border-emerald-200 p-2 space-y-1.5">
        <div class="text-sm font-bold text-emerald-800">💰 現金で一括払い</div>
        <button id="pay-cash" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded py-1.5 text-sm font-bold ${state.cash < cashNeed ? 'opacity-40' : ''}" ${state.cash < cashNeed ? 'disabled' : ''}>現金一括（必要 ${L.yen(cashNeed)}）</button>
        ${purchaseCostBox(p, price, 0, `📋 ${term('closing_cost', '諸費用')}`, 'cash', openCash)}
      </div>
      <div class="rounded-lg bg-slate-100 border border-slate-300 p-2 space-y-1.5">
        <div class="text-sm font-bold text-navy">🏦 融資（4行同時審査）</div>
        <div id="pay-credit">${creditSummaryBox(downRatio, openCredit)}</div>
        <div class="rounded-lg bg-white border-2 border-navy p-2 text-center">
          <div class="text-base font-bold">${term('own_cash', '頭金')} <span id="pay-down-pct">${Math.round(downRatio * 100)}%</span>＝<span id="pay-down-amt">${L.yen(Math.round(price * downRatio))}</span></div>
          <div class="text-[11px] text-slate-600 mt-0.5">${term('closing_cost', '諸費用')}込み必要現金 <span id="pay-down-need" class="font-bold">${L.yen(Math.round(price * downRatio) + closing)}</span></div>
        </div>
        <input id="pay-down-range" type="range" min="0" max="${maxDownPct}" step="1" value="${Math.round(downRatio * 100)}" class="w-full">
        <div class="text-[10px] text-slate-500">スライダーで頭金の割合を自由に決められます</div>
        <div id="pay-loan-costs">${purchaseCostBox(p, price, Math.round(price * (1 - downRatio)), `📋 ${term('closing_cost', '諸費用')}`, 'loan', openLoan)}</div>
        <div id="pay-banks"></div>
      </div>
      </div>
      <div class="p-4 pt-1.5 border-t shrink-0"><button id="pay-cancel" class="w-full text-slate-500 text-sm">買付を取り下げる（ペナルティなし）</button></div></div>`);
    m.appendChild(box);
    const banksDiv = box.querySelector('#pay-banks');
    // v8: 承認された銀行はカード全体を紺で塗って文字を白に反転する。否決は淡いグレーのまま沈める。
    // 「紺＝借りられる／灰＝借りられない」の明暗差だけで、読まずに判別できる状態を狙っている。
    // v11.2: 承認カードはアイコン+銀行名+LTV/DSCR+ボタンを1行に詰めていたため、銀行名だけが
    // 省略記号で削られていた（否決カードはボタンが無い分崩れず、見た目のバラつきの原因だった）。
    // v11.3: ボタンを専用行に分離したことで名前+LTV/DSCRだけなら1行に収まるため、その2つは
    // 同じ行に戻す（銀行名は必要ならtruncate・LTV/DSCRはwhitespace-nowrapで折り返さない）。
    // 金利等の詳細も「金利・年数」「月返済・自己資金」の2行に固定し、自然な折り返しに任せない。
    // v11.4: ◯／✕アイコンを削除（紺=借りられる／灰=借りられないの背景色だけで可否は伝わる）。
    // 否決カードはタップで理由をalert表示できるようにし、アイコンが無くなった分の分かりにくさを補う。
    // v11.5: 銀行名はtruncate(省略記号)ではなくフォントサイズを縮めて全文字を表示する
    // （「日本政策金融公庫」のような長い名前でも省略しない）。
    // v11.6: 融資タブ（bankReviewList）と表記を揃えるため◯／✕を復活。背景色・借りるボタン・
    // タップで理由を見る操作はそのまま維持する（可否の伝え方を重ねるだけで、操作性は変えない）。
    const bankNameStyle = 'font-size:clamp(0.65rem,3.5vw,0.875rem)';
    banksDiv.innerHTML = rs.map(r => r.approved
      ? `<div class="border rounded p-1.5 mb-1 bg-navy text-white">
          <div class="flex items-center justify-between gap-1.5">
            <b class="min-w-0" style="${bankNameStyle}">◯ ${r.label}</b>
            ${metricsBadge(r, true)}
          </div>
          <div class="text-[11px] text-white/80 mt-0.5">金利${(r.terms.rate * 100).toFixed(2)}%・${r.terms.years}年</div>
          <div class="text-[11px] text-white/80">月返済${L.yen(r.terms.monthlyPay)}・要${term('own_cash', '自己資金')}${L.yen(r.terms.requiredCash)}</div>
          <button class="pay-bank w-full bg-white text-navy rounded py-1.5 text-sm font-bold mt-1.5" data-k="${r.bankKey}">借りる</button></div>`
      : `<div class="bank-rejected border rounded p-1.5 mb-1 bg-slate-50 cursor-pointer" data-k="${r.bankKey}">
          <div class="flex items-center justify-between gap-1.5">
            <b class="min-w-0 text-slate-400" style="${bankNameStyle}">✕ ${r.label}</b>
            ${metricsBadge(r, false)}
          </div>
          ${r.reasons.filter(x => x.code !== 'OVER_LTV' && x.code !== 'DSCR_LOW').length
            ? `<div class="text-[11px] text-red-600 mt-0.5">${linkTerms(r.reasons.filter(x => x.code !== 'OVER_LTV' && x.code !== 'DSCR_LOW').map(x => x.msg).join('／'))}</div>` : ''}</div>`).join('');
    banksDiv.querySelectorAll('.bank-rejected').forEach(el => el.addEventListener('click', () => {
      const r = rs.find(x => x.bankKey === el.dataset.k);
      if (!r) return;
      alert(`${r.label}は現在の条件では借りられません。\n\n${r.reasons.map(x => x.msg).join('\n')}`);
    }));
    const range = box.querySelector('#pay-down-range');
    range.addEventListener('input', () => {
      const pct = Number(range.value);
      // v8.5: 頭金を動かすと借入額が変わり、抵当権設定登記・事務手数料も変わる。内訳ごと追従させる。
      const loanNow = Math.round(price * (1 - pct / 100));
      const closingNow = L.closingCostOf(p, price, loanNow);
      box.querySelector('#pay-down-pct').textContent = `${pct}%`;
      box.querySelector('#pay-down-amt').textContent = L.yen(Math.round(price * pct / 100));
      box.querySelector('#pay-down-need').textContent = L.yen(Math.round(price * pct / 100) + closingNow);
      box.querySelector('#pay-loan-costs').innerHTML =
        purchaseCostBox(p, price, loanNow, `📋 ${term('closing_cost', '諸費用')}`, 'loan', openLoan);
      box.querySelector('#pay-credit').innerHTML = creditSummaryBox(pct / 100, openCredit);   // v8.7: 評価も追従
    });
    range.addEventListener('change', () => { downRatio = Number(range.value) / 100; draw(); });
    box.querySelectorAll('input[name="buy-owner"]').forEach(rb => rb.addEventListener('change', e => { buyOwner = e.target.value; draw(); }));
    // v8.8: プルダウン開閉。box に委譲することで #pay-credit / #pay-loan-costs の innerHTML 差し替え後も効く。
    box.addEventListener('click', (e) => {
      // v8.21: 不動産取得税の計算過程は再描画を伴わない単発の開閉（DOM直操作）。
      // #pay-loan-costs の innerHTML 差し替え後も、box への委譲なので効き続ける。
      const acqBtn = e.target.closest('.acq-toggle');
      if (acqBtn) {
        acqBtn.closest('tr')?.nextElementSibling?.classList.toggle('hidden');
        acqBtn.querySelector('.inline-block')?.classList.toggle('rotate-90');
        return;
      }
      const btn = e.target.closest('[data-toggle]');
      if (!btn) return;
      if (btn.dataset.toggle === 'cash') openCash = !openCash;
      else if (btn.dataset.toggle === 'credit') openCredit = !openCredit;
      else if (btn.dataset.toggle === 'loan') openLoan = !openLoan;
      draw();
    });
    const ownerLabel = () => buyOwner === 'corp' ? '🏢法人名義' : '👤個人名義';
    box.querySelector('#pay-cash').addEventListener('click', () => {
      const r = L.buyPropertyV2(state, propId, { method: 'cash', price, owner: buyOwner });
      state = r.state; r.logs.forEach(pushLog); save(); render(); close(); checkEnd();
      playPurchaseCelebration(p.name || p.label, `${L.yen(price)}（現金一括・${ownerLabel()}）`);
      tutMaybeAdvance('payment');
    });
    box.querySelectorAll('.pay-bank').forEach(b => b.addEventListener('click', () => {
      const r = L.buyPropertyV2(state, propId, { method: b.dataset.k, downRatio, price, owner: buyOwner });
      state = r.state; r.logs.forEach(pushLog); save(); render(); close(); checkEnd();
      playPurchaseCelebration(p.name || p.label, `${L.yen(price)}（融資利用・${ownerLabel()}）`);
      tutMaybeAdvance('payment');
    }));
    box.querySelector('#pay-cancel').addEventListener('click', () => { pushLog('買付を取り下げた'); close(); });
    box.querySelector('#pay-x').addEventListener('click', () => { pushLog('買付を取り下げた'); close(); });
  };
  draw();
}

// v3.5: 個人所有物件を法人へ売却（移転）する確認画面。時価取引・譲渡税・取得コスト・償却再スタートを明示。
function openCorpTransfer(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  // v8.1: 税率と課税対象益は売却フローと同じ saleBreakdown から取る（数字がズレないように）
  const price = p.timeValue;
  const bd = L.saleBreakdown(state, p, price);
  const heldYears = L.heldMonthsOf(state, p) / 12;
  const capTax = bd.tax;
  const acqCost = Math.round(price * L.CONFIG.corpTransferCostRate);
  const total = capTax + acqCost;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <div class="flex justify-between items-center gap-2"><h2 class="font-bold" style="font-size:clamp(0.75rem,4vw,0.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto">🏢 ${p.name || p.label} を法人へ売却（移転）</h2><button id="tc-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <table class="w-full text-sm">
      <tr><td>移転価格（現在の時価）</td><td class="text-right font-bold">${L.yen(price)}</td></tr>
      <tr class="border-t"><td>${term('capital_gains_tax', '譲渡税')}（個人側・${heldYears <= 5 ? '短期39%' : '長期20%'}）</td><td class="text-right text-red-600">-${L.yen(capTax)}</td></tr>
      <tr><td>取得コスト（法人側・5%）</td><td class="text-right text-red-600">-${L.yen(acqCost)}</td></tr>
      <tr class="border-t font-bold"><td>支払い合計</td><td class="text-right text-red-600">${L.yen(total)}</td></tr>
    </table>
    <div class="text-xs text-slate-600 bg-slate-50 rounded p-2 space-y-1">
      <div>✅ 以後の課税は法人税率30%（${term('dead_cross', 'デッドクロス')}後も40%にならない）</div>
      <div>✅ <b>${term('depreciation', '減価償却')}が再スタート</b>（中古簡便法・取得価額=現在の時価）</div>
      <div>✅ 売却時の${term('capital_gains_tax', '譲渡税')}が保有期間に関係なく30%に</div>
    </div>
    <button id="tc-run" class="w-full bg-navy text-white rounded py-2 text-sm font-bold ${state.cash < total ? 'opacity-40' : ''}" ${state.cash < total ? 'disabled' : ''}>法人へ移転する（${L.yen(total)} 支払い）</button>
    <button id="tc-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelector('#tc-x').addEventListener('click', close);
  box.querySelector('#tc-cancel').addEventListener('click', close);
  box.querySelector('#tc-run').addEventListener('click', () => {
    const r = L.transferToCorp(state, propId);
    if (!r.done) { alert(r.reason === 'cash' ? '現金が足りません' : '移転できませんでした'); return; }
    state = r.state;
    pushLog(`${p.name || p.label} を法人へ移転（譲渡税${L.yen(r.capTax)}・取得コスト${L.yen(r.acqCost)}・償却再スタート）`);
    save(); render(); close();
    // v3.6: 移転も決定的イベントとして判子スタンプ演出に統一
    playStampFx({ stamp: '移転完了', title: '法人名義へ！', sub: `${p.name || p.label}（課税30%・償却再スタート）`, emojis: ['🏢', '📋', '✨', '💴', '✨'] });
  });
}

function openSell(propId) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const listing = (state.listings || []).find(l => l.propertyId === propId);
  if (listing) { drawListingManage(m, p, listing, close); return; }
  // v8.2: 買付を承諾すると掲載は消えるが物件は決済月まで残る。ここで案内しないと
  // 「まだ売れていない」と誤解して二重に売り出そうとしてしまう。
  const pending = (state.pendingSales || []).find(x => x.propertyId === propId);
  if (pending) {
    const box2 = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
      <div class="flex justify-between items-start gap-2"><h2 class="font-bold">${p.name || p.label} は売却手続き中</h2><button id="sl-x0" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
      <div class="rounded-lg bg-emerald-50 p-3 text-sm space-y-1">
        <div>✅ 買付を承諾済みです。<b>${L.yen(pending.price)}</b> で成約しました。</div>
        <div>📅 <b>翌月に決済</b>され、手取りが入金されます。</div>
      </div>
      ${netProceedsBox(p, pending.price, true)}
      <div class="text-xs text-slate-500">決済までは売出価格の変更も再掲載もできません。</div>
      <button id="sl-ok" class="w-full bg-navy text-white rounded py-2 text-sm font-bold">閉じる</button></div>`);
    m.appendChild(box2);
    box2.querySelector('#sl-ok').addEventListener('click', close);
    box2.querySelector('#sl-x0').addEventListener('click', close);
    return;
  }
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-center gap-2"><h2 class="font-bold" style="font-size:clamp(0.75rem,4vw,0.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto">${p.name || p.label} の売却</h2><button id="sl-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">まず不動産屋に査定を依頼しよう（行動力-5）</div>
    <button id="sl-appraise" class="w-full bg-navy text-white rounded py-2">査定を依頼する</button>
    <button id="sl-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelector('#sl-cancel').addEventListener('click', close);
  box.querySelector('#sl-x').addEventListener('click', close);
  box.querySelector('#sl-appraise').addEventListener('click', () => {
    if (state.actionPower < 5) { alert('行動力が足りません'); return; }
    const r = L.requestAppraisal(state, propId, Math.random);
    state = r.state; save();
    // v8.13: backを渡していなかったため、価格決定画面に×しか無く前の画面へ戻れなかった。
    // v11.2: afterListはnull固定。openSell(propId)をbackとafterList両方に使うと、売り出し成功直後の
    // 再実行が新規掲載を検知して管理画面（5%値下げ/取り下げ）を初回から開いてしまうため。
    drawPricing(m, p, r.appraisal, close, () => openSell(propId), null);
  });
}

// v8.1: 「この価格で売ったら手元にいくら残るか」。価格決定と買付承諾の両方で同じ内訳を見せる。
// 売却価格そのものより、税と残債を引いた手取りの方が判断材料として重要。
// hideWait: すでに成約済み（決済待ち）の画面では「待てば増える」を出さない。もう待てないので。
function netProceedsBox(p, price, hideWait = false) {
  const bd = L.saleBreakdown(state, p, price);
  // 益が出ていなければ税額も0で、待っても手取りは変わらない。カウントダウンはノイズになるので出さない。
  const waitGain = Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong));
  const toLong = (waitGain > 0 && !hideWait) ? L.monthsToLongTerm(state, p) : 0;
  const rateLabel = p.owner === 'corp' ? '🏢法人 一律30%'
    : `👤個人 ${bd.longTerm ? '長期' : '短期'}${Math.round(bd.rate * 100)}%`;
  // v8.20: 800万円以下は低廉物件特例で定額33万円（税込）。超えると速算式の階段（売却価格帯で変わる）。
  const brokerLabel = bd.price <= L.LOW_PRICE_BROKER_FEE_MAX_PRICE ? '低廉物件特例・定額33万円（税込）'
    : bd.price <= 4_000_000 ? '価格の4%＋2万＋税'
    : '価格の3%＋6万＋税';
  return `<div class="rounded-lg bg-slate-50 p-2 text-xs space-y-0.5">
    <table class="w-full">
      <tr><td class="text-slate-600">売却価格</td><td class="text-right font-bold">${L.yen(bd.price)}</td></tr>
      <tr><td class="text-slate-600">${term('capital_gains_tax', '譲渡税')}（${rateLabel}）</td><td class="text-right text-red-600">-${L.yen(bd.tax)}</td></tr>
      <tr><td class="text-slate-600">${term('chukai_tesuryo', '仲介手数料')}（${brokerLabel}）</td><td class="text-right text-red-600">-${L.yen(bd.costs.broker)}</td></tr>
      <tr><td class="text-slate-600">${term('inshizei', '印紙税')}</td><td class="text-right text-red-600">-${L.yen(bd.costs.stamp)}</td></tr>
      ${bd.costs.release ? `<tr><td class="text-slate-600">${term('teitoken_masshou', '抵当権抹消')}</td><td class="text-right text-red-600">-${L.yen(bd.costs.release)}</td></tr>` : ''}
      <tr><td class="text-slate-600">残債の精算</td><td class="text-right text-red-600">${bd.payoff ? `-${L.yen(bd.payoff)}` : '—'}</td></tr>
      <tr class="border-t font-bold"><td>手取り</td><td class="text-right ${bd.net >= 0 ? 'text-emerald-700' : 'text-red-600'}">${L.yen(bd.net)}</td></tr>
    </table>
    ${toLong > 0 ? `<div class="text-amber-800 font-bold">⏳ あと${toLong}ヶ月待つと長期20%。いまの価格なら手取りが ${L.yen(waitGain)} 増える計算</div>` : ''}
    <div class="text-[10px] text-slate-500">課税対象益 ${L.yen(bd.gain)}（売却価格 − ${term('book_value', '簿価')} ${L.yen(bd.book)}）</div>
  </div>`;
}

// v3.5: 売出価格は自由入力。査定はあくまで参考値として表示し、利回りをリアルタイムに見ながら自分で決める。
// v3.6: backを渡すと「← 戻る」を表示し、戻る押下でひとつ前の画面（売却センター等）へ戻る。
// v11.2: 売り出し成功後の戻り先は afterList で別指定する（省略時はbackを流用）。openSell()自身をbackに
// 渡す呼び出し元だと、backをそのまま流用すると掲載直後のopenSell()再実行が「既に掲載中」を検知して
// 管理画面（5%値下げ/取り下げ）を初回から開いてしまうため、backと切り離した。
function drawPricing(m, p, appraisal, close, back, afterList = back) {
  m.innerHTML = '';
  let price = appraisal;
  const gpi = L.gpiAnnual(p);
  const yieldOf = (v) => (v > 0 ? (gpi / v * 100).toFixed(1) : '-');
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-center gap-2">${back ? '<button id="sl-back" class="text-xs text-navy shrink-0">← 戻る</button>' : ''}<h2 class="font-bold" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto">売出価格を決める</h2><button id="sl-x2" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">不動産会社の査定額（参考）: <b>${L.yen(appraisal)}</b>（利回り${yieldOf(appraisal)}%）</div>
    <div class="text-center text-2xl font-black text-navy"><span class="text-xs font-normal text-slate-500 align-middle">価格</span> <span id="sl-price-v">${L.yen(appraisal)}</span></div>
    <input id="sl-price-range" type="range" min="${Math.max(10000, Math.round(appraisal * 0.5))}" max="${Math.round(appraisal * 2)}" step="10000" value="${appraisal}" class="w-full">
    <div class="flex gap-1 text-xs">
      ${[0.9, 1.0, 1.1, 1.2].map(f => `<button class="sl-preset flex-1 border rounded py-1" data-f="${f}">査定×${Math.round(f * 100)}%</button>`).join('')}
    </div>
    <div class="text-center text-sm text-slate-600">この価格の${term('yield_gross', '表面利回り')} <span id="sl-yield" class="font-bold text-lg text-emerald-700">${yieldOf(appraisal)}</span>%
      <div class="text-[11px] text-slate-500">（満室想定・年間家賃収入 ${L.yen(gpi)} 基準）</div></div>
    <div id="sl-net">${netProceedsBox(p, appraisal)}</div>
    <div>
      ${collapseHeader('sl-toggle-tip', false, '💡 価格設定のコツ', '')}
      <div id="sl-tip-body" class="hidden mt-1 text-xs text-slate-500 px-0.5">安くすれば早く売れ、高いほど時間がかかる。訳あり物件を高利回りで仕入れ、通常の利回り水準の価格で売り抜く戦略も。</div>
    </div>
    <button id="sl-list" class="w-full bg-emerald text-white rounded py-2">この価格で売りに出す</button>
    <button id="sl-cancel2" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  const range = box.querySelector('#sl-price-range');
  const updatePrice = () => {
    price = Math.max(10000, Number(range.value));
    box.querySelector('#sl-price-v').textContent = L.yen(price);
    box.querySelector('#sl-yield').textContent = yieldOf(price);
    box.querySelector('#sl-net').innerHTML = netProceedsBox(p, price);   // v8.1: 手取りも追従させる
  };
  range.addEventListener('input', updatePrice);
  box.querySelectorAll('.sl-preset').forEach(b => b.addEventListener('click', () => {
    range.value = Math.round(appraisal * Number(b.dataset.f) / 10000) * 10000;
    updatePrice();
  }));
  box.querySelector('.sl-toggle-tip').addEventListener('click', () => {
    box.querySelector('#sl-tip-body').classList.toggle('hidden');
    box.querySelector('.sl-toggle-tip .inline-block').classList.toggle('rotate-90');
  });
  box.querySelector('#sl-list').addEventListener('click', () => {
    updatePrice();
    const r = L.listForSale(state, p.id, price, appraisal);
    // v8.2: 決済待ち・掲載中・未所有は logic 側で弾かれる。理由を出して黙って落とさない。
    if (!r.listed) {
      alert({ pendingSale: 'この物件は買付を承諾済みです。翌月の決済を待ってください。',
        alreadyListed: 'この物件はすでに売り出し中です。',
        notOwned: 'この物件はもう所有していません。' }[r.reason] || '売りに出せませんでした');
      close(); return;
    }
    state = r.state;
    pushLog(`${p.label} を ${L.yen(price)} で売りに出した（表面${yieldOf(price)}%）`);
    save(); render(); close();
    afterList?.();   // v11.2: 売り出し後の戻り先（backとは別。openSell経由では管理画面を初回に開かせないためnull）
  });
  box.querySelector('#sl-back')?.addEventListener('click', () => { close(); back(); });
  box.querySelector('#sl-cancel2').addEventListener('click', close);
  box.querySelector('#sl-x2').addEventListener('click', close);
}

function drawListingManage(m, p, listing, close) {
  m.innerHTML = '';
  const downTo = Math.round(listing.askingPrice * 0.95 / 10000) * 10000;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-3">
    <div class="flex justify-between items-center gap-2"><h2 class="font-bold" style="font-size:clamp(0.75rem,4vw,0.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto">${p.name || p.label}（売出中 ${listing.listedMonths}ヶ月目）</h2><button id="sl-x3" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div class="text-sm">売出価格: <b>${L.yen(listing.askingPrice)}</b></div>
    <button id="sl-down" class="w-full border rounded py-2 text-sm">5%値下げする → ${L.yen(downTo)}</button>
    <button id="sl-delist" class="w-full border rounded py-2 text-sm">掲載を取り下げる</button>
    <button id="sl-close" class="w-full text-slate-500 text-sm">閉じる</button></div>`);
  m.appendChild(box);
  box.querySelector('#sl-down').addEventListener('click', () => {
    state = L.updateListing(state, p.id, downTo).state;
    pushLog(`${p.label} を ${L.yen(downTo)} に値下げした`); save(); render(); close();
  });
  box.querySelector('#sl-delist').addEventListener('click', () => {
    state = L.delist(state, p.id).state;
    pushLog(`${p.label} の掲載を取り下げた`); save(); render(); close();
  });
  box.querySelector('#sl-close').addEventListener('click', close);
  box.querySelector('#sl-x3').addEventListener('click', close);
}

function showOfferModal(listing) {
  const p = state.properties.find(x => x.id === listing.propertyId);
  if (!p || !listing.offer) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const o = listing.offer;
  const lv = L.skillLevel(state.skills.negotiation.exp);
  const counterPrice = Math.round((o.price + listing.askingPrice) / 2 / 10000) * 10000;
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <h2 class="font-bold">💌 ${p.name || p.label} に買付が入った！</h2>
    <div class="text-sm">売出 ${L.yen(listing.askingPrice)} に対し <b>${o.type === 'full' ? '満額' : '指値'} ${L.yen(o.price)}</b></div>
    ${netProceedsBox(p, o.price)}
    <button class="of-act w-full bg-emerald text-white rounded py-2 text-sm" data-a="accept">承諾する（翌月決済）</button>
    ${o.type === 'sashine' ? `<button class="of-act w-full border rounded py-2 text-sm" data-a="counter">カウンター ${L.yen(counterPrice)}（成立確率${Math.round((0.5 + (lv - 1) * 0.05) * 100)}%・不成立なら買付消滅）</button>` : ''}
    <button class="of-act w-full border rounded py-2 text-sm" data-a="reject">断る（掲載継続）</button></div>`);
  m.appendChild(box);
  box.querySelectorAll('.of-act').forEach(b => b.addEventListener('click', () => {
    const r = L.respondToOffer(state, listing.propertyId, b.dataset.a, lv, Math.random);
    state = r.state;
    pushLog({ accepted: '買付を承諾した。翌月に決済・入金', rejected: '買付を断った',
      counter_ok: `カウンター成立！${L.yen(r.settlePrice)} で売却へ`, counter_ng: 'カウンターは断られ、買付は流れた…' }[r.result]);
    save(); render(); close();
  }));
}

// ジャンル別の手描き風シルエット。汚れ/ひび/雑草/傾きは svgBuildingParts() の判定を反映する。
const BUILDING_SHAPES = {
  kodate: (wall, roof, win) => `
    <polygon points="15,42 50,16 85,42" fill="${roof}"/>
    <rect x="20" y="42" width="60" height="33" fill="${wall}"/>
    <rect x="44" y="55" width="13" height="20" fill="#78350f"/>
    <rect x="27" y="49" width="11" height="11" fill="${win}"/>
    <rect x="62" y="49" width="11" height="11" fill="${win}"/>`,
  apart: (wall, roof, win) => `
    <rect x="14" y="20" width="66" height="55" fill="${wall}"/>
    <rect x="14" y="20" width="66" height="6" fill="${roof}"/>
    ${[0, 1, 2, 3].map(i => `<rect x="${20 + i * 14}" y="30" width="9" height="9" fill="${win}"/>`).join('')}
    ${[0, 1, 2, 3].map(i => `<rect x="${20 + i * 14}" y="55" width="9" height="9" fill="${win}"/>`).join('')}
    <polyline points="82,75 88,68 82,60 88,52 82,45" fill="none" stroke="#94a3b8" stroke-width="3"/>`,
  tekkotsu: (wall, roof, win) => `
    <rect x="15" y="10" width="70" height="65" fill="${wall}"/>
    <rect x="15" y="10" width="70" height="6" fill="${roof}"/>
    ${[0, 1, 2].flatMap(row => [0, 1, 2, 3].map(col =>
      `<rect x="${20 + col * 15}" y="${18 + row * 18}" width="9" height="9" fill="${win}"/>`)).join('')}`,
  kubun: (wall, roof, win) => `
    <rect x="22" y="5" width="56" height="70" fill="${wall}"/>
    <rect x="22" y="5" width="56" height="6" fill="${roof}"/>
    ${[0, 1, 2, 3].flatMap(row => [0, 1, 2].map(col =>
      `<rect x="${28 + col * 17}" y="${15 + row * 15}" width="10" height="9" fill="${row === 1 && col === 1 ? '#fbbf24' : win}" ${row === 1 && col === 1 ? 'stroke="#fff" stroke-width="1"' : ''}/>`)).join('')}`,
  rc: (wall, roof, win) => `
    <rect x="25" y="2" width="50" height="73" fill="${wall}"/>
    <rect x="25" y="2" width="50" height="6" fill="${roof}"/>
    ${[0, 1, 2, 3, 4].flatMap(row => [0, 1, 2].map(col =>
      `<rect x="${30 + col * 15}" y="${12 + row * 13}" width="9" height="8" fill="${win}"/>`)).join('')}`,
};

function renderBuildingSVG(p, sizeClass = 'w-16 h-16') {
  const parts = L.svgBuildingParts(p);
  const wall = parts.wake ? '#d8cba8' : '#f1e4c9';
  const roof = { kodate: '#b3542e', apart: '#5b7fa6', tekkotsu: '#5b7fa6', kubun: '#94a3b8', rc: '#64748b' }[parts.shape];
  const win = parts.dirtLevel > 0.6 ? '#475569' : '#7dd3fc';
  const body = BUILDING_SHAPES[parts.shape](wall, roof, win);
  const dirt = parts.dirtLevel > 0.05 ? `<rect x="10" y="10" width="80" height="65" fill="#4b3621" opacity="${(parts.dirtLevel * 0.35).toFixed(2)}"/>` : '';
  const cracks = parts.hasCracks ? `<path d="M40,45 L44,55 L40,65 M60,40 L64,50 L58,58" stroke="#1e293b" stroke-width="1" fill="none" opacity="0.5"/>` : '';
  const weeds = parts.hasWeeds ? `<path d="M18,75 q2,-8 4,0 M22,75 q2,-10 4,0 M74,75 q2,-8 4,0" stroke="#16a34a" stroke-width="2" fill="none"/>` : '';
  return `<svg viewBox="0 0 100 80" class="${sizeClass} shrink-0">
    <g transform="${parts.tilt ? 'rotate(-6 50 70)' : ''}">${body}${dirt}${cracks}${weeds}</g>
  </svg>`;
}

// v3.2: 概要の「地図で場所を見る」。詳細を閉じて地図の該当地点へ飛び、
// 「タップすると詳細に戻れる」ことを吹き出しで数秒示す（市場物件はピンも立つ）。
function jumpToMapWithBubble(p, from) {
  if (from === 'owned') focusOnOwned(p.id); else focusOnMarket(p.id);
  const canvas = document.getElementById('city-canvas');
  const r = canvas ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  const bubble = el(`<div class="fixed z-[55] pointer-events-none" style="left:${Math.round(r.left + r.width / 2)}px; top:${Math.round(r.top + r.height * 0.30)}px; transform:translate(-50%,-100%); transition: opacity 0.5s;">
    <div class="bg-white rounded-xl shadow-xl px-4 py-2 text-sm font-bold text-navy">📍 ここ！ ${from === 'market' ? 'ピンや建物' : 'この建物'}をタップ（クリック）すると詳細に戻れます</div>
    <div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #fff;margin:0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.15));"></div>
  </div>`);
  document.body.appendChild(bubble);
  setTimeout(() => { bubble.style.opacity = '0'; }, 3800);
  setTimeout(() => bubble.remove(), 4400);
}

// === v4: 工事は「大分類（修繕/価値UP）→ 工事内容 → 実施方法（DIY/業者→借入）」の3階層 ===

// 物件の現況から選べる工事内容を組み立てる。cost はいずれも業者見積（DIYはこの30%が材料費）。
// v8.9: DIY可能な項目は全て progress（現在の進捗%）と sessionsLeft（残りDIY回数の目安）を持たせる。
function workOptions(p, category) {
  if (category === 'valueup') {
    // v8.9: 価値UPは「どのプランでも完了1回につき+1レベル」で、同じプランを繰り返しても良い
    // （プランごとに別枠で数えない）。上限に達したら全プランを無効化して理由を明示する。
    const maxed = (p.valueUpLevel || 0) >= L.VALUE_UP_MAX_LEVEL;
    return Object.entries(L.VALUE_UP_PLANS).map(([key, pl]) => {
      const progress = (p.diyProgress && p.diyProgress.kind === 'valueup' && p.diyProgress.planKey === key) ? p.diyProgress.done : 0;
      return {
        type: 'valueup', planKey: key, label: pl.label,
        detail: `業者なら工期${pl.months}ヶ月`,
        effect: `家賃 +${Math.round((pl.rentMult - 1) * 100)}%・資産価値UP`,
        cost: L.valueUpCost(p, key), diyable: pl.diyable, diyAp: pl.diyAp, blockedReason: pl.blockedReason,
        disabled: maxed, disabledReason: `価値UPは上限（Lv${L.VALUE_UP_MAX_LEVEL}）に達しています`,
        progress, sessionsLeft: pl.diyable ? L.estimateDiySessionsLeft(progress, pl.diyStep, state) : 0,
      };
    });
  }
  const out = [];
  // 現状回復は退去した部屋ごと。回復するまでその部屋は募集できない。
  p.units.forEach((u, i) => {
    if (!u.needsRestore) return;
    out.push({
      type: 'restore', unitIndex: i, label: `現状回復（${i + 1}号室 ${u.layout || ''}）`,
      detail: u.restoreJob ? `業者が施工中（残り${u.restoreJob.monthsLeft}ヶ月）` : '退去後の原状回復。業者なら工期1ヶ月',
      effect: 'この部屋の募集を再開できる',
      cost: L.restoreCost(p, u), diyable: !p.autoManage, diyAp: L.RESTORE_DIY_AP,
      blockedReason: p.autoManage ? 'おまかせ契約中は原状回復も業者へ自動手配されます' : undefined,
      disabled: !!u.restoreJob, disabledReason: '施工中です',
      progress: u.restoreProgress || 0,
      sessionsLeft: L.estimateDiySessionsLeft(u.restoreProgress || 0, L.RESTORE_DIY_STEP, state),
    });
  });
  // v6: 日常メンテは 🧹手入れ、大規模修繕は 🏚躯体 と、それぞれ別のゲージを直す。
  const lg = L.REPAIR_KINDS.large;
  const care = Math.round(p.careState ?? p.repairState ?? 100);
  const struct = Math.round(p.repairState ?? 100);
  // v8: 手入れが0（管理崩壊）まで落ちた物件では、日常メンテの代わりに特別清掃だけが出る。
  // 「0まで放置してから一度で直す」が最安にならないよう、日常メンテは選択肢から消す。
  const careKind = L.repairKindAvailable(p, 'maint') ? 'maint' : 'deepclean';
  const ck = L.REPAIR_KINDS[careKind];
  const careProgress = (p.diyProgress && p.diyProgress.kind === careKind) ? p.diyProgress.done : 0;
  out.push({
    type: careKind, label: ck.label, detail: L.repairDetail(p, careKind),
    effect: `🧹 手入れ ${care}% → 100%`,
    cost: L.repairCost(p, careKind), diyable: ck.diyable && !p.autoManage, diyAp: ck.diyAp,
    blockedReason: !ck.diyable ? ck.blockedReason
      : p.autoManage ? 'おまかせ契約中は工事がすべて業者任せになります' : undefined,
    disabled: care >= 100,
    disabledReason: '手入れは既に100%です',
    progress: careProgress,
    sessionsLeft: ck.diyable ? L.estimateDiySessionsLeft(careProgress, ck.diyStep, state) : 0,
  });
  out.push({
    type: 'large', label: lg.label, detail: L.repairDetail(p, 'large'),
    effect: L.isCondemned(p)
      ? `🏚 躯体 ${struct}% → 100%・資産価値+8%・使用不能を解除`
      : `🏚 躯体 ${struct}% → 100%・資産価値+8%`,
    cost: L.repairCost(p, 'large'), diyable: false, blockedReason: lg.blockedReason,
    disabled: struct >= 100, disabledReason: '躯体は既に100%です',
  });
  return out;
}

// v8: qualityMult はDIYミニゲームの出来ばえ（業者発注では常に1で無関係）。
function runWork(propId, sel, diy, financed, qualityMult = 1) {
  const opts = { diy, financed, qualityMult };
  if (sel.type === 'restore') return L.startRestore(state, propId, sel.unitIndex, opts);
  if (sel.type === 'valueup') return L.startValueUp(state, propId, sel.planKey, opts);
  return L.startRepair(state, propId, sel.type, opts);
}

// v8.13: initialSel を渡すとstep2（DIY／業者の選択）から開始する。DIYミニゲームの
// 「← 戻る」がここへ戻ってこられるようにするための引数（元は常にstep1からしか開けなかった）。
function openWorkMenu(propId, category, back, initialSel = null) {
  const m = document.getElementById('repair-modal');
  m.classList.remove('hidden'); m.classList.add('flex');
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const title = category === 'repair' ? '🔨 修繕' : '✨ 価値UP';
  const lead = category === 'repair'
    ? '傷んだところを元に戻す工事です。'
    : '設備更新やリノベで家賃そのものを上げる投資です。';
  let step = initialSel ? 2 : 1, sel = initialSel;

  const draw = () => {
    const p = state.properties.find(x => x.id === propId);
    if (!p) { close(); return; }
    m.innerHTML = '';
    const head = (backFn) => `<div class="flex justify-between items-center gap-2">
      ${backFn ? '<button id="wk-back" class="text-xs text-navy font-bold">← 戻る</button>' : '<span></span>'}
      <button id="wk-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>`;

    let body;
    if (step === 1) {
      const opts = workOptions(p, category);
      // v8.9: DIYできる項目には「今どれだけ進んでいるか」と「目安あと何回か」を必ず添える
      // （どれが何%進行中か分からない、という指摘への対応。目安は良い出来（quality=1.0）基準）。
      const diyLine = (o) => {
        if (!o.diyable) return '';
        return o.progress > 0
          ? `<div class="text-xs text-emerald-700 font-bold mt-0.5">DIY作業中 ${Math.min(100, Math.round(o.progress))}%（目安あと${o.sessionsLeft}回）</div>`
          : `<div class="text-xs text-slate-500 mt-0.5">DIYの場合の目安：約${o.sessionsLeft}回</div>`;
      };
      const rows = opts.map((o, i) => {
        const off = o.disabled;
        return `<button class="wk-opt w-full border rounded-lg p-2.5 text-left ${off ? 'opacity-40' : 'hover:bg-slate-50'}" data-i="${i}" ${off ? 'disabled' : ''}>
          <div class="font-bold text-sm">${o.label}</div>
          <div class="text-xs text-slate-600">${o.detail}</div>
          <div class="text-xs text-slate-700 mt-0.5">${o.effect}</div>
          <div class="text-xs mt-0.5">業者見積 <b>${L.yen(o.cost)}</b>${o.diyable ? ` ／ DIY材料費 <b>${L.yen(Math.round(o.cost * L.DIY_MATERIAL_RATE))}</b>` : ' <span class="text-slate-500">（業者のみ）</span>'}</div>
          ${diyLine(o)}
          ${off ? `<div class="text-xs text-red-600 mt-0.5">${o.disabledReason}</div>` : ''}</button>`;
      }).join('');
      // v8.9: 価値UPは「どのプランでも完了ごとに+1、同じプランの繰り返しでも良い」がUIから分からない
      // という指摘への対応。現在Lvと上限、仕組みを一言で明示する。
      const valueUpHeader = category === 'valueup' ? (() => {
        const lv = p.valueUpLevel || 0, max = L.VALUE_UP_MAX_LEVEL, maxed = lv >= max;
        return `<div class="text-xs font-bold ${maxed ? 'text-red-600 bg-red-50' : 'text-navy bg-slate-50'} rounded px-2 py-1.5">
          価値UP Lv${lv}/${max}${maxed ? '（上限に達しています）' : '　※どのプランでも完了ごとに+1（同じプランの繰り返しでもOK）'}</div>`;
      })() : '';
      body = `${head(back)}<h2 class="font-bold">${title}｜${p.name || p.label}</h2>
        <div class="text-xs text-slate-500">${lead}どの工事をするか選んでください。</div>
        ${valueUpHeader}
        <div class="space-y-1.5">${rows || '<div class="text-sm text-slate-500 py-4 text-center">いま必要な工事はありません。</div>'}</div>`;
    } else if (step === 2) {
      const material = Math.round(sel.cost * L.DIY_MATERIAL_RATE);
      const months = sel.type === 'restore' ? 1
        : sel.type === 'valueup' ? L.VALUE_UP_PLANS[sel.planKey].months
        : L.repairJobMonths(p, sel.type);
      const loanOk = L.canUseReformLoan(sel.cost, state.creditScore);
      body = `${head(true)}<h2 class="font-bold">${sel.label}</h2>
        <div class="text-xs text-slate-500">${sel.effect}</div>
        <button id="wk-diy" class="w-full border-2 rounded-lg p-3 text-left ${sel.diyable ? 'hover:bg-slate-50 border-emerald-500' : 'opacity-50'}" ${sel.diyable ? '' : 'disabled'}>
          <div class="font-bold text-sm">🔨 自分でやる（DIY）${sel.diyable ? '' : '<span class="text-xs font-normal">｜この工事では選べません</span>'}</div>
          ${sel.diyable ? `<div class="text-xs text-slate-600">材料費 <b>${L.yen(material)}</b>のみ・行動力${sel.diyAp}を何回か使って自分で仕上げる</div>
          <div class="text-xs text-emerald-700">安く済むが、その月の行動力を使う</div>`
            : `<div class="text-xs text-red-600">${sel.blockedReason || ''}</div>`}</button>
        <button id="wk-pro" class="w-full border-2 border-navy rounded-lg p-3 text-left hover:bg-slate-50">
          <div class="font-bold text-sm">🏢 業者に頼む</div>
          <div class="text-xs text-slate-600">費用 <b>${L.yen(sel.cost)}</b>・行動力5だけ・工期${months}ヶ月</div>
          <div class="text-xs text-navy">${loanOk ? '高いが手が空く。リフォームローンも使える' : '高いが手が空く'}</div></button>`;
    } else {
      const loanAmount = L.reformLoanAmount(sel.cost, state.creditScore);
      const down = sel.cost - loanAmount;
      const openLoans = (p.reformLoans || []).length;
      const loanOk = L.canUseReformLoan(sel.cost, state.creditScore);
      const blockedReason = sel.cost < L.REFORM_LOAN_MIN_COST
        ? `工事費が${L.yen(L.REFORM_LOAN_MIN_COST)}未満のため、少額工事は現金のみです`
        : '信用度が基準未満のため、現在は融資を利用できません';
      body = `${head(true)}<h2 class="font-bold">${sel.label}｜支払い方法</h2>
        <div class="text-sm">費用 <b>${L.yen(sel.cost)}</b>（現金 ${L.yen(state.cash)}）</div>
        <button id="wk-cash" class="w-full border rounded-lg py-2.5 text-sm font-bold ${state.cash < sel.cost ? 'opacity-40' : 'hover:bg-slate-50'}" ${state.cash < sel.cost ? 'disabled' : ''}>現金で支払う（${L.yen(sel.cost)}）</button>
        ${loanOk ? `<button id="wk-loan" class="w-full bg-navy text-white rounded-lg py-2.5 text-sm font-bold ${state.cash < down ? 'opacity-40' : ''}" ${state.cash < down ? 'disabled' : ''}>
          リフォームローンを使う（頭金${L.yen(down)}＋借入${L.yen(loanAmount)}）</button>
        <div class="text-xs text-slate-500">金利${(L.reformLoanRateFor(sel.cost) * 100).toFixed(1)}%・${L.CONFIG.reformLoanYears}年。借入可能額は信用度で変わります。
          ${openLoans ? `この物件には返済中のローンが${openLoans}本ありますが、重ねて借りられます。` : ''}</div>
        <div>${collapseHeader('wk-toggle-tip', false, '💡 現金かローンか', '')}
          <div id="wk-tip-body" class="hidden mt-1 text-xs text-slate-500 px-0.5">急がないなら現金のほうが総支払いは少ない（利息がかからないぶん）。手元の現金を他の投資や備えに残しておきたいなら、ローンで頭金を抑えるのも有効。</div></div>`
          : `<div class="text-xs text-red-600">🚫 ${blockedReason}</div>`}`;
    }

    const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-md space-y-2 max-h-[85vh] overflow-y-auto" style="max-height:85dvh">${body}</div>`);
    m.appendChild(box);
    box.querySelector('#wk-x').addEventListener('click', close);
    box.querySelector('#wk-back')?.addEventListener('click', () => {
      if (step === 1) { close(); back && back(); } else { step -= 1; draw(); }
    });
    box.querySelectorAll('.wk-opt').forEach(b => b.addEventListener('click', () => {
      sel = workOptions(p, category)[Number(b.dataset.i)];
      step = 2; draw();
    }));
    box.querySelector('#wk-diy')?.addEventListener('click', () => {
      if (state.actionPower < (sel.diyAp || 0)) { alert('行動力が足りません。翌月へ進むと回復します。'); return; }
      const material = Math.round(sel.cost * L.DIY_MATERIAL_RATE);
      if ((sel.progress || 0) <= 0 && state.cash < material) { alert(`材料費 ${L.yen(material)} が足りません。`); return; }
      close();
      openDiySession(propId, sel, category, back);
    });
    box.querySelector('#wk-pro')?.addEventListener('click', () => { step = 3; draw(); });
    box.querySelector('#wk-cash')?.addEventListener('click', () => order(false));
    box.querySelector('#wk-loan')?.addEventListener('click', () => order(true));
    box.querySelector('.wk-toggle-tip')?.addEventListener('click', () => {
      box.querySelector('#wk-tip-body').classList.toggle('hidden');
      box.querySelector('.wk-toggle-tip .inline-block').classList.toggle('rotate-90');
    });
  };

  const order = (financed) => {
    if (state.actionPower < 5) { alert('行動力が足りません'); return; }
    const r = runWork(propId, sel, false, financed);
    if (!r.started) { alert(r.reason === 'cash' ? '現金が足りません' : '発注できませんでした'); return; }
    state = r.state;
    const p = state.properties.find(x => x.id === propId);
    pushLog(`${p.name || p.label} の${sel.label}を業者へ発注（${r.financed ? `リフォームローン${L.yen(r.loanAmount)}` : `現金${L.yen(r.cost)}`}）`);
    save(); render(); close();
    showRepairEffect(propId, `🔨 ${sel.label} を発注（工期${r.monthsTotal || r.months || 1}ヶ月）`);
  };

  draw();
}
