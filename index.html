// v7: 初回チュートリアル。先輩大家🧑‍🏫の吹き出しが基本動作を順番に案内する。
// 「次へ」ボタンでは進めず、実際に対象ボタンを押すことでのみ次のステップへ進む（スキップは可）。
// 各アクション処理の実処理箇所（wireWorkButton・openSearchModal・openListingsModal・
// .listing-buy・#of-full・showPayment・onNextMonth）から tutMaybeAdvance(key) を呼び、
// 現在のステップと一致すれば進む。開始時に state のスナップショットを取り、
// 終了・スキップのいずれでも必ず復元する（チュートリアル中の操作を本編に持ち越さない）。
// v3.12: 対象ボタンはPC用パネル（btn-*）とスマホ用バー（m-*）で別物なので、候補を並べて
// 「実際に画面に出ている方」を選ぶ。従来はPC用のidだけを見ており、スマホではすべての対象が
// 非表示（実サイズ0）だったため、吹き出しが毎回画面左上に固定され上部の情報バーに被っていた。
// v7.2: 「1ステップ＝押すボタン1つ」に統一する。
// 従来は「探すを押し、中の動いて情報を集めるを押す」のように1ステップに2操作を詰めており、
// 穴が次のボタンへ移っても文面が変わらず、どちらを押すのか分からなかった。
//
// keep: そのステップで開いたままにしてよい重ね画面のid。ここに無いものは renderTutStep が勝手に閉じる。
// 従来は探すモーダルが開いたまま「🗂️市場」を指しており、対象ボタンがモーダルの裏に隠れて
// 押せず手詰まりになっていた。「説明に不要な画面は出さない」を仕組みで保証する。
const TUT_OVERLAYS = ['search-modal', 'listings-modal', 'purchase-modal', 'detail-modal', 'mobile-drawer'];
const TUTORIAL_STEPS = [
  { key: 'work', keep: [], targets: ['m-work', 'btn-work'],
    text: 'まずは種銭づくり。💼「働く」を押してみよう。' },
  { key: 'openSearch', keep: [], targets: ['m-search', 'btn-open-search'],
    text: '次は物件探し。🏘️「物件を探す」を押そう。' },
  { key: 'search', keep: ['search-modal'], targets: ['btn-search'], rebuild: () => openSearchModal(),
    text: '🔍「動いて情報を集める」を押そう。押すほど出物に近づく。' },
  // スマホは市場一覧が≡メニューの中にあるため1手増える。PCでは対象が無いので自動で飛ぶ。
  { key: 'drawer', keep: [], targets: ['m-menu'], optional: true,
    text: '見つけた物件は市場一覧に並ぶ。≡「メニュー」を開こう。' },
  { key: 'listings', keep: ['mobile-drawer'], targets: ['dr-listings', 'btn-open-listings'],
    text: '🗂️「市場」を押して、見つけた物件を見てみよう。' },
  { key: 'buy', keep: ['listings-modal'], selector: '.listing-buy', rebuild: () => openListingsModal(),
    text: '物件の「買付を検討」を押そう。' },
  { key: 'offer', keep: ['purchase-modal'], selector: '#of-full',
    text: '「満額」を押そう。満額なら必ず通る（指値は断られることもある）。' },
  { key: 'payment', keep: ['purchase-modal'], selector: '#pay-cash',
    text: '「現金一括」を押そう。融資を使うなら頭金をスライダーで決める。' },
  // v7.4: 月が変わると行動力が全回復する、という一番大事な循環をここで体験させる。
  // prepare で行動力をわざと一桁まで減らしておき、押した瞬間に満タンへ戻るのを見せる。
  { key: 'next', keep: [], targets: ['m-next', 'btn-next-month-desk'],
    prepare: () => { state.actionPower = 6; },
    text: '行動力が残り6しかない。📅「翌月へ進む」を押そう。' },
  // ここから先は押すボタンが無い説明。吹き出しの「次へ」で進む。
  // v7.5: 回復は専用の演出ではなく、実際の行動力の欄を指して見せる。
  // チュートリアルだけの特別な画面を作ると、本編で同じものを探しても見つからない。
  { key: 'apRecovered', keep: [], info: true, targets: ['hud-ap', 'hud-ap-m'],
    text: 'ここを見てほしい。行動力が6から満タンに戻っている。月が変わるたび、ここが全回復する。' },
  { key: 'terms', keep: [], info: true, targets: ['btn-terms'],
    text: '点線の用語はポインタを合わせると説明が出る。📖 で表示のON/OFF、長押しで用語集がまとめて読める。' },
  // v7.6: ここで「押して確認してみよう」とは言わない。押すと開く画面は暗幕の下に入って読めず、
  // 促しておきながら確認できない状態になる。場所だけ教えて、確認は本編に入ってからにしてもらう。
  { key: 'panel', keep: [], info: true, targets: ['panel-left', 'mobile-status'],
    text: 'ここに現金・月CF・バランスシート。純資産や負債といった財務の状況、法人成りもこの中から。経過年数と年齢は画面いちばん上に出ている。各項目はあとでゆっくりチェックしてみてね。' },
  { key: 'finish', keep: [], final: true,
    text: 'ひととおり触れた！ここまでの操作はリセットされ、本編は最初から始まる。' },
];

// そのステップに不要な重ね画面を閉じる。各モーダルの close() と同じ後始末をする。
function closeTutOverlays(keep = []) {
  for (const id of TUT_OVERLAYS) {
    if (keep.includes(id)) continue;
    const m = document.getElementById(id);
    if (!m || m.classList.contains('hidden')) continue;
    m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
  }
}
// ステップの対象を実DOMから探す（実際に画面に出ている＝実サイズを持つものだけを返す）
function visibleTutTarget(stp) {
  if (stp.selector) {
    const e = document.querySelector(stp.selector);
    if (!e) return null;
    const r = e.getBoundingClientRect();
    return r.width > 0 && r.height > 0 ? e : null;
  }
  for (const id of stp.targets) {
    const e = document.getElementById(id);
    if (!e) continue;
    const r = e.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) return e;
  }
  return null;
}
let tutIdx = -1, tutBubble = null, tutSnapshot = null;
// v7.1: 対象ボタンの周囲だけ穴を開けた4枚の暗幕（上下左右）で覆い、対象以外は暗くしつつクリックも塞ぐ。
// 単一のオーバーレイに穴を開けるのではなく、対象の矩形を避けて上下左右の帯を敷き詰める方式。
let tutMaskEls = [];
// renderTutStep の世代。次フレームでの再測定が「古いステップの予約」かを判別するために使う。
let tutRenderSeq = 0;
let tutObserver = null;   // 対象の実寸が決まるのを待つ監視役（ステップごとに張り替える）
function clearTutMask() { tutMaskEls.forEach(e => e.remove()); tutMaskEls = []; }
function buildTutMask(rect) {
  clearTutMask();
  const pad = 8;
  const l = Math.max(0, rect.left - pad), t = Math.max(0, rect.top - pad);
  const w = rect.width + pad * 2, h = rect.height + pad * 2;
  const vw = window.innerWidth, vh = window.innerHeight;
  const bands = [
    { left: 0, top: 0, width: vw, height: t },                              // 上
    { left: 0, top: t + h, width: vw, height: Math.max(0, vh - t - h) },    // 下
    { left: 0, top: t, width: l, height: h },                               // 左
    { left: l + w, top: t, width: Math.max(0, vw - l - w), height: h },     // 右
  ];
  bands.forEach(b => {
    if (b.width <= 0 || b.height <= 0) return;
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;background:rgba(2,6,23,0.6);z-index:64;`;
    d.addEventListener('click', (e) => e.stopPropagation());
    document.body.appendChild(d);
    tutMaskEls.push(d);
  });
}
function startTutorial() {
  tutSnapshot = structuredClone(state);
  tutStepStates = [];
  closeTutOverlays([]);   // 開いたままの画面があると1手目から対象が隠れる
  tutIdx = 0;
  renderTutStep();
}
function endTutorial() {
  localStorage.setItem('lm_tutorial_done', '1');
  tutBubble?.remove(); tutBubble = null;
  tutObserver?.disconnect(); tutObserver = null;
  tutStepStates = [];
  clearTutMask();
  closeTutOverlays([]);   // 途中でスキップしても、開きっぱなしの画面を残さない
  document.querySelectorAll('.tut-hl').forEach(e => e.classList.remove('tut-hl'));
  tutIdx = -1;
  if (tutSnapshot) {
    state = tutSnapshot; tutSnapshot = null;
    save(); render();
    showTutEndToast();
  }
}
// 進捗表示。optional（レイアウト依存で出ないことがある）は数に入れないので、
// PCでもスマホでも分母が変わらない。
function tutStepTotal() { return TUTORIAL_STEPS.filter(s => !s.optional).length; }
function tutStepNo() {
  let n = 0;
  for (let i = 0; i <= tutIdx && i < TUTORIAL_STEPS.length; i++) if (!TUTORIAL_STEPS[i].optional) n += 1;
  return Math.max(1, n);
}

// v7.3: 「← 前に戻る」。押した操作はゲームの状態を変えてしまうので（働けば現金が増え、
// 買えば物件が増える）、各ステップに入る直前の状態を控えておき、戻るときはそこへ復元する。
// 巻き戻さずに画面だけ戻すと、2回働いた・2回買ったという状態が残ってしまう。
let tutStepStates = [];

// 戻り先にできるのは「実際に表示された」かつ「画面を作り直せる」ステップだけ。
// 満額・現金一括の段は買付フローの途中状態（指値が通った直後）で、外から復元できない。
// その場合はさらに手前（買付を検討）まで戻し、そこからやり直してもらう。
function tutCanReturnTo(i) {
  const stp = TUTORIAL_STEPS[i];
  if (!tutStepStates[i]) return false;             // 表示されなかった段（飛ばした段）
  if (!stp.keep || stp.keep.length === 0) return true;   // 重ね画面が要らない段はそのまま戻れる
  return typeof stp.rebuild === 'function';        // 要る段は作り直せるものだけ
}

function tutPrevIdx() {
  for (let i = tutIdx - 1; i >= 0; i--) if (tutCanReturnTo(i)) return i;
  return -1;
}

function tutGoBack() {
  const prev = tutPrevIdx();
  if (prev < 0) return;
  state = structuredClone(tutStepStates[prev]);
  // 戻り先より後の控えは捨てる（そこから進み直すと取り直される）
  tutStepStates = tutStepStates.slice(0, prev);
  tutIdx = prev;
  save(); render();
  renderTutStep();
}

// 現在のステップに対応する実操作が起きたときだけ呼ばれる。一致しなければ何もしない。
function tutMaybeAdvance(key) {
  if (tutIdx < 0 || TUTORIAL_STEPS[tutIdx].key !== key) return;
  tutIdx += 1;
  if (tutIdx >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const nx = TUTORIAL_STEPS[tutIdx];
  // 段に入る前の下ごしらえ（行動力を減らす等）。render() が続けて renderTutStep を呼ぶので
  // ここで renderTutStep を直接呼ぶと二重描画になる。
  if (typeof nx.prepare === 'function') { nx.prepare(); save(); render(); return; }
  renderTutStep();
}

function showTutEndToast() {
  const t = el(`<div class="fixed top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-white rounded-lg shadow-lg px-4 py-2 z-50 text-sm font-bold">🧑‍🏫 チュートリアル終了！ここからが本編だ</div>`);
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity 0.5s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2200);
}
// v7.4: 締めの画面。指すボタンが無いので画面全体を暗幕1枚で覆い、中央に吹き出しを置く。
// ここで初めて「本編を始める」を押させる（それまでは勝手に本編へ入らない）。
function renderTutFinal(stp) {
  if (!tutStepStates[tutIdx]) tutStepStates[tutIdx] = structuredClone(state);
  clearTutMask();
  const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.72);z-index:64;';
  veil.addEventListener('click', (e) => e.stopPropagation());
  document.body.appendChild(veil);
  tutMaskEls.push(veil);

  const canBack = tutPrevIdx() >= 0;
  tutBubble = el(`<div class="fixed inset-0 z-[65] flex items-center justify-center p-4 pointer-events-none">
    <div class="bg-white rounded-xl shadow-2xl p-4 w-full max-w-xs space-y-3 border-2 border-amber-400 pointer-events-auto text-center">
      <div class="text-3xl">🧑‍🏫</div>
      <div class="font-bold text-slate-800">チュートリアル終了</div>
      <div class="text-xs text-slate-700 leading-relaxed text-left">${linkTerms(stp.text)}</div>
      <button class="tut-finish w-full bg-amber-500 hover:bg-amber-600 text-white rounded-lg py-2.5 text-sm font-bold shadow">🎬 本編を始める</button>
      <button class="tut-back text-navy text-[11px] font-bold ${canBack ? '' : 'invisible'}">← 前に戻る</button>
    </div></div>`);
  document.body.appendChild(tutBubble);
  tutBubble.querySelector('.tut-finish').addEventListener('click', endTutorial);
  tutBubble.querySelector('.tut-back').addEventListener('click', tutGoBack);
}

function renderTutStep() {
  if (tutIdx < 0) return;
  tutBubble?.remove(); tutBubble = null;
  clearTutMask();
  document.querySelectorAll('.tut-hl').forEach(e => e.classList.remove('tut-hl'));
  if (tutIdx >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const stp = TUTORIAL_STEPS[tutIdx];
  // v7.2: このステップに不要な重ね画面は先に閉じる。開いたままだと対象ボタンが裏に隠れて押せない。
  closeTutOverlays(stp.keep || []);
  // v7.4: 最終ステップは指すボタンが無い。画面全体を暗くして中央に締めの吹き出しを出す。
  if (stp.final) { renderTutFinal(stp); return; }
  let target = visibleTutTarget(stp);
  // v7.3: 「戻る」で来たときは必要な画面が閉じている。作り直せる段はここで開き直す。
  if (!target && typeof stp.rebuild === 'function') {
    stp.rebuild();
    target = visibleTutTarget(stp);
  }
  // 対象が画面に無いステップは飛ばす（スマホだけのメニュー等）。説明に不要な操作は勝手に省く。
  if (!target) { tutIdx += 1; renderTutStep(); return; }
  // この段に入る直前の状態を控える（戻るときの復元点）。再表示では上書きしない。
  if (!tutStepStates[tutIdx]) tutStepStates[tutIdx] = structuredClone(state);
  target.classList.add('tut-hl');
  buildTutMask(target.getBoundingClientRect());
  // v7.2: 吹き出しと三角はクリックを透過させる。三角は対象ボタンの上にかぶることがあり、
  // 透過しないと「光っているボタンを押したのに反応しない」状態になる（実際に3段目で起きていた）。
  // スキップだけは押せる必要があるので、そこだけ pointer-events を戻す。
  // v7.3: クリック透過は「三角」だけにする。吹き出し本体まで透過させると、
  // 中の用語（種銭・行動力など）にポインタを合わせても説明が出なくなる。
  // 対象ボタンに実際にかぶるのは対象側へ16px飛び出す三角なので、そこだけ透過すれば足りる。
  const canBack = tutPrevIdx() >= 0;
  tutBubble = el(`<div class="fixed z-[65] pointer-events-none" style="visibility:hidden; left:0; top:0;">
    <div class="relative bg-white rounded-xl shadow-2xl p-3 text-xs space-y-2 border-2 border-amber-400 pointer-events-auto">
      <div class="flex items-center justify-between gap-2">
        <span class="font-bold text-slate-800">🧑‍🏫 先輩大家</span>
        <span class="text-[10px] text-slate-500">${tutStepNo()} / ${tutStepTotal()}</span>
      </div>
      <div class="text-slate-700 leading-relaxed">${linkTerms(stp.text)}</div>
      ${stp.info
        ? '<button class="tut-nextstep w-full bg-navy hover:bg-navy-dark text-white rounded-lg py-1.5 text-xs font-bold">次へ ▶</button>'
        : '<div class="text-[11px] text-amber-700 font-bold">👆 光っているボタンを押してください</div>'}
      <div class="flex items-center justify-between gap-2 pt-1">
        <button class="tut-back text-navy text-[11px] font-bold ${canBack ? '' : 'invisible'}">← 前に戻る</button>
        <button class="tut-skip text-slate-500 text-[11px] underline">スキップ</button>
      </div>
      <div class="tut-arrow absolute pointer-events-none"></div>
    </div></div>`);
  document.body.appendChild(tutBubble);
  placeTutBubble(tutBubble, target.getBoundingClientRect());
  tutBubble.querySelector('.tut-skip').addEventListener('click', endTutorial);
  tutBubble.querySelector('.tut-back').addEventListener('click', tutGoBack);
  // 押すボタンが無い説明の段は、吹き出しの「次へ」で進む
  tutBubble.querySelector('.tut-nextstep')?.addEventListener('click', () => tutMaybeAdvance(stp.key));
  // v7.2: 対象の実寸が確定してから穴と吹き出しを置き直す。
  // CDN版TailwindはCSSを非同期に生成するため、開いた直後のモーダルやドロワーは
  // まだ w-72 等が効いておらず、その瞬間に測ると幅がまるで違う。実際スマホの≡メニューでは
  // 穴が別の場所に開き、光っているボタンが暗幕に覆われて押せなくなっていた。
  // ResizeObserver で「実際に大きさが決まった瞬間」に追従し、遅れて効くCSSも取りこぼさない。
  const seq = ++tutRenderSeq;
  const reflow = () => {
    if (seq !== tutRenderSeq || tutIdx < 0 || !tutBubble || !document.body.contains(target)) return;
    const r = target.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    buildTutMask(r);
    placeTutBubble(tutBubble, r);
  };
  requestAnimationFrame(reflow);
  tutObserver?.disconnect();
  tutObserver = new ResizeObserver(reflow);
  tutObserver.observe(target);
  setTimeout(reflow, 250);   // ResizeObserverが動かない環境向けの保険
}

// v3.12: 吹き出しを「対象ボタンに重ならない空いている側」へ置き、対象を指す三角を出す。
// 従来は対象の258px左に固定していたため、幅の狭いスマホでは必ず左端(8,8)へ丸められ、
// 上部の情報バーに文字が被ったうえ何を指しているのか分からなくなっていた。
function placeTutBubble(bubble, r) {
  const vw = window.innerWidth, vh = window.innerHeight, M = 8, GAP = 12, A = 8;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const w = Math.min(260, vw - M * 2);
  bubble.style.width = w + 'px';
  const h = bubble.offsetHeight;                       // 幅確定後に実測する
  let left, top, dir;
  if (r.left - w - GAP >= M) {                         // 対象の左に置く（PCの右パネル）
    dir = 'right'; left = r.left - w - GAP; top = clamp(r.top - 10, M, vh - h - M);
  } else if (r.right + w + GAP <= vw - M) {            // 対象の右に置く（PCの左パネル）
    dir = 'left'; left = r.right + GAP; top = clamp(r.top - 10, M, vh - h - M);
  } else if (r.top - h - GAP >= M) {                   // 対象の上に置く（スマホ下部バー）
    dir = 'down'; left = clamp(r.left + r.width / 2 - w / 2, M, vw - w - M); top = r.top - h - GAP;
  } else {                                             // 対象の下に置く（スマホ上部バー）
    dir = 'up'; left = clamp(r.left + r.width / 2 - w / 2, M, vw - w - M); top = clamp(r.bottom + GAP, M, vh - h - M);
  }
  bubble.style.left = Math.round(left) + 'px';
  // 対象の上に置く場合は下端を基準にする。文字が後から折り返して高さが伸びても、
  // 吹き出しは上へ伸びるだけで対象ボタンに被らない（高さの実測値に依存しない）。
  if (dir === 'down') { bubble.style.top = 'auto'; bubble.style.bottom = Math.round(vh - r.top + GAP) + 'px'; }
  else { bubble.style.bottom = 'auto'; bubble.style.top = Math.round(top) + 'px'; }
  const ax = clamp(r.left + r.width / 2 - left, 16, w - 16);
  const ay = clamp(r.top + r.height / 2 - top, 16, h - 16);
  const arrow = bubble.querySelector('.tut-arrow');
  const base = 'position:absolute;width:0;height:0;';
  if (dir === 'down')       arrow.style.cssText = `${base}left:${ax - A}px;bottom:${-A * 2}px;border-left:${A}px solid transparent;border-right:${A}px solid transparent;border-top:${A * 2}px solid #fbbf24;`;
  else if (dir === 'up')    arrow.style.cssText = `${base}left:${ax - A}px;top:${-A * 2}px;border-left:${A}px solid transparent;border-right:${A}px solid transparent;border-bottom:${A * 2}px solid #fbbf24;`;
  else if (dir === 'right') arrow.style.cssText = `${base}top:${ay - A}px;right:${-A * 2}px;border-top:${A}px solid transparent;border-bottom:${A}px solid transparent;border-left:${A * 2}px solid #fbbf24;`;
  else                      arrow.style.cssText = `${base}top:${ay - A}px;left:${-A * 2}px;border-top:${A}px solid transparent;border-bottom:${A}px solid transparent;border-right:${A * 2}px solid #fbbf24;`;
  bubble.style.visibility = 'visible';
}

      si.addEventListener('input', upd);
      m.querySelectorAll('.wz-seedp').forEach(b => b.addEventListener('click', () => { si.value = b.dataset.v; upd(); }));
      collect = () => { data.seed = Number(si.value); return true; };
    } else if (step === 4) {
      inner = `<div class="flex gap-2">
          <label class="flex-1 border-2 rounded-xl p-2 text-sm text-center ${data.goalType === 'networth' ? 'border-navy bg-slate-50 font-bold' : ''}"><input type="radio" name="wz-goaltype" value="networth" ${data.goalType === 'networth' ? 'checked' : ''} class="mr-1">純資産</label>

      m.appendChild(el(frame('目指す頂は？', '目標なき航海に、追い風は吹かない。', inner)));
      const gi = m.querySelector('#wz-goal');
      // 目標タイプごとにスライダーの範囲・刻みを切り替え

      const setupSlider = () => {
        const [mn, mx, st2] = RANGES[data.goalType];
        gi.min = mn; gi.max = mx; gi.step = st2;
        gi.value = Math.max(mn, Math.min(mx, data.goalAmount));

        const box = m.querySelector('#wz-goalp'); box.innerHTML = '';
        presetsFor(data.goalType).forEach(([v, l]) => {

        });
      };
      m.querySelectorAll('input[name="wz-goaltype"]').forEach(r => r.addEventListener('change', e => {
        data.goalType = e.target.value; data.goalAmount = presetsFor(data.goalType)[1][0]; setupSlider(); renderP();
      }));
      setupSlider(); renderP();
      collect = () => { data.goalAmount = Math.max(1, Number(gi.value)); return true; };
    } else if (step === 5) {
      const maxYears = L.maxYearsForAge(data.age);
      if (data.years > maxYears) data.years = maxYears;
      inner = `<div class="text-center text-3xl font-black mb-1"><span id="wz-years-v">${data.years}</span><span class="text-lg">年</span></div>

      inner = `<div class="bg-slate-50 rounded-xl p-4 text-sm leading-relaxed">
          <b>${data.age}歳の${attrLabel}</b>、手元の種銭は<b>${L.yen(startCash)}</b>。<br>
          目標は <b>${data.goalType === 'networth' ? '純資産' : '月間CF'} ${L.yen(data.goalAmount)}</b> を <b>${data.years}年以内</b> に。<br>
          さあ、メガ大家への道を歩みはじめよう。</div>
        <div class="text-xs ${data.difficulty === 'beginner' ? 'text-emerald-700' : 'text-red-600'} font-bold">

      state = L.createInitialState({ attr: data.attr, age: data.age, goalType: data.goalType,
        goalAmount: data.goalAmount, goalYears: data.years, seedCash: data.seed, difficulty: data.difficulty });
      // v8: 初心者は用語ヘルプを既定でON（点線をなぞれば意味が読める状態から始める）
      if (data.difficulty === 'beginner') setTermsOff(false);
      m.classList.add('hidden'); m.innerHTML = ''; save(); resetMapView(); render();
      if (data.tutorial) startTutorial();
    });
  };
  draw();
}

function save(){ localStorage.setItem(SAVE_KEY, L.serialize(state)); }
function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  state = L.deserialize(raw);
  state.stats = state.stats || { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false };
  state.stats.junkRepairs = state.stats.junkRepairs || 0;
  state.badges = state.badges || [];
  state.favorites = state.favorites || [];
  state.notifications = state.notifications || [];
  state.nextNotifId = state.nextNotifId || 1;
  state.salesSearch = state.salesSearch || { spent: 0, threshold: null };   // v3: 営業進捗
  state.nextPropertyId = state.nextPropertyId || 1;
  state = L.migrateSave(state);   // v4: リフォームローンの配列化など新フィールドへの移行
  // v3.5: 旧採番バグで衝突したIDを修復（一覧と詳細が別物件を指す不具合の根治）
  const dd = L.dedupePropertyIds(state);
  if (dd.fixed) { state = dd.state; console.info(`物件IDの重複を${dd.fixed}件修復しました`); }
  return true;
}

// v5: render()では視点を動かさない。物件詳細を開く・購入する等の操作をしても地図はその場に留まる。
// 初期位置へ戻すのは「翌月へ進む」ときだけで、そのときも瞬間移動ではなく animateResetView() で
// ゆっくり回って戻る（v3.5では毎回のrender()でリセットしていたが、動きすぎるという指摘を受けて変更）。
function render(){
  setCityState(state); renderHeaderClock(); renderDangerBanner(); renderPanelLeft(); renderPanelRight(); renderMobileBars(); checkEnd(); checkNewBadges(); save(); showExpFloats();
  document.getElementById('btn-result')?.classList.toggle('hidden', !state?.freePlay);   // v3.7: クリア後はいつでもリザルトへ
  if (tutIdx >= 0) renderTutStep();   // v3.7: チュートリアル中は吹き出しを追従させる
}

  const m = document.getElementById('mobile-drawer');
  m.classList.remove('hidden');

function pushLog(msg){ state.log = state.log || []; state.log.unshift(msg); if(state.log.length>50) state.log.pop(); }
function gainExp(skill, base){ state.skills[skill].exp += Math.round(base * (state.expMult||1)); }

// ホーム画面の「詳細を表示」開閉状態。render()を跨いで記憶する（毎回閉じ直されないように）。
let bsDetailOpen = false;

// v8: 経過年数と年齢はヘッダーに常設する。左パネルはスマホでは表示されないため、
// そこにしか無いと「いま何年目か」がスマホから完全に見えなくなっていた。
function elapsedText(s) { return `${Math.floor(s.month / 12)}年${s.month % 12}ヶ月`; }
// 開始年齢。旧セーブには startAge が無いので、現在年齢から経過年数を引いて復元する。
function startAgeOf(s) { return s.startAge ?? ((s.age ?? 0) - Math.floor(s.month / 12)); }

// v8: 初心者モードの赤バナー。通知に気づかないまま家賃がゼロになる事故を防ぐため、
// 危険帯以上の物件があるあいだは地図の上に出しっぱなしにする（中上級では出さない）。
function renderDangerBanner() {
  const box = document.getElementById('danger-banner');
  if (!box) return;
  const on = state && state.difficulty === 'beginner';
  const bad = on ? state.properties.filter(p => L.BAND_RANK[L.worstBandOf(p)] >= L.BAND_RANK.danger) : [];
  box.classList.toggle('hidden', bad.length === 0);
  if (!bad.length) return;
  const dead = bad.filter(p => L.worstBandOf(p) === 'dead');
  const head = dead.length
    ? `🛑 ${dead.length}件が募集停止中（家賃が入っていません）`
    : `🚨 ${bad.length}件が危険水準です`;
  box.innerHTML = `<div class="rounded-lg px-3 py-2 text-xs font-bold shadow-lg text-center ${dead.length ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'}">
    ${head}<div class="font-normal text-[11px] mt-0.5">${bad.slice(0, 3).map(p => p.name || p.label).join('・')}${bad.length > 3 ? ` ほか${bad.length - 3}件` : ''}／🏠所有 から修繕を</div></div>`;
}

function renderHeaderClock() {
  const box = document.getElementById('hud-clock');
  if (!box) return;
  box.classList.toggle('hidden', !state);
  if (!state) return;
  box.querySelector('#hud-elapsed').textContent = elapsedText(state);
  box.querySelector('#hud-age').textContent = state.age ?? '-';
}

// バランスシートの先頭に置く1行。PC左パネルとスマホの資産モーダルで共用する。
function bsElapsedRow() {
  return `<div class="text-[11px] hud-sub border-b hud-divide pb-1 mb-1">
    経過 <b>${elapsedText(state)}</b> ／ 現在 <b>${state.age ?? '-'}歳</b>（開始 ${startAgeOf(state)}歳）</div>`;
}

  const mcf = L.monthlyCF(state);

    <div class="hud-panel pointer-events-auto rounded-xl shadow-lg p-3 text-xs space-y-3">

          <div class="text-[11px] font-bold hud-sub">💰 現金</div>

        </button>
        <button class="kpi-btn hud-tile rounded-lg p-2 text-left" data-kpi="props">

          <div class="font-bold truncate ${mcf >= 0 ? 'hud-money' : 'hud-bad'}">${L.yen(mcf)}</div>

          <div class="text-[11px] font-bold hud-sub">📊 ${term('credit_score', '信用度')}</div>
          <div class="font-bold">${state.creditScore}</div>
        </button>
      </div>
      <div class="hud-divide pt-2">
        <div class="flex justify-between text-[11px] font-bold hud-accent mb-1"><span>🎯 目標達成度</span><span>${pct}%</span></div>
        <div class="w-full hud-track rounded-full h-2 overflow-hidden"><div class="bg-emerald-500 h-2 rounded-full" style="width:${pct}%"></div></div>
      </div>
      <button id="btn-bs-toggle" class="w-full text-[11px] font-bold hud-accent underline">${bsDetailOpen ? '▲ バランスシートを閉じる' : '▶ バランスシート詳細'}</button>
      <div id="bs-detail" class="space-y-1 text-xs hud-divide pt-2 ${bsDetailOpen ? '' : 'hidden'}">

        <div class="flex justify-between"><span class="hud-sub">総資産</span><b>${L.yen(L.totalAssetsV2(state))}</b></div>
        <div class="flex justify-between"><span class="hud-sub">総負債</span><b class="hud-bad">${L.yen(L.totalDebt(state))}</b></div>
        <div class="flex justify-between"><span class="hud-sub">税リスク</span><span class="${risk === '低' ? 'text-sky-400' : risk === '中' ? 'hud-accent' : 'hud-bad'} font-bold">${risk}</span></div>
      </div>
    </div>
  `));
  c.querySelectorAll('.kpi-btn').forEach(b => b.addEventListener('click', () => openKpiModal(b.dataset.kpi)));

// v8.1: 法人化の損得を数字で出す。箇条書きの「こう変わります」だけでは、
// いま設立すべきなのか、まだ早いのかが判断できなかった。
// 課税はデッドクロス後にしか発生しないので、償却が残っているうちは節税額0＝「まだ早い」が正しい答えになる。
function incorporationPitch() {
  const saving = L.incorporationSaving(state);
  const payback = L.incorporationPaybackYears(state);
  const soonest = state.properties.length
    ? Math.min(...state.properties.filter(p => p.owner !== 'corp').map(p => p.deprRemaining ?? 0))
    : null;
  if (saving <= 0) {
    return `<div class="rounded-lg bg-slate-50 p-2 text-[11px] text-slate-600 mb-2">
      <b>いま設立しても節税額は ¥0 です。</b>
      ${state.properties.length === 0
        ? '物件を買ってからでよいでしょう。'
        : `NOIへの課税は${term('dead_cross', 'デッドクロス')}（${term('depreciation', '減価償却')}切れ）後にしか発生しません。`
          + `いちばん早い物件で<b>あと${soonest}ヶ月</b>です。`}
      <div class="mt-1">売却時の${term('capital_gains_tax', '譲渡税')}を短期39%→30%にしたい場合は、早めの設立にも意味があります。</div>
    </div>`;
  }
  const years = payback == null ? null : Math.round(payback * 10) / 10;
  return `<div class="rounded-lg bg-emerald-50 p-2 text-[11px] text-emerald-900 mb-2">
    <div><b>いまの保有物件がすべて法人名義だった場合、年間 ${L.yen(saving)} の節税</b>になります。</div>
    <div class="mt-0.5">設立費用 ${L.yen(L.CONFIG.corporateSetupCost)} の回収まで<b>約${years}年</b>。</div>
    <div class="mt-1 text-emerald-800">※ 既存物件は設立後に1件ずつ移転が必要です（ローン完済済みのみ・移転時に譲渡税と取得コストがかかります）。</div>
  </div>`;
}

// v3.5: 売却センターの一括査定モード状態（モーダルをHUDから開き直すとリセット）
let bulkMode = false;

// 左上の4KPIアイコン（💰🏠📈📊）をタップすると、それぞれの内訳・詳細を表示する。
function openKpiModal(which, keepBulk = false) {
  if (which === 'props' && !keepBulk) bulkMode = false;
  const m = document.getElementById('kpi-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  let title = '', body = '';
  if (which === 'cash') {
    title = '💰 資産スナップショット';
    // v8: スマホではこのモーダルがバランスシートそのものなので、先頭に経過年数と年齢を出す。
    body = `<div class="text-[11px] text-slate-500 border-b pb-1 mb-2">
      経過 <b>${elapsedText(state)}</b> ／ 現在 <b>${state.age ?? '-'}歳</b>（開始 ${startAgeOf(state)}歳）</div>
    <table class="w-full text-sm">
      <tr><td>手元現金</td><td class="text-right font-bold">${L.yen(state.cash)}</td></tr>
      <tr class="border-t"><td>総資産（現金＋物件時価）</td><td class="text-right">${L.yen(L.totalAssetsV2(state))}</td></tr>
      <tr><td>総負債（残債）</td><td class="text-right text-red-600">-${L.yen(L.totalDebt(state))}</td></tr>
      <tr class="border-t font-bold"><td>${term('net_worth', '純資産')}</td><td class="text-right text-emerald">${L.yen(L.netWorth(state))}</td></tr>
    </table>
    ${!state.isIncorporated ? `<div class="mt-4 pt-4 border-t">
      <h3 class="font-bold text-sm mb-1">🏢 法人化</h3>
      <p class="text-[11px] text-slate-500 mb-2">設立費用 ${L.yen(L.CONFIG.corporateSetupCost)}。以降、NOIへの課税が法人税率（${L.CONFIG.corporateTaxRate * 100}%）に固定されます。</p>
      ${incorporationPitch()}
      <button id="btn-incorporate" class="w-full bg-navy text-white rounded py-2 text-sm ${state.cash < L.CONFIG.corporateSetupCost ? 'opacity-40' : ''}" ${state.cash < L.CONFIG.corporateSetupCost ? 'disabled' : ''}>法人を設立する</button>
    </div>` : '<div class="mt-4 pt-4 border-t text-sm font-bold text-navy">🏢 法人化済み</div>'}`;
  } else if (which === 'props') {
    // v3.5: 売却センター。名義・売出中・修繕中・入居状況をバッジで常時表示し、複数まとめて査定できる。
    const corpN = state.properties.filter(p => p.owner === 'corp').length;
    const persN = state.properties.length - corpN;
    title = `🏠 所有物件（${state.properties.length}件）`;
    const header = state.properties.length ? `
      <div class="flex items-center justify-between text-xs mb-1">
        <div class="font-bold text-slate-700">👤個人${persN}件 ・ 🏢法人${corpN}件</div>
        <button id="kpi-bulk-toggle" class="border rounded px-2 py-1 font-bold ${bulkMode ? 'bg-navy text-white' : 'text-navy'}">${bulkMode ? '✕ まとめて査定を終了' : '☑ まとめて査定'}</button>
      </div>
      ${bulkMode ? '<div class="text-[11px] text-slate-500 mb-1">査定したい物件にチェック → 下の「査定する」（1件につき行動力-5）</div>' : ''}` : '';
    // v8: 手当てが要る物件ほど上に出す。件数が増えると危険な物件がスクロールの下に埋もれるため。
    const byRisk = [...state.properties].sort((a, b) =>
      L.BAND_RANK[L.worstBandOf(b)] - L.BAND_RANK[L.worstBandOf(a)]);
    body = state.properties.length ? `${header}<div class="space-y-1">${byRisk.map(p => {
      const occ = p.units.length ? Math.round(p.units.filter(u => u.occupied).length / p.units.length * 100) : 0;
      const listing = (state.listings || []).find(l => l.propertyId === p.id);
      const badges = [
        p.owner === 'corp' ? '<span class="bg-navy text-white rounded px-1">🏢法人</span>' : '<span class="bg-slate-200 text-slate-700 rounded px-1">👤個人</span>',
        listing ? `<span class="bg-amber-500 text-white rounded px-1">📢売出中${listing.listedMonths + 1}ヶ月目</span>` : '',
        // v8.2: 承諾済みで決済待ちの物件は、一覧でもそれと分かるようにする
        (state.pendingSales || []).some(x => x.propertyId === p.id)
          ? '<span class="bg-emerald-600 text-white rounded px-1 font-bold">✅売却成立・翌月決済</span>' : '',
        p.repairJob ? `<span class="bg-amber-100 text-amber-700 rounded px-1">🔨${L.REPAIR_KINDS[p.repairJob.kind || 'large'].label}中 残り${p.repairJob.monthsLeft}ヶ月</span>` : '',
        // v8: 帯に応じて段階表示。使用不能・管理崩壊は工事中でも隠さない（募集停止が続いているため）
        L.structBandOf(p) === 'dead' ? '<span class="bg-red-600 text-white rounded px-1 font-bold">🛑使用不能</span>'
          : (!p.repairJob && L.structBandOf(p) === 'danger') ? '<span class="bg-red-100 text-red-700 rounded px-1">🚨躯体が危険</span>'
          : (!p.repairJob && L.structBandOf(p) === 'warn') ? '<span class="bg-amber-100 text-amber-700 rounded px-1">⚠️躯体が注意</span>' : '',
        L.careBandOf(p) === 'dead' ? '<span class="bg-red-600 text-white rounded px-1 font-bold">🛑管理崩壊</span>'
          : (!p.repairJob && L.careBandOf(p) === 'danger') ? '<span class="bg-red-100 text-red-700 rounded px-1">🚨手入れが危険</span>'
          : (!p.repairJob && L.careBandOf(p) === 'warn') ? '<span class="bg-amber-100 text-amber-700 rounded px-1">🧹要メンテ</span>' : '',
        p.autoManage ? '<span class="bg-emerald-100 text-emerald-700 rounded px-1">🏢おまかせ中</span>' : '',
        // v4: 原状回復が済んでいない部屋は募集できない＝空室損が続くので一覧で目立たせる
        p.units.filter(u => u.needsRestore).length
          ? `<span class="bg-red-500 text-white rounded px-1">要原状回復${p.units.filter(u => u.needsRestore).length}室</span>` : '',
        p.diyProgress ? `<span class="bg-emerald-100 text-emerald-700 rounded px-1">🔨DIY中${Math.min(100, Math.round(p.diyProgress.done))}%</span>` : '',
        occ >= 100 ? '<span class="bg-emerald-100 text-emerald-700 rounded px-1">満室</span>' : `<span class="bg-slate-100 text-slate-600 rounded px-1">入居${occ}%</span>`,
      ].filter(Boolean).join(' ');

        <div class="kpi-prop flex items-center gap-2 ${bulkMode ? '' : 'cursor-pointer'}" data-id="${p.id}">
          ${bulkMode ? `<input type="checkbox" class="kpi-check w-4 h-4 shrink-0" data-id="${p.id}">` : ''}

          <div class="min-w-0 flex-1"><div class="font-bold">${p.name || p.label}</div>
          <div class="text-slate-500">${p.label}｜利回り${(p.grossYield * 100).toFixed(1)}%・躯体${Math.round(p.repairState)}%・手入れ${Math.round(p.careState ?? p.repairState)}%</div>
          <div class="mt-0.5 space-x-1 text-[11px]">${badges}</div></div>
        </div>
        ${la ? `<div class="mt-1 pt-1 border-t flex items-center justify-between"><span>査定額 <b class="text-emerald-700">${L.yen(la.amount)}</b> <span class="text-slate-500">（${laAge}）</span></span><button class="kpi-sell bg-emerald text-white rounded px-2 py-1" data-id="${p.id}">売出設定へ</button></div>` : ''}
      </div>`;
    }).join('')}</div>
    ${bulkMode ? '<button id="kpi-bulk-run" class="w-full bg-navy text-white rounded py-2 text-sm font-bold mt-2">🔍 チェックした物件をまとめて査定する</button>' : ''}` : '<div class="text-slate-500 text-sm">まだ物件を所有していません。営業→買付で増やしましょう。</div>';
  } else if (which === 'cf') {
    title = '📈 月間キャッシュフロー内訳';
    const total = L.monthlyCF(state);
    const rows = state.properties.map(p => {
      const cf = p.history.at(-1)?.cf ?? 0;
      return `<tr class="border-t"><td>${p.name || p.label}</td><td class="text-right ${cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(cf)}</td></tr>`;

    body = `<table class="w-full text-sm">${rows || '<tr><td class="text-slate-500 py-2">まだ物件収支の記録がありません（買付後、翌月から計上）</td></tr>'}

  } else if (which === 'credit') {
    title = '📊 信用度と銀行取引実績';
    const rel = state.bankRelations || {};
    const bankRows = Object.keys(L.BANKS).map(k => {
      const r = rel[k] || { loans: 0, paidOff: 0 };
      return `<tr class="border-t"><td>${L.BANKS[k].label}</td><td class="text-right">融資${r.loans}件・完済${r.paidOff}件</td></tr>`;
    }).join('');
    body = `<div class="text-sm mb-2">現在の信用度: <b>${state.creditScore}</b></div>
      <div class="text-[11px] text-slate-500 mb-1">信用度が高いほど審査に通りやすく、取引実績（完済）が増えると金利優遇を受けやすくなります。</div>
      <table class="w-full text-sm">${bankRows}</table>`;
  }
  const boxEl = el(`<div class="bg-white rounded-xl p-4 w-full max-w-md max-h-[75vh] overflow-y-auto space-y-2">
    <div class="flex justify-between items-center"><h2 class="font-bold">${title}</h2><button id="kpi-close" class="text-slate-400 text-xl">✕</button></div>
    <div>${body}</div></div>`);
  m.appendChild(boxEl);
  boxEl.querySelector('#kpi-close').addEventListener('click', close);
  if (which === 'cash' && !state.isIncorporated && state.cash >= L.CONFIG.corporateSetupCost) {
    boxEl.querySelector('#btn-incorporate').addEventListener('click', () => {
      const r = L.incorporate(state);
      state = r.state;
      pushLog('🏢 法人を設立した（法人名義の購入・法人への移転が可能に）');
      save(); render(); close();
      playIncorporationCelebration();
    });
  }
  boxEl.querySelectorAll('.kpi-prop').forEach(b => b.addEventListener('click', () => {
    if (bulkMode) return;   // まとめて査定中は行クリックで詳細を開かない（チェック操作を優先）
    close(); openDetail(parsePropId(b.dataset.id), 'owned', () => openKpiModal('props', true)); }));
  boxEl.querySelector('#kpi-bulk-toggle')?.addEventListener('click', () => {
    bulkMode = !bulkMode; close(); openKpiModal('props', true);
  });
  boxEl.querySelector('#kpi-bulk-run')?.addEventListener('click', () => {
    const ids = [...boxEl.querySelectorAll('.kpi-check')].filter(c => c.checked).map(c => parsePropId(c.dataset.id));
    if (!ids.length) { alert('査定したい物件にチェックを入れてください'); return; }
    const cost = ids.length * 5;
    if (state.actionPower < cost) { alert(`行動力が足りません（${ids.length}件で${cost}必要）`); return; }
    ids.forEach(id => { const r = L.requestAppraisal(state, id, Math.random); state = r.state; });
    pushLog(`まとめて査定を依頼した（${ids.length}件・行動力-${cost}）`);
    save(); renderPanelRight();
    close(); openKpiModal('props', true);

  boxEl.querySelectorAll('.kpi-sell').forEach(b => b.addEventListener('click', (e) => {

}

// 契約は出費を伴い、契約中はDIYが封じられるので、ON/OFFとも必ず確認を取ってから切り替える。
function onAutoManageToggle(p, redraw) {
  const care = p.careState ?? p.repairState ?? 100;
  if (!p.autoManage) {
    const firstCost = care < L.AUTO_MANAGE_CARE_FLOOR ? L.autoManageCost(L.repairCost(p, 'maint')) : 0;
    const msg = `${p.name || p.label} を管理会社におまかせしますか？\n\n`
      + `・手入れが${L.AUTO_MANAGE_CARE_FLOOR}%を切ると自動で日常メンテを発注\n`
      + `・退去した部屋の原状回復も自動で業者手配\n`
      + `・工事費は通常見積の+10%\n`
      + `・この物件ではDIYができなくなります（自主管理EXPも入りません）\n`
      + `・大規模修繕と価値UPは対象外（今までどおり自分で判断）\n\n`
      + (firstCost ? `いま手入れが${Math.round(care)}%なので、契約と同時に初回の日常メンテ ${L.yen(firstCost)} が発生します。` : '手入れは足りているので、今すぐの出費はありません。');
    if (!confirm(msg)) return;
    const r = L.setAutoManage(state, p.id, true);
    state = r.state;
    if (r.started) pushLog(`${p.name || p.label} を管理会社へおまかせした（初回メンテ ${L.yen(r.cost)}）`);
    else if (r.reason === 'noCash') { alert(`現金が足りないため初回の日常メンテを発注できませんでした（必要 ${L.yen(r.cost)}）。契約自体は有効です。`); }
    else pushLog(`${p.name || p.label} を管理会社へおまかせした`);
  } else {
    if (!confirm(`${p.name || p.label} のおまかせ契約を解除しますか？\n\n以降は手入れも原状回復も自分で判断・発注することになりますが、DIYで安く済ませられるようになります。`)) return;
    state = L.setAutoManage(state, p.id, false).state;
    pushLog(`${p.name || p.label} のおまかせ契約を解除した`);
  }
  save(); render(); redraw();
}

// === v6: 用語ヘルプ ===
// 専門用語を term('dscr') で包むと点線の下線が付き、押すと吹き出しで説明が出る。
// ページ遷移はしない（読んでいた場所を見失わせない）。
// 第2引数を渡すと表示文字を差し替えられる（「NOI（営業純収益）」のような表記に使う）。
function term(key, text) {
  const t = L.TERMS[key];
  if (!t) return text || key;   // 定義漏れでも表示は壊さない（テストで検出する）
  return `<span class="term" data-term="${key}">${text || t.label}</span>`;
}

// 銀行の否認理由やチュートリアル文など、logic 側で組み立てられた文字列にも用語ヘルプを付ける。
// 長い語から先に処理し、置換済みの箇所はトークンに退避して二度と触らない
// （「自己資金」を先に処理しないと「資金」だけが引っかかる、といった食い違いを防ぐ）。
const TERM_BY_LABEL = Object.entries(L.TERMS)
  .map(([key, t]) => ({ key, label: t.label }))
  .sort((a, b) => b.label.length - a.label.length);

function linkTerms(text) {
  let out = String(text);
  const slots = [];
  // 退避先の目印には制御文字を使う。本文には現れないので「金利1.5%」のような数字を巻き込まない。
  const M = String.fromCharCode(1);
  for (const { key, label } of TERM_BY_LABEL) {
    const i = out.indexOf(label);
    if (i < 0) continue;
    out = out.slice(0, i) + M + slots.length + M + out.slice(i + label.length);
    slots.push(term(key, label));
  }
  return out.replace(new RegExp(M + '([0-9]+)' + M, 'g'), (_, n) => slots[Number(n)]);
}

// v6.3: 実務でも通じる言葉なのか、このゲームだけの指標なのかを区別して見せる。
// 「行動力」を実務用語だと思い込ませない／「DSCR」を覚えて損はないと分かるようにする。
function scopeLabel(t) {
  return t.scope === 'game' ? 'このゲーム独自' : '実務で使う用語';
}

let termPop = null;
function closeTermPopover() { termPop?.remove(); termPop = null; }

function showTermPopover(anchor) {
  closeTermPopover();
  const t = L.TERMS[anchor.dataset.term];
  if (!t) return;
  termPop = el(`<div class="term-pop">
    <div><b>${t.label}</b>${t.reading ? ` <span class="tp-yomi">（${t.reading}）</span>` : ''} <span class="tp-scope tp-${t.scope}">${scopeLabel(t)}</span></div>
    <div class="mt-1">${t.def}</div>
    <div class="mt-1 tp-calc">🧮 ${t.calc}</div>
    <div class="mt-1">${t.here}</div>
    <div class="mt-1 tp-hint">💡 ${t.hint}</div>
    <div class="mt-2 tp-foot">📖 長押しで用語集（全${Object.keys(L.TERMS).length}語）・押すと用語の表示ON/OFF</div>
  </div>`);
  termPop.dataset.for = anchor.dataset.term;
  document.body.appendChild(termPop);
  const a = anchor.getBoundingClientRect();
  const w = termPop.offsetWidth, h = termPop.offsetHeight;
  const pad = 8;
  // 下に出すのが基本。下に入らなければ上へ回す。左右は画面内に丸める。
  const top = (a.bottom + h + pad <= window.innerHeight) ? a.bottom + 6 : Math.max(pad, a.top - h - 6);
  const left = Math.max(pad, Math.min(window.innerWidth - w - pad, a.left + a.width / 2 - w / 2));
  termPop.style.top = `${top}px`;
  termPop.style.left = `${left}px`;
}

// v6.2: 用語ヘルプのON/OFF。ヘッダーの 📖 で切り替え、音のON/OFFと同じくlocalStorageに残す。
const TERMS_KEY = 'leverage_master_terms_off';
let termsOff = localStorage.getItem(TERMS_KEY) === '1';

function applyTermsMode() {
  document.body.classList.toggle('terms-off', termsOff);
  const b = document.getElementById('btn-terms');
  if (b) { b.textContent = termsOff ? '📕' : '📖'; b.style.opacity = termsOff ? '0.45' : '1'; }
  if (termsOff) closeTermPopover();
}

function setTermsOff(off) {
  termsOff = off;
  localStorage.setItem(TERMS_KEY, off ? '1' : '0');
  applyTermsMode();
}

// 用語はモーダルの中にも動的に生えるので、個別に登録せず document で一度だけ拾う。
// v6.2: ポインタを合わせるだけで出す。タッチ端末にはホバーが無いのでタップでも出す。
function initTermHelp() {
  const anchorOf = (e) => (termsOff ? null : e.target?.closest?.('.term'));

  document.addEventListener('pointerover', (e) => {
    const a = anchorOf(e);
    // マウス以外（タッチ・ペン）の pointerover は click と二重に走るのでここでは扱わない
    if (!a || e.pointerType !== 'mouse') return;
    if (termPop?.dataset.for === a.dataset.term) return;   // 同じ語に留まっている間は出し直さない
    showTermPopover(a);
  });
  document.addEventListener('pointerout', (e) => {
    if (e.pointerType !== 'mouse') return;
    const from = e.target?.closest?.('.term');
    // 用語の外へ出たら閉じる（用語内の子要素へ移っただけなら閉じない）
    if (from && !from.contains(e.relatedTarget)) closeTermPopover();
  });

  // タッチ端末用。同じ語を再度タップすると閉じる。
  document.addEventListener('click', (e) => {
    const a = anchorOf(e);
    if (!a) { closeTermPopover(); return; }
    e.stopPropagation();
    if (termPop?.dataset.for === a.dataset.term) { closeTermPopover(); return; }
    showTermPopover(a);
  }, true);

  window.addEventListener('resize', closeTermPopover);
  document.addEventListener('scroll', closeTermPopover, true);
  applyTermsMode();
}

      <button id="gl-close" class="text-slate-400 text-xl leading-none">✕</button></div>
    <div class="px-3 pt-2 shrink-0">
      <div class="flex justify-between text-[11px] font-bold text-navy"><span>📚 習得の進み</span><span>${learned.size} / ${Object.keys(L.TERMS).length}</span></div>
      <div class="w-full bg-slate-200 rounded-full h-2 mt-1 overflow-hidden"><div class="bg-navy h-2" style="width:${Math.round(learned.size / Object.keys(L.TERMS).length * 100)}%"></div></div>
      <div class="text-[10px] text-slate-500 mt-1">勉強会・大家の会の📚用語クイズで正解すると習得済みになります。</div>
    </div>
    <div class="p-3 overflow-y-auto min-h-0 flex-1">
      <div class="text-[11px] text-slate-500 mb-2">ゲーム中は、点線の下線が引かれた用語を押すと同じ説明が吹き出しで出ます。</div>
      ${L.TERM_GROUPS.map(section).join('')}</div></div>`);
  m.appendChild(box);
  box.querySelector('#gl-close').addEventListener('click', close);
}

// 構造の表示名。'木造' には既に「造」が入っているので、S・RCのときだけ「造」を足す
// （そのまま `${structure}造` と書くと「木造造」になる）。
function structureLabel(p) {
  return p.structure === '木造' ? '木造' : `${p.structure}造`;
}

// v6: ゲージは2本。🏚躯体は大規模修繕でしか戻らず、🧹手入れは日常メンテで100%まで戻る。
// 内部は小数で持っているので、表示のたびに丸める。
// 色は 緑(60%以上)→黄(20〜59%)→赤(20%未満)。
// v8: 色と警告文は帯（ok/warn/danger/dead）から引く。躯体と手入れで閾値が違うので、
// どちらのゲージかは呼び出し側が band を渡して決める（ここで数値から推測しない）。
const BAND_BAR = { ok: 'bg-emerald', warn: 'bg-yellow-400', danger: 'bg-red-500', dead: 'bg-red-600 lm-blink' };
const BAND_NOTE = {
  ok: '', warn: '<span class="text-amber-600 text-[11px] font-bold ml-1">⚠️注意</span>',
  danger: '<span class="text-red-600 text-[11px] font-bold ml-1">🚨危険</span>',
  dead: '<span class="text-red-600 text-[11px] font-bold ml-1">🛑限界</span>',
};
function repairGauge(pct, width = 'w-24', band = null) {
  const v = Math.max(0, Math.min(100, Math.round(pct ?? 100)));
  const b = band || (v >= 60 ? 'ok' : v >= 20 ? 'warn' : 'danger');
  return `<span class="inline-flex items-center gap-1 align-middle">
    <span class="inline-block ${width} bg-slate-200 rounded h-2 overflow-hidden"><span class="${BAND_BAR[b]} block h-2" style="width:${v}%"></span></span>
    <b>${v}%</b>${BAND_NOTE[b]}</span>`;
}

// 躯体と手入れを2行で並べて出す。どちらの工事が要るのかが一目で分かるようにする。
function twoGauges(p, opts = {}) {
  const care = p.careState ?? p.repairState ?? 100;
  return `<div class="space-y-1">
    ${bandAlertBox(p)}
    <div class="flex items-center justify-between text-xs p-2 bg-slate-50 rounded-lg">
      <span class="shrink-0 mr-2">🏚 ${term('repair_state', '躯体')}</span>${repairGauge(p.repairState, 'w-20', L.structBandOf(p))}
      ${p.repairJob && (p.repairJob.kind || 'large') === 'large' ? `<span class="text-amber-600 font-bold ml-1">🔨修繕中 残り${p.repairJob.monthsLeft}ヶ月</span>` : ''}
    </div>
    <div class="flex items-center justify-between text-xs p-2 bg-slate-50 rounded-lg">
      <span class="shrink-0 mr-2">🧹 ${term('care_state', '手入れ')}</span>${repairGauge(care, 'w-20', L.careBandOf(p))}
      ${p.repairJob && p.repairJob.kind !== 'large' ? `<span class="text-amber-600 font-bold ml-1">🔨メンテ中${p.repairJob.auto ? '（おまかせ）' : ''}</span>` : ''}
    </div>
    ${opts.hint ? '<div class="text-[11px] text-slate-500 px-1">躯体は大規模修繕でのみ回復します。清掃・草刈りの日常メンテで戻るのは手入れだけです。</div>' : ''}
  </div>`;
}

// v8: いま何が起きているのかと、どうすれば抜け出せるのかを必ず併記する。
// 「気づいたら家賃が入っていない」を避けるため、ペナルティは常に理由とセットで見せる。
function bandAlertBox(p) {
  const sb = L.structBandOf(p), cb = L.careBandOf(p);
  const rows = [];
  if (sb === 'dead') rows.push(['🛑 使用不能',
    `全戸が退去し、募集を停止しています。大規模修繕（費用${L.CONDEMNED_COST_MULT}倍・工期+${L.CONDEMNED_EXTRA_MONTHS}ヶ月）を完了すると解除されます。`]);
  else if (sb === 'danger') rows.push(['🚨 躯体が危険水準',
    '毎月2割の確率で1戸が退去し、銀行の評価も下がっています。躯体0%になると全戸退去・募集停止です。']);
  else if (sb === 'warn') rows.push(['⚠️ 躯体が注意水準',
    '突発修繕が起きやすく、資産価値も目減りしています。早めに直すほど安く済みます。']);
  if (cb === 'dead') rows.push(['🛑 管理崩壊',
    '毎月1戸ずつ退去し、信用度も下がり続けます。日常メンテでは戻せません。「特別清掃」（通常の2倍）が必要です。']);
  else if (cb === 'danger') rows.push(['🚨 手入れが危険水準',
    'クレーム対応で行動力を持っていかれます。手入れ0%になると連鎖退去が始まります。']);
  else if (cb === 'warn') rows.push(['⚠️ 手入れが注意水準',
    '退去が増え、内見も決まりにくくなっています。日常メンテで100%まで戻せます。']);
  if (!rows.length) return '';
  const dead = sb === 'dead' || cb === 'dead';
  return `<div class="rounded-lg p-2 text-[11px] space-y-1 ${dead ? 'bg-red-100 text-red-800' : 'bg-amber-50 text-amber-800'}">
    ${rows.map(([t, d]) => `<div><b>${t}</b>　${d}</div>`).join('')}</div>`;
}

function noiTable(p) {
  const gpi = L.gpiAnnual(p), egi = L.egiAnnual(p), opex = L.opexAnnual(p), noi = L.noiAnnualV2(p);
  return `<table class="w-full text-xs mt-2">
      <tr><td>満室想定年収（${term('gpi')}）</td><td class="text-right">${L.yen(gpi)}</td></tr>
      <tr><td>現況の${term('vacancy_loss', '空室損')}</td><td class="text-right">-${L.yen(L.vacancyLossAnnual(p))}</td></tr>
      <tr><td>現況年収（${term('egi')}）</td><td class="text-right">${L.yen(egi)}</td></tr>
      <tr><td>年間運営費（管理費・修繕積立・${term('pm_fee', 'PM')}・${term('koto_zei', '固都税')}）</td><td class="text-right">-${L.yen(opex)}</td></tr>
      <tr class="font-bold border-t"><td>${term('noi')}（営業純収益）</td><td class="text-right">${L.yen(noi)}</td></tr>
    </table>`;
}

// v6: 「手元いくらあればこの物件を買えるのか」を購入前に必ず見せる。
// 従来は詳細画面の「融資」タブを開くまで分からず、市場一覧では判断できなかった。
function minCashLine(p) {
  const r = L.minRequiredCash(p, state);
  const ok = state.cash >= r.cash;
  return `<div class="flex items-center justify-between text-xs p-2 rounded-lg ${ok ? 'bg-emerald-50' : 'bg-slate-50'}">
    <span>最低${term('own_cash', '自己資金')}<span class="text-slate-500">（${r.financed ? r.label : '融資不可・現金のみ'}）</span></span>
    <b class="${ok ? 'text-emerald-700' : 'text-red-600'}">${L.yen(r.cash)}${ok ? '' : ' <span class="font-normal">…資金不足</span>'}</b>
  </div>`;
}

// v8.1: 保有期間と譲渡税。ここが見えていないと「いつ売るか」が運任せになる。
// 「購入差額」だけを見ていると税額を小さく見誤るので、簿価と課税対象益も並べて出す。
function holdingTaxBox(p) {
  const months = L.heldMonthsOf(state, p);
  const bd = L.saleBreakdown(state, p, p.timeValue);
  const corp = p.owner === 'corp';
  const badge = corp
    ? '<span class="bg-navy text-white rounded px-1.5 py-0.5 font-bold">🏢法人・一律30%</span>'
    : bd.longTerm
      ? '<span class="bg-emerald-600 text-white rounded px-1.5 py-0.5 font-bold">長期20%</span>'
      : '<span class="bg-red-500 text-white rounded px-1.5 py-0.5 font-bold">短期39%</span>';
  // 長期化までのカウントダウン。ここが「あと少し待つ」判断の核になる。
  // ただし益が出ていないときは税額も0なので、待つ意味がない＝出さない。
  const saving = Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong));
  const toLong = saving > 0 ? L.monthsToLongTerm(state, p) : 0;
  return `<div class="rounded-lg p-2 text-xs space-y-1 ${bd.longTerm || corp ? 'bg-emerald-50' : 'bg-amber-50'}">
    <div class="flex items-center justify-between">
      <span class="font-bold">保有 ${Math.floor(months / 12)}年${months % 12}ヶ月</span>${badge}</div>
    ${toLong > 0 ? `<div class="text-amber-800 font-bold">⏳ あと${toLong}ヶ月で長期20%になる（いまの時価なら譲渡税 ${L.yen(saving)} の差）</div>` : ''}
    <table class="w-full">
      <tr><td class="text-slate-600">購入価格</td><td class="text-right">${L.yen(p.boughtPrice ?? p.price)}</td></tr>
      <tr><td class="text-slate-600">${term('book_value', '簿価')}（${term('depreciation', '減価償却')}後）</td><td class="text-right">${L.yen(bd.book)}</td></tr>
      <tr class="border-t"><td class="text-slate-600">いま時価で売った場合の課税対象益</td><td class="text-right font-bold">${L.yen(bd.gain)}</td></tr>
      <tr><td class="text-slate-600">${term('capital_gains_tax', '譲渡税')}（${Math.round(bd.rate * 100)}%）</td><td class="text-right text-red-600">-${L.yen(bd.tax)}</td></tr>
    </table>
    <div class="text-[11px] text-slate-500">償却が進むほど簿価が下がり、課税される益は「購入差額」より大きくなります。</div>
  </div>`;
}

function overviewTab(p, from) {

  if (from === 'owned') {
    const occN = p.units.filter(u => u.occupied).length, occ = p.units.length ? Math.round(occN / p.units.length * 100) : 0;
    const lastCf = p.history.at(-1)?.cf;
    const gain = (p.timeValue || 0) - (p.boughtPrice || 0);
    return `<div class="flex flex-col items-center">${svg}</div>
      <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-50 rounded-lg p-2">現況入居率<div class="font-bold ${occ >= 100 ? 'text-emerald-600' : occ > 0 ? 'text-amber-600' : 'text-red-600'}">${occ}%</div></div>
        <div class="bg-slate-50 rounded-lg p-2">直近月${term('cf', 'CF')}<div class="font-bold ${(lastCf ?? 0) >= 0 ? 'text-emerald-600' : 'text-red-600'}">${lastCf == null ? '—' : L.yen(lastCf)}</div></div>
        <div class="bg-slate-50 rounded-lg p-2">現在の${term('time_value', '時価')}<div class="font-bold">${L.yen(p.timeValue)}</div></div>
        <div class="bg-slate-50 rounded-lg p-2">購入差額<div class="font-bold ${gain >= 0 ? 'text-emerald-600' : 'text-red-600'}">${gain >= 0 ? '+' : ''}${L.yen(gain)}</div></div>
      </div>
      ${holdingTaxBox(p)}
      ${twoGauges(p, { hint: true })}
      ${(p.valueUpLevel || p.valueUpJob) ? `<div class="flex items-center justify-between text-xs p-2 bg-indigo-50 rounded-lg"><span>✨ バリューアップ ${p.valueUpLevel ? `Lv${p.valueUpLevel}` : ''}</span>${p.valueUpJob ? `<span class="text-indigo-600 font-bold">工事中 残り${p.valueUpJob.monthsLeft}ヶ月</span>` : '<span class="text-slate-500">家賃UP済み</span>'}</div>` : ''}
      <div class="text-xs text-slate-600">${structureLabel(p)}・築${p.builtAge}年・${p.units.length}戸／${term('depr_remaining', '残存償却')} ${p.deprRemaining}ヶ月</div>
      ${buildingComposition(p) ? `<div class="text-xs text-slate-600">🏠 ${buildingComposition(p)}</div>` : ''}
      ${p.junkFlags.length ? `<div class="text-xs text-red-600 font-bold">${term('wakeari', '訳あり')}: ${p.junkFlags.join('・')}</div>` : ''}
      <div class="flex items-center justify-between text-xs p-2 bg-slate-50 rounded-lg"><span>名義</span><b>${p.owner === 'corp' ? '🏢 法人' : '👤 個人'}</b></div>
      ${p.lastAppraisal ? `<div class="flex items-center justify-between text-xs p-2 bg-slate-50 rounded-lg"><span>査定額（参考）</span><b>${L.yen(p.lastAppraisal.amount)} <span class="text-slate-500 font-normal">（${state.month - p.lastAppraisal.month === 0 ? '今月' : `${state.month - p.lastAppraisal.month}ヶ月前`}）</span></b></div>` : ''}
      ${(state.isIncorporated && p.owner !== 'corp') ? `<button class="dt-to-corp w-full border border-navy text-navy rounded-lg py-2 text-xs font-bold hover:bg-slate-50 ${(p.loan || (p.reformLoans || []).length) ? 'opacity-40' : ''}" ${(p.loan || (p.reformLoans || []).length) ? 'disabled' : ''}>🏢 法人へ売却（移転）${(p.loan || (p.reformLoans || []).length) ? '｜ローン完済後に可能' : ''}</button>` : ''}
      <button class="dt-map-jump w-full border rounded-lg py-2 text-xs text-navy font-bold hover:bg-slate-50">📍 地図で場所を見る</button>
      ${noiTable(p)}</div>`;
  }
  const cut = p.origPrice && p.price < p.origPrice;
  return `<div class="flex flex-col items-center">${svg}</div>
    <div class="space-y-2 text-sm">
    <div class="font-bold text-center">売出価格: ${cut ? `<span class="line-through text-slate-400">${L.yen(p.origPrice)}</span> ` : ''}<span class="text-emerald-700 text-lg">${L.yen(p.price)}</span></div>
    ${minCashLine(p)}
    <div class="text-center text-xs text-slate-500">${structureLabel(p)}・築${p.builtAge}年・${p.units.length}戸${buildingComposition(p) ? `／${buildingComposition(p)}` : ''}</div>
    ${twoGauges(p)}
    ${p.junkFlags.length ? `<div class="text-xs text-red-600 font-bold text-center">${term('wakeari', '訳あり')}: ${p.junkFlags.join('・')}</div>` : ''}
    ${p.sellerUrgency ? `<div class="text-xs text-rose-600 font-bold text-center">🏃 売り急ぎ: ${p.sellerUrgency.reason}そうだ</div>` : ''}
    ${L.offerBlockedReason(p) ? `<div class="rounded-lg bg-red-50 text-red-800 p-2 text-xs">
      <b>🚫 買付不可</b>　一度断られたため、売主が態度を固めています。満額でも受け付けてもらえません。
      値下げか、6ヶ月以上の売れ残り（現在${p.listedMonths ?? 0}ヶ月）で交渉が再開します。</div>` : ''}
    <button class="dt-map-jump w-full border rounded-lg py-2 text-xs text-navy font-bold hover:bg-slate-50">📍 地図で場所を見る</button>
    ${noiTable(p)}</div>`;
}

}

// v8.4: ADは1〜3ヶ月分から選ぶ。積むほど決まりやすいが、確定はしない。
function openAdPicker(p, unitIndex, onPick) {
  const u = p.units[unitIndex];
  // 物件詳細（z-50）の上に重ねるので、既存のモーダル枠は使わず専用のオーバーレイを作る。
  const m = el('<div class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"></div>');
  document.body.appendChild(m);
  const close = () => m.remove();
  const base = L.unitFillChance(p, u);
  const rows = Object.values(L.AD_PLANS).map(plan => {
    const cost = u.rent * plan.months;
    // いま出ているADより弱いプランは意味がないので選ばせない
    const weaker = u.ad && u.ad.months >= plan.months;
    const after = Math.min(L.AD_MAX_CHANCE, L.naturalFillChance(p) + plan.bonus);
    const enough = state.cash >= cost;
    return `<button class="ad-pick w-full border-2 rounded-lg p-2.5 text-left ${(weaker || !enough) ? 'opacity-40' : 'hover:bg-slate-50'}"
        data-m="${plan.months}" ${(weaker || !enough) ? 'disabled' : ''}>
      <div class="flex justify-between items-center">
        <span class="font-bold text-sm">📣 ${plan.label}</span>
        <span class="font-bold">${L.yen(cost)}</span></div>
      <div class="text-xs text-slate-600">毎月の決まりやすさ <b>${Math.round(base * 100)}% → ${Math.round(after * 100)}%</b>（決まるまで継続）</div>
      ${weaker ? '<div class="text-[11px] text-slate-500">すでに同等以上のADを出しています</div>' : ''}
      ${!enough ? '<div class="text-[11px] text-red-600">現金が足りません</div>' : ''}</button>`;
  }).join('');
  const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-2">
    <div class="flex justify-between items-center"><h2 class="font-bold">📣 ${term('ad', 'AD')}（広告料）を出す</h2><button id="ad-x" class="text-slate-400 text-xl leading-none">✕</button></div>
    <div class="text-xs text-slate-600">${unitIndex + 1}号室（家賃 ${L.yen(u.rent)}）。客付け業者への成功報酬です。
      <b>積むほど決まりやすくなりますが、確実ではありません。</b></div>
    <div class="space-y-1.5">${rows}</div>
    <div class="text-[11px] text-slate-500">出したADは入居が決まるまで効き続けます。空室損（家賃×空室月数）と見比べて決めましょう。</div>
    <button id="ad-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelectorAll('.ad-pick').forEach(b => b.addEventListener('click', () => {
    close(); onPick(Number(b.dataset.m));
  }));
  box.querySelector('#ad-cancel').addEventListener('click', close);
  box.querySelector('#ad-x').addEventListener('click', close);
}

// v3.10: 建物構成サマリ（例: 1K×6戸・平均22㎡）
function buildingComposition(p) {
  if (!p.units?.length || !p.units[0].layout) return '';
  const layout = p.units[0].layout;
  const avg = Math.round(p.units.reduce((s, u) => s + (u.sizeSqm || 0), 0) / p.units.length);
  return `${layout}×${p.units.length}戸・平均${avg}㎡`;
}

function plTab(p) {
  if (!p.history.length) return '<div class="text-slate-500">購入後、月が進むと収支が記録されます。</div>';
  const equity = p.boughtPrice ? p.boughtPrice - (p.loan ? p.loan.principal : 0) + Math.round(p.boughtPrice * L.CONFIG.closingCostRate) : 0;
  const ccr = equity > 0 ? (p.cum.cf / equity * 100).toFixed(1) : '-';
  return `<div class="mb-1">累計CF: <b class="${p.cum.cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(p.cum.cf)}</b>（${p.cum.months}ヶ月）／ 自己資金回収率 ${ccr}%</div>
    <div class="max-h-60 overflow-y-auto"><table class="w-full text-xs">
    <tr class="text-slate-500"><th>月</th><th>家賃</th><th>空室損</th><th>運営費</th><th>利息</th><th>元金</th><th>税</th><th>CF</th></tr>
    ${[...p.history].reverse().map(h => `<tr class="border-t"><td>${h.month}</td><td>${L.yen(h.rentIn)}</td><td>${L.yen(h.vacancyLoss)}</td>
      <td>${L.yen(h.opex)}</td><td>${L.yen(h.interest)}</td><td>${L.yen(h.principal)}</td><td>${L.yen(h.tax)}</td>
      <td class="${h.cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(h.cf)}</td></tr>`).join('')}
    </table></div>`;
}

function financeTab(p) {
  if (p.loan) {
    const rem = L.remainingPrincipal(p.loan.principal, p.loan.rate, p.loan.years, p.loan.monthsPaid);
    return `<div class="space-y-1"><div>借入先: <b>${L.BANKS[p.loan.bankKey].label}</b></div>
      <div>金利 ${(p.loan.rate * 100).toFixed(2)}%・期間${p.loan.years}年・返済済${p.loan.monthsPaid}ヶ月</div>
      <div>残債: <b>${L.yen(rem)}</b></div></div>`;
  }
  const rs = L.reviewAllBanks(p, p.price, 0.2, state);
  return minCashLine(p)
    + `<div class="text-xs text-slate-500 mt-2 mb-1">${term('own_cash', '頭金')}2割とした場合の事前審査見込み（${term('ltv')}80%）:</div>`
    + bankReviewList(rs);
}

function bankReviewList(rs) {
  return `<div class="space-y-1">${rs.map(r => r.approved
    ? `<div class="border rounded p-2"><b>◯ ${r.label}</b><div class="text-xs">金利${(r.terms.rate * 100).toFixed(2)}%・${r.terms.years}年・月返済${L.yen(r.terms.monthlyPay)}・要${term('own_cash', '自己資金')}${L.yen(r.terms.requiredCash)}</div></div>`
    : `<div class="border rounded p-2 bg-slate-50"><b>✕ ${r.label}</b><div class="text-xs text-red-600">${linkTerms(r.reasons.map(x => x.msg).join('／'))}</div></div>`).join('')}</div>`;
}

// v8: 募集が建物ごと止まっている状態は、費用・行動力を払う前に理由を出して止める。
const FILL_BLOCKED = {
  condemned: '躯体0%で使用不能です。大規模修繕が完了するまで募集できません。',
  careCollapsed: '管理崩壊の状態です。「特別清掃」で手入れを戻すまで募集できません。',
  needsRestore: 'この部屋は原状回復が済んでいません。',
};

function wireFillButtons(body, p, from) {
  // v8.4: ADは1〜3ヶ月分から選ぶ。払っても確定はせず、決まるまで毎月効き続ける。
  body.querySelectorAll('.fill-ad').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.i);
    openAdPicker(p, i, (adMonths) => {
      const r = L.fillVacancy(state, p.id, i, 'ad', Math.random, { adMonths });
      if (FILL_BLOCKED[r.reason]) { alert(FILL_BLOCKED[r.reason]); return; }
      if (r.reason === 'noCash') { alert(`現金が足りません（必要 ${L.yen(r.cost)}）`); return; }
      state = r.state;
      const nm = `${i + 1}号室`;
      pushLog(r.success
        ? `${nm} にAD${adMonths}ヶ月分（${L.yen(r.cost)}）を出し、その月のうちに入居が決まった！`
        : `${nm} にAD${adMonths}ヶ月分（${L.yen(r.cost)}）を出した（今月は決まらず・掲出は継続中）`);
      save(); render(); openDetail(p.id, from);
    });
  }));
  body.querySelectorAll('.fill-self').forEach(b => b.addEventListener('click', () => {
    if (state.actionPower < L.SELF_FILL_AP) { alert('行動力が足りません'); return; }
    const r = L.fillVacancy(state, p.id, Number(b.dataset.i), 'self', Math.random);
    if (FILL_BLOCKED[r.reason]) { alert(FILL_BLOCKED[r.reason]); return; }
    state = r.state; pushLog(r.success ? '自主客付けに成功！（自主管理+10 EXP）' : '内見はあったが決まらず…（自主管理+10 EXP・何度でも挑戦できる）');
    save(); render(); openDetail(p.id, from);
  }));
}

// back を渡すと「← 戻る」を表示し、元のモーダルへ戻れる。
function openPurchase(propId, back) {
  const p = state.market.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('purchase-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  // v8.3: 一度断られた物件は満額も含めて買付できない（売主が態度を固めた状態）。
  const blocked = !!L.offerBlockedReason(p);
  const box = el(`<div class="bg-white rounded-xl p-5 w-full max-w-md space-y-2">
    <div class="flex justify-between items-center gap-2">
      ${back ? '<button id="of-back" class="text-xs text-navy">← 戻る</button>' : '<span></span>'}
      <button id="of-x" class="text-slate-400 text-xl leading-none shrink-0">✕</button></div>
    <div><h2 class="font-bold">${p.name || p.label} に買付を入れる（行動力-10）</h2><div class="text-[11px] text-slate-500">${p.label}</div></div>
    <div class="text-sm">売出価格: ${p.origPrice && p.price < p.origPrice ? `<span class="line-through text-slate-400">${L.yen(p.origPrice)}</span> → ` : ''}<b>${L.yen(p.price)}</b>${p.origPrice && p.price < p.origPrice ? ' <span class="text-[11px] bg-red-500 text-white rounded px-1">値下げ中</span>' : ''}${p.staleFlag ? ' <span class="text-[11px] bg-amber-500 text-white rounded px-1">売れ残り中</span>' : ''}</div>
    ${p.sellerUrgency ? `<div class="text-xs"><span class="bg-rose-100 text-rose-700 rounded px-1.5 py-0.5 font-bold">🏃 売り急ぎ</span> <span class="text-slate-600">${p.sellerUrgency.reason}そうだ</span></div>` : ''}
    ${blocked ? `<div class="rounded-lg bg-red-50 text-red-800 p-2 text-xs space-y-1">
      <div class="font-bold">🚫 この物件には買付を入れられません</div>
      <div>一度断られたため、売主が態度を固めています。<b>満額でも受け付けてもらえません。</b></div>
      <div class="text-red-700">次のどちらかで交渉が再開できます：<br>・売主が<b>値下げ</b>する<br>・<b>6ヶ月以上売れ残る</b>（現在 ${p.listedMonths ?? 0}ヶ月）</div>
    </div>` : ''}
    <button id="of-detail" class="w-full text-xs text-navy underline">📋 ${term('rentroll', 'レントロール')}・収支・融資の詳細を見る</button>
    <button id="of-full" class="w-full ${blocked ? 'bg-slate-300 text-slate-500' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} rounded py-2 text-sm font-bold" ${blocked ? 'disabled' : ''}>満額 ${L.yen(p.price)}${blocked ? '（受け付けてもらえない）' : '（必ず通る）'}</button>
    ${(!blocked && L.sashineBuffBonus(state) > 0) ? `<div class="text-[11px] bg-amber-100 text-amber-800 rounded px-2 py-1 font-bold">✨ 耳より情報：この指値だけ成功率 +${Math.round(L.sashineBuffBonus(state) * 100)}pt（使うと消えます）</div>` : ''}
    <div class="pt-1 border-t ${blocked ? 'opacity-50' : ''}">
      <div class="text-sm">${term('sashine', '指値')} <b id="of-cutpct">5%</b>引き → <b id="of-cutprice">${L.yen(Math.round(p.price * 0.95))}</b></div>
      <input id="of-slider" type="range" min="1" max="99" step="1" value="5" class="w-full" ${blocked ? 'disabled' : ''}>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-500 shrink-0">成功率</span>
        <div class="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden"><div id="of-gauge" class="h-2 rounded-full"></div></div>
        <span id="of-chance" class="font-bold w-12 text-right"></span></div>
      <div id="of-note" class="text-[11px] mt-1"></div>
      <button id="of-submit" class="w-full bg-navy text-white rounded py-2 text-sm font-bold mt-1" ${blocked ? 'disabled' : ''}>この指値で申し込む（行動力-10）</button>
    </div>
    <button id="of-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  // 詳細は買付モーダルを閉じてから開く（重なりで見えなくなる問題を解消）。詳細から買付へ「戻る」で戻れる。
  box.querySelector('#of-detail').addEventListener('click', () => { close(); openDetail(propId, 'market', () => openPurchase(propId, back)); });
  box.querySelector('#of-cancel').addEventListener('click', close);
  box.querySelector('#of-x').addEventListener('click', close);
  if (back) box.querySelector('#of-back').addEventListener('click', () => { close(); back(); });
  // v3.8: 指値スライダー。取次ライン内は通常交渉、超えると「ダメ元」（背景あり）／「非常識」（背景なし・評判リスク）に変化
  const lv = L.skillLevel(state.skills.negotiation.exp);
  const line = L.maxBrokerCut(p, lv);
  const slider = box.querySelector('#of-slider');
  const submit = box.querySelector('#of-submit');
  const noteEl = box.querySelector('#of-note');
  const gauge = box.querySelector('#of-gauge');
  const update = () => {
    const cut = Number(slider.value) / 100;
    const chance = L.offerSuccessChance(p, cut, lv);
    box.querySelector('#of-cutpct').textContent = `${slider.value}%`;
    box.querySelector('#of-cutprice').textContent = L.yen(Math.max(10000, Math.round(p.price * (1 - cut))));
    box.querySelector('#of-chance').textContent = `${Math.round(chance * 100)}%`;
    gauge.style.width = `${Math.max(3, Math.round(chance * 100))}%`;
    gauge.style.background = chance >= 0.5 ? '#059669' : chance >= 0.2 ? '#f59e0b' : '#dc2626';
    if (cut <= line) {
      // 用語ヘルプのspanを出すため innerHTML で入れる（中身は自前の文字列のみ）
      noteEl.innerHTML = `🏢「頑張って交渉します」（${term('toritsugi', '取次ライン')}: ${Math.round(line * 100)}%引きまで）`;
      noteEl.className = 'text-[11px] mt-1 text-slate-600';
      submit.textContent = 'この指値で申し込む（行動力-10）';
      submit.className = 'w-full bg-navy text-white rounded py-2 text-sm font-bold mt-1';
    } else if (L.hasSellerBackground(p)) {
      noteEl.textContent = '🏢「売主さんには事情があるようです。ダメ元で当たってみます…」（失敗してもペナルティなし）';
      noteEl.className = 'text-[11px] mt-1 text-amber-700 font-bold';
      submit.textContent = '🙏 ダメ元で打診してもらう（行動力-10）';
      submit.className = 'w-full bg-amber-500 hover:bg-amber-600 text-white rounded py-2 text-sm font-bold mt-1';
    } else {
      noteEl.textContent = '🏢「この価格はさすがに…無謀な指値は評判に関わりますよ」（失敗すると交渉力の評判ダウン）';
      noteEl.className = 'text-[11px] mt-1 text-red-600 font-bold';
      submit.textContent = '⚠️ 非常識な指値を強行する（行動力-10）';
      submit.className = 'w-full bg-red-600 hover:bg-red-700 text-white rounded py-2 text-sm font-bold mt-1';
    }
  };
  slider.addEventListener('input', update);
  update();
  const doOffer = (cut) => {
    if (state.actionPower < 10) { alert('行動力が足りません'); return; }
    const r = L.makeOffer(state, propId, cut, Math.random);
    // v8.3: 断られた物件は logic 側で弾かれる。行動力を使う演出に入る前に止める。
    if (r.blocked) {
      alert('この物件には買付を入れられません。\n一度断られているため、売主が値下げするか、6ヶ月以上売れ残るまで交渉を再開できません。');
      close(); return;
    }
    state = r.state; save();
    // 買付は一番ドキドキするポイント。結果を即出さず「交渉中…」の溜め演出を挟んでから発表する。
    playOfferSuspense(r.accepted, cut, () => {
      if (!r.accepted) {
        pushLog(r.penalized
          ? `${p.label} への無謀な指値で評判を落とした…（交渉-15 EXP・売主が態度を固めた）`
          : `${p.label} への指値は断られた…（値下げか6ヶ月の売れ残りまで買付できない）`);
        render(); close();
        if (r.counterProposal) showCounterProposal(r.counterProposal);
        return;
      }
      pushLog(`${p.label} の買付が通った！（${L.yen(r.price)}・交渉+${5 + Math.round(cut * 100)} EXP）`);
      showPayment(propId, r.price, close);
      tutMaybeAdvance('offer');
    });
  };
  box.querySelector('#of-full').addEventListener('click', () => doOffer(0));
  submit.addEventListener('click', () => doOffer(Number(slider.value) / 100));
}

// v3.8: 鬼指値で断られたときの「逆提案」。不動産会社が予算感に合う激安寄りの物件を紹介してくれる。

    <div class="flex justify-between items-center"><h2 class="font-bold">🙋 不動産会社からの逆提案</h2><button id="cp-x" class="text-slate-400 text-xl leading-none">✕</button></div>
    <div class="text-sm text-slate-700 bg-slate-50 rounded-lg p-3">「その予算感でしたら…実は<b>こういう物件</b>がありますよ。訳ありですが、価格は頑張れます」</div>
    <div class="flex items-center gap-2 border rounded-lg p-2">${renderBuildingSVG(cp, 'w-14 h-14')}
      <div class="min-w-0 flex-1 text-left">

        ${cp.junkFlags?.length ? `<div class="text-[11px] text-red-600 font-bold">訳あり: ${cp.junkFlags.join('・')}</div>` : ''}

      </div></div>
    <button id="cp-detail" class="w-full bg-navy text-white rounded-lg py-2 text-sm font-bold">📋 詳細を見る</button>
