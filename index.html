        <div class="text-[11px] leading-tight text-slate-500">保有 ${Math.floor(held / 12)}年${held % 12}ヶ月</div>
        ${renderBuildingSVG(p, 'w-10 h-10')}
        <div class="text-[11px] leading-tight text-emerald-700 font-bold">家賃 ${manYen(rentNow)}/月</div>
        <div class="text-[11px] leading-tight font-bold ${lastCf == null ? 'text-slate-400' : lastCf >= 0 ? 'text-emerald-700' : 'text-red-600'}">CF ${lastCf == null ? '—' : (lastCf >= 0 ? '+' : '') + manYen(lastCf)}</div>
      </div>`;
      return `<div class="w-full border rounded p-2 text-xs ${bulkMode ? '' : 'hover:bg-slate-50'}">
        <div class="kpi-prop flex items-center gap-2 ${bulkMode ? '' : 'cursor-pointer'}" data-id="${p.id}">
          ${bulkMode ? `<input type="checkbox" class="kpi-check w-4 h-4 shrink-0" data-id="${p.id}">` : ''}
          ${iconSide}
          <div class="min-w-0 flex-1"><div class="font-bold">${p.name || p.label}</div>
          <div class="text-slate-500 text-[11px]">${p.label}</div>
          <div class="mt-1 space-y-0.5">
            ${miniStatBar('入居', occ, statValuePair(`${occN}/${unitN}`, `${occ}%`), 'bg-emerald-500')}
            ${miniStatBar('躯体', Math.round(p.repairState), statValue(`${Math.round(p.repairState)}%`), 'bg-sky-500')}
            ${miniStatBar('手入', Math.round(p.careState ?? p.repairState), statValue(`${Math.round(p.careState ?? p.repairState)}%`), 'bg-amber-500')}
          </div>
          <div class="mt-0.5 space-x-1 text-[11px]">${badges}</div></div>
        </div>
        ${adviceLines.length ? `<button class="kpi-advice-toggle text-[11px] font-bold text-navy underline mt-1" data-id="${p.id}">${openPropAdviceIds.has(p.id) ? '▲ アドバイスを閉じる' : '💡 アドバイス'}</button>
        ${openPropAdviceIds.has(p.id) ? `<div class="mt-1 text-[11px] text-slate-600 bg-slate-50 rounded p-1.5 space-y-1">${adviceLines.map(t => `<div>${t}</div>`).join('')}</div>` : ''}` : ''}
        ${la ? `<div class="mt-1 pt-1 border-t flex items-center justify-between"><span>査定額 <b class="text-emerald-700">${L.yen(la.amount)}</b> <span class="text-slate-500">（${laAge}）</span></span><button class="kpi-sell bg-emerald text-white rounded px-2 py-1" data-id="${p.id}">売出設定へ</button></div>` : ''}
      </div>`;
    }).join('')}</div>
    ${bulkMode ? '<button id="kpi-bulk-run" class="w-full bg-navy text-white rounded py-2 text-sm font-bold mt-2">🔍 チェックした物件をまとめて査定する</button>' : ''}` : '<div class="text-slate-500 text-sm">まだ物件を所有していません。営業→買付で増やしましょう。</div>';
  } else if (which === 'cf') {
    title = '📈 月間キャッシュフロー内訳';
    const total = L.monthlyCF(state);
    const rows = state.properties.map(p => {
      const cf = p.history.at(-1)?.cf ?? 0;
      return `<tr class="border-t"><td>${p.name || p.label}</td><td class="text-right ${cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(cf)}</td></tr>`;
    }).join('');
    body = `<table class="w-full text-sm">${rows || '<tr><td class="text-slate-500 py-2">まだ物件収支の記録がありません（買付後、翌月から計上）</td></tr>'}
      <tr class="border-t-2 font-bold"><td>物件からの月CF合計</td><td class="text-right ${total >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(total)}</td></tr></table>
      <div class="text-[11px] text-slate-500 mt-2">※ 種銭は「💼 働く」で行動力を使って稼げます（自動では増えません）。</div>`;
  } else if (which === 'credit') {
    title = '📊 信用度と銀行取引実績';
    const rel = state.bankRelations || {};
    const bankRows = Object.keys(L.BANKS).map(k => {
      const r = rel[k] || { loans: 0, paidOff: 0 };
      return `<tr class="border-t"><td>${L.BANKS[k].label}</td><td class="text-right">融資${r.loans}件・完済${r.paidOff}件</td></tr>`;
    }).join('');
    body = `<div class="text-sm mb-2">現在の信用度: <b>${state.creditScore}</b></div>
      <div class="text-[11px] text-slate-500 mb-1">信用度が高いほど審査に通りやすく、取引実績（完済）が増えると金利優遇を受けやすくなります。</div>
      <table class="w-full text-sm">${bankRows}</table>`;
  }
  const boxEl = el(`<div class="bg-white rounded-xl p-4 w-full max-w-md max-h-[75vh] overflow-y-auto space-y-2" style="max-height:75dvh">
    <div class="flex justify-between items-center"><h2 class="font-bold">${title}</h2><button id="kpi-close" class="text-slate-400 text-xl">✕</button></div>
    <div>${body}</div></div>`);
  m.appendChild(boxEl);
  boxEl.querySelector('#kpi-close').addEventListener('click', close);
  if (which === 'cash' && !state.isIncorporated && state.cash >= L.CONFIG.corporateSetupCost) {
    boxEl.querySelector('#btn-incorporate').addEventListener('click', () => {
      const r = L.incorporate(state);
      state = r.state;
      pushLog('🏢 法人を設立した（法人名義の購入・法人への移転が可能に）');
      save(); render(); close();
      playIncorporationCelebration();
    });
  }
  boxEl.querySelectorAll('.kpi-prop').forEach(b => b.addEventListener('click', () => {
    if (bulkMode) return;   // まとめて査定中は行クリックで詳細を開かない（チェック操作を優先）
    close(); openDetail(parsePropId(b.dataset.id), 'owned', () => openKpiModal('props', true)); }));
  boxEl.querySelectorAll('.kpi-advice-toggle').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = parsePropId(b.dataset.id);
    if (openPropAdviceIds.has(id)) openPropAdviceIds.delete(id); else openPropAdviceIds.add(id);
    openKpiModal('props', true);
  }));
  boxEl.querySelector('#kpi-bulk-toggle')?.addEventListener('click', () => {
    bulkMode = !bulkMode; close(); openKpiModal('props', true);
  });
  boxEl.querySelector('#kpi-bulk-run')?.addEventListener('click', () => {
    const ids = [...boxEl.querySelectorAll('.kpi-check')].filter(c => c.checked).map(c => parsePropId(c.dataset.id));
    if (!ids.length) { alert('査定したい物件にチェックを入れてください'); return; }
    const cost = ids.length * 5;
    if (state.actionPower < cost) { alert(`行動力が足りません（${ids.length}件で${cost}必要）`); return; }
    ids.forEach(id => { const r = L.requestAppraisal(state, id, Math.random); state = r.state; });
    pushLog(`まとめて査定を依頼した（${ids.length}件・行動力-${cost}）`);
    save(); renderPanelRight();
    close(); openKpiModal('props', true);
  });
  boxEl.querySelectorAll('.kpi-sell').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = parsePropId(b.dataset.id);
    const pp = state.properties.find(x => x.id === id);
    if (!pp?.lastAppraisal) return;
    close();
    openSellWithAppraisal(id, pp.lastAppraisal.amount);
  }));
}

// v3.5: 一括査定の結果から直接売出設定へ（査定は取得済み。既に売出中なら管理画面へ）
// v3.6: 売り出し後・戻るボタンで売却センターへ戻る
function openSellWithAppraisal(propId, appraisal) {
  const p = state.properties.find(x => x.id === propId);
  if (!p) return;
  const m = document.getElementById('sell-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const back = () => openKpiModal('props', true);
  const listing = (state.listings || []).find(l => l.propertyId === propId);
  if (listing) { drawListingManage(m, p, listing, close); return; }
  drawPricing(m, p, appraisal, close, back);
}

// v6: 管理会社おまかせ契約のトグル。
// 説明文を並べた「読ませる行」にしたら押せると気づかれにくかったので、
// 見た目をスイッチそのものにした。文字は最小限にして、詳細は押したあとの確認ダイアログで説明する。
function autoManageToggleHtml(p) {
  const on = !!p.autoManage;
  const track = on ? 'bg-emerald-500' : 'bg-slate-300';
  const knob = on ? 'translate-x-5' : 'translate-x-0.5';
  return `<button class="dt-automanage w-full rounded-lg py-2.5 px-2.5 flex items-center gap-2 border transition-colors active:scale-[0.98]
      ${on ? 'bg-emerald-50 border-emerald-500' : 'bg-white hover:bg-slate-50'}">
    <span class="text-base leading-none">🏢</span>
    <span class="text-left min-w-0 flex-1">
      <span class="block text-xs font-bold ${on ? 'text-emerald-800' : 'text-slate-700'}">管理会社におまかせ</span>
      <span class="block text-[11px] ${on ? 'text-emerald-700' : 'text-slate-500'}">
        ${on ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse align-middle mr-1"></span>自動で手配中（+10%・DIY不可）'
             : '修繕の判断を丸ごと任せる（+10%）'}
      </span>
    </span>
    <span class="shrink-0 inline-flex items-center w-11 h-6 rounded-full ${track} transition-colors">
      <span class="w-5 h-5 rounded-full bg-white shadow transform ${knob} transition-transform"></span>
    </span>
  </button>`;
}

// 契約は出費を伴い、契約中はDIYが封じられるので、ON/OFFとも必ず確認を取ってから切り替える。
function onAutoManageToggle(p, redraw) {
  const care = p.careState ?? p.repairState ?? 100;
  if (!p.autoManage) {
    const firstCost = care < L.AUTO_MANAGE_CARE_FLOOR ? L.autoManageCost(L.repairCost(p, 'maint')) : 0;
    const msg = `${p.name || p.label} を管理会社におまかせしますか？\n\n`
      + `・手入れが${L.AUTO_MANAGE_CARE_FLOOR}%を切ると自動で日常メンテを発注\n`
      + `・退去した部屋の原状回復も自動で業者手配\n`
      + `・工事費は通常見積の+10%\n`
      + `・この物件ではDIYができなくなります（自主管理EXPも入りません）\n`
      + `・大規模修繕と価値UPは対象外（今までどおり自分で判断）\n\n`
      + (firstCost ? `いま手入れが${Math.round(care)}%なので、契約と同時に初回の日常メンテ ${L.yen(firstCost)} が発生します。` : '手入れは足りているので、今すぐの出費はありません。');
    if (!confirm(msg)) return;
    const r = L.setAutoManage(state, p.id, true);
    state = r.state;
    if (r.started) pushLog(`${p.name || p.label} を管理会社へおまかせした（初回メンテ ${L.yen(r.cost)}）`);
    else if (r.reason === 'noCash') { alert(`現金が足りないため初回の日常メンテを発注できませんでした（必要 ${L.yen(r.cost)}）。契約自体は有効です。`); }
    else pushLog(`${p.name || p.label} を管理会社へおまかせした`);
  } else {
    if (!confirm(`${p.name || p.label} のおまかせ契約を解除しますか？\n\n以降は手入れも原状回復も自分で判断・発注することになりますが、DIYで安く済ませられるようになります。`)) return;
    state = L.setAutoManage(state, p.id, false).state;
    pushLog(`${p.name || p.label} のおまかせ契約を解除した`);
  }
  save(); render(); redraw();
}

// back を渡すと「← 戻る」を表示し、閉じたあと元のモーダルへ戻れる（別モーダルから開いた場合の重なりも解消）。
function openDetail(propId, from, back) {
  const find = () => (from === 'market' ? state.market : state.properties).find(x => x.id === propId);
  if (!find()) return;
  const m = document.getElementById('detail-modal');
  m.classList.remove('hidden'); m.classList.add('flex');
  // v8.9: 融資タブは購入検討中の市場物件だけに必要（所有物件はローンの有無に関わらず不要）。
  // v8.19で「収支」タブ（月次履歴）を概要の「年間収支・運営費の内訳」と重複するとして廃止したが、
  // 月ごとの内訳・累計CF・自己資金回収率は年間集計だけでは追えないため、v11.6で復活させる。
  const tabs = from === 'owned' ? ['概要', 'レントロール', '収支'] : ['概要', 'レントロール', '融資'];
  // v8.19: 「年間収支・運営費の内訳」は所有・市場のどちらも情報過多になるため、デフォルトは常に格納。
  let active = 0, saleSimOpen = false, gpiOpen = false;
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  const draw = () => {
    // state を書き換える操作（おまかせ契約の切替等）は structuredClone で新しい物件オブジェクトを作るため、
    // 描画のたびに引き直さないと古いオブジェクトを表示し続けてしまう。
    const p = find();
    if (!p) { close(); return; }
    m.innerHTML = '';
    // v4: 大分類は「修繕」と「価値UP」の2つ。実施方法（DIY/業者→借入）は各画面で選ぶ。
    const busy = from === 'owned' && (p.repairJob || p.valueUpJob);
    const vuMaxed = (p.valueUpLevel || 0) >= L.VALUE_UP_MAX_LEVEL;
    const restoreCount = from === 'owned' ? p.units.filter(u => u.needsRestore).length : 0;
    const footer = from === 'owned' ? `<div class="p-2 border-t space-y-1">
        ${autoManageToggleHtml(p)}
        ${p.repairJob ? `<div class="text-center text-xs text-amber-600 font-bold py-1">🔨 ${L.REPAIR_KINDS[p.repairJob.kind || 'large'].label}を工事中（残り${p.repairJob.monthsLeft}ヶ月）${p.repairJob.auto ? '／おまかせ' : ''}</div>` : ''}
        ${p.valueUpJob ? `<div class="text-center text-xs text-indigo-600 font-bold py-1">✨ 価値UP工事中（残り${p.valueUpJob.monthsLeft}ヶ月）</div>` : ''}
        ${p.diyProgress ? `<div class="text-center text-xs text-emerald-700 font-bold py-1">🔨 DIY作業中（${Math.min(100, Math.round(p.diyProgress.done))}%）</div>` : ''}
        <div class="flex gap-1.5">
          ${busy ? '' : `
          <button class="dt-repair flex-1 border rounded py-3 text-xs font-bold">🔨修繕${restoreCount ? `<span class="ml-1 bg-red-500 text-white rounded px-1">要${restoreCount}</span>` : ''}</button>
          <button class="dt-valueup flex-1 border rounded py-3 text-xs font-bold ${vuMaxed ? 'opacity-40' : ''}" ${vuMaxed ? 'disabled' : ''}>✨価値UP</button>`}
          <button class="dt-sell flex-1 border rounded py-3 text-xs font-bold">💰売却</button>
        </div></div>` : '';
    // v8.9: アイコンは「物件名」と「一棟RC」の2行分の高さを使って大きく見せる
    // （建物の状態＝ボロ・傾き等が一目で分かる情報なので、小さいと意味が伝わらない）。
    // その下にもう1行、保有期間（所有）／📍地図を見る を横並びで足す。
    const held = from === 'owned' ? L.heldMonthsOf(state, p) : null;
    const box = el(`<div class="bg-white rounded-xl w-full max-w-lg max-h-[85vh] flex flex-col" style="max-height:85dvh">
      <div class="p-3 border-b shrink-0">
        <div class="flex justify-between items-center mb-1">
          ${back ? '<button id="dt-back" class="text-xs text-navy">← 戻る</button>' : '<span></span>'}
          <div class="flex items-center gap-3">
            ${from === 'market' ? `<button id="dt-fav" class="text-2xl leading-none text-amber-500" title="お気に入り">${(state.favorites || []).some(f => f.propertyId === p.id) ? '★' : '☆'}</button>` : ''}
            <button id="dt-close" class="text-slate-400 text-xl leading-none">✕</button>
          </div></div>
        <div class="flex items-center gap-2.5">${renderBuildingSVG(p, 'w-16 h-16')}
          <div class="min-w-0 flex-1"><div class="font-bold truncate">${p.name || p.label} ${from === 'owned' ? `<span class="text-[11px] align-middle ${p.owner === 'corp' ? 'bg-navy text-white' : 'bg-slate-200 text-slate-700'} rounded px-1.5 py-0.5">${p.owner === 'corp' ? '🏢法人' : '👤個人'}</span>` : ''}</div><div class="text-[11px] text-slate-500">${p.label}</div></div></div>
        <div class="flex items-center justify-between gap-2 mt-1.5">
          <span class="text-[11px] text-slate-500">${held != null ? `保有 ${Math.floor(held / 12)}年${held % 12}ヶ月` : ''}</span>
          <button class="dt-map-jump text-[11px] font-bold text-navy shrink-0 py-1 px-2 -mr-1 hover:bg-slate-50 rounded">📍地図を見る</button>
        </div>
      </div>
      ${from === 'market' ? `<div class="px-3 py-2 border-b shrink-0"><button id="dt-buy" class="w-full bg-navy hover:bg-navy-dark text-white rounded-lg py-2 text-sm font-bold shadow">💰 この物件に買付を入れる（行動力-10）</button></div>` : ''}
      <div class="flex gap-1 px-3 pt-2 bg-slate-100 text-sm shrink-0">${tabs.map((t, i) => `<button class="dt-tab flex-1 py-2 rounded-t-lg font-bold transition-colors ${i === active ? 'bg-white text-navy shadow-sm' : 'text-slate-500 hover:bg-slate-200'}" data-i="${i}">${t}</button>`).join('')}</div>
      <div id="dt-body" class="p-4 text-sm overflow-y-auto min-h-0 flex-1"></div>
      ${footer}</div>`);
    m.appendChild(box);
    box.querySelector('#dt-close').addEventListener('click', close);
    if (back) box.querySelector('#dt-back').addEventListener('click', () => { close(); back(); });
    box.querySelectorAll('.dt-tab').forEach(b => b.addEventListener('click', () => { active = Number(b.dataset.i); draw(); }));
    box.querySelector('.dt-map-jump')?.addEventListener('click', () => { close(); jumpToMapWithBubble(p, from); });
    const body = box.querySelector('#dt-body');
    // v8.9: 折りたたみの開閉はタブを跨がない再描画なので、スクロール位置を保って
    // 押した場所のまま展開させる（保存しないとdraw()の再構築で先頭に戻ってしまう）。
    const redrawKeepScroll = () => {
      const scroll = body.scrollTop;
      draw();
      const nb = m.querySelector('#dt-body');
      if (nb) nb.scrollTop = scroll;
    };
    if (tabs[active] === '概要') {
      body.innerHTML = overviewTab(p, from, { saleSimOpen, gpiOpen });
      body.querySelector('.dt-to-corp')?.addEventListener('click', () => { close(); openCorpTransfer(p.id); });
      body.querySelector('.dt-goto-rentroll')?.addEventListener('click', () => { active = tabs.indexOf('レントロール'); draw(); });
      // v8.13: 躯体・手入れの両方に同じclassのボタンが出るためquerySelectorAllで両方に繋げる。
      // v8.14: 一覧(step1)を経由せず、押した方のゲージに対応する工事内容へ直接飛ぶ
      // （躯体→大規模修繕、手入れ→日常メンテ／特別清掃のどちらか該当する方）。
      body.querySelectorAll('.dt-goto-repairmenu').forEach(btn => btn.addEventListener('click', () => {
        if (btn.dataset.maxedMsg) { alert(btn.dataset.maxedMsg); return; }
        const opts = workOptions(p, 'repair');
        const targetSel = btn.dataset.gauge === 'struct'
          ? opts.find(o => o.type === 'large')
          : opts.find(o => o.type !== 'large' && o.type !== 'restore');
        close(); openWorkMenu(p.id, 'repair', () => openDetail(propId, from, back), targetSel || null);
      }));
      body.querySelector('.dt-toggle-sale')?.addEventListener('click', () => { saleSimOpen = !saleSimOpen; redrawKeepScroll(); });
      body.querySelector('.dt-toggle-noi')?.addEventListener('click', () => { gpiOpen = !gpiOpen; redrawKeepScroll(); });
      // v8.21: 固都税の計算過程は単発の開閉なので、他の💡ヒントと同じく直接DOM操作で
      // トグルする（再描画を挟まない＝外側の年間収支アコーディオンと状態が競合しない）。
      body.querySelector('.noi-koto-toggle')?.addEventListener('click', () => {
        body.querySelector('#noi-koto-detail')?.classList.toggle('hidden');
        body.querySelector('.noi-koto-toggle .inline-block')?.classList.toggle('rotate-90');
      });
    }
    if (tabs[active] === 'レントロール') { body.innerHTML = rentRollTab(p, from); wireFillButtons(body, p, from); }
    if (tabs[active] === '収支') body.innerHTML = plTab(p);
    if (tabs[active] === '融資') {
      body.innerHTML = financeTab(p);
      body.querySelector('.ft-toggle-tip')?.addEventListener('click', () => {
        body.querySelector('#ft-tip-body').classList.toggle('hidden');
        body.querySelector('.ft-toggle-tip .inline-block').classList.toggle('rotate-90');
      });
    }
    if (from === 'owned') {
      const backHere = () => openDetail(propId, from, back);
      box.querySelector('.dt-repair')?.addEventListener('click', () => { close(); openWorkMenu(p.id, 'repair', backHere); });
      box.querySelector('.dt-valueup')?.addEventListener('click', () => { close(); openWorkMenu(p.id, 'valueup', backHere); });
      box.querySelector('.dt-sell').addEventListener('click', () => { close(); openSell(p.id); });
      box.querySelector('.dt-automanage')?.addEventListener('click', () => onAutoManageToggle(p, draw));
    }
    // v3.1: 市場物件はタブの上の固定「買付」ボタンからいつでも買付へ（買付画面から「戻る」でここへ戻れる）
    box.querySelector('#dt-buy')?.addEventListener('click', () => { close(); openPurchase(p.id, () => openDetail(propId, from, back)); });
    // v3.3: 詳細画面からお気に入りをトグル（★は地図の⭐表示にも即反映）
    box.querySelector('#dt-fav')?.addEventListener('click', () => {
      const fav = (state.favorites || []).some(f => f.propertyId === p.id);
      if (fav) {
        state = L.removeFavorite(state, p.id).state;
      } else {
        const r = L.addFavorite(state, p.id);
        if (!r.added) { if (r.reason === 'limit') alert(`お気に入りは最大${L.FAVORITE_LIMIT}件までです`); return; }
        state = r.state;
      }
      save(); render(); draw();
    });
  };
  draw();
}

// === v6: 用語ヘルプ ===
// 専門用語を term('dscr') で包むと点線の下線が付き、押すと吹き出しで説明が出る。
// ページ遷移はしない（読んでいた場所を見失わせない）。
// 第2引数を渡すと表示文字を差し替えられる（「NOI（営業純収益）」のような表記に使う）。
function term(key, text) {
  const t = L.TERMS[key];
  if (!t) return text || key;   // 定義漏れでも表示は壊さない（テストで検出する）
  return `<span class="term" data-term="${key}">${text || t.label}</span>`;
}

// 銀行の否認理由やチュートリアル文など、logic 側で組み立てられた文字列にも用語ヘルプを付ける。
// 長い語から先に処理し、置換済みの箇所はトークンに退避して二度と触らない
// （「自己資金」を先に処理しないと「資金」だけが引っかかる、といった食い違いを防ぐ）。
const TERM_BY_LABEL = Object.entries(L.TERMS)
  .map(([key, t]) => ({ key, label: t.label }))
  .sort((a, b) => b.label.length - a.label.length);

function linkTerms(text) {
  let out = String(text);
  const slots = [];
  // 退避先の目印には制御文字を使う。本文には現れないので「金利1.5%」のような数字を巻き込まない。
  const M = String.fromCharCode(1);
  for (const { key, label } of TERM_BY_LABEL) {
    const i = out.indexOf(label);
    if (i < 0) continue;
    out = out.slice(0, i) + M + slots.length + M + out.slice(i + label.length);
    slots.push(term(key, label));
  }
  return out.replace(new RegExp(M + '([0-9]+)' + M, 'g'), (_, n) => slots[Number(n)]);
}

// v6.3: 実務でも通じる言葉なのか、このゲームだけの指標なのかを区別して見せる。
// 「行動力」を実務用語だと思い込ませない／「DSCR」を覚えて損はないと分かるようにする。
function scopeLabel(t) {
  return t.scope === 'game' ? 'このゲーム独自' : '実務で使う用語';
}

let termPop = null;
function closeTermPopover() { termPop?.remove(); termPop = null; }

function showTermPopover(anchor) {
  closeTermPopover();
  const t = L.TERMS[anchor.dataset.term];
  if (!t) return;
  termPop = el(`<div class="term-pop">
    <div><b>${t.label}</b>${t.reading ? ` <span class="tp-yomi">（${t.reading}）</span>` : ''} <span class="tp-scope tp-${t.scope}">${scopeLabel(t)}</span></div>
    <div class="mt-1">${t.def}</div>
    <div class="mt-1 tp-calc">🧮 ${t.calc}</div>
    <div class="mt-1">${t.here}</div>
    <div class="mt-1 tp-hint">💡 ${t.hint}</div>
    <div class="mt-2 tp-foot">📖 長押しで用語集（全${Object.keys(L.TERMS).length}語）・押すと用語の表示ON/OFF</div>
  </div>`);
  termPop.dataset.for = anchor.dataset.term;
  document.body.appendChild(termPop);
  const a = anchor.getBoundingClientRect();
  const w = termPop.offsetWidth, h = termPop.offsetHeight;
  const pad = 8;
  // 下に出すのが基本。下に入らなければ上へ回す。左右は画面内に丸める。
  const top = (a.bottom + h + pad <= window.innerHeight) ? a.bottom + 6 : Math.max(pad, a.top - h - 6);
  const left = Math.max(pad, Math.min(window.innerWidth - w - pad, a.left + a.width / 2 - w / 2));
  termPop.style.top = `${top}px`;
  termPop.style.left = `${left}px`;
}

// v6.2: 用語ヘルプのON/OFF。ヘッダーの 📖 で切り替え、音のON/OFFと同じくlocalStorageに残す。
const TERMS_KEY = 'leverage_master_terms_off';
let termsOff = localStorage.getItem(TERMS_KEY) === '1';

function applyTermsMode() {
  document.body.classList.toggle('terms-off', termsOff);
  const b = document.getElementById('btn-terms');
  if (b) { b.textContent = termsOff ? '📕' : '📖'; b.style.opacity = termsOff ? '0.45' : '1'; }
  if (termsOff) closeTermPopover();
}

function setTermsOff(off) {
  termsOff = off;
  localStorage.setItem(TERMS_KEY, off ? '1' : '0');
  applyTermsMode();
}

// 用語はモーダルの中にも動的に生えるので、個別に登録せず document で一度だけ拾う。
// v6.2: ポインタを合わせるだけで出す。タッチ端末にはホバーが無いのでタップでも出す。
function initTermHelp() {
  const anchorOf = (e) => (termsOff ? null : e.target?.closest?.('.term'));

  document.addEventListener('pointerover', (e) => {
    const a = anchorOf(e);
    // マウス以外（タッチ・ペン）の pointerover は click と二重に走るのでここでは扱わない
    if (!a || e.pointerType !== 'mouse') return;
    if (termPop?.dataset.for === a.dataset.term) return;   // 同じ語に留まっている間は出し直さない
    showTermPopover(a);
  });
  document.addEventListener('pointerout', (e) => {
    if (e.pointerType !== 'mouse') return;
    const from = e.target?.closest?.('.term');
    // 用語の外へ出たら閉じる（用語内の子要素へ移っただけなら閉じない）
    if (from && !from.contains(e.relatedTarget)) closeTermPopover();
  });

  // タッチ端末用。同じ語を再度タップすると閉じる。
  document.addEventListener('click', (e) => {
    const a = anchorOf(e);
    if (!a) { closeTermPopover(); return; }
    e.stopPropagation();
    if (termPop?.dataset.for === a.dataset.term) { closeTermPopover(); return; }
    showTermPopover(a);
  }, true);

  window.addEventListener('resize', closeTermPopover);
  document.addEventListener('scroll', closeTermPopover, true);
  applyTermsMode();
}

// v8.9: 概要の1行目（構造・築年・戸数・残存償却）。区分（1戸のみ）は「全1戸」という
// 意味の薄い表記を避けて省略する。残存償却は月数のままだと分かりにくいので年ヶ月に変換する。

// v8.9: 訳あり（junkFlags）の表示区分。「改善済み」は実際にp.resolvedJunkへ記録された
// 種類だけに出す（L.markJunkResolvedが大規模修繕・日常メンテ/特別清掃の完了時に記録）。
// 「傾き」「事故歴」「再建築不可」は物件そのものの恒久的な物理・法的事実なので対象外
// （L.PERMANENT_JUNK_FLAGS）。手を付けていない・恒久タイプはどちらも同じ通常表示にする。
function wakeAriRowHtml(p) {
  if (!p.junkFlags?.length) return '';
  const chips = p.junkFlags.map(f => {
    if (p.resolvedJunk?.includes(f)) {
      return `<span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-emerald-50 border border-emerald-200">

  }).join('');
  return `<div class="flex flex-wrap items-center gap-1.5 mt-2">${chips}</div>`;

// v6: ゲージは2本。🏚躯体は大規模修繕でしか戻らず、🧹手入れは日常メンテで100%まで戻る。
// 内部は小数で持っているので、表示のたびに丸める。
// 色は 緑(60%以上)→黄(20〜59%)→赤(20%未満)。
// v8: 色と警告文は帯（ok/warn/danger/dead）から引く。躯体と手入れで閾値が違うので、
// どちらのゲージかは呼び出し側が band を渡して決める（ここで数値から推測しない）。
const BAND_BAR = { ok: 'bg-emerald', warn: 'bg-yellow-400', danger: 'bg-red-500', dead: 'bg-red-600 lm-blink' };
const BAND_NOTE = {
  ok: '', warn: '<span class="text-amber-600 text-[11px] font-bold ml-1">⚠️注意</span>',
  danger: '<span class="text-red-600 text-[11px] font-bold ml-1">🚨危険</span>',
  dead: '<span class="text-red-600 text-[11px] font-bold ml-1">🛑限界</span>',
};
function repairGauge(pct, width = 'w-24', band = null) {
  const v = Math.max(0, Math.min(100, Math.round(pct ?? 100)));
  const b = band || (v >= 60 ? 'ok' : v >= 20 ? 'warn' : 'danger');
  return `<span class="inline-flex items-center gap-1 align-middle">
    <span class="inline-block ${width} bg-slate-200 rounded h-2 overflow-hidden"><span class="${BAND_BAR[b]} block h-2" style="width:${v}%"></span></span>
    <b>${v}%</b>${BAND_NOTE[b]}</span>`;
}

// 躯体と手入れを2行で並べて出す。どちらの工事が要るのかが一目で分かるようにする。

  const care = p.careState ?? p.repairState ?? 100;

    </div>

      ${p.repairJob && p.repairJob.kind !== 'large' ? `<span class="text-amber-600 font-bold ml-1">🔨メンテ中${p.repairJob.auto ? '（おまかせ）' : ''}</span>` : ''}

  </div>`;
}

// v8: いま何が起きているのかと、どうすれば抜け出せるのかを必ず併記する。
// 「気づいたら家賃が入っていない」を避けるため、ペナルティは常に理由とセットで見せる。
function bandAlertBox(p) {
  const sb = L.structBandOf(p), cb = L.careBandOf(p);
  const rows = [];
  if (sb === 'dead') rows.push(['🛑 使用不能',
    `全戸が退去し、募集を停止しています。大規模修繕（費用${L.CONDEMNED_COST_MULT}倍・工期+${L.CONDEMNED_EXTRA_MONTHS}ヶ月）を完了すると解除されます。`]);
  else if (sb === 'danger') rows.push(['🚨 躯体が危険水準',
    '毎月2割の確率で1戸が退去し、銀行の評価も下がっています。躯体0%になると全戸退去・募集停止です。']);
  else if (sb === 'warn') rows.push(['⚠️ 躯体が注意水準',
    '突発修繕が起きやすく、資産価値も目減りしています。早めに直すほど安く済みます。']);
  if (cb === 'dead') rows.push(['🛑 管理崩壊',
    '毎月1戸ずつ退去し、信用度も下がり続けます。日常メンテでは戻せません。「特別清掃」（通常の2倍）が必要です。']);
  else if (cb === 'danger') rows.push(['🚨 手入れが危険水準',
    'クレーム対応で行動力を持っていかれます。手入れ0%になると連鎖退去が始まります。']);
  else if (cb === 'warn') rows.push(['⚠️ 手入れが注意水準',
    '退去が増え、内見も決まりにくくなっています。日常メンテで100%まで戻せます。']);
  if (!rows.length) return '';
  const dead = sb === 'dead' || cb === 'dead';
  return `<div class="rounded-lg p-2 text-[11px] space-y-1 ${dead ? 'bg-red-100 text-red-800' : 'bg-amber-50 text-amber-800'}">
    ${rows.map(([t, d]) => `<div><b>${t}</b>　${d}</div>`).join('')}</div>`;
}

  return `<div class="flex items-center justify-between text-xs p-2 rounded-lg ${ok ? 'bg-emerald-50' : 'bg-slate-50'}">
    <span>最低${term('own_cash', '自己資金')}<span class="text-slate-500">（${r.financed ? r.label : '融資不可・現金のみ'}）</span></span>
    <b class="${ok ? 'text-emerald-700' : 'text-red-600'}">${L.yen(r.cash)}${ok ? '' : ' <span class="font-normal">…資金不足</span>'}</b>
  </div>`;
}

// v8.1: 保有期間と譲渡税。ここが見えていないと「いつ売るか」が運任せになる。
// 「購入差額」だけを見ていると税額を小さく見誤るので、簿価と課税対象益も並べて出す。
function holdingTaxBox(p) {
  const months = L.heldMonthsOf(state, p);
  const bd = L.saleBreakdown(state, p, p.timeValue);
  const corp = p.owner === 'corp';
  const badge = corp
    ? '<span class="bg-navy text-white rounded px-1.5 py-0.5 font-bold">🏢法人・一律30%</span>'
    : bd.longTerm
      ? '<span class="bg-emerald-600 text-white rounded px-1.5 py-0.5 font-bold">長期20%</span>'
      : '<span class="bg-red-500 text-white rounded px-1.5 py-0.5 font-bold">短期39%</span>';
  // 長期化までのカウントダウン。ここが「あと少し待つ」判断の核になる。
  // ただし益が出ていないときは税額も0なので、待つ意味がない＝出さない。
  const saving = Math.round(bd.gain * (L.CONFIG.capGainTaxShort - L.CONFIG.capGainTaxLong));
  const toLong = saving > 0 ? L.monthsToLongTerm(state, p) : 0;
  return `<div class="rounded-lg p-2 text-xs space-y-1 ${bd.longTerm || corp ? 'bg-emerald-50' : 'bg-amber-50'}">
    <div class="flex items-center justify-between">
      <span class="font-bold">保有 ${Math.floor(months / 12)}年${months % 12}ヶ月</span>${badge}</div>
    ${toLong > 0 ? `<div class="text-amber-800 font-bold">⏳ あと${toLong}ヶ月で長期20%になる（いまの時価なら譲渡税 ${L.yen(saving)} の差）</div>` : ''}
    <table class="w-full">
      <tr><td class="text-slate-600">購入価格</td><td class="text-right">${L.yen(p.boughtPrice ?? p.price)}</td></tr>
      <tr><td class="text-slate-600">${term('book_value', '簿価')}（${term('depreciation', '減価償却')}後）</td><td class="text-right">${L.yen(bd.book)}</td></tr>
      <tr class="border-t"><td class="text-slate-600">いま時価で売った場合の課税対象益</td><td class="text-right font-bold">${L.yen(bd.gain)}</td></tr>
      <tr><td class="text-slate-600">${term('capital_gains_tax', '譲渡税')}（${Math.round(bd.rate * 100)}%）</td><td class="text-right text-red-600">-${L.yen(bd.tax)}</td></tr>
    </table>
    <div class="text-[11px] text-slate-500">償却が進むほど簿価が下がり、課税される益は「購入差額」より大きくなります。</div>
  </div>`;
}

// v8.9: 入居／躯体／手入れの3本を同じ見た目で並べる。所有物件だけ「詳細」「修繕」への
// 導線ボタンを付ける（市場物件はまだ自分のものではないので導線は出さない＝action省略）。
// v8.9: 値の列は常に同じ幅(w-12)にして、ボタンの有無に関わらず3行のバーの長さが揃うようにする。
function statBarRow(label, pct, valueHtml, color, action) {
  const v = Math.max(0, Math.min(100, pct));
  // v8.13: maxed（このゲージは既に100%）はopacityだけ落として押せる状態のままにする。
  // pointer-events-noneにすると押した反応が一切無くなり壊れて見えるため、
  // クリック自体は通してハンドラ側でメッセージを出す（disabled＝工事中とは区別する）。
  return `<div class="flex items-center gap-2">
    <span class="w-9 shrink-0 text-[11px] text-slate-500">${label}</span>
    <div class="flex-1 h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="${color} h-1.5" style="width:${v}%"></div></div>
    <span class="w-12 shrink-0 flex flex-col items-end leading-tight">${valueHtml}</span>
    ${action ? `<button class="${action.cls} shrink-0 text-[11.5px] font-bold text-navy bg-slate-100 hover:bg-slate-200 rounded-lg px-3 py-2 min-w-[76px] ${action.disabled ? 'opacity-40 pointer-events-none' : action.maxed ? 'opacity-40' : ''}" ${action.maxed ? `data-maxed-msg="${action.maxedMsg}"` : ''} ${action.gauge ? `data-gauge="${action.gauge}"` : ''}>${action.label} <span class="text-[10px]">›</span></button>` : ''}
  </div>`;
}

// v8.9: 「0/1 0%」のように件数と割合を1行でつなげると数字が繋がって見えて読みにくいため、
// 件数(太字)と割合(小さく淡色)を上下2段に分けて見分けやすくする。躯体・手入れは数値が1つなので1段のまま。
const statValue = (t) => `<span class="text-[11px] font-bold text-slate-700">${t}</span>`;
const statValuePair = (top, bottom) => `${statValue(top)}<span class="text-[9px] text-slate-400 font-normal leading-tight">${bottom}</span>`;

// v8.11: 所有物件一覧のアイコン脇（狭い縦幅）用。¥28,000,000のような表記は入らないため「万」「億」に丸める。
function manYen(n) {
  const r = Math.round(n);
  const sign = r < 0 ? '-' : '';
  const man = Math.abs(r) / 10000;
  return sign + (man >= 10000 ? `${(man / 10000).toFixed(man >= 100000 ? 0 : 1)}億` : `${Math.round(man).toLocaleString('en-US')}万`);
}

// 所有・市場の両方で使う3本（入居／躯体／手入れ）。所有側だけ、入居→レントロール・
// 躯体/手入れ→修繕メニューへの導線ボタンを付ける（市場物件はまだ買っていないので導線なし）。
function statBarsBlock(p, from) {
  const occN = p.units.filter(u => u.occupied).length, unitN = p.units.length;
  const occ = unitN ? Math.round(occN / unitN * 100) : 0;
  const struct = Math.round(p.repairState ?? 100), care = Math.round(p.careState ?? p.repairState ?? 100);
  const busy = !!(p.repairJob || p.valueUpJob);
  const detailAction = from === 'owned' ? { cls: 'dt-goto-rentroll', label: '詳細' } : null;
  // v8.13: 躯体・手入れは別々のゲージなので、100%到達（＝修繕不要）もそれぞれ個別に判定する。
  // 以前は同じ1個のaction（同じclass）を両方の行に使い回しており、querySelectorが最初の
  // 1個（躯体側）にしかクリックを繋げていなかった（手入れの修繕ボタンが反応しないバグ）。
  // v8.14: 押した瞬間に該当ゲージの工事内容（躯体→大規模修繕／手入れ→日常メンテ等）が
  // 一発で分かるよう、data-gaugeを持たせてクリック時にworkOptionsから直接その項目を引く
  // （一覧(step1)経由ではなく、いきなり実施方法の選択(step2)へ飛ばす）。
  const repairAction = (value, label, gauge) => from === 'owned' ? {
    cls: 'dt-goto-repairmenu', label: '修繕', gauge,
    disabled: busy, maxed: !busy && value >= 100,
    maxedMsg: `${label}は既に100%です。修繕の必要はありません。`,
  } : null;
  return `<div class="space-y-2 mt-3">
    ${statBarRow('入居', occ, statValuePair(`${occN}/${unitN}`, `${occ}%`), 'bg-emerald-500', detailAction)}
    ${statBarRow('躯体', struct, statValue(`${struct}%`), 'bg-sky-500', repairAction(struct, '躯体', 'struct'))}
    ${statBarRow('手入れ', care, statValue(`${care}%`), 'bg-amber-500', repairAction(care, '手入れ', 'care'))}
  </div>`;
}

// 折りたたみセクションの見出し行。閉じていても右側に要点の数字だけは見えるようにする
// （中を開かないと何も分からない、を避ける）。
function collapseHeader(cls, open, label, summaryHtml) {
  return `<button class="${cls} w-full flex items-center justify-between gap-2 bg-slate-50 border rounded-lg px-2.5 py-2 text-left">
    <span class="text-[11.5px] font-bold text-navy flex items-center gap-1 shrink-0"><span class="inline-block transition-transform ${open ? 'rotate-90' : ''}">▶</span>${label}</span>
    <span class="text-[11.5px] font-bold whitespace-nowrap">${summaryHtml}</span>
  </button>`;
}

// v8.6: 客付けの見込みは％を出さず、言葉と★で示す。
// 数字を出すと「何％なら出すべきか」の計算ゲームになってしまい、
// 物件を良くするより電卓を叩く遊びに寄る。体感で分かる粒度に落とす。
// 段の切れ目は「AD 1／2／3ヶ月分が必ず別の段に見える」ように置いてある。
// 同じ星が並ぶと上のプランを選ぶ意味が伝わらない。
const FILL_TIERS = [
  { min: 0.68, stars: 5, label: 'すぐ決まりそう',     cls: 'text-emerald-600' },
  { min: 0.50, stars: 4, label: 'かなり決まりやすい', cls: 'text-emerald-600' },
  { min: 0.34, stars: 3, label: '決まりやすい',       cls: 'text-emerald-700' },
  { min: 0.20, stars: 2, label: 'ふつう',             cls: 'text-amber-600' },
  { min: 0,    stars: 1, label: '決まりにくい',       cls: 'text-red-600' },
];
function fillTier(chance) { return FILL_TIERS.find(t => chance >= t.min) || FILL_TIERS[FILL_TIERS.length - 1]; }
function fillTierText(chance) {
  const t = fillTier(chance);
  return `<span class="${t.cls} font-bold">${'★'.repeat(t.stars)}${'☆'.repeat(5 - t.stars)} ${t.label}</span>`;
}

// v8.6: 魅力度の内訳と「伸びしろ」。ADを買う画面のすぐ上に置くのが肝で、
// 「広告費を払う」か「物件を良くする」かを同じ画面で比べられるようにする。
// ADは払い切りで消えるが、修繕やバリューアップは家賃と資産価値になって残る。
function appealBox(p, u) {
  const score = L.appealScore(p, u);
  const b = L.appealBreakdown(p, u);
  const W = L.APPEAL_WEIGHTS;
  const bar = (label, got, max, note) => {
    const pct = Math.round(got / max * 100);
    return `<div class="flex items-center gap-1.5">
      <span class="w-24 shrink-0 text-slate-600">${label}</span>
      <span class="flex-1 bg-slate-200 rounded-full h-1.5 overflow-hidden">
        <span class="block h-1.5 ${pct >= 80 ? 'bg-emerald-500' : pct >= 40 ? 'bg-amber-400' : 'bg-red-400'}" style="width:${pct}%"></span></span>
      <span class="w-16 shrink-0 text-right ${got >= max ? 'text-emerald-600 font-bold' : 'text-slate-500'}">${note}</span></div>`;
  };
  // 直せるもののうち、伸びしろが大きい順に案内する（築年・広さは変えられない）
  const advice = [
    { gap: W.care - b.care, text: `🧹 日常メンテで手入れを戻すと <b>+${W.care - b.care}</b>` },
    { gap: W.valueUp - b.valueUp, text: `✨ ${term('value_up', '価値UP')}を1段進めると <b>+${Math.round(W.valueUp / L.VALUE_UP_MAX_LEVEL)}</b>（家賃も上がる）` },
    { gap: W.struct - b.struct, text: `🏚 大規模修繕で躯体を直すと <b>+${W.struct - b.struct}</b>` },
  ].filter(x => x.gap > 0).sort((a, c) => c.gap - a.gap).slice(0, 2);

  return `<div class="rounded-lg bg-slate-50 p-2 text-[11px] space-y-1">
    <div class="flex justify-between items-center font-bold text-xs">
      <span>🌟 この部屋の魅力度</span>
      <span class="${score >= 80 ? 'text-emerald-600' : score >= 50 ? 'text-amber-600' : 'text-red-600'}">${score} / 100</span></div>
    ${bar('🧹 手入れ', b.care, W.care, `${b.care}/${W.care}`)}
    ${bar(`✨ ${term('value_up', '価値UP')}`, b.valueUp, W.valueUp, `${b.valueUp}/${W.valueUp}`)}
    ${bar('🏚 躯体', b.struct, W.struct, `${b.struct}/${W.struct}`)}
    ${bar('🏠 築年数', b.age, W.age, `築${p.builtAge}年`)}
    ${bar('🚪 広さ', b.layout, W.layout, `${u.sizeSqm ?? '—'}㎡`)}
    ${advice.length ? `<div class="pt-1 mt-1 border-t border-slate-200 space-y-0.5">
      <div class="font-bold text-slate-700">💡 ADを買う代わりに、こうも上げられます</div>
      ${advice.map(a => `<div class="text-slate-600">${a.text}</div>`).join('')}
      <div class="text-[10px] text-slate-500">ADは払ったら消えますが、修繕・${term('value_up', '価値UP')}は家賃と資産価値になって残ります。</div>
    </div>` : '<div class="pt-1 mt-1 border-t border-slate-200 text-emerald-700 font-bold">✨ 直せるところは直し切っています。ADに頼らなくても決まるはずです。</div>'}
  </div>`;
}

// v8.5: 空室の行にある小さなボタン2つ（AD／自主客付け）は指で押しにくかったので、
// 「📣 入居者を募集」1つにまとめ、押してからこの画面で手段を選ぶ形にした。
// v8.4: ADは1〜3ヶ月分から選ぶ。積むほど決まりやすいが、確定はしない。
function openRecruitPicker(p, unitIndex, onAd, onSelf) {
  const u = p.units[unitIndex];
  // 物件詳細（z-50）の上に重ねるので、既存のモーダル枠は使わず専用のオーバーレイを作る。
  const m = el('<div class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 modal-below-header"></div>');
  document.body.appendChild(m);
  const close = () => m.remove();
  const base = L.unitFillChance(p, u);
  const lv = L.skillLevel(state.skills.selfmgmt.exp);
  const selfChance = Math.min(L.AD_MAX_CHANCE, base + L.SELF_FILL_BASE + (lv - 1) * L.SELF_FILL_PER_LV);
  const canSelf = state.actionPower >= L.SELF_FILL_AP;

  const adRows = Object.values(L.AD_PLANS).map(plan => {
    const cost = u.rent * plan.months;
    // いま出ているADより弱いプランは意味がないので選ばせない
    const weaker = u.ad && u.ad.months >= plan.months;
    const after = Math.min(L.AD_MAX_CHANCE, L.naturalFillChance(p) + plan.bonus);
    const enough = state.cash >= cost;
    return `<button class="ad-pick w-full border-2 rounded-lg p-2.5 text-left ${(weaker || !enough) ? 'opacity-40' : 'hover:bg-slate-50'}"
        data-m="${plan.months}" ${(weaker || !enough) ? 'disabled' : ''}>
      <div class="flex justify-between items-center">
        <span class="font-bold text-sm">📣 ${plan.label}</span>
        <span class="font-bold">${L.yen(cost)}</span></div>
      <div class="text-xs text-slate-600">${fillTierText(base)} → ${fillTierText(after)}<span class="text-slate-500">（決まるまで継続）</span></div>
      ${weaker ? '<div class="text-[11px] text-slate-500">すでに同等以上のADを出しています</div>' : ''}
      ${!enough ? '<div class="text-[11px] text-red-600">現金が足りません</div>' : ''}</button>`;
  }).join('');

  const box = el(`<div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-3 max-h-[85vh] overflow-y-auto" style="max-height:85dvh">
    <div class="flex justify-between items-center">
      <h2 class="font-bold">📣 ${unitIndex + 1}号室の入居者を募集</h2>
      <button id="rc-x" class="text-slate-400 text-xl leading-none">✕</button></div>
    <div class="text-xs text-slate-600">家賃 ${L.yen(u.rent)}・空室${u.vacantMonths}ヶ月。
      いまの決まりやすさは ${fillTierText(base)} です。${u.ad ? `<span class="text-emerald-700 font-bold">（${term('ad', 'AD')}${u.ad.months}ヶ月分 掲出中）</span>` : ''}</div>

    ${appealBox(p, u)}

    <div>
      <div class="font-bold text-sm mb-1">💰 ${term('ad', 'AD')}（広告料）を出す</div>
      <div class="text-[11px] text-slate-500 mb-1.5">客付け業者への成功報酬。<b>決まるまで効き続けます</b>が、確実ではありません。</div>
      <div class="space-y-1.5">${adRows}</div>
    </div>

    <div class="pt-2 border-t">
      <div class="font-bold text-sm mb-1">🏃 自分で${term('kyakuduke', '客付け')}する</div>
      <div class="text-[11px] text-slate-500 mb-1.5">現金はかからない代わりに行動力を使う。<b>行動力の続く限り何度でも</b>挑戦できます。</div>
      <button id="rc-self" class="w-full border-2 rounded-lg p-2.5 text-left ${canSelf ? 'hover:bg-slate-50' : 'opacity-40'}" ${canSelf ? '' : 'disabled'}>
        <div class="flex justify-between items-center">
          <span class="font-bold text-sm">🏃 自主${term('kyakuduke', '客付け')}</span>
          <span class="font-bold">${term('action_power', '行動力')} -${L.SELF_FILL_AP}</span></div>
        <div class="text-xs text-slate-600">この1回の手応え ${fillTierText(selfChance)}<span class="text-slate-500">（自主管理Lv${lv}）</span></div>
        ${canSelf ? '' : '<div class="text-[11px] text-red-600">行動力が足りません（翌月へ進むと回復します）</div>'}</button>
    </div>

    <button id="rc-cancel" class="w-full text-slate-500 text-sm">やめる</button></div>`);
  m.appendChild(box);
  box.querySelectorAll('.ad-pick').forEach(b => b.addEventListener('click', () => {
    close(); onAd(Number(b.dataset.m));
  }));
  box.querySelector('#rc-self').addEventListener('click', () => { close(); onSelf(); });
  box.querySelector('#rc-cancel').addEventListener('click', close);
  box.querySelector('#rc-x').addEventListener('click', close);
}

// v3.10: 建物構成サマリ（例: 1K×6戸・平均22㎡）
function buildingComposition(p) {
  if (!p.units?.length || !p.units[0].layout) return '';
  const layout = p.units[0].layout;
  // v8.9: 区分（1戸のみ）は「×1戸・平均」という表現がそもそも成立しないので、間取り・面積だけ出す。
  if (p.units.length === 1) return `${layout}・${p.units[0].sizeSqm}㎡`;
  const avg = Math.round(p.units.reduce((s, u) => s + (u.sizeSqm || 0), 0) / p.units.length);
  return `${layout}×${p.units.length}戸・平均${avg}㎡`;
}

// v8.19で一度廃止（概要の年間収支と重複するため）→ v11.6で復活。月ごとの内訳・累計CF・
// 自己資金回収率は年間集計だけでは追えず、月次の推移を見たいという要望があったため。
function plTab(p) {
  if (!p.history.length) return '<div class="text-slate-500">購入後、月が進むと収支が記録されます。</div>';
  // v8.5: 投下自己資金は購入時に実際に払った諸費用で計算する（旧セーブは概算にフォールバック）
  const acq = p.acquisitionCost ?? Math.round((p.boughtPrice || 0) * L.CONFIG.closingCostRate);
  const equity = p.boughtPrice ? p.boughtPrice - (p.loan ? p.loan.principal : 0) + acq : 0;
  const ccr = equity > 0 ? (p.cum.cf / equity * 100).toFixed(1) : '-';
  return `<div class="mb-1">累計CF: <b class="${p.cum.cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(p.cum.cf)}</b>（${p.cum.months}ヶ月）／ 自己資金回収率 ${ccr}%</div>
    <div class="max-h-60 overflow-y-auto"><table class="w-full text-xs">
    <tr class="text-slate-500"><th>月</th><th>家賃</th><th>空室損</th><th>運営費</th><th>利息</th><th>元金</th><th>税</th><th>CF</th></tr>
    ${[...p.history].reverse().map(h => `<tr class="border-t"><td>${h.month}</td><td>${L.yen(h.rentIn)}</td><td>${L.yen(h.vacancyLoss)}</td>
      <td>${L.yen(h.opex)}</td><td>${L.yen(h.interest)}</td><td>${L.yen(h.principal)}</td><td>${L.yen(h.tax)}</td>
      <td class="${h.cf >= 0 ? 'text-emerald' : 'text-red-600'}">${L.yen(h.cf)}</td></tr>`).join('')}
    </table></div>`;
}

// v8.9: 融資タブは所有物件では表示しなくなったため、市場物件（未購入・ローン無し）専用に単純化した。
