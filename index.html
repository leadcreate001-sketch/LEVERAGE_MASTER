    ctx.fillRect(left, top + h * 0.46, innerW, Math.max(1, h * 0.055));
  }
  if (g.stairBox) {                               // アパート: 箱型の外階段
    ctx.fillStyle = owned ? '#a98551' : GRAY.acc;
    ctx.fillRect(left - w * 0.15, top + h * 0.12, w * 0.15, h * 0.88);
    if (detail) {
      ctx.strokeStyle = owned ? 'rgba(60,42,20,0.5)' : 'rgba(50,58,70,0.5)';
      ctx.lineWidth = Math.max(0.6, size * 0.018);
      for (let i = 1; i < 4; i++) {
        const yy = top + h * 0.12 + h * 0.88 * i / 4;
        ctx.beginPath(); ctx.moveTo(left - w * 0.15, yy); ctx.lineTo(left, yy); ctx.stroke();
      }
    }
  }
  if (g.stairZig) {                               // 鉄骨: ジグザグの外階段
    ctx.strokeStyle = owned ? '#7d93a8' : GRAY.acc;
    ctx.lineWidth = Math.max(0.8, size * 0.028);
    ctx.beginPath();
    const sx = left + w + w * 0.02, gapY = h / (g.floors + 1);
    ctx.moveTo(sx, top + h);
    for (let r = g.floors; r >= 1; r--) { ctx.lineTo(sx + w * 0.12, top + gapY * r + gapY * 0.4); ctx.lineTo(sx, top + gapY * r); }
    ctx.stroke();
  }
  if (g.door && detail) {                         // 戸建て: 玄関ドア
    ctx.fillStyle = owned ? '#7c4a1e' : GRAY.acc;
    ctx.fillRect(left + innerW * 0.44, -h * 0.34, innerW * 0.16, h * 0.34);
  }
  if (g.unit && owned) {                          // 区分: 所有している1住戸だけ強調
    const gapY = h / (g.floors + 1), gapX = innerW / (g.cols + 1);
    const ww = Math.max(1.1, gapX * 0.56), wh = Math.max(1.1, gapY * 0.34);
    const wx = left + gapX * 3 - ww / 2, wy = top + gapY * 4 - wh / 2 - gapY * 0.10;
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = Math.max(0.9, size * 0.026);
    ctx.strokeRect(wx - 1.5, wy - 1.5, ww + 3, wh + 3);
  }
  if (o.boarded && rects.length) {                // ボロ: 板が打たれた窓
    const r = rects[rects.length - 1];
    ctx.strokeStyle = '#7c5a2e'; ctx.lineWidth = Math.max(0.8, size * 0.026);
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.w, r.y + r.h);
    ctx.moveTo(r.x + r.w, r.y); ctx.lineTo(r.x, r.y + r.h); ctx.stroke();
  }
  if (o.crack > 0 && detail) {                    // ボロ: 壁のひび
    ctx.strokeStyle = `rgba(38,28,18,${0.35 + o.crack * 0.4})`;
    ctx.lineWidth = Math.max(0.7, size * 0.020);
    ctx.beginPath();
    let px = left + innerW * 0.26, py = top + h * 0.10; ctx.moveTo(px, py);
    for (let i = 0; i < 5; i++) { px += (rnd() - 0.4) * w * 0.14; py += h * 0.17; ctx.lineTo(px, py); }
    ctx.stroke();
  }
  ctx.strokeStyle = owned ? 'rgba(15,23,42,0.5)' : 'rgba(30,41,59,0.5)';
  ctx.lineWidth = Math.max(0.6, size * 0.024);
  ctx.strokeRect(left, top, w, h);
  if (o.weed && detail) {                         // ボロ: 足元の雑草
    ctx.strokeStyle = '#4d7c3a'; ctx.lineWidth = Math.max(0.8, size * 0.024);
    for (let i = 0; i < 5; i++) {
      const gx = left + w * (0.02 + rnd() * 1.0);
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx + (rnd() - 0.5) * size * 0.08, -size * (0.05 + rnd() * 0.07)); ctx.stroke();
    }
  }
  if (o.scaffold) {                               // v5: 業者修繕中は足場を掛けて一目で分かるように
    ctx.strokeStyle = 'rgba(203,213,225,0.65)';
    ctx.lineWidth = Math.max(0.6, size * 0.020);
    const bx = left - w * 0.08, bw = w * 1.16;
    for (let i = 0; i <= 3; i++) { const yy = top + h * i / 3; ctx.beginPath(); ctx.moveTo(bx, yy); ctx.lineTo(bx + bw, yy); ctx.stroke(); }
    for (let i = 0; i <= 3; i++) { const xx = bx + bw * i / 3; ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, 0); ctx.stroke(); }
  }
  ctx.restore();
}

// 雰囲気建物（タップ不可・背景）: 濃紺のシルエット＋ごく淡い金の窓。
// ピンハネ帝国のタイトル画面の摩天楼と同じ質感にして「夜の街」に見せる。
function drawFillerBuilding(x, y, size, stories, seed, alpha) {
  const rnd = srand(seed);
  const w = size * (stories >= 5 ? 0.56 : 0.70), h = size * (0.30 + stories * 0.14);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#0d1a2e'; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = 'rgba(148,163,184,0.16)'; ctx.fillRect(x - w / 2, y - h, w, Math.max(0.8, h * 0.05));
  const cols = Math.max(2, Math.round(w / (size * 0.20))), rows = Math.max(1, stories);
  const gx = w / (cols + 1), gy = h / (rows + 1);
  for (let r = 1; r <= rows; r++) for (let c = 1; c <= cols; c++) {
    if (rnd() < 0.45) continue;
    ctx.fillStyle = `rgba(251,191,36,${0.26 + rnd() * 0.36})`;
    ctx.fillRect(x - w / 2 + gx * c - gx * 0.18, y - h + gy * r - gy * 0.16, Math.max(0.7, gx * 0.36), Math.max(0.7, gy * 0.30));
  }
  ctx.restore();
}

// 物件stateから描画パラメータへの変換。既存の svgBuildingParts をそのまま使うので、
// DIY・修繕で修繕度が上がれば専用の分岐なしに自然と綺麗になる。
function buildingOptsFor(p, owned) {
  const parts = L.svgBuildingParts(p);
  const occ = p.units && p.units.length ? p.units.filter(u => u.occupied).length / p.units.length : 1;
  const ruined = parts.wake && p.repairState < 40;
  return {
    shape: parts.shape, owned, occ,
    dirt: parts.dirtLevel, crack: parts.hasCracks ? 0.7 : 0, weed: parts.hasWeeds,
    tilt: parts.tilt ? 0.035 : 0, broken: ruined, boarded: ruined,
    scaffold: owned && !!p.repairJob,
    seed: hashSeed('bld:' + p.id)() * 4294967296,
  };
}

// 陸地の輪郭パッチ（雰囲気のみ）: 中心に厚く・外周にいくほど薄く広がる分布。
// v9-A: 「中心からの距離 + パッチ半径」が陸地半径を超えないようにする。超えると、中心間距離と
// 半径の和で見ている離隔チェック（L.regionOverlaps）の前提が崩れ、検算がOKでも海岸線が接触する。
// v9-A: ブロブの本数は陸地の大きさで割らない。半径もRに比例させているので、数まで面積比で
// 減らすと小さい陸地だけ隙間だらけになり「島が散らばっている」ように見える（実際にそうなった）。
// 本数は一定にして大きさだけを比例させると、どの陸地も同じ密度で埋まる。
//
// 基本の陸は半径の0.50までに収め、そこから外は「岬」だけが伸びる余地として空けておく。
// 外周いっぱいまで基本形で埋めると、岬を足しても既存の海岸線に埋もれて凹凸が見えなくなる
// （world-sample で実際にそうなった）。入り江は廃止——海を色で抜く方式では、海岸に接して
// いても独立した水たまり＝池にしか見えなかったため。
const LAND_BLOBS = (() => {
  const out = {};
  for (const r of REGION_LIST) {
    const rnd = hashSeed('land:' + r.key);
    const ls = lonScale(r.lat);
    const n = Math.round(88 * L.LAND_FILL);
    const blobs = Array.from({ length: n }, () => {
      const ang = rnd() * TAU;
      const d = Math.sqrt(rnd()) * r.radius * 0.50;
      return {
        lat: r.lat + Math.sin(ang) * d, lon: r.lon + Math.cos(ang) * d * ls,
        rad: r.radius * (0.17 + rnd() * 0.13),
        dLat: Math.sin(ang) * d, dLon: Math.cos(ang) * d * ls,
        core: d < r.radius * CORE_RATIO,
      };
    });
    // 岬: 基本の海岸線より外へ、細くなりながらブロブを連ねて突き出す。
    const nCape = Math.round(L.CAPES);
    for (let i = 0; i < nCape; i++) {
      const ang = rnd() * TAU, steps = 4 + Math.floor(rnd() * 3);
      const reach = r.radius * (0.60 + (0.14 + rnd() * 0.26) * L.CAPE_SIZE);
      const w0 = r.radius * 0.15 * L.CAPE_SIZE;
      for (let k = 1; k <= steps; k++) {
        const rad = Math.max(r.radius * 0.035, w0 * (1 - 0.13 * k));
        const d = r.radius * 0.48 + (reach - r.radius * 0.48) * (k / steps);
        if (d + rad > r.radius) break;   // 陸地半径を超えない＝離隔チェックを壊さない
        const a2 = ang + (rnd() - 0.5) * 0.14;
        blobs.push({
          lat: r.lat + Math.sin(a2) * d, lon: r.lon + Math.cos(a2) * d * ls,
          rad, dLat: Math.sin(a2) * d, dLon: Math.cos(a2) * d * ls, core: false,
        });
      }
    }
    out[r.key] = blobs;
  }
  return out;
})();

// 内陸の池。陸を塗ったあとに水の色で抜く。建物・山はこの中に置かない。
const LAND_WATERS = (() => {
  const out = {};
  for (const r of REGION_LIST) {
    const rnd = hashSeed('water:' + r.key);
    const ls = lonScale(r.lat);
    out[r.key] = Array.from({ length: Math.round(L.LAKES) }, () => {
      const ang = rnd() * TAU, d = (0.10 + rnd() * 0.30) * r.radius;
      return {
        lat: r.lat + Math.sin(ang) * d, lon: r.lon + Math.cos(ang) * d * ls,
        rad: r.radius * (0.06 + rnd() * 0.08),
        dLat: Math.sin(ang) * d, dLon: Math.cos(ang) * d * ls,
      };
    });
  }
  return out;
})();

// その点が実際に陸（ブロブの塗られている範囲・かつ池の外）かどうか。
// これを見ずに半径だけで配置していたため、ブロブの隙間＝海の上に建物が立っていた。
function onLandOf(regionKey, dLat, dLon) {
  const r = regionOf(regionKey), ls = lonScale(r.lat), aLon = dLon / ls;
  if (!LAND_BLOBS[r.key].some(b => Math.hypot(dLat - b.dLat, aLon - b.dLon / ls) < b.rad * 0.92)) return false;
  return !LAND_WATERS[r.key].some(w => Math.hypot(dLat - w.dLat, aLon - w.dLon / ls) < w.rad * 1.15);
}

// v9-A: 旧「未開拓エリア（海に浮かぶ黒いシミ4つ）」は廃止し、未解放の陸地そのものを黒く塗る方式にした。
// 陸地は L.REGIONS が持ち、解放済みかどうかで色が変わるだけになる（別データを持たない）。

// 街道の経路（緯度経度）をキャッシュし、建物・山が道の上に湧かないようにする判定に使う。
// 描画用の roadPath() は同じ式を通してから project() する（判定と見た目がズレないように）。
//
// 大円（＝球面上の最短路）そのままだと定規で引いたようになるので、進行方向の法線に、
// 両端で0になる包絡線を掛けた揺らぎを足して蛇行させる。両端は必ず0なので接続点はずれない。
function roadPhases(a, b) {
  const rnd = hashSeed('road:' + a.key + ':' + b.key);
  return [rnd() * TAU, rnd() * TAU];
}
const ROAD_LL = REGION_LIST.filter(r => r.roadTo).map(r => ({ from: regionOf(r.roadTo), to: r }));
function roadPathLL(a, b) {
  const ph = roadPhases(a, b), n = 64;
  const amp = L.ROAD_CURVE * L.regionAngularDistance(a, b) * 0.22;
  const base = [];
  for (let i = 0; i <= n; i++) base.push(slerpLL(a, b, i / n));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, q = base[i];
    const nb = base[Math.min(n, i + 1)], pv = base[Math.max(0, i - 1)];
    const cl = Math.max(0.25, Math.cos(q.lat));
    const dLat = nb.lat - pv.lat, dLon = (nb.lon - pv.lon) * cl;
    const len = Math.hypot(dLat, dLon) || 1;
    const off = amp * Math.sin(Math.PI * t)
      * (0.62 * Math.sin(t * TAU * 1.3 + ph[0]) + 0.38 * Math.sin(t * TAU * 2.7 + ph[1]));
    out.push({ lat: q.lat + (-dLon / len) * off, lon: q.lon + (dLat / len) * off / cl });
  }
  return out;
}
const ROAD_PATHS_LL = ROAD_LL.map(({ from, to }) => roadPathLL(from, to));
// 点と線分の距離（緯度経度を局所的に平面とみなす。経度は cos(lat) を掛けて弧の長さに直す）
function distToSeg(lat, lon, p, q) {
  const cl = Math.max(0.25, Math.cos(lat));
  const px = (lon - p.lon) * cl, py = lat - p.lat;
  const vx = (q.lon - p.lon) * cl, vy = q.lat - p.lat;
  const len2 = vx * vx + vy * vy;
  const t = len2 ? Math.max(0, Math.min(1, (px * vx + py * vy) / len2)) : 0;
  return Math.hypot(px - vx * t, py - vy * t);
}
function nearRoad(lat, lon, clear) {
  if (clear <= 0) return false;
  for (const path of ROAD_PATHS_LL)
    for (let i = 0; i < path.length - 1; i++)
      if (distToSeg(lat, lon, path[i], path[i + 1]) < clear) return true;
  return false;
}

// 山（地形記号）。外周寄りの陸に置く。建物より先に決めて、建物のほうに避けさせる。
const LAND_HILLS = (() => {
  const out = {};
  for (const r of REGION_LIST) {
    const rnd = hashSeed('hill:' + r.key);
    const want = Math.round(L.HILLS);
    const ls = lonScale(r.lat);
    const arr = [];
    for (let i = 0; i < want * 8 && arr.length < want; i++) {
      const ang = rnd() * TAU, d = (0.42 + rnd() * 0.48) * r.radius;
      const dLat = Math.sin(ang) * d, dLon = Math.cos(ang) * d * ls;
      if (!onLandOf(r.key, dLat, dLon)) continue;
      if (nearRoad(r.lat + dLat, r.lon + dLon, L.ROAD_CLEAR)) continue;   // 道の上に山は生えない
      arr.push({ lat: r.lat + dLat, lon: r.lon + dLon, dLat, dLon, sz: 0.7 + rnd() * 0.7 });
    }
    out[r.key] = arr;
  }
  return out;
})();
function nearHillOf(regionKey, dLat, dLon) {
  const r = regionOf(regionKey), ls = lonScale(r.lat);
  return LAND_HILLS[r.key].some(h => Math.hypot(dLat - h.dLat, (dLon - h.dLon) / ls) < r.radius * 0.055 * h.sz);
}

// 雰囲気建物のスロット: 中心=高密度・高層、外周=低密度・低層。
// 引いたときは先頭6割だけ描いて間引く（生成順が半径に対してランダムなので偏らない）。
// v9-A: 陸地ごとに生成する。棟数は面積比（半径の2乗）で配分するので、小さい陸地は自然に疎になる。
// 本土は radius 1.20 で want=200・試行460回となり、単一大陸だった頃と同じ本数になる。
const FILLER_SLOTS = (() => {
  const out = {};
  for (const r of REGION_LIST) {
    const rnd = hashSeed('fill:' + r.key);
    const want = Math.max(12, Math.round(FILLER_COUNT * Math.pow(r.radius / 1.20, 2)));
    const ls = lonScale(r.lat);
    const arr = [];
    for (let i = 0; i < want * 6 && arr.length < want; i++) {
      const ang = rnd() * TAU;
      const d = rnd() * r.radius * L.BLD_RANGE;
      const t = d / r.radius;                     // 0=中心（都心）〜1=外周（地方）
      const keepProb = t < CORE_RATIO ? 0.62 : t < MID_RATIO ? 0.32 : 0.12;
      if (rnd() > keepProb) continue;
      const dLat = Math.sin(ang) * d, dLon = Math.cos(ang) * d * ls;
      if (!onLandOf(r.key, dLat, dLon)) continue;   // 海・池の上には建てない
      if (nearRoad(r.lat + dLat, r.lon + dLon, L.ROAD_CLEAR)) continue;   // 街道の上にも建てない
      if (nearHillOf(r.key, dLat, dLon)) continue;   // 山の上にも建てない
      const stories = t < CORE_RATIO ? 4 + Math.floor(rnd() * 6)
        : t < MID_RATIO ? 2 + Math.floor(rnd() * 3)
        : 1 + Math.floor(rnd() * 2);
      arr.push({ lat: r.lat + dLat, lon: r.lon + dLon, stories, seed: 100 + i });
    }
    out[r.key] = arr;
  }
  return out;
})();

// urban=都心コア寄り、local=郊外〜地方寄りの半径帯に配置（既存ロジックのareaKeyをそのまま利用）。
// v9-A: 帯は陸地半径に対する比率で持つので、大きさの違う陸地でも同じ見え方になる。
function bandFor(r, areaKey) {
  return areaKey === 'urban'
    ? { rMin: r.radius * 0.033, rMax: r.radius * CORE_RATIO }
    // 外周は建物を置く範囲（BLD_RANGE）で頭打ちにする。ここを超えるとブロブの外＝海に出る。
    : { rMin: r.radius * MID_RATIO * 0.85, rMax: r.radius * L.BLD_RANGE };
}
// v9-A: 物件は自分の陸地（p.region）の中に置く。旧セーブは migrateSave で 'main' が補完されている。
function slotFor(regionKey, areaKey, seed) {
  const r = regionOf(regionKey);
  const rnd = hashSeed('slot:' + areaKey + ':' + seed);
  const { rMin, rMax } = bandFor(r, areaKey);
  const ang = rnd() * TAU;
  const rad = rMin + (rMax - rMin) * rnd();
  return { lat: r.lat + Math.sin(ang) * rad, lon: r.lon + Math.cos(ang) * rad * lonScale(r.lat) };
}

function project(lat, lon) {
  const cl = Math.cos(lat);
  const x = cl * Math.sin(lon + yaw);
  const y = Math.sin(lat);
  const z = cl * Math.cos(lon + yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = y * cp - z * sp;
  const z2 = y * sp + z * cp;
  return { x: cx + x * R, y: cy - y2 * R, z: z2 };
}

const STARS = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random() * 0.6, tw: Math.random() * TAU }));

// v5: 空・海・大気光・大陸の色はピンハネ帝国と同じ値に揃えた（夜寄りの濃紺）。
function drawSky(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#050b1c'); g.addColorStop(1, '#0d1c33');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#e2e8f0';
  const t = performance.now() / 1000;
  for (const s of STARS) {
    ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(t / 2.3 + s.tw));
    ctx.fillRect(s.x * w, s.y * h, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
}

function drawGlobeBase() {
  ctx.beginPath(); ctx.arc(cx, cy, R + 5, 0, TAU);
  ctx.strokeStyle = 'rgba(56,189,248,0.16)'; ctx.lineWidth = 10; ctx.stroke();
  const pg = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.15, cx, cy, R);
  pg.addColorStop(0, '#17416e'); pg.addColorStop(1, '#081a30');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
}

// 球面に沿って線を引く（裏側に回った区間は途切れる）。橋・航路の共通処理。
function strokeGreatCircle(a, b, t0, t1, steps = 26) {
  ctx.beginPath(); let pen = false;
  for (let i = 0; i <= steps; i++) {
    const q = slerpLL(a, b, t0 + (t1 - t0) * (i / steps));
    const p = project(q.lat, q.lon);
    if (p.z > 0.03) { if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; } } else pen = false;
  }
  ctx.stroke();
}

// v9-A: 橋はやめた。この配置（陸どうしがほぼ接している）では架ける隙間が無く、
// どう描いても「橋」に見えないため。陸の上を通る街道でつなぐ。
//
// 経路（緯度経度）は roadPathLL() が持つ（建物・山の回避判定と共有する唯一の実装）。
// ここでは、その経路を投影して画面座標にするだけ。
function roadPath(a, b) { return roadPathLL(a, b).map(q => project(q.lat, q.lon)); }
function strokeRoadPoly(pts) {
  ctx.beginPath(); let pen = false;
  for (const p of pts) {
    if (p.z > 0.03) { if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; } } else pen = false;
  }
  ctx.stroke();
}
// 街道は解放状態に関係なく、ロック中の地区まで通して描く。
// ロックされていることは「土地が黒い」ことだけで示す（道まで消すと世界がつながって見えない）。
function drawRoad(a, b) {
  const pts = roadPath(a, b);
  const w = Math.max(1.4, R * L.ROAD_W * 0.42);
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = '#c8b58a'; ctx.lineWidth = w; strokeRoadPoly(pts);                       // 路面
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(0.7, w * 0.22);
  ctx.setLineDash([R * 0.014, R * 0.014]); strokeRoadPoly(pts); ctx.setLineDash([]);         // センターライン
  ctx.restore();
}

// 島（海外）は陸路で行けない。航路の点線と✈️で示す。
// 陸続きの街道と違い、こちらは「便が就航している」ことの表現なので、解放されるまで飛ばさない。
function drawSeaRoute(from, island) {
  if (!regionUnlocked(island)) return;
  ctx.save();
  ctx.setLineDash([R * 0.02, R * 0.022]);
  ctx.strokeStyle = 'rgba(148,197,255,0.5)';
  ctx.lineWidth = Math.max(1, R * 0.005);
  strokeGreatCircle(from, island, 0, 1, 40);
  ctx.setLineDash([]);
  const mid = slerpLL(from, island, (performance.now() / 2600) % 1);
  const pm = project(mid.lat, mid.lon);
  if (pm.z > 0.05) {
    ctx.font = `${Math.round(R * 0.055)}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('✈️', pm.x, pm.y);
  }
  ctx.restore();
}

function drawLandmasses() {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();

  // 陸地。まず一回り大きい砂色で塗ってから本体を重ねると、union の外周だけが海岸線として残る。
  // 輪郭線が1本入るかどうかで「地図に見えるか」が決まる（塗り分けだけでは地図にならない）。
  //
  // 縁の太さは半径への掛け算ではなく固定px（球外周のリングと同じ Math.max(1, R*0.004)）にする。
  // 掛け算だとブロブが大きいほど縁も太くなり、輪郭の太さが場所によってバラバラに見えていた。
  const edgePx = Math.max(1, R * 0.004);
  for (const r of REGION_LIST) {
    const open = regionUnlocked(r);
    for (const b of LAND_BLOBS[r.key]) {
      const p = project(b.lat, b.lon);
      if (p.z < 0.02) continue;
      ctx.globalAlpha = Math.min(1, p.z * 4) * (open ? 0.95 : 0.85);
      ctx.fillStyle = open ? 'hsl(45, 32%, 52%)' : 'hsl(220, 22%, 14%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, b.rad * R * (0.35 + 0.65 * p.z) + edgePx, 0, TAU); ctx.fill();
    }
    for (const b of LAND_BLOBS[r.key]) {
      const p = project(b.lat, b.lon);
      if (p.z < 0.02) continue;
      ctx.globalAlpha = Math.min(1, p.z * 4) * (open ? 0.95 : 0.85);
      ctx.fillStyle = !open ? 'hsl(220, 25%, 9%)'
        : b.core ? 'hsl(158, 26%, 21%)' : 'hsl(112, 26%, 20%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, b.rad * R * (0.35 + 0.65 * p.z), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!open) continue;   // 池・山は解放された陸地にだけ描く（未解放は黒い土地のまま）

    // 池: 陸を塗ったあとに水の色で抜く。砂の縁は海岸線と同じ固定px。
    for (const wt of LAND_WATERS[r.key]) {
      const p = project(wt.lat, wt.lon);
      if (p.z < 0.02) continue;
      const rr = wt.rad * R * (0.35 + 0.65 * p.z);
      ctx.globalAlpha = Math.min(1, p.z * 4);
      ctx.fillStyle = 'hsl(45, 32%, 52%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, rr + edgePx, 0, TAU); ctx.fill();
      ctx.fillStyle = 'hsl(202, 46%, 26%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 山（地形記号）。稜線に陽の当たる面を入れると、ただの三角ではなく山に見える。
    for (const hl of LAND_HILLS[r.key]) {
      const p = project(hl.lat, hl.lon);
      if (p.z < 0.06) continue;
      const u = R * 0.020 * hl.sz * (0.5 + p.z * 0.6);
      ctx.globalAlpha = Math.min(1, p.z * 3);
      ctx.fillStyle = 'rgba(120,132,124,0.85)';
      ctx.beginPath(); ctx.moveTo(p.x - u, p.y + u * 0.55); ctx.lineTo(p.x, p.y - u); ctx.lineTo(p.x + u, p.y + u * 0.55); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(226,232,240,0.75)';
      ctx.beginPath(); ctx.moveTo(p.x, p.y - u); ctx.lineTo(p.x + u * 0.34, p.y - u * 0.10); ctx.lineTo(p.x, p.y - u * 0.10); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 街道と航路は陸地より後に描く（緑の上にかぶせる）
  for (const r of REGION_LIST) if (r.roadTo) drawRoad(regionOf(r.roadTo), r);
  drawSeaRoute(L.REGIONS.main, L.REGIONS.overseas);

  ctx.strokeStyle = 'rgba(148,163,184,0.09)'; ctx.lineWidth = 1;
  for (let m = 0; m < 8; m++) {
    const lon = m * TAU / 8;
    ctx.beginPath(); let pen = false;
    for (let la = -85; la <= 85; la += 6) {
      const p = project(la * Math.PI / 180, lon);
      if (p.z > 0.02) { if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; } } else pen = false;
    }
    ctx.stroke();
  }
  ctx.restore();

  // 未解放の陸地には🔒とエリア名。タップすると解放条件が見られる。
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const r of REGION_LIST) {
    if (regionUnlocked(r)) continue;
    const p = project(r.lat, r.lon);
    if (p.z < 0.05) continue;
    const sc = 0.6 + p.z * 0.6;
    ctx.globalAlpha = Math.min(1, p.z * 2);
    ctx.fillStyle = '#fbbf24';
    ctx.font = `${Math.round(18 * sc)}px ${EMOJI_FONT}`;
    ctx.fillText('🔒', p.x, p.y);
    ctx.fillStyle = 'rgba(203,213,225,0.9)';
    ctx.font = `700 ${Math.round(Math.max(10, 12 * sc))}px sans-serif`;
    ctx.fillText(`${r.icon} ${r.label}`, p.x, p.y + 20 * sc);
  }
  ctx.restore();
}

// 状態バッジ（入居率ドット・売出中・修繕中・お気に入り⭐）
function drawBadges(p, pr, size, kind) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  const g = BLD_STYLE[L.svgBuildingParts(p).shape] || BLD_STYLE.kodate;
  const top = pr.y - size * g.h;
  if (kind === 'owned') {
    const occ = p.units && p.units.length ? p.units.filter(u => u.occupied).length / p.units.length : 1;
    ctx.fillStyle = occ >= 0.999 ? '#4ade80' : occ > 0 ? '#fbbf24' : '#f87171';
    ctx.beginPath(); ctx.arc(pr.x + size * 0.42, top - size * 0.18, Math.max(1.8, size * 0.11), 0, TAU); ctx.fill();
    if ((st.listings || []).some(l => l.propertyId === p.id)) {
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(pr.x - size * 0.42, top - size * 0.18, Math.max(1.8, size * 0.11), 0, TAU); ctx.fill();
    }
    if (p.repairJob || p.valueUpJob) {
      ctx.globalAlpha = 1; ctx.fillStyle = '#f59e0b';
      ctx.font = `${Math.round(Math.max(10, size * 0.7))}px ${EMOJI_FONT}`;
      ctx.fillText(p.repairJob ? '🔨' : '✨', pr.x, top - size * 0.34);
    }
  } else if ((st.favorites || []).some(f => f.propertyId === p.id)) {
    // お気に入り登録した市場物件だけ⭐を付けタップ可能にする（未登録の市場物件は背景と同じ扱い）
    ctx.globalAlpha = 1; ctx.fillStyle = '#facc15';
    ctx.font = `${Math.round(Math.max(10, size * 0.72))}px ${EMOJI_FONT}`;
    ctx.fillText('⭐', pr.x, top - size * 0.20);
  }
  ctx.restore();
}

// 実物件（所有・市場）同士が重なってタップしづらくなるのを防ぐ決定的な間引き配置。
// 既に配置済みの点と近すぎる場合、id由来の固定角度でスパイラル状に押し出す（毎フレーム同じ結果になる）。
function spreadItems(items) {
  const placed = [];
  for (const it of items) {
    let lat = it.lat, lon = it.lon;
    for (let tries = 0; tries < 24; tries++) {
      const conflict = placed.some(pl => {
        const dlat = lat - pl.lat;
        const dlon = (lon - pl.lon) * Math.cos(lat);
        return Math.sqrt(dlat * dlat + dlon * dlon) < MIN_SEP;
      });
      if (!conflict) break;
      const pushAng = hashSeed('push:' + it.kind + ':' + it.p.id + ':' + tries)() * TAU;
      const pushRad = MIN_SEP * 0.65 * (tries + 1);
      lat = it.lat + Math.sin(pushAng) * pushRad;
      lon = it.lon + Math.cos(pushAng) * pushRad;
    }
    placed.push({ ...it, lat, lon });
  }
  return placed;
}

function coloredItems() {
  if (!st) return [];
  const items = [];
  st.properties.forEach(p => { const s = slotFor(p.region, p.areaKey, 'o:' + p.id); items.push({ p, lat: s.lat, lon: s.lon, kind: 'owned' }); });
  st.market.forEach(p => { const s = slotFor(p.region, p.areaKey, 'm:' + p.id); items.push({ p, lat: s.lat, lon: s.lon, kind: 'market' }); });
  return spreadItems(items);
}

// v5: 翌月ボタンから呼ばれるゆっくり回転。draw() の毎フレームで補間する。
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function normAngle(a) { return ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; }
function stepViewAnim(now) {
  if (!viewAnim) return;
  const t = Math.min(1, (now - viewAnim.t0) / viewAnim.dur);
  const e = easeInOutCubic(t);
  // v9-A: 行き先を指定できるようにした（既定は HOME＝本土の都心コア）。
  const toPitch = viewAnim.toPitch == null ? HOME.pitch : viewAnim.toPitch;
  const toZoom = viewAnim.toZoom == null ? HOME.zoom : viewAnim.toZoom;
  yaw = viewAnim.fromYaw + viewAnim.dYaw * e;
  pitch = viewAnim.fromPitch + (toPitch - viewAnim.fromPitch) * e;
  zoom = viewAnim.fromZoom + (toZoom - viewAnim.fromZoom) * e;
  if (t >= 1) {
    yaw = viewAnim.fromYaw + viewAnim.dYaw; pitch = toPitch; zoom = toZoom;
    viewAnim = null;
  }
}

function draw(ts) {
  rafId = requestAnimationFrame(draw);
  if (ts - lastFrame < 1000 / FPS) return;
  const dt = Math.min(0.1, (ts - lastFrame) / 1000 || 0.033);
  lastFrame = ts;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  stepViewAnim(ts);
  if (!dragging && !viewAnim) { yaw += yawV * dt; yawV *= 0.92; }

  cx = w / 2; cy = h * 0.52; R = Math.min(w, h) * 0.44 * zoom;

  drawSky(w, h);
  drawGlobeBase();
  drawLandmasses();

  // 雰囲気建物（奥から手前へ）。引いたときは本数も間引いて、ごちゃつきを抑える。
  const fUnit = fillerUnit();
  // v9-A: 未解放の陸地には雰囲気建物を描かない（黒い土地のままにする）
  const fillers = [];
  for (const r of REGION_LIST) if (regionUnlocked(r)) fillers.push(...FILLER_SLOTS[r.key]);
  const cap = zoom < 0.9 ? Math.round(fillers.length * 0.6) : fillers.length;
  fillers.slice(0, cap)
    .map(s => ({ s, p: project(s.lat, s.lon) }))
    .filter(o => o.p.z > 0.05)
    .sort((a, b) => a.p.z - b.p.z)
    .forEach(({ s, p }) => drawFillerBuilding(p.x, p.y, fUnit * (0.62 + p.z * 0.8), s.stories, s.seed, 0.30 + p.z * 0.26));

  // 実物件（所有=カラー／市場=グレー）は奥から手前へ
  const pUnit = propUnit();
  coloredItems()
    .map(it => ({ ...it, pr: project(it.lat, it.lon) }))
    .filter(it => it.pr.z > 0.04)
    .sort((a, b) => a.pr.z - b.pr.z)
    .forEach(it => {
      const size = pUnit * (0.80 + it.pr.z * 0.55);
      if (it.kind === 'owned') {   // 所有物件の足元に淡いハロー（自分の物件を見分けやすく）
        ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#a7f3d0';
        ctx.beginPath(); ctx.ellipse(it.pr.x, it.pr.y, size * 0.72, size * 0.22, 0, 0, TAU); ctx.fill(); ctx.restore();
      }
      const o = buildingOptsFor(it.p, it.kind === 'owned');
      drawBuilding(it.pr.x, it.pr.y, size, { ...o, alpha: it.kind === 'owned' ? 1 : 0.85 });
      drawBadges(it.p, it.pr, size, it.kind);
    });

  // 一覧「地図を見る」からのハイライト（拡大リング＋跳ねる📍ピン）。どこかをクリックするまで維持され、
  // ピン自体をクリックすると詳細画面が開く（pointerup側で処理）。
  if (pingItem) {
    const pr = project(pingItem.lat, pingItem.lon);
    if (pr.z > 0.02) {
      pingItem.sx = pr.x; pingItem.sy = pr.y;   // クリック判定用に画面座標を保持
      const now = performance.now();
      const t = (now % 900) / 900;
      ctx.save();
      ctx.strokeStyle = `rgba(250,204,21,${0.9 * (1 - t)})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(pr.x, pr.y - 8, 14 + t * 34, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(250,204,21,${0.6 * (1 - ((t + 0.5) % 1))})`;
      ctx.beginPath(); ctx.arc(pr.x, pr.y - 8, 14 + ((t + 0.5) % 1) * 34, 0, TAU); ctx.stroke();
      const bounce = Math.abs(Math.sin(now / 220)) * 9;
      ctx.fillStyle = '#ef4444';
      ctx.font = `28px ${EMOJI_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('📍', pr.x, pr.y - 26 - bounce);
      ctx.restore();
    } else {
      pingItem.sx = null; pingItem.sy = null;   // 裏面に回ったらクリック不可
    }
  }
}

// 地図上でタップ対象になるのは所有物件、および★お気に入り登録済みの市場物件のみ。
// v3.3: どの建物がタップ対象か分かるように、ホバー（マウス）／1度目のタップ（タッチ）で
// 物件名などの簡易情報を吹き出し表示する。2度目のタップ（マウスはクリック）で詳細へ。
let tipEl = null, tapCandidateId = null, tapCandidateTimer = 0;
function tipHtmlFor(hit) {
  const p = hit.p;
  const nm = p.name || p.label;
  if (hit.kind === 'owned') {
    const occ = p.units && p.units.length ? Math.round(p.units.filter(u => u.occupied).length / p.units.length * 100) : 100;
    return `🏠 <b>${nm}</b><br>${p.owner === 'corp' ? '🏢法人' : '👤個人'}・入居${occ}%・躯体${Math.round(p.repairState)}%・手入れ${Math.round(p.careState ?? p.repairState)}%${p.repairJob ? '・🔨修繕中' : ''}${p.autoManage ? '・🏢おまかせ' : ''}`;
  }
  return `⭐ <b>${nm}</b><br>市場（お気に入り）・${L.yen(p.price)}・利回り${(p.grossYield * 100).toFixed(1)}%`;
}
function showTip(hit, x, y, extra) {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.style.cssText = 'position:fixed;z-index:45;pointer-events:none;background:rgba(255,255,255,0.97);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,0.28);padding:6px 10px;font-size:12px;color:#0f172a;line-height:1.5;max-width:240px;';
    document.body.appendChild(tipEl);
  }
  const rect = canvas.getBoundingClientRect();
  tipEl.innerHTML = tipHtmlFor(hit) + (extra ? `<div style="color:#64748b;font-size:10px;">${extra}</div>` : '');
  tipEl.style.left = Math.round(rect.left + x + 14) + 'px';
  tipEl.style.top = Math.round(rect.top + y - 14) + 'px';
  tipEl.style.display = 'block';
}
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }

function hitTest(px, py) {
  const favIds = new Set((st?.favorites || []).map(f => f.propertyId));
  const pUnit = propUnit();
  const items = coloredItems()
    .filter(it => it.kind === 'owned' || favIds.has(it.p.id))
    .map(it => ({ ...it, pr: project(it.lat, it.lon) }))
    .filter(it => it.pr.z > 0.04)
    .sort((a, b) => b.pr.z - a.pr.z);
  for (const it of items) {
    const size = pUnit * (0.80 + it.pr.z * 0.55);
    const g = BLD_STYLE[L.svgBuildingParts(it.p).shape] || BLD_STYLE.kodate;
    const half = size * g.w * 0.5;
    const top = size * g.h;
    // 建物が小さくても押しやすいよう、見た目より広めの当たり判定にする（最低22px幅を確保）。
    const padX = Math.max(8, 11 - half), padTop = Math.max(10, 14 - top * 0.5);
    if (px >= it.pr.x - half - padX && px <= it.pr.x + half + padX &&
        py >= it.pr.y - top - padTop && py <= it.pr.y + 8) return it;
  }
  return null;
}

// 立っている📍ピンのクリック判定（ピン頭〜リング周辺を広めに取る）
function hitPin(px, py) {
  if (!pingItem || pingItem.sx == null) return false;
  const dx = px - pingItem.sx, dy = py - (pingItem.sy - 20);
  return dx * dx + dy * dy < 26 * 26;
}

// 未解放エリアの🔒クリック判定。表面に見えている陸地のキーを返す。
function hitLock(px, py) {
  for (const r of REGION_LIST) {
    if (regionUnlocked(r)) continue;
    const p = project(r.lat, r.lon);
    if (p.z < 0.05) continue;
    const dx = px - p.x, dy = py - p.y;
    if (dx * dx + dy * dy < 26 * 26) return r.key;
  }
  return null;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}

function initCity(cv, callbacks) {
  canvas = cv; cbs = callbacks || {};
  ctx = canvas.getContext('2d');
  resize();
  // Tailwind CDNのスタイル適用が非同期のため、initCity実行時点ではcanvasのレイアウトサイズが
  // まだ確定していないことがある（clientWidth=0）。ResizeObserverで実際のサイズ確定を捉える。
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener('resize', resize);
  }

  canvas.addEventListener('pointerleave', hideTip);
  // v3.4: ホイールで拡大縮小（PC）
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    viewAnim = null;                              // 手動操作が入ったら自動回転は中断
    const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoom = Math.max(L.ZOOM_MIN, Math.min(ZOOM_MAX, zoom * f));
  }, { passive: false });
  canvas.addEventListener('pointerdown', e => {
    viewAnim = null;                              // 手動操作が入ったら自動回転は中断
    activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // v3.4: 2本目の指が置かれたらピンチズームモードへ（回転ドラッグは中断）
    if (activePtrs.size >= 2) {
      pinching = true; dragging = false;
      const pts = [...activePtrs.values()];
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      hideTip();
      return;
    }
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; yawV = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', e => {
    // バックグラウンド起動等で最初のフレームがまだ描かれていない場合の保険
    // （R=0のままだと当たり判定が全て左上に潰れる）。draw()と同じ式で投影パラメータを確定させる。
    if (!R && canvas.clientWidth) {
      resize();
      const w = canvas.width / dpr, h = canvas.height / dpr;
      cx = w / 2; cy = h * 0.52; R = Math.min(w, h) * 0.44 * zoom;
    }
    if (activePtrs.has(e.pointerId)) activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // v3.4: ピンチ中は2点間距離の変化でズーム
    if (pinching && activePtrs.size >= 2) {
      const pts = [...activePtrs.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0) zoom = Math.max(L.ZOOM_MIN, Math.min(ZOOM_MAX, zoom * d / pinchDist));
      pinchDist = d;
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (!dragging) {
      // ホバー時: タップできる対象（所有/お気に入り物件・ピン・🔒）の上ではカーソルを指マークに。
      const hit = hitTest(mx, my);
      const over = hitPin(mx, my) || hitLock(mx, my) || hit;
      canvas.style.cursor = over ? 'pointer' : 'grab';
      if (hit && e.pointerType !== 'touch') showTip(hit, mx, my, 'クリックで詳細を開く');
      else if (!tapCandidateId) hideTip();
      return;
    }
    hideTip();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx / (R || 150);
    pitch = Math.max(-1.1, Math.min(1.1, pitch + dy / (R || 150)));
    yawV = dx / (R || 150) * 6;
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointercancel', e => {
    activePtrs.delete(e.pointerId);
    if (activePtrs.size === 0) { pinching = false; pinchDist = 0; dragging = false; canvas.style.cursor = 'grab'; }
  });
  canvas.addEventListener('pointerup', e => {
    activePtrs.delete(e.pointerId);
    // v3.4: ピンチ操作の指離しはタップとして扱わない
    if (pinching) {
      pinchDist = 0;
      if (activePtrs.size === 0) pinching = false;
      dragging = false; canvas.style.cursor = 'grab';
      return;
    }
    dragging = false; canvas.style.cursor = 'grab';
    if (moved < 8) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      // ①ピンをクリック → 詳細画面へ（ピンは消す）
      if (hitPin(mx, my)) { const id = pingItem.id; pingItem = null; if (cbs.onTapMarketDetail) cbs.onTapMarketDetail(id); return; }
      // どこかをクリックしたらピンは解除（②以降の判定は続ける）
      pingItem = null;
      // ②🔒未解放エリア → 解放条件パネル（どのエリアを押したかを渡す）
      const lockKey = hitLock(mx, my);
      if (lockKey) { if (cbs.onTapLock) cbs.onTapLock(lockKey); return; }
      // ③物件
      const hit = hitTest(mx, my);
      if (hit) {
        // v3.3: タッチは1度目のタップで吹き出し（何がヒットしたか見せる）、同じ建物をもう一度タップで詳細。
        // マウスはホバーで既に吹き出しが出ているため、クリックで即詳細。
        if (e.pointerType === 'touch' && tapCandidateId !== hit.p.id) {
          tapCandidateId = hit.p.id;
          showTip(hit, mx, my, 'もう一度タップで詳細を開く');
          clearTimeout(tapCandidateTimer);
          tapCandidateTimer = setTimeout(() => { tapCandidateId = null; hideTip(); }, 2800);
          return;
        }
        tapCandidateId = null; hideTip();
        if (hit.kind === 'owned' && cbs.onTapProperty) cbs.onTapProperty(hit.p.id);
        if (hit.kind === 'market' && cbs.onTapMarket) cbs.onTapMarket(hit.p.id);
      } else {
        tapCandidateId = null; hideTip();
      }
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = 0; }
    else if (!rafId) { lastFrame = performance.now(); rafId = requestAnimationFrame(draw); }
  });
  rafId = requestAnimationFrame(draw);
}

// コイン回収アニメ用: 所有建物のビューポート座標一覧。
// v9-A: 陸地が4つになると、裏側の陸地にある物件は投影されず💰が飛ばなくなる。
// 見えていない物件は「球の縁のうち、その物件の方角に最も近い点」から飛ばす
// （見えていないがあちらから届いた、と読める）。v5で直した「裏側を向けたまま翌月を押すと
// 1個も飛ばない」と同じ症状が、別の原因で再発するのを先に潰しておく。
function cityBuildingScreenPositions() {
  if (!canvas || !st) return [];
  const rect = canvas.getBoundingClientRect();
  return st.properties.map(p => {
    const s = slotFor(p.region, p.areaKey, 'o:' + p.id);
    const pr = project(s.lat, s.lon);
    if (pr.z >= 0.04) return { x: rect.left + pr.x, y: rect.top + pr.y };
    const ang = Math.atan2(pr.y - cy, pr.x - cx);
    return { x: rect.left + cx + Math.cos(ang) * R * 0.96, y: rect.top + cy + Math.sin(ang) * R * 0.96 };
  }).filter(Boolean);
}

// ===== サウンド（Web Audio APIでその場合成。外部音源ファイル不要・単一ファイルのまま） =====
const MUTE_KEY = 'leverage_master_muted';
let muted = localStorage.getItem(MUTE_KEY) === '1';
let audioCtx = null;
let bgmHandle = null;

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone({ freq, duration = 0.15, type = 'sine', gain = 0.12, delay = 0 }) {
  if (muted) return;
  const ctx = ensureAudioCtx();
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type;
  const t0 = ctx.currentTime + delay;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}

function sfxClick() { playTone({ freq: 700, duration: 0.05, type: 'square', gain: 0.05 }); }
function sfxKnock() { playTone({ freq: 180, duration: 0.08, type: 'triangle', gain: 0.14 }); playTone({ freq: 160, duration: 0.08, type: 'triangle', gain: 0.12, delay: 0.16 }); }
function sfxCoin() { [880, 1180, 1480].forEach((f, i) => playTone({ freq: f, duration: 0.12, type: 'sine', gain: 0.10, delay: i * 0.05 })); }
function sfxFanfare() { [523, 659, 784, 1046].forEach((f, i) => playTone({ freq: f, duration: 0.28, type: 'triangle', gain: 0.15, delay: i * 0.1 })); }
function sfxBadge() { playTone({ freq: 1046, duration: 0.15, type: 'sine', gain: 0.12 }); playTone({ freq: 1568, duration: 0.22, type: 'sine', gain: 0.10, delay: 0.1 }); }

// 当初 300Hz・gain 0.05・40ms にしたが、低い音は同じ振幅でも聴感上ずっと小さく、
// 実機では鳴っていないのと同じだった。sfxClick（700Hz・0.05）と同程度まで上げている。
function sfxStep() { playTone({ freq: 520, duration: 0.06, type: 'triangle', gain: 0.10 }); }

// 買付の溜め用ドラムロール（低音の連打が徐々に速く強くなる）
function sfxDrumroll() { for (let i = 0; i < 22; i++) playTone({ freq: 90 + (i % 2) * 20, duration: 0.05, type: 'triangle', gain: 0.05 + i * 0.004, delay: i * (0.09 - i * 0.002) }); }
// 買付不成立の残念音（下降する短二音）
function sfxFail() { playTone({ freq: 392, duration: 0.22, type: 'sawtooth', gain: 0.12 }); playTone({ freq: 294, duration: 0.35, type: 'sawtooth', gain: 0.12, delay: 0.2 }); }

// 気分で選べるBGM（コード進行＋アルペジオ＋ベースをその場で生成。単調なドローンではなく音楽的に展開させる）。
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
const BGM_MOODS = {
  // chords は各コードの構成音（MIDIノート番号）。stepMsごとにアルペジオを1音鳴らし、コード頭でベースを添える。
  relax:  { label: '🌿 のんびり', stepMs: 640, gain: 0.05, wave: 'sine',
    chords: [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]] },
  chill:  { label: '🌙 しっとり', stepMs: 500, gain: 0.045, wave: 'triangle',
    chords: [[57, 60, 64], [52, 55, 59], [53, 57, 60], [55, 59, 62]] },
  lively: { label: '✨ わくわく', stepMs: 340, gain: 0.05, wave: 'triangle',
    chords: [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]] },
};

function playBgmNote(ctx, master, freq, wave, duration, gain) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  const t0 = ctx.currentTime;
  osc.type = wave; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + duration + 0.05);
}

const BGM_KEY = 'leverage_master_bgm';
let bgmMood = localStorage.getItem(BGM_KEY) || 'relax';

function startBgm() {
  if (muted || bgmHandle) return;
  const mood = BGM_MOODS[bgmMood] || BGM_MOODS.relax;
  const ctx = ensureAudioCtx();
  const master = ctx.createGain();
  master.gain.value = mood.gain;
  master.connect(ctx.destination);
  const chordLen = 8;   // 1コードあたりのステップ数
  let step = 0;
  const timer = setInterval(() => {
    const chord = mood.chords[Math.floor(step / chordLen) % mood.chords.length];
    const pos = step % chordLen;
    // アルペジオ（1オクターブ上げて明瞭に）＋コード頭でベース
    playBgmNote(ctx, master, midi(chord[pos % chord.length] + 12), mood.wave, 0.55, 0.5);
    if (pos === 0) playBgmNote(ctx, master, midi(chord[0] - 12), 'sine', 1.6, 0.6);
    if (pos === 4) playBgmNote(ctx, master, midi(chord[0]), 'sine', 1.0, 0.35);   // 中間で軽く土台
    step++;
  }, mood.stepMs);
  bgmHandle = { master, timer };
}

function stopBgm() {
  if (!bgmHandle) return;
  clearInterval(bgmHandle.timer);
  try { bgmHandle.master.disconnect(); } catch (e) {}
  bgmHandle = null;
}

function setMuted(v) {
  muted = v;
  localStorage.setItem(MUTE_KEY, v ? '1' : '0');
  if (v) stopBgm(); else startBgm();
}

function setBgmMood(mood) {
  bgmMood = mood;
  localStorage.setItem(BGM_KEY, mood);
  if (!muted) { stopBgm(); startBgm(); }   // 再生中なら即切り替え
}

function wireCommaInput(input, { min = 0, max = Infinity } = {}){
  input.addEventListener('input', () => {
    const digits = input.value.replace(/[^\d]/g, '');
    input.value = digits ? Number(digits).toLocaleString('en-US') : '';
  });
  input.addEventListener('blur', () => {
    const clamped = Math.max(min, Math.min(max, parseCommaNumber(input.value)));
    input.value = clamped.toLocaleString('en-US');
  });
}

// v3.12: 対象ボタンはPC用パネル（btn-*）とスマホ用バー（m-*）で別物なので、候補を並べて
// 「実際に画面に出ている方」を選ぶ。従来はPC用のidだけを見ており、スマホではすべての対象が
// 非表示（実サイズ0）だったため、吹き出しが毎回画面左上に固定され上部の情報バーに被っていた。
// v7.2: 「1ステップ＝押すボタン1つ」に統一する。
// 従来は「探すを押し、中の動いて情報を集めるを押す」のように1ステップに2操作を詰めており、
// 穴が次のボタンへ移っても文面が変わらず、どちらを押すのか分からなかった。
//
// keep: そのステップで開いたままにしてよい重ね画面のid。ここに無いものは renderTutStep が勝手に閉じる。
// 従来は探すモーダルが開いたまま「🗂️市場」を指しており、対象ボタンがモーダルの裏に隠れて
// 押せず手詰まりになっていた。「説明に不要な画面は出さない」を仕組みで保証する。
const TUT_OVERLAYS = ['search-modal', 'listings-modal', 'purchase-modal', 'detail-modal', 'mobile-drawer'];
const TUTORIAL_STEPS = [
  { key: 'work', keep: [], targets: ['m-work', 'btn-work'],
    text: 'まずは種銭づくり。💼「働く」を押してみよう。' },
  { key: 'openSearch', keep: [], targets: ['m-search', 'btn-open-search'],
    text: '次は物件探し。🏘️「物件を探す」を押そう。' },
  { key: 'search', keep: ['search-modal'], targets: ['btn-search'], rebuild: () => openSearchModal(),
    text: '🔍「動いて情報を集める」を押そう。押すほど出物に近づく。' },
  // スマホは市場一覧が≡メニューの中にあるため1手増える。PCでは対象が無いので自動で飛ぶ。
  { key: 'drawer', keep: [], targets: ['m-menu'], optional: true,
    text: '見つけた物件は市場一覧に並ぶ。≡「メニュー」を開こう。' },
  { key: 'listings', keep: ['mobile-drawer'], targets: ['dr-listings', 'btn-open-listings'],
    text: '🗂️「市場」を押して、見つけた物件を見てみよう。' },
  { key: 'buy', keep: ['listings-modal'], selector: '.listing-buy', rebuild: () => openListingsModal(),
    text: '物件の「買付を検討」を押そう。' },
  { key: 'offer', keep: ['purchase-modal'], selector: '#of-full',
    text: '「満額」を押そう。満額なら必ず通る（指値は断られることもある）。' },
  { key: 'payment', keep: ['purchase-modal'], selector: '#pay-cash',
    text: '「現金一括」を押そう。融資を使うなら頭金をスライダーで決める。' },
  // v7.4: 月が変わると行動力が全回復する、という一番大事な循環をここで体験させる。
  // prepare で行動力をわざと一桁まで減らしておき、押した瞬間に満タンへ戻るのを見せる。
  { key: 'next', keep: [], targets: ['m-next', 'btn-next-month-desk'],
    prepare: () => { state.actionPower = 6; },
    text: '行動力が残り6しかない。📅「翌月へ進む」を押そう。' },
  // ここから先は押すボタンが無い説明。吹き出しの「次へ」で進む。
  // v7.5: 回復は専用の演出ではなく、実際の行動力の欄を指して見せる。
  // チュートリアルだけの特別な画面を作ると、本編で同じものを探しても見つからない。
  { key: 'apRecovered', keep: [], info: true, targets: ['hud-ap', 'hud-ap-m'],
    text: 'ここを見てほしい。行動力が6から満タンに戻っている。月が変わるたび、ここが全回復する。' },
  // v8.9: スマホ版はヘッダーの📖ボタン自体を削除したため、この段はPCでしか出ない（対象が
  // 無い＝visibleTutTargetがnullを返すステップは自動で飛ばされる）。optionalは進捗の分母から外すため。
  { key: 'terms', keep: [], info: true, targets: ['btn-terms'], optional: true,
    text: '点線の用語はポインタを合わせると説明が出る。📖 で表示のON/OFF、長押しで用語集がまとめて読める。' },
  // v7.6: ここで「押して確認してみよう」とは言わない。押すと開く画面は暗幕の下に入って読めず、
  // 促しておきながら確認できない状態になる。場所だけ教えて、確認は本編に入ってからにしてもらう。
  { key: 'panel', keep: [], info: true, targets: ['panel-left', 'mobile-status'],
    text: 'ここに現金・月CF・バランスシート。純資産や負債といった財務の状況、法人成りもこの中から。経過年数と年齢は画面いちばん上に出ている。各項目はあとでゆっくりチェックしてみてね。' },
  { key: 'finish', keep: [], final: true,
    text: 'ひととおり触れた！ここまでの操作はリセットされ、本編は最初から始まる。' },
];

// そのステップに不要な重ね画面を閉じる。各モーダルの close() と同じ後始末をする。
function closeTutOverlays(keep = []) {
  for (const id of TUT_OVERLAYS) {
    if (keep.includes(id)) continue;
    const m = document.getElementById(id);
    if (!m || m.classList.contains('hidden')) continue;
    m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
  }
}
// ステップの対象を実DOMから探す（実際に画面に出ている＝実サイズを持つものだけを返す）
function visibleTutTarget(stp) {
  if (stp.selector) {
    const e = document.querySelector(stp.selector);
    if (!e) return null;
    const r = e.getBoundingClientRect();
    return r.width > 0 && r.height > 0 ? e : null;
  }
  for (const id of stp.targets) {
    const e = document.getElementById(id);
    if (!e) continue;
    const r = e.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) return e;
  }
  return null;
}
let tutIdx = -1, tutBubble = null, tutSnapshot = null;
// v7.1: 対象ボタンの周囲だけ穴を開けた4枚の暗幕（上下左右）で覆い、対象以外は暗くしつつクリックも塞ぐ。
// 単一のオーバーレイに穴を開けるのではなく、対象の矩形を避けて上下左右の帯を敷き詰める方式。
let tutMaskEls = [];
// renderTutStep の世代。次フレームでの再測定が「古いステップの予約」かを判別するために使う。
let tutRenderSeq = 0;
let tutObserver = null;   // 対象の実寸が決まるのを待つ監視役（ステップごとに張り替える）
function clearTutMask() { tutMaskEls.forEach(e => e.remove()); tutMaskEls = []; }
function buildTutMask(rect) {
  clearTutMask();
  const pad = 8;
  const l = Math.max(0, rect.left - pad), t = Math.max(0, rect.top - pad);
  const w = rect.width + pad * 2, h = rect.height + pad * 2;
  const vw = window.innerWidth, vh = window.innerHeight;
  const bands = [
    { left: 0, top: 0, width: vw, height: t },                              // 上
    { left: 0, top: t + h, width: vw, height: Math.max(0, vh - t - h) },    // 下
    { left: 0, top: t, width: l, height: h },                               // 左
    { left: l + w, top: t, width: Math.max(0, vw - l - w), height: h },     // 右
  ];
  bands.forEach(b => {
    if (b.width <= 0 || b.height <= 0) return;
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;background:rgba(2,6,23,0.6);z-index:64;`;
    d.addEventListener('click', (e) => e.stopPropagation());
    document.body.appendChild(d);
    tutMaskEls.push(d);
  });
}
function startTutorial() {
  tutSnapshot = structuredClone(state);
  tutStepStates = [];
  closeTutOverlays([]);   // 開いたままの画面があると1手目から対象が隠れる
  tutIdx = 0;
  renderTutStep();
}
function endTutorial() {
  localStorage.setItem('lm_tutorial_done', '1');
  tutBubble?.remove(); tutBubble = null;
  tutObserver?.disconnect(); tutObserver = null;
  tutStepStates = [];
  clearTutMask();
  closeTutOverlays([]);   // 途中でスキップしても、開きっぱなしの画面を残さない
  document.querySelectorAll('.tut-hl').forEach(e => e.classList.remove('tut-hl'));
  tutIdx = -1;
  if (tutSnapshot) {
    state = tutSnapshot; tutSnapshot = null;
    save(); render();
    showTutEndToast();
  }
}
// 進捗表示。optional（レイアウト依存で出ないことがある）は数に入れないので、
// PCでもスマホでも分母が変わらない。
function tutStepTotal() { return TUTORIAL_STEPS.filter(s => !s.optional).length; }
function tutStepNo() {
  let n = 0;
  for (let i = 0; i <= tutIdx && i < TUTORIAL_STEPS.length; i++) if (!TUTORIAL_STEPS[i].optional) n += 1;
  return Math.max(1, n);
}

// v7.3: 「← 前に戻る」。押した操作はゲームの状態を変えてしまうので（働けば現金が増え、
// 買えば物件が増える）、各ステップに入る直前の状態を控えておき、戻るときはそこへ復元する。
// 巻き戻さずに画面だけ戻すと、2回働いた・2回買ったという状態が残ってしまう。
let tutStepStates = [];

// 戻り先にできるのは「実際に表示された」かつ「画面を作り直せる」ステップだけ。
// 満額・現金一括の段は買付フローの途中状態（指値が通った直後）で、外から復元できない。
// その場合はさらに手前（買付を検討）まで戻し、そこからやり直してもらう。
function tutCanReturnTo(i) {
  const stp = TUTORIAL_STEPS[i];
  if (!tutStepStates[i]) return false;             // 表示されなかった段（飛ばした段）
  if (!stp.keep || stp.keep.length === 0) return true;   // 重ね画面が要らない段はそのまま戻れる
  return typeof stp.rebuild === 'function';        // 要る段は作り直せるものだけ
}

function tutPrevIdx() {
  for (let i = tutIdx - 1; i >= 0; i--) if (tutCanReturnTo(i)) return i;
  return -1;
}

function tutGoBack() {
  const prev = tutPrevIdx();
  if (prev < 0) return;
  state = structuredClone(tutStepStates[prev]);
  // 戻り先より後の控えは捨てる（そこから進み直すと取り直される）
  tutStepStates = tutStepStates.slice(0, prev);
  tutIdx = prev;
  save(); render();
  renderTutStep();
}

// 現在のステップに対応する実操作が起きたときだけ呼ばれる。一致しなければ何もしない。
function tutMaybeAdvance(key) {
  if (tutIdx < 0 || TUTORIAL_STEPS[tutIdx].key !== key) return;
  tutIdx += 1;
  if (tutIdx >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const nx = TUTORIAL_STEPS[tutIdx];
  // 段に入る前の下ごしらえ（行動力を減らす等）。render() が続けて renderTutStep を呼ぶので
  // ここで renderTutStep を直接呼ぶと二重描画になる。
  if (typeof nx.prepare === 'function') { nx.prepare(); save(); render(); return; }
  renderTutStep();
}

function showTutEndToast() {
  const t = el(`<div class="fixed top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-white rounded-lg shadow-lg px-4 py-2 z-50 text-sm font-bold">🧑‍🏫 チュートリアル終了！ここからが本編だ</div>`);
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity 0.5s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2200);
}
// v7.4: 締めの画面。指すボタンが無いので画面全体を暗幕1枚で覆い、中央に吹き出しを置く。
// ここで初めて「本編を始める」を押させる（それまでは勝手に本編へ入らない）。
function renderTutFinal(stp) {
  if (!tutStepStates[tutIdx]) tutStepStates[tutIdx] = structuredClone(state);
  clearTutMask();
  const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.72);z-index:64;';
  veil.addEventListener('click', (e) => e.stopPropagation());
  document.body.appendChild(veil);
  tutMaskEls.push(veil);

  const canBack = tutPrevIdx() >= 0;
  tutBubble = el(`<div class="fixed inset-0 z-[65] flex items-center justify-center p-4 pointer-events-none modal-below-header">
    <div class="bg-white rounded-xl shadow-2xl p-4 w-full max-w-xs space-y-3 border-2 border-amber-400 pointer-events-auto text-center max-h-[85vh] overflow-y-auto" style="max-height:85dvh">
      <div class="text-3xl">🧑‍🏫</div>
      <div class="font-bold text-slate-800">チュートリアル終了</div>
      <div class="text-xs text-slate-700 leading-relaxed text-left">${linkTerms(stp.text)}</div>
      <button class="tut-finish w-full bg-amber-500 hover:bg-amber-600 text-white rounded-lg py-2.5 text-sm font-bold shadow">🎬 本編を始める</button>
      <button class="tut-back text-navy text-[11px] font-bold ${canBack ? '' : 'invisible'}">← 前に戻る</button>
    </div></div>`);
  document.body.appendChild(tutBubble);
  tutBubble.querySelector('.tut-finish').addEventListener('click', endTutorial);
  tutBubble.querySelector('.tut-back').addEventListener('click', tutGoBack);
}

function renderTutStep() {
  if (tutIdx < 0) return;
  tutBubble?.remove(); tutBubble = null;
  clearTutMask();
  document.querySelectorAll('.tut-hl').forEach(e => e.classList.remove('tut-hl'));
  if (tutIdx >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const stp = TUTORIAL_STEPS[tutIdx];
  // v7.2: このステップに不要な重ね画面は先に閉じる。開いたままだと対象ボタンが裏に隠れて押せない。
  closeTutOverlays(stp.keep || []);
  // v7.4: 最終ステップは指すボタンが無い。画面全体を暗くして中央に締めの吹き出しを出す。
  if (stp.final) { renderTutFinal(stp); return; }
  let target = visibleTutTarget(stp);
  // v7.3: 「戻る」で来たときは必要な画面が閉じている。作り直せる段はここで開き直す。
  if (!target && typeof stp.rebuild === 'function') {
    stp.rebuild();
    target = visibleTutTarget(stp);
  }
  // 対象が画面に無いステップは飛ばす（スマホだけのメニュー等）。説明に不要な操作は勝手に省く。
  if (!target) { tutIdx += 1; renderTutStep(); return; }
  // この段に入る直前の状態を控える（戻るときの復元点）。再表示では上書きしない。
  if (!tutStepStates[tutIdx]) tutStepStates[tutIdx] = structuredClone(state);
  target.classList.add('tut-hl');
  buildTutMask(target.getBoundingClientRect());
  // v7.2: 吹き出しと三角はクリックを透過させる。三角は対象ボタンの上にかぶることがあり、
  // 透過しないと「光っているボタンを押したのに反応しない」状態になる（実際に3段目で起きていた）。
  // スキップだけは押せる必要があるので、そこだけ pointer-events を戻す。
  // v7.3: クリック透過は「三角」だけにする。吹き出し本体まで透過させると、
  // 中の用語（種銭・行動力など）にポインタを合わせても説明が出なくなる。
  // 対象ボタンに実際にかぶるのは対象側へ16px飛び出す三角なので、そこだけ透過すれば足りる。
  const canBack = tutPrevIdx() >= 0;
  tutBubble = el(`<div class="fixed z-[65] pointer-events-none" style="visibility:hidden; left:0; top:0;">
    <div class="relative bg-white rounded-xl shadow-2xl p-3 text-xs space-y-2 border-2 border-amber-400 pointer-events-auto">
      <div class="flex items-center justify-between gap-2">
        <span class="font-bold text-slate-800">🧑‍🏫 先輩大家</span>
        <span class="text-[10px] text-slate-500">${tutStepNo()} / ${tutStepTotal()}</span>
      </div>
      <div class="text-slate-700 leading-relaxed">${linkTerms(stp.text)}</div>
      ${stp.info
        ? '<button class="tut-nextstep w-full bg-navy hover:bg-navy-dark text-white rounded-lg py-1.5 text-xs font-bold">次へ ▶</button>'
        : '<div class="text-[11px] text-amber-700 font-bold">👆 光っているボタンを押してください</div>'}
      <div class="flex items-center justify-between gap-2 pt-1">
        <button class="tut-back text-navy text-[11px] font-bold ${canBack ? '' : 'invisible'}">← 前に戻る</button>
        <button class="tut-skip text-slate-500 text-[11px] underline">スキップ</button>
      </div>
      <div class="tut-arrow absolute pointer-events-none"></div>
    </div></div>`);
  document.body.appendChild(tutBubble);
  placeTutBubble(tutBubble, target.getBoundingClientRect());
  tutBubble.querySelector('.tut-skip').addEventListener('click', endTutorial);
  tutBubble.querySelector('.tut-back').addEventListener('click', tutGoBack);
  // 押すボタンが無い説明の段は、吹き出しの「次へ」で進む
  tutBubble.querySelector('.tut-nextstep')?.addEventListener('click', () => tutMaybeAdvance(stp.key));
  // v7.2: 対象の実寸が確定してから穴と吹き出しを置き直す。
  // CDN版TailwindはCSSを非同期に生成するため、開いた直後のモーダルやドロワーは
  // まだ w-72 等が効いておらず、その瞬間に測ると幅がまるで違う。実際スマホの≡メニューでは
  // 穴が別の場所に開き、光っているボタンが暗幕に覆われて押せなくなっていた。
  // ResizeObserver で「実際に大きさが決まった瞬間」に追従し、遅れて効くCSSも取りこぼさない。
  const seq = ++tutRenderSeq;
  const reflow = () => {
    if (seq !== tutRenderSeq || tutIdx < 0 || !tutBubble || !document.body.contains(target)) return;
    const r = target.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    buildTutMask(r);
    placeTutBubble(tutBubble, r);
  };
  requestAnimationFrame(reflow);
  tutObserver?.disconnect();
  tutObserver = new ResizeObserver(reflow);
  tutObserver.observe(target);
  setTimeout(reflow, 250);   // ResizeObserverが動かない環境向けの保険
}

// v3.12: 吹き出しを「対象ボタンに重ならない空いている側」へ置き、対象を指す三角を出す。
// 従来は対象の258px左に固定していたため、幅の狭いスマホでは必ず左端(8,8)へ丸められ、
// 上部の情報バーに文字が被ったうえ何を指しているのか分からなくなっていた。
function placeTutBubble(bubble, r) {
  const vw = window.innerWidth, vh = window.innerHeight, M = 8, GAP = 12, A = 8;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const w = Math.min(260, vw - M * 2);
  bubble.style.width = w + 'px';
  const h = bubble.offsetHeight;                       // 幅確定後に実測する
  let left, top, dir;
  if (r.left - w - GAP >= M) {                         // 対象の左に置く（PCの右パネル）
    dir = 'right'; left = r.left - w - GAP; top = clamp(r.top - 10, M, vh - h - M);
  } else if (r.right + w + GAP <= vw - M) {            // 対象の右に置く（PCの左パネル）
    dir = 'left'; left = r.right + GAP; top = clamp(r.top - 10, M, vh - h - M);
  } else if (r.top - h - GAP >= M) {                   // 対象の上に置く（スマホ下部バー）
    dir = 'down'; left = clamp(r.left + r.width / 2 - w / 2, M, vw - w - M); top = r.top - h - GAP;
  } else {                                             // 対象の下に置く（スマホ上部バー）
    dir = 'up'; left = clamp(r.left + r.width / 2 - w / 2, M, vw - w - M); top = clamp(r.bottom + GAP, M, vh - h - M);
  }
  bubble.style.left = Math.round(left) + 'px';
  // 対象の上に置く場合は下端を基準にする。文字が後から折り返して高さが伸びても、
  // 吹き出しは上へ伸びるだけで対象ボタンに被らない（高さの実測値に依存しない）。
  if (dir === 'down') { bubble.style.top = 'auto'; bubble.style.bottom = Math.round(vh - r.top + GAP) + 'px'; }
  else { bubble.style.bottom = 'auto'; bubble.style.top = Math.round(top) + 'px'; }
  const ax = clamp(r.left + r.width / 2 - left, 16, w - 16);
  const ay = clamp(r.top + r.height / 2 - top, 16, h - 16);
  const arrow = bubble.querySelector('.tut-arrow');
  const base = 'position:absolute;width:0;height:0;';
  if (dir === 'down')       arrow.style.cssText = `${base}left:${ax - A}px;bottom:${-A * 2}px;border-left:${A}px solid transparent;border-right:${A}px solid transparent;border-top:${A * 2}px solid #fbbf24;`;
  else if (dir === 'up')    arrow.style.cssText = `${base}left:${ax - A}px;top:${-A * 2}px;border-left:${A}px solid transparent;border-right:${A}px solid transparent;border-bottom:${A * 2}px solid #fbbf24;`;
  else if (dir === 'right') arrow.style.cssText = `${base}top:${ay - A}px;right:${-A * 2}px;border-top:${A}px solid transparent;border-bottom:${A}px solid transparent;border-left:${A * 2}px solid #fbbf24;`;
  else                      arrow.style.cssText = `${base}top:${ay - A}px;left:${-A * 2}px;border-top:${A}px solid transparent;border-bottom:${A}px solid transparent;border-right:${A * 2}px solid #fbbf24;`;
  bubble.style.visibility = 'visible';
}

// v3.7: 初期設定をウィザード形式（1問ずつ・フレーバー付き）に。最後に「あなたの物語」で確認してから開始。
function showSetup() {
  const m = document.getElementById('setup-modal');
  m.classList.remove('hidden');
  const data = { difficulty: 'beginner', attr: 'employee', age: 30, seed: 10_000_000, goalType: 'networth', goalAmount: 100_000_000, years: 20,
    tutorial: localStorage.getItem('lm_tutorial_done') !== '1' };

        <button class="wz-diff border-2 rounded-xl p-3 text-left ${data.difficulty === 'normal' ? 'border-navy bg-slate-50' : ''}" data-v="normal">

        <button class="wz-attr border-2 rounded-xl p-3 text-left ${data.attr === 'self' ? 'border-navy bg-slate-50' : ''}" data-v="self">
          <div class="font-bold">🛠️ 自営業</div><div class="text-xs text-slate-600">${term('credit_score', '信用度')}10・${term('action_power', '行動力')}120。<b>自由な時間は最大の資本。</b></div></button></div>`;
      m.appendChild(el(frame('あなたは、何者だ？', '大家への道はここから始まる。', inner)));

    } else if (step === 4) {
      inner = `<div class="flex gap-2">

        <div class="text-xs text-slate-500 mt-1">${term('net_worth', '純資産')}＝資産から負債を引いた本当の財産。月間${term('cf', 'CF')}＝毎月の不労所得。</div>`;
      m.appendChild(el(frame('目指す頂は？', '目標なき航海に、追い風は吹かない。', inner)));
      const gi = m.querySelector('#wz-goal');

      const setupSlider = () => {
        const [mn, mx, st2] = RANGES[data.goalType];

        goalAmount: data.goalAmount, goalYears: data.years, seedCash: data.seed, difficulty: data.difficulty });
      // v8: 初心者は用語ヘルプを既定でON（点線をなぞれば意味が読める状態から始める）
      if (data.difficulty === 'beginner') setTermsOff(false);
      m.classList.add('hidden'); m.innerHTML = ''; save(); resetMapView(); render();
      if (data.tutorial) startTutorial();
    });
  };
  draw();
}

function save(){ localStorage.setItem(SAVE_KEY, L.serialize(state)); }
function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  state = L.deserialize(raw);
  state.stats = state.stats || { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false };
  state.stats.junkRepairs = state.stats.junkRepairs || 0;
  state.badges = state.badges || [];
  state.favorites = state.favorites || [];
  state.notifications = state.notifications || [];
  state.nextNotifId = state.nextNotifId || 1;
  state.salesSearch = state.salesSearch || { spent: 0, threshold: null };   // v3: 営業進捗
  state.nextPropertyId = state.nextPropertyId || 1;
  state = L.migrateSave(state);   // v4: リフォームローンの配列化など新フィールドへの移行
  // v3.5: 旧採番バグで衝突したIDを修復（一覧と詳細が別物件を指す不具合の根治）
  const dd = L.dedupePropertyIds(state);
  if (dd.fixed) { state = dd.state; console.info(`物件IDの重複を${dd.fixed}件修復しました`); }
  return true;
}

// v5: render()では視点を動かさない。物件詳細を開く・購入する等の操作をしても地図はその場に留まる。
// 初期位置へ戻すのは「翌月へ進む」ときだけで、そのときも瞬間移動ではなく animateResetView() で
// ゆっくり回って戻る（v3.5では毎回のrender()でリセットしていたが、動きすぎるという指摘を受けて変更）。
function render(){
  setCityState(state); renderHeaderClock(); renderRegionPills(); renderDangerBanner(); renderPanelLeft(); renderPanelRight(); renderMobileBars(); checkEnd(); checkNewBadges(); save(); showExpFloats(); showCashFloats();
  document.getElementById('btn-result')?.classList.toggle('hidden', !state?.freePlay);   // v3.7: クリア後はいつでもリザルトへ
  if (tutIdx >= 0) renderTutStep();   // v3.7: チュートリアル中は吹き出しを追従させる
}

// v11.6: 縦幅が狭い端末では、上詰めの#mobile-status（現金/CF/行動力＋市場/所有）と
// 下詰めの#mobile-actions（探す/働く/翌月/≡）が近づきすぎて重なり、市場/所有の行が
// 探す/働く/翌月の裏に隠れて押せなくなることがあった。スクロール導入はマップのドラッグ
// 操作と競合するため、代わりに現金/CF/行動力の1段目（ヘッダーの#hud-clock-extraと
// 重複する情報）を畳んで市場/所有の行を上に詰める。それでも下段が収まらないくらい
// 極端に狭い場合は、畳んでも解決しないので既定表示（ヘッダーの下から1段目込み）に戻す。
function fitMobileHud() {
  const statusEl = document.getElementById('mobile-status');
  const actionsEl = document.getElementById('mobile-actions');
  const main = document.querySelector('main');
  if (!statusEl || !actionsEl || !main) return;
  const row1 = statusEl.children[0];
  if (!row1) return;
  row1.classList.remove('hud-row1-hide');   // 判定は常に既定表示（1段目あり）基準で行う
  if (getComputedStyle(statusEl).display === 'none') return;   // PC/タブレット（左右パネル）は対象外
  const mainTop = main.getBoundingClientRect().top;
  const actionsTop = actionsEl.getBoundingClientRect().top - mainTop;
  const margin = 6;
  const fits = () => (statusEl.getBoundingClientRect().bottom - mainTop) + margin <= actionsTop;
  if (fits()) return;   // 既定のままで十分収まる

  row1.classList.add('hud-row1-hide');
  if (!fits()) row1.classList.remove('hud-row1-hide');   // 畳んでも収まらないなら畳む意味が無い
}
window.addEventListener('resize', fitMobileHud);

// v3.9: スマホの≡メニュー。普段隠している機能（一覧・通知・ログ・資産詳細・スキル・音・リセット）をまとめる。
function openMobileDrawer() {
  const m = document.getElementById('mobile-drawer');
  m.classList.remove('hidden');
  const close = () => { m.classList.add('hidden'); m.innerHTML = ''; };
  const g = state.goal;
  const pct = Math.max(0, Math.min(100, Math.round((g.type === 'networth' ? L.netWorth(state) : L.monthlyCF(state)) / g.amount * 100)));
  const unread = (state.notifications || []).filter(n => !n.read).length;

function pushLog(msg){ state.log = state.log || []; state.log.unshift(msg); if(state.log.length>50) state.log.pop(); }
function gainExp(skill, base){ state.skills[skill].exp += Math.round(base * (state.expMult||1)); }

// ホーム画面の「詳細を表示」開閉状態。render()を跨いで記憶する（毎回閉じ直されないように）。
let bsDetailOpen = false;

// v8: 経過年数と年齢はヘッダーに常設する。左パネルはスマホでは表示されないため、
// そこにしか無いと「いま何年目か」がスマホから完全に見えなくなっていた。
function elapsedText(s) { return `${Math.floor(s.month / 12)}年${s.month % 12}ヶ月`; }
// 開始年齢。旧セーブには startAge が無いので、現在年齢から経過年数を引いて復元する。
function startAgeOf(s) { return s.startAge ?? ((s.age ?? 0) - Math.floor(s.month / 12)); }

// v8: 初心者モードの赤バナー。通知に気づかないまま家賃がゼロになる事故を防ぐため、
// 危険帯以上の物件があるあいだは地図の上に出しっぱなしにする（中上級では出さない）。
// v8.11: 形は通知トースト（showNotifToast）と統一。ただし色・点滅は危険度で変え、
// ✕は今月だけの一時的な非表示（dangerBannerDismissed）。解決していなければ翌月また出す
// ——気づかないまま放置される事故を防ぐという本来の狙いは、ここだけは崩さない。
// v8.12: ✓ボタンは廃止し、カード全体のタップで物件へ飛ぶ（✕だけ独立して残す）。
let dangerBannerDismissed = false;
function renderDangerBanner() {
  const box = document.getElementById('danger-banner');
  if (!box) return;
  const on = state && state.difficulty === 'beginner';
  const bad = on ? state.properties.filter(p => L.BAND_RANK[L.worstBandOf(p)] >= L.BAND_RANK.danger) : [];
  box.innerHTML = '';
  box.classList.toggle('hidden', bad.length === 0 || dangerBannerDismissed);
  if (!bad.length || dangerBannerDismissed) return;
  const dead = bad.filter(p => L.worstBandOf(p) === 'dead');
  const head = dead.length
    ? `🛑 ${dead.length}件が募集停止中（家賃が入っていません）`
    : `🚨 ${bad.length}件が危険水準です`;
  const card = el(`<div class="w-[92vw] max-w-[480px] rounded-lg shadow-lg px-3 py-2 text-sm font-bold flex items-center gap-2 pointer-events-auto cursor-pointer ${dead.length ? 'bg-red-600 text-white lm-blink' : 'bg-amber-500 text-white'}">
    <span class="flex-1 text-left leading-snug">${head}<br><span class="font-normal text-[11px]">${bad.slice(0, 3).map(p => p.name || p.label).join('・')}${bad.length > 3 ? ` ほか${bad.length - 3}件` : ''}／🏠所有 から修繕を</span></span>
    <button class="db-dismiss bg-white/25 rounded px-2 py-1 text-xs shrink-0" title="今月は閉じる（解決していなければ翌月また出ます）">✕</button>
  </div>`);
  box.appendChild(card);
  card.addEventListener('click', () => {
    if (bad.length === 1) openDetail(bad[0].id, 'owned'); else openKpiModal('props');
  });
  card.querySelector('.db-dismiss').addEventListener('click', (e) => {
    e.stopPropagation();
    dangerBannerDismissed = true;
    renderDangerBanner();
  });
}

function renderHeaderClock() {
  const box = document.getElementById('hud-clock');
  if (!box) return;
  box.classList.toggle('hidden', !state);
  if (!state) return;
  box.querySelector('#hud-elapsed').textContent = elapsedText(state);
  box.querySelector('#hud-age').textContent = state.age ?? '-';
  // v8.9: スマホ版はここ（ヘッダー）だけが常に見えるので、現金・行動力もここに常時表示する。
  box.querySelector('#hud-clock-cash').textContent = L.yen(state.cash);
  // v8.17: 月CFも追加。プラス/マイナスで色分けする（他の月CF表示と同じhud-money/hud-badを流用）。
  const mcf = L.monthlyCF(state);
  const cfEl = box.querySelector('#hud-clock-cf');
  cfEl.textContent = L.yen(mcf);
  cfEl.classList.toggle('hud-money', mcf >= 0);
  cfEl.classList.toggle('hud-bad', mcf < 0);
  box.querySelector('#hud-clock-ap').textContent = `${state.actionPower}/${state.baseActionPower}`;
}

// v8.1: 法人化の損得を数字で出す。箇条書きの「こう変わります」だけでは、
// いま設立すべきなのか、まだ早いのかが判断できなかった。
// 課税はデッドクロス後にしか発生しないので、償却が残っているうちは節税額0＝「まだ早い」が正しい答えになる。
function incorporationPitch() {
  const saving = L.incorporationSaving(state);
  const payback = L.incorporationPaybackYears(state);
  const soonest = state.properties.length
    ? Math.min(...state.properties.filter(p => p.owner !== 'corp').map(p => p.deprRemaining ?? 0))
    : null;
  if (saving <= 0) {
    return `<div class="rounded-lg bg-slate-50 p-2 text-[11px] text-slate-600 mb-2">
      <b>いま設立しても節税額は ¥0 です。</b>
      ${state.properties.length === 0
        ? '物件を買ってからでよいでしょう。'
        : `NOIへの課税は${term('dead_cross', 'デッドクロス')}（${term('depreciation', '減価償却')}切れ）後にしか発生しません。`
          + `いちばん早い物件で<b>あと${soonest}ヶ月</b>です。`}
      <div class="mt-1">売却時の${term('capital_gains_tax', '譲渡税')}を短期39%→30%にしたい場合は、早めの設立にも意味があります。</div>
    </div>`;
  }
  const years = payback == null ? null : Math.round(payback * 10) / 10;
  return `<div class="rounded-lg bg-emerald-50 p-2 text-[11px] text-emerald-900 mb-2">
    <div><b>いまの保有物件がすべて法人名義だった場合、年間 ${L.yen(saving)} の節税</b>になります。</div>
    <div class="mt-0.5">設立費用 ${L.yen(L.CONFIG.corporateSetupCost)} の回収まで<b>約${years}年</b>。</div>
    <div class="mt-1 text-emerald-800">※ 既存物件は設立後に1件ずつ移転が必要です（ローン完済済みのみ・移転時に譲渡税と取得コストがかかります）。</div>
  </div>`;
}

// v3.5: 売却センターの一括査定モード状態（モーダルをHUDから開き直すとリセット）
let bulkMode = false;
// v8.9: 所有物件一覧の「アドバイス」吹き出しを開いている物件id（基本は押すまで非表示）
const openPropAdviceIds = new Set();

// 左上の4KPIアイコン（💰🏠📈📊）をタップすると、それぞれの内訳・詳細を表示する。
function openKpiModal(which, keepBulk = false) {
  if (which === 'props' && !keepBulk) bulkMode = false;
  const m = document.getElementById('kpi-modal');
  m.classList.remove('hidden'); m.classList.add('flex'); m.innerHTML = '';
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; };
  let title = '', body = '';
  if (which === 'cash') {
    title = '💰 資産スナップショット';
    // v8: スマホではこのモーダルがバランスシートそのものなので、先頭に経過年数と年齢を出す。
    body = `<div class="text-[11px] text-slate-500 border-b pb-1 mb-2">
      経過 <b>${elapsedText(state)}</b> ／ 現在 <b>${state.age ?? '-'}歳</b>（開始 ${startAgeOf(state)}歳）</div>
    <table class="w-full text-sm">
      <tr><td>手元現金</td><td class="text-right font-bold">${L.yen(state.cash)}</td></tr>
      <tr class="border-t"><td>総資産（現金＋物件時価）</td><td class="text-right">${L.yen(L.totalAssetsV2(state))}</td></tr>
      <tr><td>総負債（残債）</td><td class="text-right text-red-600">-${L.yen(L.totalDebt(state))}</td></tr>
      <tr class="border-t font-bold"><td>${term('net_worth', '純資産')}</td><td class="text-right text-emerald">${L.yen(L.netWorth(state))}</td></tr>
    </table>
    ${!state.isIncorporated ? `<div class="mt-4 pt-4 border-t">
      <h3 class="font-bold text-sm mb-1">🏢 法人化</h3>
      <p class="text-[11px] text-slate-500 mb-2">設立費用 ${L.yen(L.CONFIG.corporateSetupCost)}。以降、NOIへの課税が法人税率（${L.CONFIG.corporateTaxRate * 100}%）に固定されます。</p>
      ${incorporationPitch()}
      <button id="btn-incorporate" class="w-full bg-navy text-white rounded py-2 text-sm ${state.cash < L.CONFIG.corporateSetupCost ? 'opacity-40' : ''}" ${state.cash < L.CONFIG.corporateSetupCost ? 'disabled' : ''}>法人を設立する</button>
    </div>` : '<div class="mt-4 pt-4 border-t text-sm font-bold text-navy">🏢 法人化済み</div>'}`;
  } else if (which === 'props') {
    // v3.5: 売却センター。名義・売出中・修繕中・入居状況をバッジで常時表示し、複数まとめて査定できる。
    const corpN = state.properties.filter(p => p.owner === 'corp').length;
    const persN = state.properties.length - corpN;
    title = `🏠 所有物件（${state.properties.length}件）`;
    const header = state.properties.length ? `
      <div class="flex items-center justify-between text-xs mb-1">
        <div class="font-bold text-slate-700">👤個人${persN}件 ・ 🏢法人${corpN}件</div>
        <button id="kpi-bulk-toggle" class="border rounded px-2 py-1 font-bold ${bulkMode ? 'bg-navy text-white' : 'text-navy'}">${bulkMode ? '✕ まとめて査定を終了' : '☑ まとめて査定'}</button>
      </div>
      ${bulkMode ? '<div class="text-[11px] text-slate-500 mb-1">査定したい物件にチェック → 下の「査定する」（1件につき行動力-5）</div>' : ''}` : '';
    // v8: 手当てが要る物件ほど上に出す。件数が増えると危険な物件がスクロールの下に埋もれるため。
    const byRisk = [...state.properties].sort((a, b) =>
      L.BAND_RANK[L.worstBandOf(b)] - L.BAND_RANK[L.worstBandOf(a)]);
    body = state.properties.length ? `${header}<div class="space-y-1">${byRisk.map(p => {
      const occN = p.units.filter(u => u.occupied).length, unitN = p.units.length;
      const occ = unitN ? Math.round(occN / unitN * 100) : 0;
      const adviceLines = L.propertyAdviceLines(p);
      const listing = (state.listings || []).find(l => l.propertyId === p.id);
      const badges = [
        p.owner === 'corp' ? '<span class="bg-navy text-white rounded px-1">🏢法人</span>' : '<span class="bg-slate-200 text-slate-700 rounded px-1">👤個人</span>',
        listing ? `<span class="bg-amber-500 text-white rounded px-1">📢売出中${listing.listedMonths + 1}ヶ月目</span>` : '',
        // v8.2: 承諾済みで決済待ちの物件は、一覧でもそれと分かるようにする
        (state.pendingSales || []).some(x => x.propertyId === p.id)
          ? '<span class="bg-emerald-600 text-white rounded px-1 font-bold">✅売却成立・翌月決済</span>' : '',
        p.repairJob ? `<span class="bg-amber-100 text-amber-700 rounded px-1">🔨${L.REPAIR_KINDS[p.repairJob.kind || 'large'].label}中 残り${p.repairJob.monthsLeft}ヶ月</span>` : '',
        // v8: 帯に応じて段階表示。使用不能・管理崩壊は工事中でも隠さない（募集停止が続いているため）
        L.structBandOf(p) === 'dead' ? '<span class="bg-red-600 text-white rounded px-1 font-bold">🛑使用不能</span>'
          : (!p.repairJob && L.structBandOf(p) === 'danger') ? '<span class="bg-red-100 text-red-700 rounded px-1">🚨躯体が危険</span>'
          : (!p.repairJob && L.structBandOf(p) === 'warn') ? '<span class="bg-amber-100 text-amber-700 rounded px-1">⚠️躯体が注意</span>' : '',
        L.careBandOf(p) === 'dead' ? '<span class="bg-red-600 text-white rounded px-1 font-bold">🛑管理崩壊</span>'
          : (!p.repairJob && L.careBandOf(p) === 'danger') ? '<span class="bg-red-100 text-red-700 rounded px-1">🚨手入れが危険</span>'
          : (!p.repairJob && L.careBandOf(p) === 'warn') ? '<span class="bg-amber-100 text-amber-700 rounded px-1">🧹要メンテ</span>' : '',
        p.autoManage ? '<span class="bg-emerald-100 text-emerald-700 rounded px-1">🏢おまかせ中</span>' : '',
        // v4: 原状回復が済んでいない部屋は募集できない＝空室損が続くので一覧で目立たせる
        p.units.filter(u => u.needsRestore).length

        p.diyProgress ? `<span class="bg-emerald-100 text-emerald-700 rounded px-1">🔨DIY中${Math.min(100, Math.round(p.diyProgress.done))}%</span>` : '',
        occ >= 100 ? '<span class="bg-emerald-100 text-emerald-700 rounded px-1">満室</span>' : `<span class="bg-slate-100 text-slate-600 rounded px-1">入居${occ}%</span>`,
      ].filter(Boolean).join(' ');
      const la = p.lastAppraisal;   // v3.6: 査定結果は物件に保存され、一覧に残り続ける
      const laAge = la ? (state.month - la.month === 0 ? '今月' : `${state.month - la.month}ヶ月前`) : '';
      // v8.11: 購入額・保有期間・現状家賃・直近CFは、行の高さを増やさずアイコン脇の余白（上下に
      // 空きが出ていた）に収める。アイコンは10x10=40pxしか無いのに、右側は名前+3本のバー+バッジで
      // ずっと高いため、items-centerで生まれる上下の空白に4行を上下2行ずつ振り分ける。
      const held = L.heldMonthsOf(state, p);
      const rentNow = Math.round(L.egiAnnual(p) / 12);
      const lastCf = p.history.at(-1)?.cf;
      const iconSide = `<div class="w-20 shrink-0 flex flex-col items-center gap-0.5 text-center">
