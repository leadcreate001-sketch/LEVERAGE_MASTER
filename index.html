  return { state: s, started: true, diy: false, cost, loanAmount, financed: !!opts.financed, months: plan.months };
}

// 価値UPの効果（各室家賃・時価・レベル）を物件に適用する。DIY完了時と業者工期完了時の共通処理。
export function applyValueUp(p, rentMult) {
  p.units.forEach(u => { u.rent = Math.max(1000, Math.round(u.rent * rentMult / 1000) * 1000); });
  p.timeValue = Math.round(p.timeValue * rentMult);
  p.valueUpLevel = (p.valueUpLevel || 0) + 1;
}

// v8: 資産額は marketValueOf（躯体の傷みぶんを割り引いた時価）で数える。
// 放置すれば純資産が目に見えて減り、直せば戻る——ゲージが財務に直結する。
// v8.7: properties が未初期化の state から呼ばれても落ちないようにする。
// 審査（reviewLoan）が資産背景を見るようになり、これらが呼ばれる経路が一気に増えたため。
export function totalAssetsV2(state) {
  return (state.cash ?? 0) + (state.properties || []).reduce((t, p) => t + marketValueOf(p), 0);
}
export function netWorth(state) { return Math.round(totalAssetsV2(state) - totalDebt(state)); }
export function monthlyCF(state) {
  return (state.properties || []).reduce((t, p) => t + (p.history?.at(-1)?.cf ?? 0), 0);
}
export function isClearedV2(state) {
  const g = state.goal;
  return g.type === 'networth' ? netWorth(state) >= g.amount : monthlyCF(state) >= g.amount;
}
export function isTimeUpV2(state) { return state.month >= state.goal.years * 12; }
export function isBankrupt(state) { return state.cash < 0; }
export function taxRiskLevelV2(state) {
  if (!state.properties.length) return '低';
  const m = Math.min(...state.properties.map(p => p.deprRemaining));
  return m >= 36 ? '低' : m >= 12 ? '中' : '高';
}

// === Task 10 / v6: イベント（築年数・構造・戸数・手入れの状態で出し分ける） ===
// v5までは「ジャンル」だけで判定していたため、築3年の新築アパートにシロアリが出ていた。
// v6では物件ごとの match(p) で対象を絞り、その建物で現実に起こりうるものだけを候補にする。
// 結果として築浅（0〜7年）では設備・躯体系のイベントがほぼ全滅し、
// 金利・銀行・セミナーといった築年に依存しない経営イベントだけが残る。

const isKodateP = p => p.genreKey === 'kodate' || p.genreKey === 'w_kodate';
const isKubunP = p => p.genreKey === 'kubun' || p.genreKey === 'w_kubun';

// 物件条件のビルダー。指定しなかった項目は無条件。
// kind: 'kodate'=戸建て / 'kubun'=区分 / 'tou'=一棟もの / 'notKubun'=区分以外（建物全体を自分で管理する物件）
//
// v6.3: 「その建物に物理的に存在しない設備」のイベントを出さないよう条件を締めた。
// 木造2階建てのアパートに受水槽・給水ポンプは無い（直圧給水）し、
// 区分マンションの所有者が敷地の草木やハチの巣を扱うことも無い（管理組合の仕事）。
function evTarget({ structures, minAge, minUnits, careBelow, structBelow, kind, needOccupied } = {}) {
  return (p) => {
    if (structures && !structures.includes(p.structure)) return false;
    if (minAge != null && (p.builtAge ?? 0) < minAge) return false;
    if (minUnits != null && (p.units?.length ?? 0) < minUnits) return false;
    if (careBelow != null && (p.careState ?? 100) >= careBelow) return false;
    // 大規模修繕を終えた直後の建物から雨漏りやタイル剥落が起きるのは不自然。
    // 躯体に由来するイベントは、躯体がある程度傷んでいるときだけ出す。
    if (structBelow != null && (p.repairState ?? 100) >= structBelow) return false;
    if (kind === 'kodate' && !isKodateP(p)) return false;
    if (kind === 'kubun' && !isKubunP(p)) return false;
    if (kind === 'tou' && (isKodateP(p) || isKubunP(p))) return false;
    if (kind === 'notKubun' && isKubunP(p)) return false;
    if (needOccupied && !(p.units || []).some(u => u.occupied)) return false;
    return true;
  };
}

// choices の apply でよく使う操作
const evFind = (s, id) => s.properties.find(x => x.id === id);
const evPay = (n) => (s) => { s.cash -= n; return s; };
const evPayPerUnit = (per) => (s, id) => { const p = evFind(s, id); s.cash -= per * (p?.units.length ?? 1); return s; };
const evHitStruct = (n) => (s, id) => { const p = evFind(s, id); if (p) p.repairState = Math.max(0, p.repairState - n); return s; };
const evHitCare = (n) => (s, id) => { const p = evFind(s, id); if (p) p.careState = Math.max(0, (p.careState ?? 100) - n); return s; };
// 退去は「退去届」であり原状回復までは発生させない（monthlyVacancyRoll と役割を分ける）
const evEvict = (n) => (s, id) => {
  const p = evFind(s, id);
  if (p) p.units.filter(u => u.occupied).slice(0, n).forEach(u => { u.occupied = false; u.vacantMonths = 0; });
  return s;
};
const evChain = (...fns) => (s, id, ui) => fns.reduce((acc, f) => f(acc, id, ui), s);
// v6.4: 部屋ごとの設備イベント用。対象の部屋だけを退去させる。
const evEvictUnit = () => (s, id, ui) => {
  const u = evFind(s, id)?.units?.[ui];
  if (u?.occupied) { u.occupied = false; u.vacantMonths = 0; }
  return s;
};
// 全室の家賃を一定率で動かす（設備更新による小幅な賃料アップ等）
const evRentMult = (m) => (s, id) => {
  const p = evFind(s, id);
  if (p) p.units.forEach(u => { u.rent = Math.round(u.rent * m / 1000) * 1000; });
  return s;
};

// === v8: 用語クイズ ===
// 用語集（TERMS・50語）を「読む辞書」から「遊んで覚えるコレクション」に変える。
// 勉強会・大家の会に参加したときに出題し、正解した語は learnedTerms に貯まって用語集に印が付く。
export const QUIZ_MIN_Q = 3;
export const QUIZ_MAX_Q = 5;
export const QUIZ_COMBO_MULT = [1.0, 1.0, 1.2, 1.5, 2.0];   // 連続正解数 → 倍率（4連続以上は2.0）
export const QUIZ_CASH_PER_CORRECT = 3_000;                  // 大家の会だけ。人脈から得た情報料という建て付け
export const QUIZ_SASHINE_BONUS = 0.10;                      // 全問正解の「耳より情報」＝次の1件だけ指値+10pt

export function quizComboMult(streak) {
  return QUIZ_COMBO_MULT[Math.min(streak, QUIZ_COMBO_MULT.length - 1)];
}

// 正解率 → ランク。演出（判子スタンプ）の文字にそのまま使う。
export function quizRank(correct, total) {
  const r = total ? correct / total : 0;
  return r >= 1 ? 'S' : r >= 0.8 ? 'A' : r >= 0.6 ? 'B' : 'C';
}

// 出題を組み立てる。同じセッション内で用語が重複しないよう、母集団から抜きながら選ぶ。
// hard=true（中上級）は誤答選択肢を同じ group から取るので紛らわしい。初心者は別 group から取る。
export function buildQuiz(rng = Math.random, { count, hard = false } = {}) {
  const keys = Object.keys(TERMS);
  // v8.12: 出題される（＝答えとして問われる）語は実務用語だけにする。このゲーム独自の指標
  // （scope: 'game'。信用度・躯体・手入れ・行動力・取次ライン）は出題対象から外す。
  // 誤答の選択肢としては引き続き全用語（keys）から選ぶ——「これは実在しない用語か」を
  // 当てさせるクイズではなく、正しい語を選ばせるクイズなので、紛れ込んでも実害はない。
  const quizableKeys = keys.filter(k => TERMS[k].scope !== 'game');
  const n = count ?? (QUIZ_MIN_Q + Math.floor(rng() * (QUIZ_MAX_Q - QUIZ_MIN_Q + 1)));
  const pool = [...quizableKeys];
  const picked = [];
  for (let i = 0; i < n && pool.length; i++) {
    picked.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  }
  return picked.map(key => {
    const t = TERMS[key];
    // 誤答の母集団。中上級は同グループ（似た語）から、初心者は別グループ（明らかに違う語）から。
    const distractPool = keys.filter(k => k !== key &&
      (hard ? TERMS[k].group === t.group : TERMS[k].group !== t.group));
    const fallback = keys.filter(k => k !== key);
    const src = distractPool.length >= 3 ? distractPool : fallback;
    if (rng() < 0.5) {
      // ○×: 半分の確率で定義を別の用語のものにすり替える
      const swap = rng() < 0.5;
      const other = src[Math.floor(rng() * src.length)];
      return { key, type: 'ox', label: t.label,
        text: `「${t.label}」とは、${swap ? TERMS[other].def : t.def}`,
        answer: !swap };
    }
    // 4択: 定義から用語を当てる
    const wrongs = [];
    const p2 = [...src];
    while (wrongs.length < 3 && p2.length) wrongs.push(p2.splice(Math.floor(rng() * p2.length), 1)[0]);
    const options = [key, ...wrongs].sort(() => rng() - 0.5);
    return { key, type: 'mc4', label: t.label, text: t.def,
      options: options.map(k => ({ key: k, label: TERMS[k].label })), answer: key };
  });
}

// クイズ結果を state に反映する。EXP・現金・耳より情報バフ・習得済み用語をまとめて処理する。
export function applyQuizResult(state, { correctKeys, total, comboBest, cashReward }) {
  const s = structuredClone(state);
  const correct = correctKeys.length;
  const mult = quizComboMult(comboBest);
  s.skills.appraisal.exp += Math.round(5 * correct * mult);
  s.skills.negotiation.exp += 3 * correct;
  if (cashReward) s.cash += QUIZ_CASH_PER_CORRECT * correct;
  s.learnedTerms = [...new Set([...(s.learnedTerms || []), ...correctKeys])];
  if (total > 0 && correct === total) {
    s.buffs = s.buffs || [];
    s.buffs.push({ type: 'sashine', bonus: QUIZ_SASHINE_BONUS, uses: 1 });
  }
  return { state: s, rank: quizRank(correct, total), mult };
}

// 「耳より情報」バフの合計。指値の成功率に上乗せする。
export function sashineBuffBonus(state) {
  return (state.buffs || []).filter(b => b.type === 'sashine').reduce((t, b) => t + b.bonus, 0);
}

// 指値を1回使うとバフを1つ消費する（uses が尽きたものは配列から外す）。
export function consumeSashineBuff(state) {
  const s = structuredClone(state);
  const i = (s.buffs || []).findIndex(b => b.type === 'sashine');
  if (i >= 0) {
    s.buffs[i].uses -= 1;
    if (s.buffs[i].uses <= 0) s.buffs.splice(i, 1);
  }
  return s;
}

// v6: 一度起きたイベントは、同じ物件では当分のあいだ繰り返さない。
// v6.3: クールダウンはイベントごとに決める。給湯器を替えれば次は8年後、
// 火災警報器は10年、配管更新は20年、セミナーの勧誘は半年。
// 「その工事をしたら現実には何年もつのか」をそのまま入れる。
export const EVENT_COOLDOWN_MONTHS = 36;   // 物件イベントの既定値
export const EVENT_COOLDOWN_GLOBAL = 12;   // 経営イベントの既定値

export function eventCooldownOf(eventId) {
  const e = EVENTS.find(x => x.id === eventId);
  if (!e) return EVENT_COOLDOWN_MONTHS;
  return e.cooldown ?? (e.match ? EVENT_COOLDOWN_MONTHS : EVENT_COOLDOWN_GLOBAL);
}

// v6.4: エアコン・給湯器・火災警報器は各部屋に1台ずつある設備なので、
// クールダウンも部屋ごとに持つ。3号室の給湯器を替えても、5号室のはまだ古いまま。
export function eventOnCooldown(state, eventId, propertyId = null, unitIndex = null) {
  const now = state.month ?? 0;
  const span = eventCooldownOf(eventId);
  return (state.eventHistory || []).some(h =>
    h.id === eventId && h.propertyId === propertyId
    && (h.unitIndex ?? null) === (unitIndex ?? null)
    && now - h.month < span);
}

function recordEventFired(s, eventId, propertyId, unitIndex = null) {
  s.eventHistory = s.eventHistory || [];
  s.eventHistory.push({ id: eventId, propertyId: propertyId ?? null, unitIndex: unitIndex ?? null, month: s.month });
  // 記録は「そのイベントのクールダウンを過ぎたら」捨てる。
  // 一律の期間で切ると、20年もつエレベーターの記録まで消えて再発してしまう。
  s.eventHistory = s.eventHistory.filter(h => s.month - h.month < eventCooldownOf(h.id));
}

// イベントの見出し。セミナーのようにお題が毎回変わるものは関数で持つ。
export function eventTitle(event) {
  return typeof event.title === 'function' ? event.title() : event.title;
}

// v6: 物件イベントは対象になりうる物件が1件以上あるときだけ候補になる。
// v6.4: 戻り値は { property, unitIndex } の組。部屋ごとの設備イベント（perUnit）は
// 空いている部屋も含めて全戸が対象になり、部屋単位でクールダウンを判定する。
export function eventTargets(event, state) {
  if (!event.match) return [];
  const out = [];
  for (const p of state.properties || []) {
    if (!event.match(p, state)) continue;
    if (event.perUnit) {
      (p.units || []).forEach((u, i) => {
        if (!eventOnCooldown(state, event.id, p.id, i)) out.push({ property: p, unitIndex: i });
      });
    } else if (!eventOnCooldown(state, event.id, p.id)) {
      out.push({ property: p, unitIndex: null });
    }
  }
  return out;
}

export function eligibleEvents(state) {
  return EVENTS.filter(e => (e.match
    ? eventTargets(e, state).length > 0
    : e.condition(state) && !eventOnCooldown(state, e.id)));
}

export function maxYearsForAge(age) {
  return Math.max(1, CONFIG.maxAge - age);
}

// v3: 種銭は労働で稼ぐ。行動力1消費で¥1,000〜10,000（100円単位）を獲得。
export function doWork(state, rng = Math.random) {
  if (state.actionPower < 1) return { state, earned: 0 };
  const s = structuredClone(state);
  s.actionPower -= 1;
  // v3.9: 金額幅(1,000〜10,000円)は維持しつつ低額を引きやすく偏らせ、平均を約2,000円（旧5,500円の約37%）に。
  const earned = (10 + Math.floor(Math.pow(rng(), 6) * 91)) * 100;
  s.cash += earned;
  return { state: s, earned };
}

export function createInitialState({ attr, goalType, goalAmount, goalYears, seedCash, age, difficulty }) {
  const emp = attr === 'employee';
  // v8: 難易度による下駄は「ウィザードで選んだ値」に対して掛ける。プリセットの縮小（goalScale）と
  // 期限の延長（yearsBonus）はウィザード側の提示値で済ませてあるので、ここでは掛けない。
  const diffKey = DIFFICULTY[difficulty] ? difficulty : 'normal';
  const d = DIFFICULTY[diffKey];
  const clampedAge = Math.max(18, Math.min(CONFIG.maxAge - 1, Math.round(age ?? 30)));
  const clampedSeed = Math.max(CONFIG.seedMin, Math.min(CONFIG.seedMax, Math.round(seedCash * d.seedMult)));
  const clampedYears = Math.max(1, Math.min(goalYears, maxYearsForAge(clampedAge)));
  return {
    // v8: startAge は age と一緒に動かない「開始時点の年齢」。バランスシートで
    // 「現在33歳（開始30歳）」と何年ぶん歳を取ったかを見せるために保持する。
    cash: clampedSeed, month: 0, attr, age: clampedAge, startAge: clampedAge,
    difficulty: diffKey,
    creditScore: (emp ? CONFIG.creditEmployee : CONFIG.creditSelf) + d.creditBonus,
    baseActionPower: emp ? 100 : 120, actionPower: emp ? 100 : 120,
    goal: { type: goalType, amount: goalAmount, years: clampedYears },
    skills: { appraisal: { exp: 0 }, negotiation: { exp: 0 }, selfmgmt: { exp: 0 } },
    properties: [], market: [], listings: [], pendingSales: [],
    bankRelations: { kouko: { loans: 0, paidOff: 0 }, chigin: { loans: 0, paidOff: 0 },
      shinkin: { loans: 0, paidOff: 0 }, nonbank: { loans: 0, paidOff: 0 } },
    log: ['ゲーム開始。まずは営業で物件を探そう。'],
    stats: { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false, junkRepairs: 0, maxMonthlyCF: 0 },
    badges: [],
    favorites: [], notifications: [], nextNotifId: 1, notifSettings: defaultNotifSettings(),
    isIncorporated: false,
    salesSearch: { spent: 0, threshold: null },
    nextPropertyId: 1,
    unlockedRegions: ['main'],   // v9-A: 解放済みの陸地。開発区・競売区・海外は条件を満たすと増える

    learnedTerms: [],   // v8: 用語クイズで正解した用語キー（用語集の習得マーク用）
    buffs: [],          // v8: 一時的な有利効果（現状は「耳より情報」＝次の指値+10pt のみ）
    rewindLeft: d.rewind,   // v8: 初心者モードのお守り。先月へ戻せる残り回数
  };
}

// v3.5: 旧セーブのID衝突修復。重複IDを見つけたら後から登場した方へ新IDを振り直す
// （名前もIDから再生成される。お気に入り・掲載などの参照は先に登場した方を指し続ける）。
export function dedupePropertyIds(state) {
  const s = structuredClone(state);
  s.nextPropertyId = s.nextPropertyId || 1;
  const seen = new Set();
  let fixed = 0;
  const fix = (p) => {
    if (seen.has(String(p.id))) {
      p.id = 'p' + s.nextPropertyId++;
      p.name = propertyName(p.genreKey, p.builtAge, p.id);
      fixed += 1;
    }
    seen.add(String(p.id));
  };
  (s.properties || []).forEach(fix);
  (s.market || []).forEach(fix);
  return { state: s, fixed };
}

// v3.5: 個人所有物件を法人へ売却（移転）。時価で取引し、個人側は譲渡税を精算、
// 法人側は取得コスト（時価の5%）を支払う。移転後は減価償却が中古簡便法で再スタートする。
// 抵当権が残る物件（ローン未完済）は移転できない。
export function transferToCorp(state, propertyId) {
  const p0 = state.properties.find(x => x.id === propertyId);
  if (!state.isIncorporated || !p0 || p0.owner === 'corp') return { state, done: false, reason: 'invalid' };
  if (p0.loan || (p0.reformLoans || []).length > 0) return { state, done: false, reason: 'loan' };
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const price = p.timeValue;
  const book = bookValueV2(p);
  const gain = Math.max(0, price - book);
  const heldYears = (s.month - (p.boughtMonth ?? s.month)) / 12;
  const capTax = Math.round(gain * (heldYears <= 5 ? CONFIG.capGainTaxShort : CONFIG.capGainTaxLong));
  const acqCost = Math.round(price * CONFIG.corpTransferCostRate);
  if (s.cash < capTax + acqCost) return { state, done: false, reason: 'cash' };
  s.cash -= capTax + acqCost;
  p.owner = 'corp';
  p.boughtPrice = price;
  p.boughtMonth = s.month;
  p.deprRemaining = deprMonthsFor(p.structure, p.builtAge);   // 償却再スタート（中古簡便法）
  return { state: s, done: true, price, capTax, acqCost };
}

// 訳あり物件の修繕完了時にカウントアップするロジック
export function recordJunkRepair(state, property) {
  if (property.junkFlags && property.junkFlags.length > 0) {
    state.stats.junkRepairs = (state.stats.junkRepairs || 0) + 1;
  }
}

// v8.9: junkFlagsは生成時のまま消えないので、実際に修繕（大規模修繕／日常メンテ・特別清掃）が
// 完了した時点で「解消しうる種類」だけresolvedJunkに記録する。恒久タイプ（傾き等）は対象外。
// どの訳ありがどの修繕で直るかまでは追わず、「このタイミングで手を入れた」ことだけを記録する簡易実装。
export function markJunkResolved(property) {
  if (!property.junkFlags?.length) return;
  const resolvable = property.junkFlags.filter(f => !PERMANENT_JUNK_FLAGS.includes(f));
  if (!resolvable.length) return;
  property.resolvedJunk = [...new Set([...(property.resolvedJunk || []), ...resolvable])];
}
export const FAVORITE_LIMIT = 10;

export function addFavorite(state, propertyId) {
  const s = structuredClone(state);
  s.favorites = s.favorites || [];
  const p = s.market.find(x => x.id === propertyId);
  if (!p) return { state: s, added: false, reason: 'not_found' };
  if (s.favorites.some(f => f.propertyId === propertyId)) return { state: s, added: false, reason: 'already' };
  if (s.favorites.length >= FAVORITE_LIMIT) return { state: s, added: false, reason: 'limit' };
  s.favorites.push({ propertyId, addedMonth: s.month, registeredPrice: p.price });
  return { state: s, added: true };
}

export function removeFavorite(state, propertyId) {
  const s = structuredClone(state);
  s.favorites = (s.favorites || []).filter(f => f.propertyId !== propertyId);
  return { state: s };
}

  first_loan: { icon: '🏦', label: '融資デビュー' },
  five_properties: { icon: '🏘️', label: '5物件オーナー' },
  first_full: { icon: '💯', label: '満室達成' },
  first_sale: { icon: '🤝', label: '初めての売却' },
  first_profit: { icon: '💰', label: '売却益ゲット' },
  junk_flip: { icon: '🔨', label: '訳あり物件を再生して売却' },
  skill_master: { icon: '⭐', label: 'スキルLv5到達' },
  debt_free: { icon: '🎉', label: '借入完済' },
  goal_clear: { icon: '🏆', label: '目標達成' },
  // v8.6: 「ADを出さない」という選択に報酬をつける。物件を良くする動機づけの一部。
  ad_free: { icon: '✨', label: '広告いらず（AD無しで5戸成約）' },
  appeal_master: { icon: '🌟', label: '魅力度100の部屋をつくった' },
};
export const AD_FREE_BADGE_COUNT = 5;

export function evaluateBadges(state) {
  const stats = state.stats || {};
  const ids = [];
  if ((stats.buys || 0) >= 1) ids.push('first_buy');
  if (stats.hadLoan) ids.push('first_loan');
  if (state.properties.length >= 5) ids.push('five_properties');
  if (state.properties.some(p => p.units.every(u => u.occupied))) ids.push('first_full');
  if ((stats.sales || 0) >= 1) ids.push('first_sale');
  if ((stats.profitSales || 0) >= 1) ids.push('first_profit');
  if ((stats.junkFlips || 0) >= 1) ids.push('junk_flip');
  if (['appraisal', 'negotiation', 'selfmgmt'].some(k => skillLevel(state.skills[k].exp) >= 5)) ids.push('skill_master');
  if (state.properties.length > 0 && totalDebt(state) === 0) ids.push('debt_free');
  if (isClearedV2(state)) ids.push('goal_clear');
  // v8.6: ADに頼らず決めた実績と、魅力度を振り切った部屋
  if ((stats.adFreeFills || 0) >= AD_FREE_BADGE_COUNT) ids.push('ad_free');
  if (state.properties.some(p => p.units.some(u => appealScore(p, u) >= 100))) ids.push('appeal_master');
  return ids;
}

// v3.7: リザルト称号。達成スピード（期限に対する消化率）と純資産の規模で決まる。
export function resultTitle(state) {
  if (isBankrupt(state)) return '夢半ばの破産者';
  if (!isClearedV2(state)) return '時間切れの挑戦者';
  const speed = state.month / Math.max(1, state.goal.years * 12);
  const nw = netWorth(state);
  const scale = nw >= 300_000_000 ? 'メガ大家' : nw >= 100_000_000 ? '大家' : '街の大家';
  if (speed <= 0.35) return `電光石火の${scale}`;
  if (speed <= 0.6) return `敏腕${scale}`;
  if (speed <= 0.85) return `堅実な${scale}`;
  return `執念の${scale}`;
}

// v6: おまかせ契約中の物件について、その月の自動発注を処理する。
// 対象は「手入れの維持」と「原状回復」の2つだけ。大規模修繕・価値UPは金額が大きいのでオーナー判断のまま。
// 現金が足りない月は黙って見送らず、必ず通知を出す（気づかないまま空室が続くのを防ぐ）。
function autoManageMonth(s, p, logs) {
  const nm = p.name || p.label;
  let short = false;

  // ① 退去した部屋の原状回復。放置すると募集できないので最優先で発注する。
  for (const u of p.units) {
    if (!u.needsRestore || u.restoreJob) continue;
    const cost = autoManageCost(restoreCost(p, u));
    if (s.cash < cost) { short = true; continue; }
    s.cash -= cost;
    u.restoreJob = { monthsTotal: 1, monthsLeft: 1, auto: true };
    u.restoreProgress = 0;
    logs.push(`${nm} の原状回復を管理会社が手配した（${yen(cost)}）`);
  }

  // ② 手入れの維持。基準を下回ったら日常メンテを発注し、完了時に100%へ戻る。
  if (!p.repairJob && (p.careState ?? 100) < AUTO_MANAGE_CARE_FLOOR) {
    const cost = autoManageCost(repairCost(p, 'maint'));
    if (s.cash >= cost) {
      s.cash -= cost;
      const months = repairJobMonths(p, 'maint');
      p.repairJob = { kind: 'maint', monthsTotal: months, monthsLeft: months, startState: p.careState, auto: true };
      logs.push(`${nm} の日常メンテを管理会社が手配した（${yen(cost)}）`);
    } else {
      short = true;
    }
  }

  if (short) {
    pushNotification(s, 'auto_manage_nocash', p.id, nm,
      `${nm} で残高不足のため、おまかせの自動修繕を実施できませんでした。現金を用意するか契約を見直してください`);
  }
}

// v8: 危険域のペナルティを1物件ぶん適用する。advanceMonth から毎月呼ぶ。
// 「痛いが理不尽ではない」ことを重視し、どの段階でも通知とログで理由が読めるようにしてある。
function applyDangerBandPenalties(s, p, logs, rng) {
  const nm = p.name || p.label;
  const sb = structBandOf(p);
  const cb = careBandOf(p);

  // 🏚 危険（10%未満）: 傷んだ建物から住人が離れていく
  if (sb === 'danger' && rng() < STRUCT_DANGER_VACATE_CHANCE) {
    const occupied = p.units.filter(u => u.occupied);
    if (occupied.length) {
      const u = occupied[Math.floor(rng() * occupied.length)];
      u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; u.needsRestore = true;
      logs.push(`${nm} の劣化に耐えかねて1戸が退去（躯体${Math.round(p.repairState)}%）`);
    }
  }

  // 🏚 使用不能（0%）: 全戸退去のうえ募集停止。大規模修繕の完了でしか解除できない。
  if (sb === 'dead' && !p.condemned) {
    p.condemned = true;
    const lost = p.units.filter(u => u.occupied).length;
    p.units.forEach(u => {
      if (u.occupied) { u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; }
    });
    pushNotification(s, 'condemned', p.id, nm,
      `${nm} が使用不能になりました（躯体0%）。全${lost}戸が退去し、大規模修繕が完了するまで募集できません`);
    logs.push(`🛑 ${nm} が使用不能に。全${lost}戸が退去し、募集を停止した`);
  }
  if (sb !== 'dead' && p.condemned) p.condemned = false;   // 修繕で躯体が戻れば自動解除

  // 🧹 危険（20%未満）: 荒れた共用部にクレームが来る
  if (cb === 'danger' && rng() < CARE_DANGER_CLAIM_CHANCE) {
    s.actionPower -= CARE_DANGER_CLAIM_AP;
    const claim = CARE_CLAIMS[Math.floor(rng() * CARE_CLAIMS.length)];
    logs.push(`${nm} で入居者クレーム「${claim}」対応に追われた（行動力-${CARE_DANGER_CLAIM_AP}）`);
  }

  // 🧹 管理崩壊（0%）: 毎月確実に1戸ずつ抜けていき、評判も落ちる
  if (cb === 'dead') {
    const occupied = p.units.filter(u => u.occupied);
    if (occupied.length) {
      const u = occupied[Math.floor(rng() * occupied.length)];
      u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; u.needsRestore = true;
      logs.push(`${nm} は管理崩壊状態。愛想を尽かした1戸が退去した`);
    }
    s.creditScore = Math.max(0, (s.creditScore ?? 0) - 1);
  }

  // 帯が悪化した月だけ通知する。同じ帯に留まっているあいだは黙り、回復すれば再アームされる。
  const worst = worstBandOf(p);
  const before = p.notifiedBand || 'ok';
  if (BAND_RANK[worst] > BAND_RANK[before]) {
    // v8.9: 通知本文は短く（躯体・手入れの数値のみ）、打ち手の説明は advice として別枠に持たせる。
    // 通知一覧のプルダウンと物件一覧の吹き出しの両方が、この同じ advice を出典にする。
    if (worst === 'warn') {
      pushNotification(s, 'band_warn', p.id, nm,
        `${nm} が注意水準です（躯体${Math.round(p.repairState)}% ／ 手入れ${Math.round(p.careState)}%）`,
        null, bandAdviceText(p));
    } else if (worst === 'danger') {
      pushNotification(s, 'band_danger', p.id, nm,
        `${nm} が危険水準です（躯体${Math.round(p.repairState)}% ／ 手入れ${Math.round(p.careState)}%）`,
        null, bandAdviceText(p));
    }
  }
  if (BAND_RANK[worst] !== BAND_RANK[before]) p.notifiedBand = worst;
}

// v8.9: 帯（躯体・手入れ）の打ち手アドバイス文だけを返す。通知本文からは分離し、
// 通知一覧のプルダウン・物件一覧の吹き出し・（将来の）詳細画面で使い回す。
export function bandAdviceText(property) {
  const worst = worstBandOf(property);
  if (worst === 'warn') return '早めに直すほど安く済みます。';
  if (worst === 'danger') return '退去が始まり、銀行の評価も下がります。';
  return null;
}

// 球面上の角距離。cos(d) = sin φ1 sin φ2 + cos φ1 cos φ2 cos(Δλ)
export function regionAngularDistance(a, b) {
  return Math.acos(Math.max(-1, Math.min(1,
    Math.sin(a.lat) * Math.sin(b.lat) + Math.cos(a.lat) * Math.cos(b.lat) * Math.cos(a.lon - b.lon))));
}

// 陸地どうしが重なっていないかを全ペアで検算する。
// v5で未開拓エリアの1つが大陸の内側に入り、黒い影が「焦げ跡」に見えた事故があった。
// あれは目視でしか気づけなかったので、陸地が4つに増える今回はコードで検算する。
export function regionOverlaps() {
  const ms = Object.values(REGIONS), bad = [];
  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
    const d = regionAngularDistance(ms[i], ms[j]), need = ms[i].radius + ms[j].radius + SEA_GAP;
    if (d <= need) bad.push({ a: ms[i].key, b: ms[j].key, dist: +d.toFixed(3), need: +need.toFixed(3) });
  }
  return bad;
}
{
  const bad = regionOverlaps();
  if (bad.length && typeof console !== 'undefined') console.warn('[v9] 陸地が重なっています', bad);
}

export function isRegionUnlocked(state, key) {
  if (key === 'main') return true;   // 本土は unlockedRegions に無くても常に開いている
  return (state.unlockedRegions || ['main']).includes(key);
}

// UIの進捗バーはこの戻り値だけで描ける（条件のロジックをUI側に書かないため）。
export function regionUnlockProgress(state, key) {
  const r = REGIONS[key];
  if (!r) return null;
  if (!r.unlock) return { key, ready: true, unlocked: true, met: true, mode: 'and', conditions: [] };
  const conditions = r.unlock.conds.map(c => {
    const cur = c.cur(state);
    return { key: c.key, label: c.label, cur, need: c.need, fmt: c.fmt, met: cur >= c.need };
  });
  const met = r.unlock.mode === 'or' ? conditions.some(c => c.met) : conditions.every(c => c.met);
  return { key, ready: r.ready, unlocked: isRegionUnlocked(state, key), met, mode: r.unlock.mode, conditions };
}

// 新たに条件を満たし、かつ中身が実装済み（ready）なエリアのキーを返す。state は書き換えない。
export function checkRegionUnlocks(state) {
  return Object.keys(REGIONS).filter(k => {
    const r = REGIONS[k];
    if (!r.unlock || !r.ready) return false;
    if (isRegionUnlocked(state, k)) return false;
    return regionUnlockProgress(state, k).met;
  });
}

// 一度解放したエリアは、条件を下回っても閉じない。閉じると理不尽なうえ、
// そのエリアに持っている物件が宙に浮く。配列に入れたら消さない。
export function unlockRegion(state, key) {
  if (!REGIONS[key] || key === 'main') return false;
  state.unlockedRegions = state.unlockedRegions || ['main'];
  if (state.unlockedRegions.includes(key)) return false;
  state.unlockedRegions.push(key);
  return true;
}

// v8.6: 空室が3ヶ月を超えたら、その原因と打ち手を通知で教える。
// 「決まらない」だけ見せても何をすればいいか分からない。魅力度の一番低い項目を名指しする。
// v8.9: 判定・アドバイス文の組み立ては unitVacancyAdvice に切り出し、通知本文は短くする。
function notifyLongVacancy(s, p) {
  p.units.forEach((u, i) => {
    if (u.occupied || u.needsRestore) { u.vacancyAlerted = false; return; }
    if (u.vacantMonths < LONG_VACANCY_MONTHS || u.vacancyAlerted) return;
    const adv = unitVacancyAdvice(p, u);
    if (!adv) return;   // 魅力は十分。運が悪いだけなので黙っておく
    u.vacancyAlerted = true;
    const nm = p.name || p.label;
    pushNotification(s, 'long_vacancy', p.id, nm,
      `${nm} ${i + 1}号室が${u.vacantMonths}ヶ月空室です。`, null, adv.message);
  });
}

// v8.9: 1室ぶんの長期空室アドバイス判定。通知生成（notifyLongVacancy）と物件一覧の
// 「アドバイス」吹き出し（通知が発火済みかに関係なく現況で判定したい）の両方から呼ぶ共通ロジック。
export function unitVacancyAdvice(property, unit) {
  if (unit.occupied || unit.needsRestore) return null;
  if ((unit.vacantMonths || 0) < LONG_VACANCY_MONTHS) return null;
  const score = appealScore(property, unit);
  if (score >= APPEAL_ALERT_SCORE) return null;
  const b = appealBreakdown(property, unit);
  // 満点との差が大きい＝伸びしろが大きい項目を勧める（築年・広さは直せないので除く）
  const fixable = [
    { key: 'care', gap: APPEAL_WEIGHTS.care - b.care, hint: '日常メンテで手入れを100%に戻す' },
    { key: 'valueUp', gap: APPEAL_WEIGHTS.valueUp - b.valueUp, hint: '✨価値UPで設備・内装を新しくする' },
    { key: 'struct', gap: APPEAL_WEIGHTS.struct - b.struct, hint: '大規模修繕で躯体を直す' },
  ].sort((x, y) => y.gap - x.gap)[0];
  return { score, hint: fixable.hint,
    message: `物件の魅力が足りていません（${score}/100）。`
      + `${fixable.gap > 0 ? `いちばん効くのは「${fixable.hint}」です。` : ''}ADを出すより、直したほうが家賃も資産価値も上がります。` };
}

// v8.9: 物件一覧の「アドバイス」吹き出し用。通知の発火履歴に関係なく現況だけで判定し、
// 該当するアドバイス文をまとめて返す（該当なしなら空配列＝吹き出し自体を出さない）。
export function propertyAdviceLines(property) {
  const lines = [];
  const ba = bandAdviceText(property);
  if (ba) {
    const worst = worstBandOf(property);
    lines.push(`${worst === 'danger' ? '🚨' : '⚠️'} 躯体${Math.round(property.repairState)}% ／ `
      + `手入れ${Math.round(property.careState ?? property.repairState)}%。${ba}`);
  }
  property.units.forEach((u, i) => {
    const adv = unitVacancyAdvice(property, u);
    if (adv) lines.push(`🏚 ${i + 1}号室が${u.vacantMonths}ヶ月空室。${adv.message}`);
  });
  return lines;
}

export function advanceMonth(state, rng = Math.random) {
  let s = structuredClone(state);
  const logs = [];
  const diff = difficultyOf(s);   // v8: 劣化・イベント頻度・客付けに難易度の係数が乗る
  s.month += 1;
  for (const sale of [...(s.pendingSales || [])].filter(x => x.settleMonth <= s.month)) {
    const r = settleSale(s, sale); s = r.state; logs.push(...r.logs);
  }
  for (const p of s.properties) {
    // v4: 業者に出した原状回復は工期を経て完了する。先に完了させてから客付け判定に進む。
    for (const u of p.units) {
      if (u.restoreJob) {
        u.restoreJob.monthsLeft -= 1;
        if (u.restoreJob.monthsLeft <= 0) {
          u.restoreJob = null; u.needsRestore = false; u.restoreProgress = 0;
          logs.push(`${p.name || p.label} の原状回復が完了。募集を再開できる`);
        }
      }
    }
    // v6: 経年劣化。🏚躯体は築年帯×構造で、🧹手入れは一律で減る。
    // 小数のまま保持する（整数に丸めながら引くと、築浅RCの -0.08/月 が永久に0のままになる）。
    // v8: 初心者モードは劣化が0.7倍。数字を甘くするより「考える時間を与える」ほうが効くため。
    p.repairState = Math.max(0, (p.repairState ?? 100) - structuralDecay(p) * diff.decayMult);
    p.careState = Math.max(0, (p.careState ?? 100) - CARE_DECAY_PER_MONTH * diff.decayMult);
    monthlyVacancyRoll(p, rng);
    applyDangerBandPenalties(s, p, logs, rng);   // v8: 危険域のペナルティは客付け判定より先に効かせる
    const fillRes = naturalFillRoll(p, rng, diff.fillBonus, s);
    if (fillRes.adFree > 0) {
      logs.push(`${p.name || p.label} で${fillRes.adFree}戸が決まった（AD無し・物件の力で決まった！）`);
    }
    notifyLongVacancy(s, p);   // v8.6: 長引く空室の原因を教える
    const pl = propertyMonthlyPL(p);
    s.cash += pl.cf;
    if (p.loan) {
      p.loan.monthsPaid += 1;
      if (p.loan.monthsPaid >= p.loan.years * 12) p.loan = null;   // 完済したら返済を止める
    }
    // v4: リフォームローンは複数本。各本を1ヶ月進め、完済した本だけを配列から外す。
    if (p.reformLoans && p.reformLoans.length) {
      p.reformLoans.forEach(l => { l.monthsPaid += 1; });
      p.reformLoans = p.reformLoans.filter(l => l.monthsPaid < l.years * 12);
    }
    if (p.deprRemaining > 0) p.deprRemaining -= 1;
    const drift = p.structure === '木造' ? -0.0015 : p.structure === 'S' ? -0.001 : -0.0005;
    p.timeValue = Math.max(10000, Math.round(p.timeValue * (1 + drift)));
    p.history.push({ month: s.month, ...pl });
    if (p.history.length > 24) p.history.shift();
    p.cum.cf += pl.cf; p.cum.months += 1;
    if (rng() < troubleChanceFor(p) * diff.eventMult) {   // v6: 築年帯で傾斜（旧: 全物件3%固定）
      const base = CONFIG.troubleMin + rng() * (CONFIG.troubleMax - CONFIG.troubleMin);
      const c = Math.round(troubleRepairCost(base, skillLevel(s.skills.selfmgmt.exp)));
      s.cash -= c;
      logs.push(`${p.label} で突発修繕（-${yen(c)}）`);
    }
    // v3: 業者修繕の進行。毎月少しずつ回復し、最終月に100到達・時価+8%・完了通知
    if (p.repairJob) {
      p.repairJob.monthsLeft -= 1;
      const j = p.repairJob;
      const kind = j.kind || 'large';
      // v6: 工事種別ごとに動かすゲージが違う（日常メンテ=🧹手入れ／大規模修繕=🏚躯体）。どちらも到達点は100%。
      const goal = REPAIR_KINDS[kind].cap;
      if (j.monthsLeft <= 0) {
        const before = repairGaugeValue(p, kind);
        setRepairGauge(p, kind, goal);
        p.repairJob = null;
        const nm = p.name || p.label;
        if (kind === 'large') {
          p.timeValue = Math.round(p.timeValue * 1.08);
          s.skills.selfmgmt.exp += 15;
          if (before < 100) { recordJunkRepair(s, p); markJunkResolved(p); }
          pushNotification(s, 'repair_done', p.id, nm, `${nm} の大規模修繕が完了しました（躯体100%・資産価値上昇）`);
          logs.push(`${nm} の大規模修繕が完了した（躯体100%）`);
        } else {
          // おまかせ契約による自動工事は「自分で手を動かしていない」ので自主管理EXPが入らない
          if (!j.auto) s.skills.selfmgmt.exp += 8;
          if (before < 100) markJunkResolved(p);
          const kindLabel = REPAIR_KINDS[kind].label;
          pushNotification(s, 'repair_done', p.id, nm,
            `${nm} の${kindLabel}が完了しました（手入れ100%）${j.auto ? '／管理会社おまかせ' : ''}`);
          logs.push(`${nm} の${kindLabel}が完了した（手入れ100%）`);
        }
      } else {
        const k = j.monthsTotal - j.monthsLeft;
        setRepairGauge(p, kind, Math.min(goal - 1, j.startState + (goal - j.startState) * k / j.monthsTotal));
      }
    }
    // v6: 管理会社おまかせ契約。手入れの維持と原状回復の発注をここで自動化する。
    if (p.autoManage) autoManageMonth(s, p, logs);
    // v3.11: バリューアップ工事の進行。完了月に各室の家賃と時価が上がる。
    if (p.valueUpJob) {
      p.valueUpJob.monthsLeft -= 1;
      if (p.valueUpJob.monthsLeft <= 0) {
        applyValueUp(p, p.valueUpJob.rentMult);   // DIY完了時と同じ処理を使う
        p.valueUpJob = null;
        const nm = p.name || p.label;
        pushNotification(s, 'valueup_done', p.id, nm, `${nm} のバリューアップが完了！家賃がアップしました`);
        logs.push(`${nm} のバリューアップ完了（家賃UP・資産価値上昇）`);
      }
    }
    // v8: 「躯体20%割れ」の単発通知は、3段階の帯通知（applyDangerBandPenalties）に統合した。
  }
  if (s.month % 12 === 0) { s.properties.forEach(p => { p.builtAge += 1; }); s.age = (s.age ?? 30) + 1; }
  // v3.7: 生涯実績用に最大月CFを記録（リザルト画面で表示）
  s.stats = s.stats || {};
  const mcfNow = monthlyCF(s);
  if (mcfNow > (s.stats.maxMonthlyCF ?? 0)) s.stats.maxMonthlyCF = mcfNow;
  // v3: 月次給与の自動加算は廃止（種銭は doWork で稼ぐ）
  // v8.2: 決済で物件が消えた直後なので、掲載を掃除してから回す。
  // ここで未定義の物件を触ると advanceMonth ごと例外で止まり、月が進まず行動力も戻らなくなる。
  s.listings = pruneListings(s).listings;
  for (const l of s.listings) {
    l.listedMonths += 1;
    if (!l.offer) {
      const p = s.properties.find(x => x.id === l.propertyId);
      if (!p) continue;   // 念のための二重防御（pruneListings で除かれているはず）
      const o = rollBuyOffer(l, p, rng);
      if (o) { l.offer = { ...o, month: s.month }; logs.push(`${p.label} に買付！（${o.type === 'full' ? '満額' : '指値'} ${yen(o.price)}）`); }
    }
  }
  { const r = tickMarket(s, rng); s = r.state; logs.push(...r.logs); }
  let pendingEvent = null;
  if (rng() < CONFIG.eventChance * diff.eventMult) {
    const es = eligibleEvents(s);
    if (es.length) {
      const ev = es[Math.floor(rng() * es.length)];
      // v6: 対象はジャンルではなく match（築年数・構造・戸数・手入れ）で絞り込んだ物件から選ぶ
      const cands = eventTargets(ev, s);
      const pick = cands.length ? cands[Math.floor(rng() * cands.length)] : null;
      const targetId = pick ? pick.property.id : null;
      const unitIndex = pick ? pick.unitIndex : null;
      // 見出しは発生した時点で確定させる（セミナーのお題は毎回変わるので、
      // 描画のたびに引き直すと画面を開き直すだけで題目が変わってしまう）。
      pendingEvent = { id: ev.id, targetId, unitIndex, title: eventTitle(ev) };
      recordEventFired(s, ev.id, targetId, unitIndex);   // 同じ部屋・同じ物件で当分は繰り返さない
    }
  }
  // v9-A: エリアの解放。ready=false のあいだは checkRegionUnlocks が常に空を返すので、
  // ここは中身（新築・競売・海外）が実装されるまで眠っている。
  const newlyUnlocked = checkRegionUnlocks(s);
  for (const key of newlyUnlocked) {
    unlockRegion(s, key);
    const r = REGIONS[key];
    pushNotification(s, 'region_unlocked', null, `${r.icon} ${r.label}`,
      `${r.icon} ${r.label} が解放された。${r.desc}`);
    logs.push(`${r.icon} ${r.label} が解放された`);
  }
  s.actionPower = s.baseActionPower;
  return { state: s, logs, pendingEvent, newlyUnlocked };
}

export function serialize(state) { return JSON.stringify(state); }
export function deserialize(str) { return JSON.parse(str); }

// v4: 旧セーブを新フィールドへ移行する。ui側のload()から呼ぶ（純関数なのでテストできる）。
export function migrateSave(state) {
  const s = structuredClone(state);
  // v8: 旧セーブには無い項目を補う。開始年齢は現在年齢から経過年数を引いて復元する。
  if (s.startAge === undefined) s.startAge = (s.age ?? 30) - Math.floor((s.month ?? 0) / 12);
  if (s.difficulty === undefined) s.difficulty = 'normal';
  if (s.rewindLeft === undefined) s.rewindLeft = difficultyOf(s).rewind;
  if (!Array.isArray(s.learnedTerms)) s.learnedTerms = [];
  if (!Array.isArray(s.buffs)) s.buffs = [];
  // v9-A: 陸地。旧セーブは本土だけが開いていて、物件はすべて本土にある。
  if (!Array.isArray(s.unlockedRegions) || !s.unlockedRegions.length) s.unlockedRegions = ['main'];
  // v8.8: 通知の表示設定。無い分（旧セーブ・将来追加した種類）は既定値で埋める。ユーザーが選んだ値は保持する。
  s.notifSettings = { ...defaultNotifSettings(), ...(s.notifSettings || {}) };
  // v8.2: すでに壊れているセーブを読み込み時に直す。
  // このバグに当たった人は「翌月が押せない」状態でセーブが残っているので、
  // 読み込むだけで復帰できるようにしておく（作り直しを強いない）。
  s.properties = s.properties || [];
  s.pendingSales = s.pendingSales || [];
  s.listings = pruneListings(s).listings;
  // v8.21: 旧セーブの物件補完は所有物件（s.properties）だけでなく市場物件（s.market）にも
  // 必要（どちらも generateProperty で同じ形のオブジェクトを作るため）。以前はs.propertiesだけ
  // 処理しており、市場に残っていた旧世代の物件はassessedLand/assessedBldgが埋まらないままだった
  // （物件詳細の評価額内訳表示が¥0になるバグとして発覚）。
  const fixLegacyProperty = (p) => {
    // リフォームローンの単数→配列
    if (!Array.isArray(p.reformLoans)) p.reformLoans = p.reformLoan ? [p.reformLoan] : [];
    delete p.reformLoan;
    if (p.region === undefined) p.region = 'main';   // v9-A: 旧セーブの物件はすべて本土
    // v8.9: 固定資産税評価額。旧セーブには無いので、構造・延床面積・築年から算出して埋める。
    if (p.assessedValue === undefined) p.assessedValue = estimateAssessedValue(p.structure, p.builtAge, totalFloorSqm(p), p.areaKey);
    // v8.21: 内訳（土地・建物）は表示用に新規追加したフィールド。assessedValueだけ既にある
    // 旧セーブでは、建物側を決定的な式（乱数なし）で出し、土地側は差分で埋める
    // （合計を既存のassessedValueと必ず一致させるため、土地単価を乱数で引き直さない）。
    if (p.assessedBldg === undefined) {
      const life = ASSESSED_USEFUL_LIFE[p.structure] ?? ASSESSED_USEFUL_LIFE['木造'];
      const remain = Math.max(ASSESSED_DEPRECIATION_FLOOR, 1 - (p.builtAge ?? 0) / life);
      p.assessedBldg = Math.round((REBUILD_COST_PER_SQM[p.structure] ?? REBUILD_COST_PER_SQM['木造']) * totalFloorSqm(p) * remain);
      p.assessedLand = Math.max(0, p.assessedValue - p.assessedBldg);
    }
    // v8.21: 固都税は評価額の純関数（他のメカニクスから書き換えられることはない）なので、
    // 常に評価額×税率で揃え直す。旧・一律3万円下限で生成された物件のpropTaxAも、
    // ここで実際の評価額ベースの額に更新される（内訳表示と実際の負担額を一致させるため）。
    p.propTaxA = Math.round(p.assessedValue * PROPERTY_TAX_RATE);
    // v6: 修繕度の2ゲージ化。旧セーブは1本しか持たないので、手入れは躯体と同じ値から始める。
    if (p.careState === undefined) p.careState = p.repairState;
    if (p.autoManage === undefined) p.autoManage = false;
    if (!Array.isArray(p.resolvedJunk)) p.resolvedJunk = [];
    // 原状回復（部屋ごと）。既存の空室は「原状回復済み」扱いにし、いきなり客付け不可にしない。
    (p.units || []).forEach(u => {
      if (u.ad === undefined) u.ad = null;   // v8.4: 広告料（決まるまで効く）
      if (u.needsRestore === undefined) u.needsRestore = false;
      if (u.tenantMonths === undefined) u.tenantMonths = u.occupied ? 12 : 0;
      if (u.restoreJob === undefined) u.restoreJob = null;
      if (u.restoreProgress === undefined) u.restoreProgress = 0;
    });
  };
  (s.properties || []).forEach(fixLegacyProperty);
  (s.market || []).forEach(fixLegacyProperty);
  return s;
}

export const SHAPE_BY_GENRE = {

  apart: 'apart', w_apart: 'apart',
  tekkotsu: 'tekkotsu', w_tekkotsu: 'tekkotsu',
  kubun: 'kubun', w_kubun: 'kubun',
  rc: 'rc', w_rc: 'rc',
};

export function svgBuildingParts(property) {
  const shape = SHAPE_BY_GENRE[property.genreKey] ?? 'kodate';
  const wake = !!(property.junkFlags && property.junkFlags.length > 0);
  const ageFactor = Math.min(property.builtAge, 60) / 300;
  // v6: 見た目も2ゲージで分ける。ひび割れは🏚躯体の傷み、汚れと雑草は🧹手入れの不足として描く。
  const care = property.careState ?? property.repairState ?? 100;
  const dirtLevel = Math.max(0, Math.min(1, (100 - care) / 100 + (wake ? 0.25 : 0) + ageFactor));
  const hasCracks = property.repairState < 50 || wake;
  const hasWeeds = care < 30;
  const tilt = wake && property.junkFlags.includes('傾き');
  return { shape, dirtLevel, hasCracks, hasWeeds, tilt, wake };
}

// v8.7: minLoan（最低融資額）を追加。頭金を入れすぎると借入が数十万円になり、
// 銀行がそんな少額を扱うのは非現実的だった（頭金95%で借入115万が4行とも承認されていた）。
// 「自己資金を入れるほど通りやすいが、入れすぎると取扱い対象から外れる」という
// 上下の折り返しを作ることで、頭金の決定が単調な最大化ではなくなる。
export const MIN_LOAN_AMOUNT = 1_000_000;
export const BANKS = {

  shinkin: { key:'shinkin', label:'信用金庫',         baseRate:0.023, termMin:10, termMax:20, ltvMax:0.80, maxLoan:80_000_000, minLoan:MIN_LOAN_AMOUNT, minCredit:35, wakeOk:false, areaLimit:'local', lifeStrict:'soft', minPrice:0 },

export const STRUCTURE_LIFE = { '木造': 22, 'S': 34, 'RC': 47 };
export const JUNK_FLAGS = ['残置物', '再建築不可', '傾き', '事故歴', '管理崩壊', '立退き交渉中'];
// v8.9: 「傾き」「事故歴」「再建築不可」は物件そのものの恒久的な物理・法的事実なので、
// どれだけ修繕しても解消しない（resolvedJunkの対象から外す）。
export const PERMANENT_JUNK_FLAGS = ['傾き', '事故歴', '再建築不可'];

export function usefulLifeRemaining(structure, builtAge) {
  const legal = STRUCTURE_LIFE[structure];
  if (builtAge >= legal) return Math.max(4, Math.floor(legal * 0.2));
  return Math.floor((legal - builtAge) + builtAge * 0.2);
}
export function deprMonthsFor(structure, builtAge) {
  return usefulLifeRemaining(structure, builtAge) * 12;
}

// ===== Task 4: 銀行審査エンジン =====
export function bankRate(bankKey, state) {
  const b = BANKS[bankKey];
  const rel = (state.bankRelations && state.bankRelations[bankKey]) || { paidOff: 0 };
  const negLv = skillLevel(state.skills.negotiation.exp);
  const cut = (effectiveCredit(state) / 100) * 0.005 + negotiationRateCut(negLv) + Math.min(rel.paidOff * 0.001, 0.005);
  // v8: 難易度による金利の下駄。交渉・信用による引き下げ幅の上限（-0.7%）とは別枠で乗せる。
  return Math.max(b.baseRate - cut, b.baseRate - 0.007) + difficultyOf(state).rateAdj;
}

export function reviewLoan(bankKey, property, price, downRatio, state) {
  const b = BANKS[bankKey];
  const reasons = [];
  const loanAmount = Math.round(price * (1 - downRatio));
  const rel = (state.bankRelations && state.bankRelations[bankKey]) || { paidOff: 0 };
  const ltvMax = bankKey === 'chigin' && rel.paidOff >= 3 ? 0.90 : b.ltvMax;

  // v8.7: 審査は「本人属性＋資産背景＋この案件の自己資金の厚み」の合計で見る。
  // v8: 危険域の物件を抱えていると、その分だけ実効的な信用度が下がった状態で審査される。
  const cr = creditForReview(state, downRatio);
  if (cr.total < b.minCredit) reasons.push({ code: 'CREDIT_LOW',
    msg: `総合評価が基準未満（${cr.total} < ${b.minCredit}）`
      + `［属性${cr.base}${cr.penalty ? `(管理状態-${cr.penalty})` : ''}`
      + `＋資産背景${cr.asset}＋自己資金${cr.down}］`
      + `${cr.down < DOWN_PAYMENT_BONUS_MAX ? '／頭金を厚くすると評価が上がります' : ''}` });
  if (property.junkFlags.length > 0 && !b.wakeOk) reasons.push({ code: 'WAKEARI_NG', msg: '瑕疵・事故物件のため取扱不可' });
  if (b.areaLimit && property.areaKey !== b.areaLimit) reasons.push({ code: 'AREA_NG', msg: `${b.label}の営業エリア外（地方・郊外のみ）` });
  if (price < b.minPrice || loanAmount > b.maxLoan) reasons.push({ code: 'AMOUNT_NG', msg: `融資額が取扱範囲外（${b.label}）` });
  // v8.7: 少額すぎる融資は銀行が扱わない。頭金の入れすぎで借入が数十万円になるのを防ぐ。
  if (loanAmount < (b.minLoan ?? 0)) reasons.push({ code: 'LOAN_TOO_SMALL',
    msg: `融資額が少なすぎます（${yen(loanAmount)}／最低 ${yen(b.minLoan)} から）` });

  const remainYears = usefulLifeRemaining(property.structure, property.builtAge);
  let years = b.termMax;
  if (b.lifeStrict === true) {
    if (property.builtAge >= STRUCTURE_LIFE[property.structure]) reasons.push({ code: 'LIFE_OVER', msg: `法定耐用年数切れ（${property.structure}築${property.builtAge}年）は取扱不可` });
    years = Math.min(b.termMax, remainYears);
  } else if (b.lifeStrict === 'soft') {
    years = Math.min(b.termMax, remainYears + 5);
  }
  const preAgeYears = years;   // 年齢キャップを適用する前の年数（築年数由来の制約はここに反映済み）
  const age = state.age ?? 0;
  const maxTermByAge = Math.max(0, CONFIG.maxAge - age);
  years = Math.min(years, maxTermByAge);
  // 年齢キャップが「実際に」否認の原因になった場合だけAGE_OVERを出す。
  // 築年数側の制約(LIFE_OVER・soft cap等)で既にtermMin未満だったケースまで年齢のせいにしない。
  if (years < b.termMin && preAgeYears >= b.termMin) {
    reasons.push({ code: 'AGE_OVER', msg: `完済時年齢が上限(${CONFIG.maxAge}歳)を超えるため取扱不可（現在${age}歳・借入可能最長${maxTermByAge}年）` });
  }
  years = Math.max(b.termMin, years);

  if ((1 - downRatio) > ltvMax) reasons.push({ code: 'OVER_LTV', msg: `自己資金${Math.round((1 - ltvMax) * 100)}%以上が必要（LTV上限${Math.round(ltvMax * 100)}%）` });

  const rate = bankRate(bankKey, state);
  const monthlyPay = monthlyPayment(loanAmount, rate, years);
  const d = dscr(noiAnnualV2(property), monthlyPay * 12);
  if (d < CONFIG.minDscr) reasons.push({ code: 'DSCR_LOW', msg: `収支が返済に対して弱い（DSCR ${d.toFixed(2)} < ${CONFIG.minDscr}）` });

  const requiredCash = Math.round(price * downRatio) + closingCostOf(property, price, loanAmount);
  if (state.cash < requiredCash) reasons.push({ code: 'NO_CASH', msg: `自己資金が足りない（必要 ${yen(requiredCash)} / 手元 ${yen(state.cash)}）` });

  const approved = reasons.length === 0;
  // v8.21: LTV・DSCRは否決理由に埋めるだけでなく、常に見える指標として単独でも返す
  // （UI側で承認・否決を問わず銀行名の隣に常時表示するため）。
  return { bankKey, label: b.label, approved, reasons,
    ltv: 1 - downRatio, ltvMax, dscr: d, dscrMin: CONFIG.minDscr,
    terms: approved ? { rate, years, ltv: 1 - downRatio, loanAmount, monthlyPay: Math.round(monthlyPay), requiredCash } : undefined };
}

// v8.21: 融資が通りやすい順（信用度の必要水準が低い・LTVが緩い・訳あり/エリアの制限が
// 少ないほど上位）に並べる。ノンバンクは金利が高い代わりに信用度25・LTV90%まで許容と
// 最も間口が広く、地方銀行は信用度50必須・訳あり不可・1,000万円未満取扱不可と最も狭い。
export function reviewAllBanks(property, price, downRatio, state) {
  return ['nonbank', 'kouko', 'shinkin', 'chigin'].map(k => reviewLoan(k, property, price, downRatio, state));
}

// === v2: 売却フロー（査定・掲載・値下げ・取下げ） ===

// v3.9: 市場利回り。物件の「通常版ジャンル」の標準利回りを基準に、築年・エリア・訳あり・価値UPで調整。
// 高利回り=市場が高い利回りを要求＝安く評価。低利回り=人気で高く評価。
// v11: 価値UPで利回りが下がり、上限で頭打ちになる
export const VALUEUP_YIELD_STEP = 0.01;    // v11.1: 価値UP1回につき利回り-1.0pt（実際の上限VALUE_UP_MAX_LEVEL=2回で-2.0ptに届くよう調整。旧0.004だと2回で-0.8ptにしか届かず、5回前提だった-2.0pt上限が実質到達不能だった）
export const VALUEUP_YIELD_MAX = 0.02;     // 上限-2.0pt（VALUE_UP_MAX_LEVEL=2回で到達）
export function marketYield(property) {
  const genreKey = property.genreKey || 'kodate';   // v11: rollBuyOffer経由で最小stubから呼ばれても落ちないよう防御
  const normalKey = genreKey.startsWith('w_') ? genreKey.slice(2) : genreKey;
  const g = GENRE[normalKey] || GENRE.kodate;
  const a = AREA_ADJ[property.areaKey] || AREA_ADJ.local;
  let y = (g.yieldMin + g.yieldMax) / 2;         // その物件タイプの標準的な市場利回り
  y += Math.max(0, (property.builtAge ?? 0) - 15) * 0.0015;   // 築15年超は古いほど高利回り（安評価）
  y += a.yieldAdd;                                // 都心は低利回り(高評価)・地方は高利回り(安評価)
  if (property.junkFlags?.length) y += 0.06 + property.junkFlags.length * 0.02;   // 訳あり未解消は高利回り(安評価)
  y -= Math.min(VALUEUP_YIELD_MAX, (property.valueUpLevel ?? 0) * VALUEUP_YIELD_STEP);   // v11: 改装済みは家賃の伸び以上に評価
  return Math.max(0.04, Math.min(0.5, y));
}

// v3.9: 収益還元法による適正価格。満室想定家賃を市場利回りで割り戻し、入居状況・修繕度・手入れで補正する。
// v11: 固定資産評価額をフロアに追加（収益がボロボロでも土地建物の価値までは割り込まない）。
// これにより「安く買って直して満室にした物件」も家賃相応の現実的な価格で評価される。
export function fairValue(property) {
  const assessed = property.assessedValue ?? 0;
  const fallback = assessed > 0 ? assessed : (property.timeValue ?? 0);   // v11: timeValueより評価額を優先
  if (!property.units?.length) return fallback;   // 家賃データがなければフォールバック
  const gpi = gpiAnnual(property);
  if (gpi <= 0) return fallback;
  const occ = property.units.filter(u => u.occupied).length / property.units.length;
  const incomeFactor = 0.6 + 0.4 * occ;       // 満室=満額・空室が多いほど収入評価を下げる
  const repairFactor = 0.85 + 0.15 * (property.repairState ?? 100) / 100;   // 躯体。ボロいほど最大15%減
  const careFactor = 0.92 + 0.08 * (property.careState ?? 100) / 100;      // v11: 手入れ。最大8%減
  const incomeApproach = gpi / marketYield(property) * incomeFactor * repairFactor * careFactor;
  return Math.round(Math.max(incomeApproach, assessed));   // v11: 評価額をフロアにする
}

export function appraise(property, appraisalLv, rng = Math.random) {
  // v3.9: 査定は収益還元の適正価格ベース。査定なので気持ち安め(×0.92)＋目利きで誤差幅が縮む。
  const base = Math.round(fairValue(property) * 0.92);
  const spread = Math.max(0.02, 0.10 - (appraisalLv - 1) * 0.01);
  const f = (1 - spread) + rng() * spread * 2;
  return Math.max(10000, Math.round(base * f / 10000) * 10000);
}

export function requestAppraisal(state, propertyId, rng = Math.random) {
  const s = structuredClone(state);
  s.actionPower -= 5;   // v3: 査定依頼は軽い手続き
  const p = s.properties.find(x => x.id === propertyId);
  const lv = skillLevel(s.skills?.appraisal?.exp ?? 0);
  const appraisal = appraise(p, lv, rng);
  p.lastAppraisal = { amount: appraisal, month: s.month };   // v3.6: 査定結果は物件に記録され、一覧・詳細に残る
  return { state: s, appraisal };
}

export function listForSale(state, propertyId, askingPrice, appraisal = null) {
  const s = structuredClone(state);
  s.listings = s.listings || [];
  // v8.2: 決済待ちの物件を再掲載させない（「行動力が戻らない」バグの根本原因）。
  // 買付を承諾すると掲載は消えるが、物件は決済月まで所有一覧に残る。その隙に売り出せてしまうと、
  // 翌月 settleSale が物件を消した直後に掲載ループが未定義を触り、advanceMonth が例外で止まる。
  if ((s.pendingSales || []).some(x => x.propertyId === propertyId)) {
    return { state: s, listed: false, reason: 'pendingSale' };
  }
  if ((s.listings || []).some(l => l.propertyId === propertyId)) {
    return { state: s, listed: false, reason: 'alreadyListed' };
  }
  if (!s.properties.some(p => p.id === propertyId)) {
    return { state: s, listed: false, reason: 'notOwned' };
  }
  s.listings.push({ propertyId, askingPrice, appraisal, listedMonths: 0, offer: null });
  return { state: s, listed: true };
}

// v8.2: 掲載の整合を取り直す。所有していない物件・決済待ちの物件の掲載は捨てる。
// 根本原因は listForSale 側で塞いだが、advanceMonth は「1件でも壊れたデータがあると
// 月送りごと止まる」構造なので、そこへ入る前に必ず通す保険をかけておく。
export function pruneListings(state) {
  const before = (state.listings || []).length;
  const listings = (state.listings || []).filter(l =>
    state.properties.some(p => p.id === l.propertyId)
    && !(state.pendingSales || []).some(x => x.propertyId === l.propertyId));
  return { listings, removed: before - listings.length };
}

export function updateListing(state, propertyId, newPrice) {
  const s = structuredClone(state);
  s.listings = s.listings || [];
  const l = s.listings.find(x => x.propertyId === propertyId);
  if (l) { l.askingPrice = newPrice; l.offer = null; }
  return { state: s };
}

export function delist(state, propertyId) {
  const s = structuredClone(state);
  s.listings = (s.listings || []).filter(x => x.propertyId !== propertyId);
  return { state: s };
}

// === Task 8: 市場の鮮度と営業検索 ===

export function bargainScore(p) {
  const g = GENRE[p.genreKey];
  return Math.max(0, Math.min(1, (p.grossYield - g.yieldMin) / (g.yieldMax - g.yieldMin)));
}

function pushNotification(s, kind, propertyId, label, message, snapshot = null, advice = null) {
  s.notifications = s.notifications || [];
  const id = s.nextNotifId || 1;
  s.nextNotifId = id + 1;
  // snapshot: 対象物件が消えた後（他決等）でも閲覧できるよう、その時点の物件データを保持
  // advice: v8.9〜。本文を短くする代わりに、詳細な打ち手の説明をここへ分離（通知一覧でプルダウン表示）
  s.notifications.unshift({ id, month: s.month, kind, propertyId, label, message, read: false, snapshot, advice });
}

export function tickMarket(state, rng = Math.random) {
  const s = structuredClone(state);
  const logs = [];
  s.favorites = s.favorites || [];
  s.market = s.market.filter(p => {
    const sc = bargainScore(p);
    const soldP = sc > 0.66 ? 0.30 : sc > 0.33 ? 0.15 : 0.05;
    if (rng() < soldP) {
      const nm = p.name || p.label;
      logs.push(`${nm} は他の買主で決まってしまった`);
      if (s.favorites.some(f => f.propertyId === p.id)) {
        pushNotification(s, 'sold_out', p.id, nm, `${nm} は他の買主で成約しました`, structuredClone(p));
        s.favorites = s.favorites.filter(f => f.propertyId !== p.id);
      }
      return false;
    }
    return true;
  });
  s.market.forEach(p => {
    if (rng() < 0.20) {
      const cut = 0.03 + rng() * 0.05;
      p.price = Math.max(10000, Math.round(p.price * (1 - cut) / 10000) * 10000);
      p.askingPrice = p.price;
      p.refusedOffer = false;   // 値下げ＝売主の姿勢が軟化。指値を断られた物件も再チャレンジ可に

      const nm = p.name || p.label;
      logs.push(`${nm} が値下げされた（${yen(p.price)}）`);
      if (s.favorites.some(f => f.propertyId === p.id)) {
        pushNotification(s, 'price_cut', p.id, nm, `${nm} が値下げされました（${yen(p.price)}）`);
      }
    }
    p.listedMonths += 1;
    if (p.listedMonths >= 6) p.staleFlag = true;
  });
  return { state: s, logs };
}

export function searchHitChance(nGenres, nAreas, nAges, appraisalLv) {
  let p = [0.55, 0.70, 0.85, 1.0][Math.min(nGenres, 4) - 1];
  if (nAges === 1) p -= 0.10;
  if (nAreas === 1) p -= 0.05;
  p += (appraisalLv - 1) * 0.05;
  return Math.round(Math.max(0.30, Math.min(1.0, p)) * 100) / 100;
}

// === v3: 営業は1押下=行動力1消費。累計が隠し閾値(6〜40)に達すると物件情報を入手 ===
export const SEARCH_PRESS_COST = 1;
// v3.9: 出物に出会う確率を旧設定の約30〜50%に（＝必要な調査回数を約2.5倍に引き上げ）
export const SEARCH_MIN = 15;
export const SEARCH_MAX = 100;

// 閾値抽選: threshold = 6 + 34×u^f。fは従来の発見率(0.30〜1.0)を流用し、
// 条件が広く目利きLvが高いほど f が大きい＝低い閾値（早い発見）が出やすい。
export function drawSearchThreshold({ genres, areas, ages }, appraisalLv, rng = Math.random) {
  const f = searchHitChance(genres.length, areas.length, ages.length, appraisalLv);
  return SEARCH_MIN + Math.round((SEARCH_MAX - SEARCH_MIN) * Math.pow(rng(), f));
}

// v3.11: 平凡物件は買い候補の約2倍の頻度で出す（＝閾値が約半分）
export const MUNDANE_SEARCH_DIVISOR = 2;

// 市場に1件追加してID採番・名前付けする内部ヘルパー
function pushToMarket(s, p) {
  s.nextPropertyId = s.nextPropertyId || 1;
  p.id = 'p' + s.nextPropertyId++;
  p.name = propertyName(p.genreKey, p.builtAge, p.id);
  s.market.unshift(p);
  return p;
}

export function doSalesPress(state, { genres, areas, ages }, rng = Math.random) {
  if (state.actionPower < SEARCH_PRESS_COST) return { state, found: null, mundane: [], pressed: false };
  const s = structuredClone(state);
  s.actionPower -= SEARCH_PRESS_COST;
  const ss = s.salesSearch = s.salesSearch || { spent: 0, threshold: null };
  const lv = skillLevel(s.skills.appraisal.exp);
  if (ss.threshold == null) ss.threshold = drawSearchThreshold({ genres, areas, ages }, lv, rng);
  // v3.11: 平凡ルートの閾値（買い候補の約半分＝2倍の頻度）
  if (ss.mundaneThreshold == null) ss.mundaneThreshold = Math.max(4, Math.round(drawSearchThreshold({ genres, areas, ages }, lv, rng) / MUNDANE_SEARCH_DIVISOR));
  ss.spent += SEARCH_PRESS_COST;
  ss.mundaneSpent = (ss.mundaneSpent || 0) + SEARCH_PRESS_COST;
  s.skills.appraisal.exp += 1;

  // v3.11: 平凡ルート（低利回り・1〜2件・売れ残り演出）。買い候補とは独立に発火する。
  const mundane = [];
  if (ss.mundaneSpent >= ss.mundaneThreshold) {
    const n = rng() < 0.35 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const gk = genres[Math.floor(rng() * genres.length)];
      const ak = areas[Math.floor(rng() * areas.length)];
      const mp = generateProperty(gk, ak, rng, ages, { lowYield: true });
      mp.staleFlag = true;                              // 長く売りに出ている
      mp.listedMonths = 6 + Math.floor(rng() * 8);
      mundane.push(pushToMarket(s, mp));
    }
    ss.mundaneSpent = 0; ss.mundaneThreshold = null;
    s.skills.appraisal.exp += 2;
  }

  // 買い候補ルート（現状維持）
  let found = null, log = null;
  if (ss.spent >= ss.threshold) {
    const gk = genres[Math.floor(rng() * genres.length)];
    const ak = areas[Math.floor(rng() * areas.length)];
    const p = generateProperty(gk, ak, rng, ages);
    found = pushToMarket(s, p);
    s.skills.appraisal.exp += 10;
    ss.spent = 0; ss.threshold = null;
    log = `${p.name || p.label}（${p.label}）を発見（表面${(p.grossYield * 100).toFixed(1)}%・${yen(p.price)}）`;
  }
  return { state: s, found, mundane, pressed: true, log };
}

// === v6: 最低自己資金 ===
// 「手元いくらでこの物件が買えるのか」は融資タブを開くまで分からなかった。
// 4行の審査を回し、承認される中でいちばん手出しが少なくて済む組み合わせを返す。
// 「現金が足りない（NO_CASH）」だけは判定から外す。いくら要るかを知るための計算なので、
// 今その金額を持っているかどうかは関係ない。
export function minRequiredCash(property, state, price = property.price) {
  let best = null;
  for (const bankKey of Object.keys(BANKS)) {
    // 頭金を1%刻みで増やしていき、その銀行が最初に承認する点＝その銀行での最小手出し
    for (let down = 0.05; down <= 0.95; down += 0.01) {
      const r = reviewLoan(bankKey, property, price, down, state);
      if (r.reasons.some(x => x.code !== 'NO_CASH')) continue;
      const cash = Math.round(price * down) + closingCostOf(property, price, Math.round(price * (1 - down)));
      if (!best || cash < best.cash) best = { cash, bankKey, label: BANKS[bankKey].label, downRatio: down, financed: true };
      break;
    }
  }
  // どの銀行も通らなければ現金で買うしかない
  const cashBuy = price + closingCostOf(property, price, 0);
  if (!best || cashBuy < best.cash) return { cash: cashBuy, bankKey: null, label: '現金購入', downRatio: 1, financed: false };
  return best;
}

// v8.9: 物件情報一覧では「最低自己資金」の金額そのものより、今の手元資金で
// 買えそうか（融資が使えるか）をひと目で見せたい。金額計算は minRequiredCash を再利用する。
export function purchaseSignal(property, state, price = property.price) {
  const r = minRequiredCash(property, state, price);
  if (state.cash < r.cash) return { level: 'red', icon: '🔴', label: '資金不足' };
  const remain = state.cash - r.cash;
  if (remain < 1_000_000) return { level: 'yellow', icon: '🟡', label: '融資打診可' };
  return { level: 'green', icon: '🟢', label: '購入・融資OK' };
}

// 現況（空室を反映した実際の年間家賃）を物件価格で割った利回り。満室想定のgrossYieldと対で見せる。
export function currentYieldOf(property) {
  return egiAnnual(property) / property.price;
