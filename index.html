// v6: 一度起きたイベントは、同じ物件では当分のあいだ繰り返さない。
// v6.3: クールダウンはイベントごとに決める。給湯器を替えれば次は8年後、
// 火災警報器は10年、配管更新は20年、セミナーの勧誘は半年。
// 「その工事をしたら現実には何年もつのか」をそのまま入れる。
export const EVENT_COOLDOWN_MONTHS = 36;   // 物件イベントの既定値
export const EVENT_COOLDOWN_GLOBAL = 12;   // 経営イベントの既定値

export function eventCooldownOf(eventId) {
  const e = EVENTS.find(x => x.id === eventId);
  if (!e) return EVENT_COOLDOWN_MONTHS;
  return e.cooldown ?? (e.match ? EVENT_COOLDOWN_MONTHS : EVENT_COOLDOWN_GLOBAL);
}

// v6.4: エアコン・給湯器・火災警報器は各部屋に1台ずつある設備なので、
// クールダウンも部屋ごとに持つ。3号室の給湯器を替えても、5号室のはまだ古いまま。
export function eventOnCooldown(state, eventId, propertyId = null, unitIndex = null) {
  const now = state.month ?? 0;
  const span = eventCooldownOf(eventId);
  return (state.eventHistory || []).some(h =>
    h.id === eventId && h.propertyId === propertyId
    && (h.unitIndex ?? null) === (unitIndex ?? null)
    && now - h.month < span);
}

function recordEventFired(s, eventId, propertyId, unitIndex = null) {
  s.eventHistory = s.eventHistory || [];
  s.eventHistory.push({ id: eventId, propertyId: propertyId ?? null, unitIndex: unitIndex ?? null, month: s.month });
  // 記録は「そのイベントのクールダウンを過ぎたら」捨てる。
  // 一律の期間で切ると、20年もつエレベーターの記録まで消えて再発してしまう。
  s.eventHistory = s.eventHistory.filter(h => s.month - h.month < eventCooldownOf(h.id));
}

// イベントの見出し。セミナーのようにお題が毎回変わるものは関数で持つ。
export function eventTitle(event) {
  return typeof event.title === 'function' ? event.title() : event.title;
}

// v6: 物件イベントは対象になりうる物件が1件以上あるときだけ候補になる。
// v6.4: 戻り値は { property, unitIndex } の組。部屋ごとの設備イベント（perUnit）は
// 空いている部屋も含めて全戸が対象になり、部屋単位でクールダウンを判定する。
export function eventTargets(event, state) {
  if (!event.match) return [];
  const out = [];
  for (const p of state.properties || []) {
    if (!event.match(p, state)) continue;
    if (event.perUnit) {
      (p.units || []).forEach((u, i) => {
        if (!eventOnCooldown(state, event.id, p.id, i)) out.push({ property: p, unitIndex: i });
      });
    } else if (!eventOnCooldown(state, event.id, p.id)) {
      out.push({ property: p, unitIndex: null });
    }
  }
  return out;
}

export function eligibleEvents(state) {
  return EVENTS.filter(e => (e.match
    ? eventTargets(e, state).length > 0
    : e.condition(state) && !eventOnCooldown(state, e.id)));
}

export function maxYearsForAge(age) {
  return Math.max(1, CONFIG.maxAge - age);
}

// v3: 種銭は労働で稼ぐ。行動力1消費で¥1,000〜10,000（100円単位）を獲得。
export function doWork(state, rng = Math.random) {
  if (state.actionPower < 1) return { state, earned: 0 };
  const s = structuredClone(state);
  s.actionPower -= 1;
  // v3.9: 金額幅(1,000〜10,000円)は維持しつつ低額を引きやすく偏らせ、平均を約2,000円（旧5,500円の約37%）に。
  const earned = (10 + Math.floor(Math.pow(rng(), 6) * 91)) * 100;
  s.cash += earned;
  return { state: s, earned };
}

export function createInitialState({ attr, goalType, goalAmount, goalYears, seedCash, age, difficulty }) {
  const emp = attr === 'employee';
  // v8: 難易度による下駄は「ウィザードで選んだ値」に対して掛ける。プリセットの縮小（goalScale）と
  // 期限の延長（yearsBonus）はウィザード側の提示値で済ませてあるので、ここでは掛けない。
  const diffKey = DIFFICULTY[difficulty] ? difficulty : 'normal';
  const d = DIFFICULTY[diffKey];
  const clampedAge = Math.max(18, Math.min(CONFIG.maxAge - 1, Math.round(age ?? 30)));
  const clampedSeed = Math.max(CONFIG.seedMin, Math.min(CONFIG.seedMax, Math.round(seedCash * d.seedMult)));
  const clampedYears = Math.max(1, Math.min(goalYears, maxYearsForAge(clampedAge)));
  return {
    // v8: startAge は age と一緒に動かない「開始時点の年齢」。バランスシートで
    // 「現在33歳（開始30歳）」と何年ぶん歳を取ったかを見せるために保持する。
    cash: clampedSeed, month: 0, attr, age: clampedAge, startAge: clampedAge,
    difficulty: diffKey,
    creditScore: (emp ? CONFIG.creditEmployee : CONFIG.creditSelf) + d.creditBonus,
    baseActionPower: emp ? 100 : 120, actionPower: emp ? 100 : 120,
    goal: { type: goalType, amount: goalAmount, years: clampedYears },
    skills: { appraisal: { exp: 0 }, negotiation: { exp: 0 }, selfmgmt: { exp: 0 } },
    properties: [], market: [], listings: [], pendingSales: [],
    bankRelations: { kouko: { loans: 0, paidOff: 0 }, chigin: { loans: 0, paidOff: 0 },
      shinkin: { loans: 0, paidOff: 0 }, nonbank: { loans: 0, paidOff: 0 } },
    log: ['ゲーム開始。まずは営業で物件を探そう。'],
    stats: { buys: 0, sales: 0, profitSales: 0, junkFlips: 0, hadLoan: false, junkRepairs: 0, maxMonthlyCF: 0 },
    badges: [],
    favorites: [], notifications: [], nextNotifId: 1,
    isIncorporated: false,
    salesSearch: { spent: 0, threshold: null },
    nextPropertyId: 1,
    learnedTerms: [],   // v8: 用語クイズで正解した用語キー（用語集の習得マーク用）
    buffs: [],          // v8: 一時的な有利効果（現状は「耳より情報」＝次の指値+10pt のみ）
    rewindLeft: d.rewind,   // v8: 初心者モードのお守り。先月へ戻せる残り回数
  };
}

// v3.5: 旧セーブのID衝突修復。重複IDを見つけたら後から登場した方へ新IDを振り直す
// （名前もIDから再生成される。お気に入り・掲載などの参照は先に登場した方を指し続ける）。
export function dedupePropertyIds(state) {
  const s = structuredClone(state);
  s.nextPropertyId = s.nextPropertyId || 1;
  const seen = new Set();
  let fixed = 0;
  const fix = (p) => {
    if (seen.has(String(p.id))) {
      p.id = 'p' + s.nextPropertyId++;
      p.name = propertyName(p.genreKey, p.builtAge, p.id);
      fixed += 1;
    }
    seen.add(String(p.id));
  };
  (s.properties || []).forEach(fix);
  (s.market || []).forEach(fix);
  return { state: s, fixed };
}

// v3.5: 個人所有物件を法人へ売却（移転）。時価で取引し、個人側は譲渡税を精算、
// 法人側は取得コスト（時価の5%）を支払う。移転後は減価償却が中古簡便法で再スタートする。
// 抵当権が残る物件（ローン未完済）は移転できない。
export function transferToCorp(state, propertyId) {
  const p0 = state.properties.find(x => x.id === propertyId);
  if (!state.isIncorporated || !p0 || p0.owner === 'corp') return { state, done: false, reason: 'invalid' };
  if (p0.loan || (p0.reformLoans || []).length > 0) return { state, done: false, reason: 'loan' };
  const s = structuredClone(state);
  const p = s.properties.find(x => x.id === propertyId);
  const price = p.timeValue;
  const book = bookValueV2(p);
  const gain = Math.max(0, price - book);
  const heldYears = (s.month - (p.boughtMonth ?? s.month)) / 12;
  const capTax = Math.round(gain * (heldYears <= 5 ? CONFIG.capGainTaxShort : CONFIG.capGainTaxLong));
  const acqCost = Math.round(price * CONFIG.corpTransferCostRate);
  if (s.cash < capTax + acqCost) return { state, done: false, reason: 'cash' };
  s.cash -= capTax + acqCost;
  p.owner = 'corp';
  p.boughtPrice = price;
  p.boughtMonth = s.month;
  p.deprRemaining = deprMonthsFor(p.structure, p.builtAge);   // 償却再スタート（中古簡便法）
  return { state: s, done: true, price, capTax, acqCost };
}

// 訳あり物件の修繕完了時にカウントアップするロジック
export function recordJunkRepair(state, property) {
  if (property.junkFlags && property.junkFlags.length > 0) {
    state.stats.junkRepairs = (state.stats.junkRepairs || 0) + 1;
  }
}
export const FAVORITE_LIMIT = 10;

export function addFavorite(state, propertyId) {
  const s = structuredClone(state);
  s.favorites = s.favorites || [];
  const p = s.market.find(x => x.id === propertyId);
  if (!p) return { state: s, added: false, reason: 'not_found' };
  if (s.favorites.some(f => f.propertyId === propertyId)) return { state: s, added: false, reason: 'already' };
  if (s.favorites.length >= FAVORITE_LIMIT) return { state: s, added: false, reason: 'limit' };
  s.favorites.push({ propertyId, addedMonth: s.month, registeredPrice: p.price });
  return { state: s, added: true };
}

export function removeFavorite(state, propertyId) {
  const s = structuredClone(state);
  s.favorites = (s.favorites || []).filter(f => f.propertyId !== propertyId);
  return { state: s };
}

export function markNotificationsRead(state) {
  const s = structuredClone(state);
  s.notifications = (s.notifications || []).map(n => ({ ...n, read: true }));
  return { state: s };
}

// 通知は一覧を開いただけでは消えず、個別にチェックするまで未読のまま残す。
export function markNotificationRead(state, notifId) {
  const s = structuredClone(state);
  s.notifications = (s.notifications || []).map(n => n.id === notifId ? { ...n, read: true } : n);
  return { state: s };
}

// === Phase 2: 実績バッジ（10種）===
export const BADGES = {
  first_buy: { icon: '🏠', label: '初めての物件購入' },
  first_loan: { icon: '🏦', label: '融資デビュー' },
  five_properties: { icon: '🏘️', label: '5物件オーナー' },
  first_full: { icon: '💯', label: '満室達成' },
  first_sale: { icon: '🤝', label: '初めての売却' },
  first_profit: { icon: '💰', label: '売却益ゲット' },
  junk_flip: { icon: '🔨', label: '訳あり物件を再生して売却' },
  skill_master: { icon: '⭐', label: 'スキルLv5到達' },
  debt_free: { icon: '🎉', label: '借入完済' },
  goal_clear: { icon: '🏆', label: '目標達成' },
};

export function evaluateBadges(state) {
  const stats = state.stats || {};
  const ids = [];
  if ((stats.buys || 0) >= 1) ids.push('first_buy');
  if (stats.hadLoan) ids.push('first_loan');
  if (state.properties.length >= 5) ids.push('five_properties');
  if (state.properties.some(p => p.units.every(u => u.occupied))) ids.push('first_full');
  if ((stats.sales || 0) >= 1) ids.push('first_sale');
  if ((stats.profitSales || 0) >= 1) ids.push('first_profit');
  if ((stats.junkFlips || 0) >= 1) ids.push('junk_flip');
  if (['appraisal', 'negotiation', 'selfmgmt'].some(k => skillLevel(state.skills[k].exp) >= 5)) ids.push('skill_master');
  if (state.properties.length > 0 && totalDebt(state) === 0) ids.push('debt_free');
  if (isClearedV2(state)) ids.push('goal_clear');
  return ids;
}

// v3.7: リザルト称号。達成スピード（期限に対する消化率）と純資産の規模で決まる。
export function resultTitle(state) {
  if (isBankrupt(state)) return '夢半ばの破産者';
  if (!isClearedV2(state)) return '時間切れの挑戦者';
  const speed = state.month / Math.max(1, state.goal.years * 12);
  const nw = netWorth(state);
  const scale = nw >= 300_000_000 ? 'メガ大家' : nw >= 100_000_000 ? '大家' : '街の大家';
  if (speed <= 0.35) return `電光石火の${scale}`;
  if (speed <= 0.6) return `敏腕${scale}`;
  if (speed <= 0.85) return `堅実な${scale}`;
  return `執念の${scale}`;
}

// v6: おまかせ契約中の物件について、その月の自動発注を処理する。
// 対象は「手入れの維持」と「原状回復」の2つだけ。大規模修繕・価値UPは金額が大きいのでオーナー判断のまま。
// 現金が足りない月は黙って見送らず、必ず通知を出す（気づかないまま空室が続くのを防ぐ）。
function autoManageMonth(s, p, logs) {
  const nm = p.name || p.label;
  let short = false;

  // ① 退去した部屋の原状回復。放置すると募集できないので最優先で発注する。
  for (const u of p.units) {
    if (!u.needsRestore || u.restoreJob) continue;
    const cost = autoManageCost(restoreCost(p, u));
    if (s.cash < cost) { short = true; continue; }
    s.cash -= cost;
    u.restoreJob = { monthsTotal: 1, monthsLeft: 1, auto: true };
    u.restoreProgress = 0;
    logs.push(`${nm} の原状回復を管理会社が手配した（${yen(cost)}）`);
  }

  // ② 手入れの維持。基準を下回ったら日常メンテを発注し、完了時に100%へ戻る。
  if (!p.repairJob && (p.careState ?? 100) < AUTO_MANAGE_CARE_FLOOR) {
    const cost = autoManageCost(repairCost(p, 'maint'));
    if (s.cash >= cost) {
      s.cash -= cost;
      const months = repairJobMonths(p, 'maint');
      p.repairJob = { kind: 'maint', monthsTotal: months, monthsLeft: months, startState: p.careState, auto: true };
      logs.push(`${nm} の日常メンテを管理会社が手配した（${yen(cost)}）`);
    } else {
      short = true;
    }
  }

  if (short) {
    pushNotification(s, 'auto_manage_nocash', p.id, nm,
      `${nm} で残高不足のため、おまかせの自動修繕を実施できませんでした。現金を用意するか契約を見直してください`);
  }
}

// v8: 危険域のペナルティを1物件ぶん適用する。advanceMonth から毎月呼ぶ。
// 「痛いが理不尽ではない」ことを重視し、どの段階でも通知とログで理由が読めるようにしてある。
function applyDangerBandPenalties(s, p, logs, rng) {
  const nm = p.name || p.label;
  const sb = structBandOf(p);
  const cb = careBandOf(p);

  // 🏚 危険（10%未満）: 傷んだ建物から住人が離れていく
  if (sb === 'danger' && rng() < STRUCT_DANGER_VACATE_CHANCE) {
    const occupied = p.units.filter(u => u.occupied);
    if (occupied.length) {
      const u = occupied[Math.floor(rng() * occupied.length)];
      u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; u.needsRestore = true;
      logs.push(`${nm} の劣化に耐えかねて1戸が退去（躯体${Math.round(p.repairState)}%）`);
    }
  }

  // 🏚 使用不能（0%）: 全戸退去のうえ募集停止。大規模修繕の完了でしか解除できない。
  if (sb === 'dead' && !p.condemned) {
    p.condemned = true;
    const lost = p.units.filter(u => u.occupied).length;
    p.units.forEach(u => {
      if (u.occupied) { u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; }
    });
    pushNotification(s, 'condemned', p.id, nm,
      `${nm} が使用不能になりました（躯体0%）。全${lost}戸が退去し、大規模修繕が完了するまで募集できません`);
    logs.push(`🛑 ${nm} が使用不能に。全${lost}戸が退去し、募集を停止した`);
  }
  if (sb !== 'dead' && p.condemned) p.condemned = false;   // 修繕で躯体が戻れば自動解除

  // 🧹 危険（20%未満）: 荒れた共用部にクレームが来る
  if (cb === 'danger' && rng() < CARE_DANGER_CLAIM_CHANCE) {
    s.actionPower -= CARE_DANGER_CLAIM_AP;
    const claim = CARE_CLAIMS[Math.floor(rng() * CARE_CLAIMS.length)];
    logs.push(`${nm} で入居者クレーム「${claim}」対応に追われた（行動力-${CARE_DANGER_CLAIM_AP}）`);
  }

  // 🧹 管理崩壊（0%）: 毎月確実に1戸ずつ抜けていき、評判も落ちる
  if (cb === 'dead') {
    const occupied = p.units.filter(u => u.occupied);
    if (occupied.length) {
      const u = occupied[Math.floor(rng() * occupied.length)];
      u.occupied = false; u.vacantMonths = 0; u.tenantMonths = 0; u.needsRestore = true;
      logs.push(`${nm} は管理崩壊状態。愛想を尽かした1戸が退去した`);
    }
    s.creditScore = Math.max(0, (s.creditScore ?? 0) - 1);
  }

  // 帯が悪化した月だけ通知する。同じ帯に留まっているあいだは黙り、回復すれば再アームされる。
  const worst = worstBandOf(p);
  const before = p.notifiedBand || 'ok';
  if (BAND_RANK[worst] > BAND_RANK[before]) {
    if (worst === 'warn') {
      pushNotification(s, 'band_warn', p.id, nm,
        `${nm} が注意水準です（躯体${Math.round(p.repairState)}% ／ 手入れ${Math.round(p.careState)}%）。早めに直すほど安く済みます`);
    } else if (worst === 'danger') {
      pushNotification(s, 'band_danger', p.id, nm,
        `${nm} が危険水準です（躯体${Math.round(p.repairState)}% ／ 手入れ${Math.round(p.careState)}%）。退去が始まり、銀行の評価も下がります`);
    }
  }
  if (BAND_RANK[worst] !== BAND_RANK[before]) p.notifiedBand = worst;
}

// クレームの中身。同じ文面が続くと「またこれか」になるので数を持たせる。
const CARE_CLAIMS = [
  'ゴミ置き場が荒れている', '草が伸び放題で虫が出る', '共用廊下の電球が切れたまま',
  '自転車置き場が溢れている', '掲示板が破れて情報が読めない', '階段の手すりがぐらつく',
];

export function advanceMonth(state, rng = Math.random) {
  let s = structuredClone(state);
  const logs = [];
  const diff = difficultyOf(s);   // v8: 劣化・イベント頻度・客付けに難易度の係数が乗る
  s.month += 1;
  for (const sale of [...(s.pendingSales || [])].filter(x => x.settleMonth <= s.month)) {
    const r = settleSale(s, sale); s = r.state; logs.push(...r.logs);
  }
  for (const p of s.properties) {
    // v4: 業者に出した原状回復は工期を経て完了する。先に完了させてから客付け判定に進む。
    for (const u of p.units) {
      if (u.restoreJob) {
        u.restoreJob.monthsLeft -= 1;
        if (u.restoreJob.monthsLeft <= 0) {
          u.restoreJob = null; u.needsRestore = false; u.restoreProgress = 0;
          logs.push(`${p.name || p.label} の原状回復が完了。募集を再開できる`);
        }
      }
    }
    // v6: 経年劣化。🏚躯体は築年帯×構造で、🧹手入れは一律で減る。
    // 小数のまま保持する（整数に丸めながら引くと、築浅RCの -0.08/月 が永久に0のままになる）。
    // v8: 初心者モードは劣化が0.7倍。数字を甘くするより「考える時間を与える」ほうが効くため。
    p.repairState = Math.max(0, (p.repairState ?? 100) - structuralDecay(p) * diff.decayMult);
    p.careState = Math.max(0, (p.careState ?? 100) - CARE_DECAY_PER_MONTH * diff.decayMult);
    monthlyVacancyRoll(p, rng);
    applyDangerBandPenalties(s, p, logs, rng);   // v8: 危険域のペナルティは客付け判定より先に効かせる
    naturalFillRoll(p, rng, diff.fillBonus);
    const pl = propertyMonthlyPL(p);
    s.cash += pl.cf;
    if (p.loan) {
      p.loan.monthsPaid += 1;
      if (p.loan.monthsPaid >= p.loan.years * 12) p.loan = null;   // 完済したら返済を止める
    }
    // v4: リフォームローンは複数本。各本を1ヶ月進め、完済した本だけを配列から外す。
    if (p.reformLoans && p.reformLoans.length) {
      p.reformLoans.forEach(l => { l.monthsPaid += 1; });
      p.reformLoans = p.reformLoans.filter(l => l.monthsPaid < l.years * 12);
    }
    if (p.deprRemaining > 0) p.deprRemaining -= 1;
    const drift = p.structure === '木造' ? -0.0015 : p.structure === 'S' ? -0.001 : -0.0005;
    p.timeValue = Math.max(10000, Math.round(p.timeValue * (1 + drift)));
    p.history.push({ month: s.month, ...pl });
    if (p.history.length > 24) p.history.shift();
    p.cum.cf += pl.cf; p.cum.months += 1;
    if (rng() < troubleChanceFor(p) * diff.eventMult) {   // v6: 築年帯で傾斜（旧: 全物件3%固定）
      const base = CONFIG.troubleMin + rng() * (CONFIG.troubleMax - CONFIG.troubleMin);
      const c = Math.round(troubleRepairCost(base, skillLevel(s.skills.selfmgmt.exp)));
      s.cash -= c;
      logs.push(`${p.label} で突発修繕（-${yen(c)}）`);
    }
    // v3: 業者修繕の進行。毎月少しずつ回復し、最終月に100到達・時価+8%・完了通知
    if (p.repairJob) {
      p.repairJob.monthsLeft -= 1;
      const j = p.repairJob;
      const kind = j.kind || 'large';
      // v6: 工事種別ごとに動かすゲージが違う（日常メンテ=🧹手入れ／大規模修繕=🏚躯体）。どちらも到達点は100%。
      const goal = REPAIR_KINDS[kind].cap;
      if (j.monthsLeft <= 0) {
        const before = repairGaugeValue(p, kind);
        setRepairGauge(p, kind, goal);
        p.repairJob = null;
        const nm = p.name || p.label;
        if (kind === 'large') {
          p.timeValue = Math.round(p.timeValue * 1.08);
          s.skills.selfmgmt.exp += 15;
          if (before < 100) recordJunkRepair(s, p);
          pushNotification(s, 'repair_done', p.id, nm, `${nm} の大規模修繕が完了しました（躯体100%・資産価値上昇）`);
          logs.push(`${nm} の大規模修繕が完了した（躯体100%）`);
        } else {
          // おまかせ契約による自動工事は「自分で手を動かしていない」ので自主管理EXPが入らない
          if (!j.auto) s.skills.selfmgmt.exp += 8;
          const kindLabel = REPAIR_KINDS[kind].label;
          pushNotification(s, 'repair_done', p.id, nm,
            `${nm} の${kindLabel}が完了しました（手入れ100%）${j.auto ? '／管理会社おまかせ' : ''}`);
          logs.push(`${nm} の${kindLabel}が完了した（手入れ100%）`);
        }
      } else {
        const k = j.monthsTotal - j.monthsLeft;
        setRepairGauge(p, kind, Math.min(goal - 1, j.startState + (goal - j.startState) * k / j.monthsTotal));
      }
    }
    // v6: 管理会社おまかせ契約。手入れの維持と原状回復の発注をここで自動化する。
    if (p.autoManage) autoManageMonth(s, p, logs);
    // v3.11: バリューアップ工事の進行。完了月に各室の家賃と時価が上がる。
    if (p.valueUpJob) {
      p.valueUpJob.monthsLeft -= 1;
      if (p.valueUpJob.monthsLeft <= 0) {
        applyValueUp(p, p.valueUpJob.rentMult);   // DIY完了時と同じ処理を使う
        p.valueUpJob = null;
        const nm = p.name || p.label;
        pushNotification(s, 'valueup_done', p.id, nm, `${nm} のバリューアップが完了！家賃がアップしました`);
        logs.push(`${nm} のバリューアップ完了（家賃UP・資産価値上昇）`);
      }
    }
    // v8: 「躯体20%割れ」の単発通知は、3段階の帯通知（applyDangerBandPenalties）に統合した。
  }
  if (s.month % 12 === 0) { s.properties.forEach(p => { p.builtAge += 1; }); s.age = (s.age ?? 30) + 1; }
  // v3.7: 生涯実績用に最大月CFを記録（リザルト画面で表示）
  s.stats = s.stats || {};
  const mcfNow = monthlyCF(s);
  if (mcfNow > (s.stats.maxMonthlyCF ?? 0)) s.stats.maxMonthlyCF = mcfNow;
  // v3: 月次給与の自動加算は廃止（種銭は doWork で稼ぐ）
  // v8.2: 決済で物件が消えた直後なので、掲載を掃除してから回す。
  // ここで未定義の物件を触ると advanceMonth ごと例外で止まり、月が進まず行動力も戻らなくなる。
  s.listings = pruneListings(s).listings;
  for (const l of s.listings) {
    l.listedMonths += 1;
    if (!l.offer) {
      const p = s.properties.find(x => x.id === l.propertyId);
      if (!p) continue;   // 念のための二重防御（pruneListings で除かれているはず）
      const o = rollBuyOffer(l, p, rng);
      if (o) { l.offer = { ...o, month: s.month }; logs.push(`${p.label} に買付！（${o.type === 'full' ? '満額' : '指値'} ${yen(o.price)}）`); }
    }
  }
  { const r = tickMarket(s, rng); s = r.state; logs.push(...r.logs); }
  let pendingEvent = null;
  if (rng() < CONFIG.eventChance * diff.eventMult) {
    const es = eligibleEvents(s);
    if (es.length) {
      const ev = es[Math.floor(rng() * es.length)];
      // v6: 対象はジャンルではなく match（築年数・構造・戸数・手入れ）で絞り込んだ物件から選ぶ
      const cands = eventTargets(ev, s);
      const pick = cands.length ? cands[Math.floor(rng() * cands.length)] : null;
      const targetId = pick ? pick.property.id : null;
      const unitIndex = pick ? pick.unitIndex : null;
      // 見出しは発生した時点で確定させる（セミナーのお題は毎回変わるので、
      // 描画のたびに引き直すと画面を開き直すだけで題目が変わってしまう）。
      pendingEvent = { id: ev.id, targetId, unitIndex, title: eventTitle(ev) };
      recordEventFired(s, ev.id, targetId, unitIndex);   // 同じ部屋・同じ物件で当分は繰り返さない
    }
  }
  s.actionPower = s.baseActionPower;
  return { state: s, logs, pendingEvent };
}

export function serialize(state) { return JSON.stringify(state); }
export function deserialize(str) { return JSON.parse(str); }

// v4: 旧セーブを新フィールドへ移行する。ui側のload()から呼ぶ（純関数なのでテストできる）。
export function migrateSave(state) {
  const s = structuredClone(state);
  // v8: 旧セーブには無い項目を補う。開始年齢は現在年齢から経過年数を引いて復元する。
  if (s.startAge === undefined) s.startAge = (s.age ?? 30) - Math.floor((s.month ?? 0) / 12);
  if (s.difficulty === undefined) s.difficulty = 'normal';
  if (s.rewindLeft === undefined) s.rewindLeft = difficultyOf(s).rewind;
  if (!Array.isArray(s.learnedTerms)) s.learnedTerms = [];
  if (!Array.isArray(s.buffs)) s.buffs = [];
  // v8.2: すでに壊れているセーブを読み込み時に直す。
  // このバグに当たった人は「翌月が押せない」状態でセーブが残っているので、
  // 読み込むだけで復帰できるようにしておく（作り直しを強いない）。
  s.properties = s.properties || [];
  s.pendingSales = s.pendingSales || [];
  s.listings = pruneListings(s).listings;
  (s.properties || []).forEach(p => {
    // リフォームローンの単数→配列
    if (!Array.isArray(p.reformLoans)) p.reformLoans = p.reformLoan ? [p.reformLoan] : [];
    delete p.reformLoan;
    // v6: 修繕度の2ゲージ化。旧セーブは1本しか持たないので、手入れは躯体と同じ値から始める。
    if (p.careState === undefined) p.careState = p.repairState;
    if (p.autoManage === undefined) p.autoManage = false;
    // 原状回復（部屋ごと）。既存の空室は「原状回復済み」扱いにし、いきなり客付け不可にしない。
    (p.units || []).forEach(u => {
      if (u.ad === undefined) u.ad = null;   // v8.4: 広告料（決まるまで効く）
      if (u.needsRestore === undefined) u.needsRestore = false;
      if (u.tenantMonths === undefined) u.tenantMonths = u.occupied ? 12 : 0;
      if (u.restoreJob === undefined) u.restoreJob = null;
      if (u.restoreProgress === undefined) u.restoreProgress = 0;
    });
  });
  return s;
}

// === Phase 2: 物件外観（手描き風SVG用のパーツ記述。実際のSVGマークアップはui.mjs側で組み立てる）===
export const SHAPE_BY_GENRE = {
  kodate: 'kodate', w_kodate: 'kodate',
  apart: 'apart', w_apart: 'apart',
  tekkotsu: 'tekkotsu', w_tekkotsu: 'tekkotsu',
  kubun: 'kubun', w_kubun: 'kubun',
  rc: 'rc', w_rc: 'rc',
};

export function svgBuildingParts(property) {
  const shape = SHAPE_BY_GENRE[property.genreKey] ?? 'kodate';
  const wake = !!(property.junkFlags && property.junkFlags.length > 0);
  const ageFactor = Math.min(property.builtAge, 60) / 300;
  // v6: 見た目も2ゲージで分ける。ひび割れは🏚躯体の傷み、汚れと雑草は🧹手入れの不足として描く。
  const care = property.careState ?? property.repairState ?? 100;
  const dirtLevel = Math.max(0, Math.min(1, (100 - care) / 100 + (wake ? 0.25 : 0) + ageFactor));
  const hasCracks = property.repairState < 50 || wake;
  const hasWeeds = care < 30;
  const tilt = wake && property.junkFlags.includes('傾き');
  return { shape, dirtLevel, hasCracks, hasWeeds, tilt, wake };
}

export const STRUCTURE_LIFE = { '木造': 22, 'S': 34, 'RC': 47 };
export const JUNK_FLAGS = ['残置物', '再建築不可', '傾き', '事故歴', '管理崩壊', '立退き交渉中'];

export function usefulLifeRemaining(structure, builtAge) {
  const legal = STRUCTURE_LIFE[structure];
  if (builtAge >= legal) return Math.max(4, Math.floor(legal * 0.2));
  return Math.floor((legal - builtAge) + builtAge * 0.2);
}
export function deprMonthsFor(structure, builtAge) {
  return usefulLifeRemaining(structure, builtAge) * 12;
}

// ===== Task 4: 銀行審査エンジン =====
export function bankRate(bankKey, state) {
  const b = BANKS[bankKey];
  const rel = (state.bankRelations && state.bankRelations[bankKey]) || { paidOff: 0 };
  const negLv = skillLevel(state.skills.negotiation.exp);
  const cut = (effectiveCredit(state) / 100) * 0.005 + negotiationRateCut(negLv) + Math.min(rel.paidOff * 0.001, 0.005);
  // v8: 難易度による金利の下駄。交渉・信用による引き下げ幅の上限（-0.7%）とは別枠で乗せる。
  return Math.max(b.baseRate - cut, b.baseRate - 0.007) + difficultyOf(state).rateAdj;
}

export function reviewLoan(bankKey, property, price, downRatio, state) {
  const b = BANKS[bankKey];
  const reasons = [];
  const loanAmount = Math.round(price * (1 - downRatio));
  const rel = (state.bankRelations && state.bankRelations[bankKey]) || { paidOff: 0 };
  const ltvMax = bankKey === 'chigin' && rel.paidOff >= 3 ? 0.90 : b.ltvMax;

  // v8: 危険域の物件を抱えていると、その分だけ実効的な信用度が下がった状態で審査される。
  const credit = effectiveCredit(state);
  const penalty = creditPenalty(state);
  if (credit < b.minCredit) reasons.push({ code: 'CREDIT_LOW',
    msg: `属性・信用度が基準未満（${credit} < ${b.minCredit}）${penalty ? `※保有物件の管理状態で-${penalty}` : ''}` });
  if (property.junkFlags.length > 0 && !b.wakeOk) reasons.push({ code: 'WAKEARI_NG', msg: '瑕疵・事故物件のため取扱不可' });
  if (b.areaLimit && property.areaKey !== b.areaLimit) reasons.push({ code: 'AREA_NG', msg: `${b.label}の営業エリア外（地方・郊外のみ）` });
  if (price < b.minPrice || loanAmount > b.maxLoan) reasons.push({ code: 'AMOUNT_NG', msg: `融資額が取扱範囲外（${b.label}）` });

  const remainYears = usefulLifeRemaining(property.structure, property.builtAge);
  let years = b.termMax;
  if (b.lifeStrict === true) {
    if (property.builtAge >= STRUCTURE_LIFE[property.structure]) reasons.push({ code: 'LIFE_OVER', msg: `法定耐用年数切れ（${property.structure}築${property.builtAge}年）は取扱不可` });
    years = Math.min(b.termMax, remainYears);
  } else if (b.lifeStrict === 'soft') {
    years = Math.min(b.termMax, remainYears + 5);
  }
  const preAgeYears = years;   // 年齢キャップを適用する前の年数（築年数由来の制約はここに反映済み）
  const age = state.age ?? 0;
  const maxTermByAge = Math.max(0, CONFIG.maxAge - age);
  years = Math.min(years, maxTermByAge);
  // 年齢キャップが「実際に」否認の原因になった場合だけAGE_OVERを出す。
  // 築年数側の制約(LIFE_OVER・soft cap等)で既にtermMin未満だったケースまで年齢のせいにしない。
  if (years < b.termMin && preAgeYears >= b.termMin) {
    reasons.push({ code: 'AGE_OVER', msg: `完済時年齢が上限(${CONFIG.maxAge}歳)を超えるため取扱不可（現在${age}歳・借入可能最長${maxTermByAge}年）` });
  }
  years = Math.max(b.termMin, years);

  if ((1 - downRatio) > ltvMax) reasons.push({ code: 'OVER_LTV', msg: `自己資金${Math.round((1 - ltvMax) * 100)}%以上が必要（LTV上限${Math.round(ltvMax * 100)}%）` });

  const rate = bankRate(bankKey, state);
  const monthlyPay = monthlyPayment(loanAmount, rate, years);
  const d = dscr(noiAnnualV2(property), monthlyPay * 12);
  if (d < CONFIG.minDscr) reasons.push({ code: 'DSCR_LOW', msg: `収支が返済に対して弱い（DSCR ${d.toFixed(2)} < ${CONFIG.minDscr}）` });

  const requiredCash = Math.round(price * downRatio + price * CONFIG.closingCostRate);
  if (state.cash < requiredCash) reasons.push({ code: 'NO_CASH', msg: `自己資金が足りない（必要 ${yen(requiredCash)} / 手元 ${yen(state.cash)}）` });

  const approved = reasons.length === 0;
  return { bankKey, label: b.label, approved, reasons,
    terms: approved ? { rate, years, ltv: 1 - downRatio, loanAmount, monthlyPay: Math.round(monthlyPay), requiredCash } : undefined };
}

export function reviewAllBanks(property, price, downRatio, state) {
  return ['kouko', 'chigin', 'shinkin', 'nonbank'].map(k => reviewLoan(k, property, price, downRatio, state));
}

// === v2: 売却フロー（査定・掲載・値下げ・取下げ） ===

// v3.9: 市場利回り。物件の「通常版ジャンル」の標準利回りを基準に、築年・エリア・訳ありで調整。
// 高利回り=市場が高い利回りを要求＝安く評価。低利回り=人気で高く評価。
export function marketYield(property) {
  const normalKey = property.genreKey.startsWith('w_') ? property.genreKey.slice(2) : property.genreKey;
  const g = GENRE[normalKey] || GENRE.kodate;
  const a = AREA_ADJ[property.areaKey] || AREA_ADJ.local;
  let y = (g.yieldMin + g.yieldMax) / 2;         // その物件タイプの標準的な市場利回り
  y += Math.max(0, property.builtAge - 15) * 0.0015;   // 築15年超は古いほど高利回り（安評価）
  y += a.yieldAdd;                                // 都心は低利回り(高評価)・地方は高利回り(安評価)
  if (property.junkFlags?.length) y += 0.06 + property.junkFlags.length * 0.02;   // 訳あり未解消は高利回り(安評価)
  return Math.max(0.04, Math.min(0.5, y));
}

// v3.9: 収益還元法による適正価格。満室想定家賃を市場利回りで割り戻し、入居状況・修繕度で補正する。
// これにより「安く買って直して満室にした物件」も家賃相応の現実的な価格で評価される。
export function fairValue(property) {
  if (!property.units?.length) return property.timeValue ?? 0;   // 家賃データがなければ従来の時価にフォールバック
  const gpi = gpiAnnual(property);
  if (gpi <= 0) return property.timeValue ?? 0;
  const occ = property.units?.length ? property.units.filter(u => u.occupied).length / property.units.length : 1;
  const incomeFactor = 0.6 + 0.4 * occ;       // 満室=満額・空室が多いほど収入評価を下げる
  const repairFactor = 0.85 + 0.15 * (property.repairState ?? 100) / 100;   // ボロいほど最大15%減
  return Math.round(gpi / marketYield(property) * incomeFactor * repairFactor);
}

export function appraise(property, appraisalLv, rng = Math.random) {
  // v3.9: 査定は収益還元の適正価格ベース。査定なので気持ち安め(×0.92)＋目利きで誤差幅が縮む。
  const base = Math.round(fairValue(property) * 0.92);
  const spread = Math.max(0.02, 0.10 - (appraisalLv - 1) * 0.01);
  const f = (1 - spread) + rng() * spread * 2;
  return Math.max(10000, Math.round(base * f / 10000) * 10000);
}

export function requestAppraisal(state, propertyId, rng = Math.random) {
  const s = structuredClone(state);
  s.actionPower -= 5;   // v3: 査定依頼は軽い手続き
  const p = s.properties.find(x => x.id === propertyId);
  const lv = skillLevel(s.skills?.appraisal?.exp ?? 0);
  const appraisal = appraise(p, lv, rng);
  p.lastAppraisal = { amount: appraisal, month: s.month };   // v3.6: 査定結果は物件に記録され、一覧・詳細に残る
  return { state: s, appraisal };
}

export function listForSale(state, propertyId, askingPrice, appraisal = null) {
  const s = structuredClone(state);
  s.listings = s.listings || [];
  // v8.2: 決済待ちの物件を再掲載させない（「行動力が戻らない」バグの根本原因）。
  // 買付を承諾すると掲載は消えるが、物件は決済月まで所有一覧に残る。その隙に売り出せてしまうと、
  // 翌月 settleSale が物件を消した直後に掲載ループが未定義を触り、advanceMonth が例外で止まる。
  if ((s.pendingSales || []).some(x => x.propertyId === propertyId)) {
    return { state: s, listed: false, reason: 'pendingSale' };
  }
  if ((s.listings || []).some(l => l.propertyId === propertyId)) {
    return { state: s, listed: false, reason: 'alreadyListed' };
  }
  if (!s.properties.some(p => p.id === propertyId)) {
    return { state: s, listed: false, reason: 'notOwned' };
  }
  s.listings.push({ propertyId, askingPrice, appraisal, listedMonths: 0, offer: null });
  return { state: s, listed: true };
}

// v8.2: 掲載の整合を取り直す。所有していない物件・決済待ちの物件の掲載は捨てる。
// 根本原因は listForSale 側で塞いだが、advanceMonth は「1件でも壊れたデータがあると
// 月送りごと止まる」構造なので、そこへ入る前に必ず通す保険をかけておく。
export function pruneListings(state) {
  const before = (state.listings || []).length;
  const listings = (state.listings || []).filter(l =>
    state.properties.some(p => p.id === l.propertyId)
    && !(state.pendingSales || []).some(x => x.propertyId === l.propertyId));
  return { listings, removed: before - listings.length };
}

export function updateListing(state, propertyId, newPrice) {
  const s = structuredClone(state);
  s.listings = s.listings || [];
  const l = s.listings.find(x => x.propertyId === propertyId);
  if (l) { l.askingPrice = newPrice; l.offer = null; }
  return { state: s };
}

export function delist(state, propertyId) {
  const s = structuredClone(state);
  s.listings = (s.listings || []).filter(x => x.propertyId !== propertyId);
  return { state: s };
}

// === Task 8: 市場の鮮度と営業検索 ===

export function bargainScore(p) {
  const g = GENRE[p.genreKey];
  return Math.max(0, Math.min(1, (p.grossYield - g.yieldMin) / (g.yieldMax - g.yieldMin)));
}

function pushNotification(s, kind, propertyId, label, message, snapshot = null) {
  s.notifications = s.notifications || [];
  const id = s.nextNotifId || 1;
  s.nextNotifId = id + 1;
  // snapshot: 対象物件が消えた後（他決等）でも閲覧できるよう、その時点の物件データを保持
  s.notifications.unshift({ id, month: s.month, kind, propertyId, label, message, read: false, snapshot });
}

export function tickMarket(state, rng = Math.random) {
  const s = structuredClone(state);
  const logs = [];
  s.favorites = s.favorites || [];
  s.market = s.market.filter(p => {
    const sc = bargainScore(p);
    const soldP = sc > 0.66 ? 0.30 : sc > 0.33 ? 0.15 : 0.05;
    if (rng() < soldP) {
      const nm = p.name || p.label;
      logs.push(`${nm} は他の買主で決まってしまった`);
      if (s.favorites.some(f => f.propertyId === p.id)) {
        pushNotification(s, 'sold_out', p.id, nm, `${nm} は他の買主で成約しました`, structuredClone(p));
        s.favorites = s.favorites.filter(f => f.propertyId !== p.id);
      }
      return false;
    }
    return true;
  });
  s.market.forEach(p => {
    if (rng() < 0.20) {
      const cut = 0.03 + rng() * 0.05;
      p.price = Math.max(10000, Math.round(p.price * (1 - cut) / 10000) * 10000);
      p.askingPrice = p.price;
      p.refusedOffer = false;   // 値下げ＝売主の姿勢が軟化。指値を断られた物件も再チャレンジ可に

      const nm = p.name || p.label;
      logs.push(`${nm} が値下げされた（${yen(p.price)}）`);
      if (s.favorites.some(f => f.propertyId === p.id)) {
        pushNotification(s, 'price_cut', p.id, nm, `${nm} が値下げされました（${yen(p.price)}）`);
      }
    }
    p.listedMonths += 1;
    if (p.listedMonths >= 6) p.staleFlag = true;
  });
  return { state: s, logs };
}

export function searchHitChance(nGenres, nAreas, nAges, appraisalLv) {
  let p = [0.55, 0.70, 0.85, 1.0][Math.min(nGenres, 4) - 1];
  if (nAges === 1) p -= 0.10;
  if (nAreas === 1) p -= 0.05;
  p += (appraisalLv - 1) * 0.05;
  return Math.round(Math.max(0.30, Math.min(1.0, p)) * 100) / 100;
}

// === v3: 営業は1押下=行動力1消費。累計が隠し閾値(6〜40)に達すると物件情報を入手 ===
export const SEARCH_PRESS_COST = 1;
// v3.9: 出物に出会う確率を旧設定の約30〜50%に（＝必要な調査回数を約2.5倍に引き上げ）
export const SEARCH_MIN = 15;
export const SEARCH_MAX = 100;

// 閾値抽選: threshold = 6 + 34×u^f。fは従来の発見率(0.30〜1.0)を流用し、
// 条件が広く目利きLvが高いほど f が大きい＝低い閾値（早い発見）が出やすい。
export function drawSearchThreshold({ genres, areas, ages }, appraisalLv, rng = Math.random) {
  const f = searchHitChance(genres.length, areas.length, ages.length, appraisalLv);
  return SEARCH_MIN + Math.round((SEARCH_MAX - SEARCH_MIN) * Math.pow(rng(), f));
}

// v3.11: 平凡物件は買い候補の約2倍の頻度で出す（＝閾値が約半分）
export const MUNDANE_SEARCH_DIVISOR = 2;

// 市場に1件追加してID採番・名前付けする内部ヘルパー
function pushToMarket(s, p) {
  s.nextPropertyId = s.nextPropertyId || 1;
  p.id = 'p' + s.nextPropertyId++;
  p.name = propertyName(p.genreKey, p.builtAge, p.id);
  s.market.unshift(p);
  return p;
}

export function doSalesPress(state, { genres, areas, ages }, rng = Math.random) {
  if (state.actionPower < SEARCH_PRESS_COST) return { state, found: null, mundane: [], pressed: false };
  const s = structuredClone(state);
  s.actionPower -= SEARCH_PRESS_COST;
  const ss = s.salesSearch = s.salesSearch || { spent: 0, threshold: null };
  const lv = skillLevel(s.skills.appraisal.exp);
  if (ss.threshold == null) ss.threshold = drawSearchThreshold({ genres, areas, ages }, lv, rng);
  // v3.11: 平凡ルートの閾値（買い候補の約半分＝2倍の頻度）
  if (ss.mundaneThreshold == null) ss.mundaneThreshold = Math.max(4, Math.round(drawSearchThreshold({ genres, areas, ages }, lv, rng) / MUNDANE_SEARCH_DIVISOR));
  ss.spent += SEARCH_PRESS_COST;
  ss.mundaneSpent = (ss.mundaneSpent || 0) + SEARCH_PRESS_COST;
  s.skills.appraisal.exp += 1;

  // v3.11: 平凡ルート（低利回り・1〜2件・売れ残り演出）。買い候補とは独立に発火する。
  const mundane = [];
  if (ss.mundaneSpent >= ss.mundaneThreshold) {
    const n = rng() < 0.35 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const gk = genres[Math.floor(rng() * genres.length)];
      const ak = areas[Math.floor(rng() * areas.length)];
      const mp = generateProperty(gk, ak, rng, ages, { lowYield: true });
      mp.staleFlag = true;                              // 長く売りに出ている
      mp.listedMonths = 6 + Math.floor(rng() * 8);
      mundane.push(pushToMarket(s, mp));
    }
    ss.mundaneSpent = 0; ss.mundaneThreshold = null;
    s.skills.appraisal.exp += 2;
  }

  // 買い候補ルート（現状維持）
  let found = null, log = null;
  if (ss.spent >= ss.threshold) {
    const gk = genres[Math.floor(rng() * genres.length)];
    const ak = areas[Math.floor(rng() * areas.length)];
    const p = generateProperty(gk, ak, rng, ages);
    found = pushToMarket(s, p);
    s.skills.appraisal.exp += 10;
    ss.spent = 0; ss.threshold = null;
    log = `${p.name || p.label}（${p.label}）を発見（表面${(p.grossYield * 100).toFixed(1)}%・${yen(p.price)}）`;
  }
  return { state: s, found, mundane, pressed: true, log };
}

// 「手元いくらでこの物件が買えるのか」は融資タブを開くまで分からなかった。
// 4行の審査を回し、承認される中でいちばん手出しが少なくて済む組み合わせを返す。

// 今その金額を持っているかどうかは関係ない。
export function minRequiredCash(property, state, price = property.price) {
  let best = null;
  for (const bankKey of Object.keys(BANKS)) {
    // 頭金を1%刻みで増やしていき、その銀行が最初に承認する点＝その銀行での最小手出し
    for (let down = 0.05; down <= 0.95; down += 0.01) {
      const r = reviewLoan(bankKey, property, price, down, state);
      if (r.reasons.some(x => x.code !== 'NO_CASH')) continue;
      const cash = Math.round(price * down + price * CONFIG.closingCostRate);
      if (!best || cash < best.cash) best = { cash, bankKey, label: BANKS[bankKey].label, downRatio: down, financed: true };
      break;
    }
  }
  // どの銀行も通らなければ現金で買うしかない
  const cashBuy = Math.round(price * (1 + CONFIG.closingCostRate));
  if (!best || cashBuy < best.cash) return { cash: cashBuy, bankKey: null, label: '現金購入', downRatio: 1, financed: false };
  return best;
}

function windowRects(g, left, top, w, h, innerW) {
  const out = [];
  const gapY = h / (g.floors + 1);
  if (g.ribbon) {                                   // 鉄骨: 横長の連窓を3分割
    const segs = 3, bw = innerW * 0.80, bh = Math.max(1.2, gapY * 0.34);

    for (let r = g.floors; r >= 1; r--)

    return out;
  }
  const gapX = innerW / (g.cols + 1);
  const ww = Math.max(1.1, gapX * 0.56), wh = Math.max(1.1, gapY * (g.balcony ? 0.34 : 0.46));
  for (let r = g.floors; r >= 1; r--)
    for (let c = 1; c <= g.cols; c++)
      out.push({ x: left + gapX * c - ww / 2, y: top + gapY * r - wh / 2 - (g.balcony ? gapY * 0.10 : 0), w: ww, h: wh });
  return out;
}

function drawBuilding(x, y, size, o) {
  const g = BLD_STYLE[o.shape] || BLD_STYLE.kodate;
  const owned = !!o.owned;
  const wall = owned ? g.wall : GRAY.wall, side = owned ? g.side : GRAY.side;
  const roof = owned ? g.roof : GRAY.roof, dark = owned ? g.dark : GRAY.dark;
  const w = size * g.w, h = size * g.h;
  const rnd = srand(o.seed || 7);

  ctx.save();
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  ctx.fillStyle = 'rgba(2,6,23,0.35)';            // 接地影

  ctx.translate(x, y);

      ctx.ellipse(left + rnd() * w, top + rnd() * h, w * (0.08 + rnd() * 0.15), h * (0.04 + rnd() * 0.10), 0, 0, TAU);
      ctx.fill();
    }
  }
  if (g.frame && detail) {                        // 鉄骨: 縦の柱ライン
    ctx.fillStyle = owned ? 'rgba(50,68,88,0.55)' : 'rgba(70,80,92,0.5)';

    ctx.fillRect(left - w * 0.05, top - h * 0.038, w * 1.10, Math.max(1, h * 0.038));
  }
  if (g.tank && detail) {                         // 鉄骨: 屋上の貯水タンク（脚付き）
    ctx.fillStyle = owned ? '#5c7186' : GRAY.acc;
    ctx.fillRect(left + innerW * 0.16, top - h * 0.145, innerW * 0.34, h * 0.075);
    ctx.fillRect(left + innerW * 0.20, top - h * 0.075, w * 0.028, h * 0.040);
    ctx.fillRect(left + innerW * 0.44, top - h * 0.075, w * 0.028, h * 0.040);
  }
  if (g.roofType === 'rooftop') {                 // RC: 屋上設備＋赤い航空障害灯
    ctx.fillStyle = owned ? '#6b7481' : GRAY.acc;
    ctx.fillRect(left + innerW * 0.10, top - h * 0.085, innerW * 0.34, Math.max(1, h * 0.048));

    ctx.fillStyle = owned ? 'rgba(112,84,48,0.5)' : 'rgba(88,97,110,0.55)';
    ctx.fillRect(left, top + h * 0.46, innerW, Math.max(1, h * 0.055));
  }
  if (g.stairBox) {                               // アパート: 箱型の外階段
    ctx.fillStyle = owned ? '#a98551' : GRAY.acc;

      ctx.lineWidth = Math.max(0.6, size * 0.018);

        const yy = top + h * 0.12 + h * 0.88 * i / 4;

  if (g.stairZig) {                               // 鉄骨: ジグザグの外階段
    ctx.strokeStyle = owned ? '#7d93a8' : GRAY.acc;
    ctx.lineWidth = Math.max(0.8, size * 0.028);
    ctx.beginPath();
    const sx = left + w + w * 0.02, gapY = h / (g.floors + 1);

    for (let r = g.floors; r >= 1; r--) { ctx.lineTo(sx + w * 0.12, top + gapY * r + gapY * 0.4); ctx.lineTo(sx, top + gapY * r); }
    ctx.stroke();

  if (g.door && detail) {                         // 戸建て: 玄関ドア
    ctx.fillStyle = owned ? '#7c4a1e' : GRAY.acc;
    ctx.fillRect(left + innerW * 0.44, -h * 0.34, innerW * 0.16, h * 0.34);
  }
  if (g.unit && owned) {                          // 区分: 所有している1住戸だけ強調
    const gapY = h / (g.floors + 1), gapX = innerW / (g.cols + 1);
    const ww = Math.max(1.1, gapX * 0.56), wh = Math.max(1.1, gapY * 0.34);
    const wx = left + gapX * 3 - ww / 2, wy = top + gapY * 4 - wh / 2 - gapY * 0.10;
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = Math.max(0.9, size * 0.026);
    ctx.strokeRect(wx - 1.5, wy - 1.5, ww + 3, wh + 3);
  }
  if (o.boarded && rects.length) {                // ボロ: 板が打たれた窓
    const r = rects[rects.length - 1];
    ctx.strokeStyle = '#7c5a2e'; ctx.lineWidth = Math.max(0.8, size * 0.026);
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.w, r.y + r.h);
    ctx.moveTo(r.x + r.w, r.y); ctx.lineTo(r.x, r.y + r.h); ctx.stroke();
  }
  if (o.crack > 0 && detail) {                    // ボロ: 壁のひび
    ctx.strokeStyle = `rgba(38,28,18,${0.35 + o.crack * 0.4})`;
    ctx.lineWidth = Math.max(0.7, size * 0.020);
    ctx.beginPath();
    let px = left + innerW * 0.26, py = top + h * 0.10; ctx.moveTo(px, py);
    for (let i = 0; i < 5; i++) { px += (rnd() - 0.4) * w * 0.14; py += h * 0.17; ctx.lineTo(px, py); }
    ctx.stroke();
  }
  ctx.strokeStyle = owned ? 'rgba(15,23,42,0.5)' : 'rgba(30,41,59,0.5)';
  ctx.lineWidth = Math.max(0.6, size * 0.024);
  ctx.strokeRect(left, top, w, h);
  if (o.weed && detail) {                         // ボロ: 足元の雑草
    ctx.strokeStyle = '#4d7c3a'; ctx.lineWidth = Math.max(0.8, size * 0.024);
    for (let i = 0; i < 5; i++) {
      const gx = left + w * (0.02 + rnd() * 1.0);
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx + (rnd() - 0.5) * size * 0.08, -size * (0.05 + rnd() * 0.07)); ctx.stroke();
    }
  }
  if (o.scaffold) {                               // v5: 業者修繕中は足場を掛けて一目で分かるように
    ctx.strokeStyle = 'rgba(203,213,225,0.65)';
    ctx.lineWidth = Math.max(0.6, size * 0.020);
    const bx = left - w * 0.08, bw = w * 1.16;
    for (let i = 0; i <= 3; i++) { const yy = top + h * i / 3; ctx.beginPath(); ctx.moveTo(bx, yy); ctx.lineTo(bx + bw, yy); ctx.stroke(); }
    for (let i = 0; i <= 3; i++) { const xx = bx + bw * i / 3; ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, 0); ctx.stroke(); }
  }
  ctx.restore();
}

// 雰囲気建物（タップ不可・背景）: 濃紺のシルエット＋ごく淡い金の窓。
// ピンハネ帝国のタイトル画面の摩天楼と同じ質感にして「夜の街」に見せる。
function drawFillerBuilding(x, y, size, stories, seed, alpha) {
  const rnd = srand(seed);
  const w = size * (stories >= 5 ? 0.56 : 0.70), h = size * (0.30 + stories * 0.14);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#0d1a2e'; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = 'rgba(148,163,184,0.16)'; ctx.fillRect(x - w / 2, y - h, w, Math.max(0.8, h * 0.05));
  const cols = Math.max(2, Math.round(w / (size * 0.20))), rows = Math.max(1, stories);
  const gx = w / (cols + 1), gy = h / (rows + 1);
  for (let r = 1; r <= rows; r++) for (let c = 1; c <= cols; c++) {
    if (rnd() < 0.45) continue;
    ctx.fillStyle = `rgba(251,191,36,${0.26 + rnd() * 0.36})`;
    ctx.fillRect(x - w / 2 + gx * c - gx * 0.18, y - h + gy * r - gy * 0.16, Math.max(0.7, gx * 0.36), Math.max(0.7, gy * 0.30));
  }
  ctx.restore();
}

// 物件stateから描画パラメータへの変換。既存の svgBuildingParts をそのまま使うので、
// DIY・修繕で修繕度が上がれば専用の分岐なしに自然と綺麗になる。
function buildingOptsFor(p, owned) {
  const parts = L.svgBuildingParts(p);
  const occ = p.units && p.units.length ? p.units.filter(u => u.occupied).length / p.units.length : 1;
  const ruined = parts.wake && p.repairState < 40;
  return {
    shape: parts.shape, owned, occ,
    dirt: parts.dirtLevel, crack: parts.hasCracks ? 0.7 : 0, weed: parts.hasWeeds,
    tilt: parts.tilt ? 0.035 : 0, broken: ruined, boarded: ruined,
    scaffold: owned && !!p.repairJob,
    seed: hashSeed('bld:' + p.id)() * 4294967296,
  };
}

// 大陸の陸地パッチ（雰囲気のみ）: 中心に厚く・外周にいくほど薄く広がる分布
const CONTINENT_BLOBS = (() => {
  const rnd = srand(777);
  return Array.from({ length: 110 }, () => {
    const ang = rnd() * TAU;
    const rad = Math.pow(rnd(), 0.55) * OUTER_R * 1.04;
    return {
      lat: CONTINENT.lat + Math.sin(ang) * rad,
      lon: CONTINENT.lon + Math.cos(ang) * rad,
      rad: 0.10 + rnd() * 0.15,
      core: rad < CORE_R,
    };
  });
})();

// 未開拓エリア（黒い影の陸地＋🔒）: 球を回すと海だけでは寂しいため、将来アップデートで解禁される
// ことを匂わせる非インタラクティブな陸影を数か所配置する。
// v5: 経度は大陸（lon 0・半径1.05）から十分離す。従来 lon 5.55（＝-0.73rad）の1か所が大陸の
// 内側に入っており、黒い影が緑の地面に重なって「焦げ跡」のように見えていた（実機で確認）。
// ブロブ半径0.34を足しても大陸に届かない位置に4か所を振り直した。
const UNEXPLORED_CENTERS = [
  { lat: 0.42, lon: 2.20 },
  { lat: -0.50, lon: 3.10 },
  { lat: -0.20, lon: 4.00 },
  { lat: 0.15, lon: 4.75 },
];
const UNEXPLORED_AREAS = UNEXPLORED_CENTERS.map((c, i) => {
  const rnd = srand(9001 + i * 137);
  return {
    center: c,
    blobs: Array.from({ length: 12 }, () => {
      const ang = rnd() * TAU;
      const rad = Math.pow(rnd(), 0.6) * 0.34;
      return { lat: c.lat + Math.sin(ang) * rad, lon: c.lon + Math.cos(ang) * rad, rad: 0.08 + rnd() * 0.09 };
    }),
  };
});

// 雰囲気建物のスロット: 中心=高密度・高層、外周=低密度・低層。
// 引いたときは先頭6割だけ描いて間引く（生成順が半径に対してランダムなので偏らない）。
const FILLER_SLOTS = (() => {
  const rnd = srand(4242);
  const out = [];
  for (let i = 0; i < 460 && out.length < FILLER_COUNT; i++) {
    const ang = rnd() * TAU;
    const rad = rnd() * OUTER_R;
    const keepProb = rad < CORE_R ? 0.62 : rad < MID_R ? 0.32 : 0.12;
    if (rnd() > keepProb) continue;
    const stories = rad < CORE_R ? 4 + Math.floor(rnd() * 6)
      : rad < MID_R ? 2 + Math.floor(rnd() * 3)
      : 1 + Math.floor(rnd() * 2);
    out.push({
      lat: CONTINENT.lat + Math.sin(ang) * rad,
      lon: CONTINENT.lon + Math.cos(ang) * rad,
      stories, seed: 100 + i,
    });
  }
  return out;
})();

// urban=都心コア寄り、local=郊外〜地方寄りの半径帯に配置（既存ロジックのareaKeyをそのまま利用）
function bandFor(areaKey) {
  return areaKey === 'urban' ? { rMin: 0.04, rMax: CORE_R } : { rMin: MID_R * 0.85, rMax: OUTER_R * 0.95 };
}
function slotFor(areaKey, seed) {
  const rnd = hashSeed('slot:' + areaKey + ':' + seed);
  const { rMin, rMax } = bandFor(areaKey);
  const ang = rnd() * TAU;
  const rad = rMin + (rMax - rMin) * rnd();
  return { lat: CONTINENT.lat + Math.sin(ang) * rad, lon: CONTINENT.lon + Math.cos(ang) * rad };
}

function project(lat, lon) {
  const cl = Math.cos(lat);
  const x = cl * Math.sin(lon + yaw);
  const y = Math.sin(lat);
  const z = cl * Math.cos(lon + yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = y * cp - z * sp;
  const z2 = y * sp + z * cp;
  return { x: cx + x * R, y: cy - y2 * R, z: z2 };
}

const STARS = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random() * 0.6, tw: Math.random() * TAU }));

// v5: 空・海・大気光・大陸の色はピンハネ帝国と同じ値に揃えた（夜寄りの濃紺）。
function drawSky(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#050b1c'); g.addColorStop(1, '#0d1c33');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#e2e8f0';
  const t = performance.now() / 1000;
  for (const s of STARS) {
    ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(t / 2.3 + s.tw));
    ctx.fillRect(s.x * w, s.y * h, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
}

function drawGlobeBase() {
  ctx.beginPath(); ctx.arc(cx, cy, R + 5, 0, TAU);
  ctx.strokeStyle = 'rgba(56,189,248,0.16)'; ctx.lineWidth = 10; ctx.stroke();
  const pg = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.15, cx, cy, R);
  pg.addColorStop(0, '#17416e'); pg.addColorStop(1, '#081a30');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
}

function drawLandmasses() {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  for (const b of CONTINENT_BLOBS) {
    const p = project(b.lat, b.lon);
    if (p.z < 0.02) continue;
    ctx.globalAlpha = Math.min(1, p.z * 4) * 0.95;
    ctx.fillStyle = b.core ? 'hsl(158, 26%, 21%)' : 'hsl(112, 26%, 20%)';
    ctx.beginPath(); ctx.arc(p.x, p.y, b.rad * R * (0.35 + 0.65 * p.z), 0, TAU); ctx.fill();
  }
  // 未開拓エリア（黒い影の陸地）
  for (const area of UNEXPLORED_AREAS) {
    for (const b of area.blobs) {
      const p = project(b.lat, b.lon);
      if (p.z < 0.02) continue;
      ctx.globalAlpha = Math.min(1, p.z * 4) * 0.85;
      ctx.fillStyle = 'hsl(220, 25%, 9%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, b.rad * R * (0.35 + 0.65 * p.z), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(148,163,184,0.09)'; ctx.lineWidth = 1;
  for (let m = 0; m < 8; m++) {
    const lon = m * TAU / 8;
    ctx.beginPath(); let pen = false;
    for (let la = -85; la <= 85; la += 6) {
      const p = project(la * Math.PI / 180, lon);
      if (p.z > 0.02) { if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; } } else pen = false;
    }
    ctx.stroke();
  }
  ctx.restore();

  // 未開拓エリアの🔒（将来アップデートで解禁される予感）
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const area of UNEXPLORED_AREAS) {
    const p = project(area.center.lat, area.center.lon);
    if (p.z < 0.05) continue;
    ctx.globalAlpha = Math.min(1, p.z * 2);
    ctx.fillStyle = '#fbbf24';
    ctx.font = `${Math.round(18 * (0.6 + p.z * 0.6))}px ${EMOJI_FONT}`;
    ctx.fillText('🔒', p.x, p.y);
  }
  ctx.restore();
}

// 状態バッジ（入居率ドット・売出中・修繕中・お気に入り⭐）
function drawBadges(p, pr, size, kind) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  const g = BLD_STYLE[L.svgBuildingParts(p).shape] || BLD_STYLE.kodate;
  const top = pr.y - size * g.h;
  if (kind === 'owned') {
    const occ = p.units && p.units.length ? p.units.filter(u => u.occupied).length / p.units.length : 1;
    ctx.fillStyle = occ >= 0.999 ? '#4ade80' : occ > 0 ? '#fbbf24' : '#f87171';
    ctx.beginPath(); ctx.arc(pr.x + size * 0.42, top - size * 0.18, Math.max(1.8, size * 0.11), 0, TAU); ctx.fill();
    if ((st.listings || []).some(l => l.propertyId === p.id)) {
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(pr.x - size * 0.42, top - size * 0.18, Math.max(1.8, size * 0.11), 0, TAU); ctx.fill();
    }
    if (p.repairJob || p.valueUpJob) {
      ctx.globalAlpha = 1; ctx.fillStyle = '#f59e0b';
      ctx.font = `${Math.round(Math.max(10, size * 0.7))}px ${EMOJI_FONT}`;
      ctx.fillText(p.repairJob ? '🔨' : '✨', pr.x, top - size * 0.34);
    }
  } else if ((st.favorites || []).some(f => f.propertyId === p.id)) {
    // お気に入り登録した市場物件だけ⭐を付けタップ可能にする（未登録の市場物件は背景と同じ扱い）
    ctx.globalAlpha = 1; ctx.fillStyle = '#facc15';
    ctx.font = `${Math.round(Math.max(10, size * 0.72))}px ${EMOJI_FONT}`;
    ctx.fillText('⭐', pr.x, top - size * 0.20);
  }
  ctx.restore();
}

// 実物件（所有・市場）同士が重なってタップしづらくなるのを防ぐ決定的な間引き配置。
// 既に配置済みの点と近すぎる場合、id由来の固定角度でスパイラル状に押し出す（毎フレーム同じ結果になる）。
function spreadItems(items) {
  const placed = [];
  for (const it of items) {
    let lat = it.lat, lon = it.lon;
    for (let tries = 0; tries < 24; tries++) {
      const conflict = placed.some(pl => {
        const dlat = lat - pl.lat;
        const dlon = (lon - pl.lon) * Math.cos(lat);
        return Math.sqrt(dlat * dlat + dlon * dlon) < MIN_SEP;
      });
      if (!conflict) break;
      const pushAng = hashSeed('push:' + it.kind + ':' + it.p.id + ':' + tries)() * TAU;
      const pushRad = MIN_SEP * 0.65 * (tries + 1);
      lat = it.lat + Math.sin(pushAng) * pushRad;
      lon = it.lon + Math.cos(pushAng) * pushRad;
    }
    placed.push({ ...it, lat, lon });
  }
  return placed;
}

function coloredItems() {
  if (!st) return [];
  const items = [];
  st.properties.forEach(p => { const s = slotFor(p.areaKey, 'o:' + p.id); items.push({ p, lat: s.lat, lon: s.lon, kind: 'owned' }); });
  st.market.forEach(p => { const s = slotFor(p.areaKey, 'm:' + p.id); items.push({ p, lat: s.lat, lon: s.lon, kind: 'market' }); });
  return spreadItems(items);
}

// v5: 翌月ボタンから呼ばれるゆっくり回転。draw() の毎フレームで補間する。
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function normAngle(a) { return ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; }
function stepViewAnim(now) {
  if (!viewAnim) return;
  const t = Math.min(1, (now - viewAnim.t0) / viewAnim.dur);
  const e = easeInOutCubic(t);
  yaw = viewAnim.fromYaw + viewAnim.dYaw * e;
  pitch = viewAnim.fromPitch + (HOME.pitch - viewAnim.fromPitch) * e;
  zoom = viewAnim.fromZoom + (HOME.zoom - viewAnim.fromZoom) * e;
  if (t >= 1) { viewAnim = null; yaw = HOME.yaw; pitch = HOME.pitch; zoom = HOME.zoom; }
}

function draw(ts) {
  rafId = requestAnimationFrame(draw);
  if (ts - lastFrame < 1000 / FPS) return;
  const dt = Math.min(0.1, (ts - lastFrame) / 1000 || 0.033);
  lastFrame = ts;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  stepViewAnim(ts);
  if (!dragging && !viewAnim) { yaw += yawV * dt; yawV *= 0.92; }

  cx = w / 2; cy = h * 0.52; R = Math.min(w, h) * 0.44 * zoom;

  drawSky(w, h);
  drawGlobeBase();
  drawLandmasses();

  // 雰囲気建物（奥から手前へ）。引いたときは本数も間引いて、ごちゃつきを抑える。
  const fUnit = fillerUnit();
  const cap = zoom < 0.9 ? Math.round(FILLER_SLOTS.length * 0.6) : FILLER_SLOTS.length;
  FILLER_SLOTS.slice(0, cap)
    .map(s => ({ s, p: project(s.lat, s.lon) }))
    .filter(o => o.p.z > 0.05)
    .sort((a, b) => a.p.z - b.p.z)
    .forEach(({ s, p }) => drawFillerBuilding(p.x, p.y, fUnit * (0.62 + p.z * 0.8), s.stories, s.seed, 0.30 + p.z * 0.26));

  // 実物件（所有=カラー／市場=グレー）は奥から手前へ
  const pUnit = propUnit();
  coloredItems()
    .map(it => ({ ...it, pr: project(it.lat, it.lon) }))
    .filter(it => it.pr.z > 0.04)
    .sort((a, b) => a.pr.z - b.pr.z)
    .forEach(it => {
      const size = pUnit * (0.80 + it.pr.z * 0.55);
      if (it.kind === 'owned') {   // 所有物件の足元に淡いハロー（自分の物件を見分けやすく）
        ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#a7f3d0';
        ctx.beginPath(); ctx.ellipse(it.pr.x, it.pr.y, size * 0.72, size * 0.22, 0, 0, TAU); ctx.fill(); ctx.restore();
      }
      const o = buildingOptsFor(it.p, it.kind === 'owned');
      drawBuilding(it.pr.x, it.pr.y, size, { ...o, alpha: it.kind === 'owned' ? 1 : 0.85 });
      drawBadges(it.p, it.pr, size, it.kind);
    });

  // 一覧「地図を見る」からのハイライト（拡大リング＋跳ねる📍ピン）。どこかをクリックするまで維持され、
  // ピン自体をクリックすると詳細画面が開く（pointerup側で処理）。
  if (pingItem) {
    const pr = project(pingItem.lat, pingItem.lon);
    if (pr.z > 0.02) {
      pingItem.sx = pr.x; pingItem.sy = pr.y;   // クリック判定用に画面座標を保持
      const now = performance.now();
      const t = (now % 900) / 900;
      ctx.save();
      ctx.strokeStyle = `rgba(250,204,21,${0.9 * (1 - t)})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(pr.x, pr.y - 8, 14 + t * 34, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(250,204,21,${0.6 * (1 - ((t + 0.5) % 1))})`;
      ctx.beginPath(); ctx.arc(pr.x, pr.y - 8, 14 + ((t + 0.5) % 1) * 34, 0, TAU); ctx.stroke();
      const bounce = Math.abs(Math.sin(now / 220)) * 9;
      ctx.fillStyle = '#ef4444';
      ctx.font = `28px ${EMOJI_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('📍', pr.x, pr.y - 26 - bounce);
      ctx.restore();
    } else {
      pingItem.sx = null; pingItem.sy = null;   // 裏面に回ったらクリック不可
    }
  }
}

// 地図上でタップ対象になるのは所有物件、および★お気に入り登録済みの市場物件のみ。
// v3.3: どの建物がタップ対象か分かるように、ホバー（マウス）／1度目のタップ（タッチ）で
// 物件名などの簡易情報を吹き出し表示する。2度目のタップ（マウスはクリック）で詳細へ。
let tipEl = null, tapCandidateId = null, tapCandidateTimer = 0;
function tipHtmlFor(hit) {
  const p = hit.p;
  const nm = p.name || p.label;
  if (hit.kind === 'owned') {
    const occ = p.units && p.units.length ? Math.round(p.units.filter(u => u.occupied).length / p.units.length * 100) : 100;
    return `🏠 <b>${nm}</b><br>${p.owner === 'corp' ? '🏢法人' : '👤個人'}・入居${occ}%・躯体${Math.round(p.repairState)}%・手入れ${Math.round(p.careState ?? p.repairState)}%${p.repairJob ? '・🔨修繕中' : ''}${p.autoManage ? '・🏢おまかせ' : ''}`;
  }
  return `⭐ <b>${nm}</b><br>市場（お気に入り）・${L.yen(p.price)}`;
}
function showTip(hit, x, y, extra) {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.style.cssText = 'position:fixed;z-index:45;pointer-events:none;background:rgba(255,255,255,0.97);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,0.28);padding:6px 10px;font-size:12px;color:#0f172a;line-height:1.5;max-width:240px;';
    document.body.appendChild(tipEl);
  }
  const rect = canvas.getBoundingClientRect();
  tipEl.innerHTML = tipHtmlFor(hit) + (extra ? `<div style="color:#64748b;font-size:10px;">${extra}</div>` : '');
  tipEl.style.left = Math.round(rect.left + x + 14) + 'px';
  tipEl.style.top = Math.round(rect.top + y - 14) + 'px';
  tipEl.style.display = 'block';
}
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }

function hitTest(px, py) {
  const favIds = new Set((st?.favorites || []).map(f => f.propertyId));
  const pUnit = propUnit();
  const items = coloredItems()
    .filter(it => it.kind === 'owned' || favIds.has(it.p.id))
    .map(it => ({ ...it, pr: project(it.lat, it.lon) }))
    .filter(it => it.pr.z > 0.04)
    .sort((a, b) => b.pr.z - a.pr.z);
  for (const it of items) {
    const size = pUnit * (0.80 + it.pr.z * 0.55);
    const g = BLD_STYLE[L.svgBuildingParts(it.p).shape] || BLD_STYLE.kodate;
    const half = size * g.w * 0.5;
    const top = size * g.h;
    // 建物が小さくても押しやすいよう、見た目より広めの当たり判定にする（最低22px幅を確保）。
    const padX = Math.max(8, 11 - half), padTop = Math.max(10, 14 - top * 0.5);
    if (px >= it.pr.x - half - padX && px <= it.pr.x + half + padX &&
        py >= it.pr.y - top - padTop && py <= it.pr.y + 8) return it;
  }
  return null;
}

// 立っている📍ピンのクリック判定（ピン頭〜リング周辺を広めに取る）
function hitPin(px, py) {
  if (!pingItem || pingItem.sx == null) return false;
  const dx = px - pingItem.sx, dy = py - (pingItem.sy - 20);
  return dx * dx + dy * dy < 26 * 26;
}

// 未開拓エリアの🔒クリック判定。表面に見えている最寄りのロックを返す。
function hitLock(px, py) {
  for (const area of UNEXPLORED_AREAS) {
    const p = project(area.center.lat, area.center.lon);
    if (p.z < 0.05) continue;
    const dx = px - p.x, dy = py - p.y;
    if (dx * dx + dy * dy < 20 * 20) return area;
  }
  return null;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}

function initCity(cv, callbacks) {
  canvas = cv; cbs = callbacks || {};
  ctx = canvas.getContext('2d');
  resize();
  // Tailwind CDNのスタイル適用が非同期のため、initCity実行時点ではcanvasのレイアウトサイズが
  // まだ確定していないことがある（clientWidth=0）。ResizeObserverで実際のサイズ確定を捉える。
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener('resize', resize);
  }

  canvas.addEventListener('pointerleave', hideTip);
  // v3.4: ホイールで拡大縮小（PC）
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    viewAnim = null;                              // 手動操作が入ったら自動回転は中断
    const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * f));
  }, { passive: false });
  canvas.addEventListener('pointerdown', e => {
    viewAnim = null;                              // 手動操作が入ったら自動回転は中断
    activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // v3.4: 2本目の指が置かれたらピンチズームモードへ（回転ドラッグは中断）
    if (activePtrs.size >= 2) {
      pinching = true; dragging = false;
      const pts = [...activePtrs.values()];
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      hideTip();
      return;
    }
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; yawV = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', e => {
    // バックグラウンド起動等で最初のフレームがまだ描かれていない場合の保険
    // （R=0のままだと当たり判定が全て左上に潰れる）。draw()と同じ式で投影パラメータを確定させる。
    if (!R && canvas.clientWidth) {
      resize();
      const w = canvas.width / dpr, h = canvas.height / dpr;
      cx = w / 2; cy = h * 0.52; R = Math.min(w, h) * 0.44 * zoom;
    }
    if (activePtrs.has(e.pointerId)) activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // v3.4: ピンチ中は2点間距離の変化でズーム
    if (pinching && activePtrs.size >= 2) {
      const pts = [...activePtrs.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0) zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * d / pinchDist));
      pinchDist = d;
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (!dragging) {
      // ホバー時: タップできる対象（所有/お気に入り物件・ピン・🔒）の上ではカーソルを指マークに。
      const hit = hitTest(mx, my);
      const over = hitPin(mx, my) || hitLock(mx, my) || hit;
      canvas.style.cursor = over ? 'pointer' : 'grab';
      if (hit && e.pointerType !== 'touch') showTip(hit, mx, my, 'クリックで詳細を開く');
      else if (!tapCandidateId) hideTip();
      return;
    }
    hideTip();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx / (R || 150);
    pitch = Math.max(-1.1, Math.min(1.1, pitch + dy / (R || 150)));
    yawV = dx / (R || 150) * 6;
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointercancel', e => {
    activePtrs.delete(e.pointerId);
    if (activePtrs.size === 0) { pinching = false; pinchDist = 0; dragging = false; canvas.style.cursor = 'grab'; }
  });
  canvas.addEventListener('pointerup', e => {
    activePtrs.delete(e.pointerId);
    // v3.4: ピンチ操作の指離しはタップとして扱わない
    if (pinching) {
      pinchDist = 0;
      if (activePtrs.size === 0) pinching = false;
      dragging = false; canvas.style.cursor = 'grab';
      return;
    }
    dragging = false; canvas.style.cursor = 'grab';
    if (moved < 8) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      // ①ピンをクリック → 詳細画面へ（ピンは消す）
      if (hitPin(mx, my)) { const id = pingItem.id; pingItem = null; if (cbs.onTapMarketDetail) cbs.onTapMarketDetail(id); return; }
      // どこかをクリックしたらピンは解除（②以降の判定は続ける）
      pingItem = null;
      // ②🔒未開拓エリア → ティーザー表示
      if (hitLock(mx, my)) { if (cbs.onTapLock) cbs.onTapLock(); return; }
      // ③物件
      const hit = hitTest(mx, my);
      if (hit) {
        // v3.3: タッチは1度目のタップで吹き出し（何がヒットしたか見せる）、同じ建物をもう一度タップで詳細。
        // マウスはホバーで既に吹き出しが出ているため、クリックで即詳細。
        if (e.pointerType === 'touch' && tapCandidateId !== hit.p.id) {
          tapCandidateId = hit.p.id;
          showTip(hit, mx, my, 'もう一度タップで詳細を開く');
          clearTimeout(tapCandidateTimer);
          tapCandidateTimer = setTimeout(() => { tapCandidateId = null; hideTip(); }, 2800);
          return;
        }
        tapCandidateId = null; hideTip();
        if (hit.kind === 'owned' && cbs.onTapProperty) cbs.onTapProperty(hit.p.id);
        if (hit.kind === 'market' && cbs.onTapMarket) cbs.onTapMarket(hit.p.id);
      } else {
        tapCandidateId = null; hideTip();
      }
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = 0; }
    else if (!rafId) { lastFrame = performance.now(); rafId = requestAnimationFrame(draw); }
  });
  rafId = requestAnimationFrame(draw);
}

// ===== サウンド（Web Audio APIでその場合成。外部音源ファイル不要・単一ファイルのまま） =====
const MUTE_KEY = 'leverage_master_muted';

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone({ freq, duration = 0.15, type = 'sine', gain = 0.12, delay = 0 }) {
  if (muted) return;
  const ctx = ensureAudioCtx();
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type;
  const t0 = ctx.currentTime + delay;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}

function sfxClick() { playTone({ freq: 700, duration: 0.05, type: 'square', gain: 0.05 }); }
function sfxKnock() { playTone({ freq: 180, duration: 0.08, type: 'triangle', gain: 0.14 }); playTone({ freq: 160, duration: 0.08, type: 'triangle', gain: 0.12, delay: 0.16 }); }
function sfxCoin() { [880, 1180, 1480].forEach((f, i) => playTone({ freq: f, duration: 0.12, type: 'sine', gain: 0.10, delay: i * 0.05 })); }
function sfxFanfare() { [523, 659, 784, 1046].forEach((f, i) => playTone({ freq: f, duration: 0.28, type: 'triangle', gain: 0.15, delay: i * 0.1 })); }

// 気分で選べるBGM（コード進行＋アルペジオ＋ベースをその場で生成。単調なドローンではなく音楽的に展開させる）。
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
const BGM_MOODS = {
  // chords は各コードの構成音（MIDIノート番号）。stepMsごとにアルペジオを1音鳴らし、コード頭でベースを添える。
  relax:  { label: '🌿 のんびり', stepMs: 640, gain: 0.05, wave: 'sine',
    chords: [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]] },
  chill:  { label: '🌙 しっとり', stepMs: 500, gain: 0.045, wave: 'triangle',
    chords: [[57, 60, 64], [52, 55, 59], [53, 57, 60], [55, 59, 62]] },
  lively: { label: '✨ わくわく', stepMs: 340, gain: 0.05, wave: 'triangle',
    chords: [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]] },
};

function playBgmNote(ctx, master, freq, wave, duration, gain) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  const t0 = ctx.currentTime;
  osc.type = wave; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + duration + 0.05);
}

function startBgm() {
  if (muted || bgmHandle) return;
  const mood = BGM_MOODS[bgmMood] || BGM_MOODS.relax;
  const ctx = ensureAudioCtx();
  const master = ctx.createGain();
  master.gain.value = mood.gain;
  master.connect(ctx.destination);
  const chordLen = 8;   // 1コードあたりのステップ数
  let step = 0;
  const timer = setInterval(() => {
    const chord = mood.chords[Math.floor(step / chordLen) % mood.chords.length];
    const pos = step % chordLen;
    // アルペジオ（1オクターブ上げて明瞭に）＋コード頭でベース
    playBgmNote(ctx, master, midi(chord[pos % chord.length] + 12), mood.wave, 0.55, 0.5);
    if (pos === 0) playBgmNote(ctx, master, midi(chord[0] - 12), 'sine', 1.6, 0.6);
    if (pos === 4) playBgmNote(ctx, master, midi(chord[0]), 'sine', 1.0, 0.35);   // 中間で軽く土台
    step++;
  }, mood.stepMs);
  bgmHandle = { master, timer };
}

function stopBgm() {
  if (!bgmHandle) return;
  clearInterval(bgmHandle.timer);
  try { bgmHandle.master.disconnect(); } catch (e) {}
  bgmHandle = null;
}

function setMuted(v) {
  muted = v;
  localStorage.setItem(MUTE_KEY, v ? '1' : '0');
  if (v) stopBgm(); else startBgm();
}

function setBgmMood(mood) {
  bgmMood = mood;

    </div>

  m.appendChild(box);
  box.querySelector('#ttl-start')?.addEventListener('click', () => showSetup());
  // v5: 視点の初期化はゲーム開始のここだけ（以後は翌月ボタンの animateResetView のみ）
  box.querySelector('#ttl-continue')?.addEventListener('click', () => { m.classList.add('hidden'); m.innerHTML = ''; resetMapView(); render(); });
